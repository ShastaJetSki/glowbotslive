<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buns Artisan Bakes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBFA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>/* open in the store's colours straight away */try{var _t=JSON.parse(localStorage.getItem('buns-theme')||'null');if(_t){var _r=document.documentElement.style;if(_t.primary)_r.setProperty('--brand',_t.primary);if(_t.accent)_r.setProperty('--accent',_t.accent);if(_t.background)_r.setProperty('--bg',_t.background);if(_t.text)_r.setProperty('--ink',_t.text);}}catch(e){}</script>
<style>
/* ══════════════ Buns Artisan Bakes · shared styles ══════════════ */
:root{
  --brand:#9B7EC8;      /* light purple — set in Settings */
  --accent:#E89AB8;     /* pink — set in Settings */
  --bg:#FFFBFA;         /* page background — set in Settings */
  --ink:#2F2638;        /* text — set in Settings */
  --brand-ink:#fff;     /* text on brand buttons (worked out from the brand colour) */
  --brand-soft:color-mix(in srgb,var(--brand) 12%,var(--bg));
  --brand-mist:color-mix(in srgb,var(--brand) 6%,var(--bg));
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--bg));
  --brand-deep:color-mix(in srgb,var(--brand) 72%,#1d1424);
  --muted:color-mix(in srgb,var(--ink) 58%,var(--bg));
  --faint:color-mix(in srgb,var(--ink) 38%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 11%,var(--bg));
  --card:color-mix(in srgb,#fff 70%,var(--bg));
  --shadow:0 1px 2px rgba(47,38,56,.04),0 8px 28px -8px rgba(47,38,56,.12);
  --shadow-lg:0 2px 6px rgba(47,38,56,.05),0 24px 60px -18px rgba(47,38,56,.25);
  --serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
  --r:18px;--r-sm:12px;
  --max:1200px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{color:inherit;}
button,input,select,textarea{font:inherit;color:inherit;}
::selection{background:var(--accent-soft);}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px;}
.serif{font-family:var(--serif);}
h1,h2,h3,.h1,.h2,.h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;line-height:1.08;margin:0;}
h1,.h1{font-size:clamp(40px,6vw,76px);}
h2,.h2{font-size:clamp(30px,4vw,46px);}
h3,.h3{font-size:clamp(22px,2.4vw,28px);}
.eyebrow{font:500 11.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--brand-deep);}
.eyebrow.pink{color:color-mix(in srgb,var(--accent) 70%,var(--ink));}
.lead{font-size:18px;color:var(--muted);max-width:560px;}
.muted{color:var(--muted);}
.italic{font-style:italic;}
.center{text-align:center;}
.hide{display:none!important;}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;border-radius:999px;padding:14px 28px;font:500 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),background .25s,box-shadow .25s,color .25s,border-color .25s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 8px 22px -10px color-mix(in srgb,var(--brand) 80%,transparent);}
.btn-primary:hover{background:var(--brand-deep);color:#fff;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{background:color-mix(in srgb,var(--accent) 80%,var(--ink));}
.btn-ghost{background:transparent;border-color:color-mix(in srgb,var(--ink) 22%,transparent);}
.btn-ghost:hover{border-color:var(--ink);}
.btn-light{background:#fff;color:var(--ink);}
.btn-sm{padding:10px 18px;font-size:11.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--ink) 30%,transparent);}
.link:hover{text-decoration-color:var(--ink);}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;}
.iconbtn:hover{border-color:var(--ink);}
.iconbtn svg{width:18px;height:18px;}

/* ── form fields ── */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px;}
.field label{font:500 11.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:13px 15px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field textarea{min-height:110px;resize:vertical;}
.input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer;}
.check input{width:18px;height:18px;accent-color:var(--brand);margin-top:2px;}
.seg{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--brand-mist);border:1px solid var(--line);}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:11px 14px;font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:.2s;}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);}
.seg button[disabled]{opacity:.35;cursor:not-allowed;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;cursor:pointer;transition:.2s;white-space:nowrap;}
.chip:hover{border-color:var(--ink);}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}

/* ── cards & surfaces ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
.pad{padding:24px;}
.tag{display:inline-block;padding:5px 11px;border-radius:999px;font:500 10.5px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 55%,var(--ink));}
.tag.brand{background:var(--brand-soft);color:var(--brand-deep);}
.tag.dark{background:var(--ink);color:var(--bg);}
.price{font:500 17px/1 var(--sans);letter-spacing:.02em;}
.price s{color:var(--faint);font-weight:400;margin-left:6px;font-size:.85em;}
.divider{height:1px;background:var(--line);border:0;margin:24px 0;}

/* ── product picture (real photo or a soft placeholder) ── */
.pimg{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--brand-soft),var(--accent-soft));aspect-ratio:4/5;border-radius:var(--r);}
.pimg img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease);}
.pimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 500 clamp(44px,7vw,84px)/1 var(--serif);color:color-mix(in srgb,var(--brand) 55%,#fff);}
.pimg .ph svg{width:34%;opacity:.55;}

/* ── header ── */
.ann{background:var(--ink);color:var(--bg);text-align:center;font:400 12.5px/1.4 var(--sans);letter-spacing:.06em;padding:9px 16px;}
.ann a{color:inherit;}
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s;}
.hdr.scrolled{border-bottom-color:var(--line);}
.hdr-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:78px;}
.hdr-nav{display:flex;gap:30px;}
.hdr-nav a{font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--muted);position:relative;padding:6px 0;transition:color .2s;}
.hdr-nav a:hover,.hdr-nav a.on{color:var(--ink);}
.hdr-nav a.on::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--ink);}
.logo{text-decoration:none;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1;}
.logo b{font:500 38px/0.9 var(--serif);font-style:italic;letter-spacing:-.01em;}
.logo small{font:500 9.5px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-top:5px;}
.logo img{max-height:52px;width:auto;}
.hdr-act{display:flex;justify-content:flex-end;gap:10px;align-items:center;}
.cartbtn{position:relative;}
.cartbtn .n{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font:600 10.5px/19px var(--sans);text-align:center;}

/* ── footer ── */
.ftr{margin-top:120px;background:var(--ink);color:color-mix(in srgb,var(--bg) 80%,var(--ink));}
.ftr a{color:inherit;text-decoration:none;}
.ftr a:hover{color:var(--bg);}
.ftr-in{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.3fr;gap:40px;padding:72px 0 48px;}
.ftr h4{font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--bg);margin:0 0 18px;}
.ftr p,.ftr li{font-size:14px;line-height:1.9;margin:0;}
.ftr ul{list-style:none;padding:0;margin:0;}
.ftr .logo b{color:var(--bg);font-size:44px;}
.ftr-bottom{border-top:1px solid color-mix(in srgb,var(--bg) 14%,transparent);padding:22px 0;font-size:12.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.news{display:flex;gap:8px;margin-top:12px;}
.news input{flex:1;min-width:0;background:transparent;border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:999px;padding:12px 18px;color:var(--bg);outline:none;}
.news input::placeholder{color:color-mix(in srgb,var(--bg) 55%,transparent);}
.news button{background:var(--bg);color:var(--ink);}

/* ── mobile bottom bar ── */
.mnav{display:none;}

/* ── drawer (cart) + modal ── */
.scrim{position:fixed;inset:0;background:rgba(30,22,36,.38);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:90;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);z-index:100;transform:translateX(100%);transition:transform .45s var(--ease),visibility 0s .45s;display:flex;flex-direction:column;visibility:hidden;}
.drawer.on{transform:none;visibility:visible;transition:transform .45s var(--ease);box-shadow:var(--shadow-lg);}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:24px 26px;border-bottom:1px solid var(--line);}
.drawer-b{flex:1;overflow-y:auto;padding:8px 26px;}
.drawer-f{padding:22px 26px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.line{display:grid;grid-template-columns:72px 1fr auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center;}
.line .pimg{aspect-ratio:1;border-radius:12px;}
.line .pimg .ph{font-size:28px;}
.line-name{font:500 20px/1.15 var(--serif);}
.line-opt{font-size:12.5px;color:var(--muted);margin-top:3px;}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;margin-top:10px;}
.qty button{width:32px;height:32px;border:0;background:none;cursor:pointer;font-size:16px;color:var(--muted);}
.qty span{min-width:22px;text-align:center;font-size:14px;}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;background:var(--bg);border-radius:24px;z-index:100;transition:.35s var(--ease);box-shadow:var(--shadow-lg);}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}

/* ── toast ── */
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.35s var(--ease);z-index:200;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0);}

/* ── reveal on scroll ── */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.rv.in{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none;}html{scroll-behavior:auto;}}

/* ── loading shimmer ── */
.sk{background:linear-gradient(90deg,var(--brand-mist),var(--brand-soft),var(--brand-mist));background-size:200% 100%;animation:sk 1.4s infinite;border-radius:var(--r);}
@keyframes sk{to{background-position:-200% 0;}}

/* ── product card (shop + home) ── */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px;}
.pc{text-decoration:none;display:block;position:relative;}
.pc:hover .pimg img{transform:scale(1.05);}
.pc .pimg{margin-bottom:16px;}
.pc .flags{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:2;flex-wrap:wrap;}
.pc .flags .tag{background:color-mix(in srgb,#fff 88%,transparent);backdrop-filter:blur(6px);color:var(--ink);}
.pc .flags .tag.new{background:var(--ink);color:var(--bg);}
.pc .quick{position:absolute;right:14px;bottom:14px;z-index:2;opacity:0;transform:translateY(8px);transition:.35s var(--ease);}
.pc:hover .quick{opacity:1;transform:none;}
.pc-name{font:500 23px/1.15 var(--serif);margin:0 0 6px;}
.pc-desc{font-size:14px;color:var(--muted);margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.pc .soldout{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 55%,transparent);display:flex;align-items:center;justify-content:center;z-index:1;font:italic 500 26px var(--serif);}

/* ── status pill ── */
.st{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;background:var(--brand-soft);color:var(--brand-deep);}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.st.paid,.st.new{background:#eef4ff;color:#3159c4;}
.st.baking,.st.in_progress{background:#fff4e5;color:#b25e09;}
.st.ready,.st.out_for_delivery,.st.shipped,.st.quoted{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 55%,var(--ink));}
.st.completed{background:#e9f7ef;color:#1f7a45;}
.st.cancelled,.st.refunded,.st.declined,.st.pending_payment{background:#f1eff2;color:#6b6470;}

/* ══ phones & tablets ══ */
@media (max-width:900px){
  .hdr-in{grid-template-columns:auto 1fr auto;height:64px;}
  .hdr-nav{display:none;}
  .logo{align-items:flex-start;text-align:left;}
  .logo b{font-size:30px;}
  .logo small{font-size:8.5px;letter-spacing:.28em;}
  .hdr-act .hide-m{display:none;}
  .ftr-in{grid-template-columns:1fr 1fr;gap:34px;padding:56px 0 36px;}
  .ftr-in>div:first-child{grid-column:1/-1;}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom));}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
  .mnav a,.mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;text-decoration:none;border:0;background:none;color:var(--faint);font:500 10px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;}
  .mnav svg{width:22px;height:22px;}
  .mnav .on{color:var(--ink);}
  .mnav .n{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--accent);color:#fff;font:600 10px/17px var(--sans);}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom));}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 14px;}
  .pc-name{font-size:19px;}
  .pc-desc{display:none;}
  .pc .quick{display:none;}
  .pc .flags{top:10px;left:10px;}
  .wrap{padding:0 18px;}
  .ftr{margin-top:80px;}
}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr;}.ftr-in{grid-template-columns:1fr;}}

</style>

<script>
/* ══════════════ Buns Artisan Bakes · shared code ══════════════ */
/* the Supabase connection comes from Buns-config.js (one small file next to the pages) */
var BUNS_CFG=(window.BUNS_CONFIG&&window.BUNS_CONFIG.url&&window.BUNS_CONFIG.url.indexOf('PASTE')<0)?window.BUNS_CONFIG:{url:"__SUPABASE_URL__",key:"__SUPABASE_KEY__"};
var sb=(window.supabase&&BUNS_CFG.url.indexOf('__')!==0)?window.supabase.createClient(BUNS_CFG.url,BUNS_CFG.key):null;
var B=window.B={};

/* ── little helpers ── */
B.esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');};
B.money=function(c){c=+c||0;return '$'+(c/100).toFixed(2);};
B.moneyShort=function(c){c=+c||0;return c%100===0?'$'+(c/100):'$'+(c/100).toFixed(2);};
B.qs=function(k){return new URLSearchParams(location.search).get(k);};
B.slug=function(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');};
B.ymd=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
B.parseYmd=function(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
B.niceDate=function(s,opt){var d=typeof s==='string'&&s.length===10?B.parseYmd(s):new Date(s);return d&&!isNaN(d)?d.toLocaleDateString('en-US',opt||{weekday:'long',month:'long',day:'numeric'}):'';};
B.shortDate=function(s){return B.niceDate(s,{month:'short',day:'numeric',year:'numeric'});};
B.STATUS={pending_payment:'Awaiting payment',paid:'Order received',baking:'In the oven',ready:'Ready',out_for_delivery:'Out for delivery',shipped:'Shipped',completed:'Completed',cancelled:'Cancelled',refunded:'Refunded'};
B.FUL={pickup:'Pickup',delivery:'Local delivery',shipping:'Shipping'};

var ICON={
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.3-3.6 4.2-5.5 7.5-5.5s6.2 1.9 7.5 5.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h16M5.5 9.5 7 4h10l1.5 5.5M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-5h5v5"/></svg>',
  cake:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 20v-7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v7"/><path d="M5 15.5c1.2 0 1.8-1 3.5-1s2.3 1 3.5 1 1.8-1 3.5-1 2.3 1 3.5 1"/><path d="M12 12V8.5M12 6.5c-.8-.6-.8-1.8 0-2.5.8.7.8 1.9 0 2.5Z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  wheat:'<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M32 60V20"/><path d="M32 22c-6-2-8-8-7-14 6 1 9 7 7 14Zm0 0c6-2 8-8 7-14-6 1-9 7-7 14Z"/><path d="M32 34c-7-1-11-6-11-13 7 0 11 6 11 13Zm0 0c7-1 11-6 11-13-7 0-11 6-11 13Z"/><path d="M32 46c-7-1-11-6-11-13 7 0 11 6 11 13Zm0 0c7-1 11-6 11-13-7 0-11 6-11 13Z"/></svg>'
};
B.ICON=ICON;

/* ── brand colours (set in Settings; remembered so pages open in the right colours) ── */
function hexRgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');var n=parseInt(h,16);return isNaN(n)?null:[n>>16&255,n>>8&255,n&255];}
function lum(rgb){var a=rgb.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);});return .2126*a[0]+.7152*a[1]+.0722*a[2];}
B.inkOn=function(hex){var c=hexRgb(hex);if(!c)return '#fff';return lum(c)>.42?'#2F2638':'#fff';};
B.applyTheme=function(t){
  if(!t)return;var r=document.documentElement.style;
  if(t.primary){r.setProperty('--brand',t.primary);r.setProperty('--brand-ink',B.inkOn(t.primary));}
  if(t.accent)r.setProperty('--accent',t.accent);
  if(t.background)r.setProperty('--bg',t.background);
  if(t.text)r.setProperty('--ink',t.text);
  try{localStorage.setItem('buns-theme',JSON.stringify(t));}catch(e){}
};

/* ── store settings (cached for a few minutes) ── */
var _settings=null;
B.settings=function(fresh){
  if(_settings&&!fresh)return _settings;
  _settings=(async function(){
    try{var c=JSON.parse(sessionStorage.getItem('buns-settings')||'null');if(c&&!fresh&&Date.now()-c.t<5*60000)return c.v;}catch(e){}
    if(!sb)return null;
    var r=await sb.from('buns_settings').select('*').eq('id',1).maybeSingle();
    if(r.data){try{sessionStorage.setItem('buns-settings',JSON.stringify({t:Date.now(),v:r.data}));}catch(e){}}
    return r.data||null;
  })();
  return _settings;
};
B.clearSettingsCache=function(){try{sessionStorage.removeItem('buns-settings');}catch(e){}_settings=null;};

/* ── catalogue ── */
var _catalog=null;
B.catalog=function(){
  if(_catalog)return _catalog;
  _catalog=(async function(){
    if(!sb)return {products:[],categories:[]};
    var r=await Promise.all([
      sb.from('buns_products').select('*').eq('active',true).order('sort').order('created_at',{ascending:false}),
      sb.from('buns_categories').select('*').eq('active',true).order('sort')
    ]);
    return {products:r[0].data||[],categories:r[1].data||[]};
  })();
  return _catalog;
};

/* ── product picture ── */
B.pimg=function(p,i,cls){
  var src=p&&p.images&&p.images[i||0];
  return '<div class="pimg'+(cls?' '+cls:'')+'">'+(src?'<img src="'+B.esc(src)+'" alt="'+B.esc(p.name)+'" loading="lazy">':'<div class="ph">'+ICON.wheat+'</div>')+'</div>';
};
B.unitPrice=function(p,opts){var c=+p.price_cents||0;(p.options||[]).forEach(function(o){var pick=opts&&opts[o.name];(o.choices||[]).forEach(function(ch){if(ch.label===pick)c+=(+ch.delta_cents||0);});});return c;};
B.soldOut=function(p){return p.track_stock&&(+p.stock||0)<=0;};

/* ── cart (kept on this device until checkout) ── */
B.cart={
  get:function(){try{return JSON.parse(localStorage.getItem('buns-cart')||'[]');}catch(e){return [];}},
  save:function(c){localStorage.setItem('buns-cart',JSON.stringify(c));B.renderCartBadge();document.dispatchEvent(new Event('buns-cart'));},
  key:function(pid,opts){return pid+'|'+JSON.stringify(opts||{});},
  add:function(pid,qty,opts){var c=B.cart.get(),k=B.cart.key(pid,opts),f=c.find(function(x){return x.k===k;});if(f)f.qty+=qty;else c.push({k:k,id:pid,qty:qty,opts:opts||{}});B.cart.save(c);},
  set:function(k,qty){var c=B.cart.get();c=c.map(function(x){if(x.k===k)x.qty=qty;return x;}).filter(function(x){return x.qty>0;});B.cart.save(c);},
  clear:function(){B.cart.save([]);},
  count:function(){return B.cart.get().reduce(function(a,x){return a+x.qty;},0);}
};
/* cart lines with today's product info (drops anything no longer for sale) */
B.cartLines=async function(){
  var cat=await B.catalog(),byId={};cat.products.forEach(function(p){byId[p.id]=p;});
  return B.cart.get().map(function(x){var p=byId[x.id];if(!p)return null;var u=B.unitPrice(p,x.opts);return {k:x.k,p:p,qty:x.qty,opts:x.opts,unit:u,line:u*x.qty};}).filter(Boolean);
};

/* ── toast ── */
B.toast=function(msg){var t=document.getElementById('bToast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(B._tt);B._tt=setTimeout(function(){t.classList.remove('on');},2800);};

/* ── header, footer, mobile bar, cart drawer ── */
B.renderCartBadge=function(){var n=B.cart.count();document.querySelectorAll('[data-cart-n]').forEach(function(el){el.textContent=n;el.style.display=n?'':'none';});};
B.init=async function(opt){
  opt=opt||{};var page=opt.page||'';
  var nav=[['Buns-shop.html','Shop','shop'],['Buns-custom.html','Custom Cakes','custom'],['Buns-index.html#story','Our Story','story']];
  var hdr=document.getElementById('bunsHeader');
  if(hdr){
    hdr.innerHTML='<div class="ann hide" id="bAnn"></div>'
      +'<header class="hdr" id="bHdr"><div class="wrap hdr-in">'
      +'<nav class="hdr-nav">'+nav.map(function(n){return '<a href="'+n[0]+'"'+(page===n[2]?' class="on"':'')+'>'+n[1]+'</a>';}).join('')+'</nav>'
      +'<a class="logo" href="Buns-index.html" id="bLogo"><b>Buns</b><small>Artisan Bakes</small></a>'
      +'<div class="hdr-act"><a class="iconbtn hide-m" href="Buns-account.html" aria-label="Your account">'+ICON.user+'</a>'
      +'<button class="iconbtn cartbtn" onclick="B.openCart()" aria-label="Your bag">'+ICON.bag+'<span class="n" data-cart-n style="display:none">0</span></button></div>'
      +'</div></header>';
    var h=document.getElementById('bHdr');window.addEventListener('scroll',function(){h.classList.toggle('scrolled',scrollY>8);},{passive:true});
  }
  var ftr=document.getElementById('bunsFooter');
  if(ftr){
    ftr.innerHTML='<footer class="ftr"><div class="wrap"><div class="ftr-in">'
      +'<div><a class="logo" href="Buns-index.html" style="align-items:flex-start"><b>Buns</b><small style="color:inherit">Artisan Bakes</small></a><p style="margin-top:18px;max-width:300px" id="bFtrTag"></p><p style="margin-top:14px" id="bFtrSocial"></p></div>'
      +'<div><h4>Visit</h4><p id="bFtrAddr"></p><p id="bFtrContact" style="margin-top:8px"></p></div>'
      +'<div><h4>Hours</h4><ul id="bFtrHours"></ul></div>'
      +'<div><h4>From the oven</h4><p>New bakes and seasonal drops, a few times a month.</p><form class="news" onsubmit="B.subscribe(event)"><input type="email" required placeholder="Your email" aria-label="Email"><button class="btn btn-sm">Join</button></form></div>'
      +'</div><div class="ftr-bottom"><span>© '+new Date().getFullYear()+' <span id="bFtrName">Buns Artisan Bakes</span></span><span><a href="Buns-shop.html">Shop</a> · <a href="Buns-custom.html">Custom orders</a> · <a href="Buns-account.html">Account</a> · <a href="Buns-admin.html">Staff</a></span></div></div></footer>';
  }
  /* mobile bottom bar */
  var m=document.createElement('nav');m.className='mnav';m.setAttribute('aria-label','Main');
  m.innerHTML=[['Buns-index.html','Home','home',ICON.home],['Buns-shop.html','Shop','shop',ICON.shop],['Buns-custom.html','Custom','custom',ICON.cake],['Buns-account.html','Account','account',ICON.user]]
    .map(function(n){return '<a href="'+n[0]+'"'+(page===n[2]?' class="on"':'')+'>'+n[3]+'<span>'+n[1]+'</span></a>';}).join('')
    +'<button onclick="B.openCart()">'+ICON.bag+'<span>Bag</span><i class="n" data-cart-n style="display:none;font-style:normal">0</i></button>';
  if(!opt.noMobileNav)document.body.appendChild(m);
  /* drawer, scrim, toast */
  var d=document.createElement('div');
  d.innerHTML='<div class="scrim" id="bScrim" onclick="B.closeCart()"></div>'
    +'<aside class="drawer" id="bDrawer" aria-label="Your bag"><div class="drawer-h"><div><div class="eyebrow">Your bag</div><div class="serif" style="font-size:28px;margin-top:6px" id="bCartTitle">Nothing yet</div></div><button class="iconbtn" onclick="B.closeCart()" aria-label="Close">'+ICON.close+'</button></div>'
    +'<div class="drawer-b" id="bCartBody"></div><div class="drawer-f" id="bCartFoot"></div></aside>'
    +'<div class="toast" id="bToast" role="status"></div>';
  document.body.appendChild(d);
  B.renderCartBadge();
  document.addEventListener('buns-cart',function(){if(document.getElementById('bDrawer').classList.contains('on'))B.renderCart();});
  window.addEventListener('storage',function(e){if(e.key==='buns-cart')B.renderCartBadge();});
  B.reveal();
  /* fill in the store's details */
  var s=await B.settings();
  if(s){
    B.applyTheme(s.theme);
    if(s.logo_url){var lg=document.getElementById('bLogo');if(lg)lg.innerHTML='<img src="'+B.esc(s.logo_url)+'" alt="'+B.esc(s.store_name)+'">';}
    var ann=document.getElementById('bAnn');if(ann&&s.home&&s.home.announcement){ann.textContent=s.home.announcement;ann.classList.remove('hide');}
    var set=function(id,html){var el=document.getElementById(id);if(el)el.innerHTML=html;};
    set('bFtrTag',B.esc(s.tagline||''));set('bFtrName',B.esc(s.store_name||'Buns Artisan Bakes'));
    set('bFtrAddr',[s.address,s.city_line].filter(Boolean).map(B.esc).join('<br>')||'Pickup details are shared with your order.');
    set('bFtrContact',[s.phone?'<a href="tel:'+B.esc(s.phone)+'">'+B.esc(s.phone)+'</a>':'',s.email?'<a href="mailto:'+B.esc(s.email)+'">'+B.esc(s.email)+'</a>':''].filter(Boolean).join('<br>'));
    set('bFtrSocial',[s.instagram?'<a href="'+B.esc(s.instagram)+'" target="_blank" rel="noopener">Instagram</a>':'',s.facebook?'<a href="'+B.esc(s.facebook)+'" target="_blank" rel="noopener">Facebook</a>':''].filter(Boolean).join(' · '));
    var days=[['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri'],['sat','Sat'],['sun','Sun']];
    set('bFtrHours',days.map(function(d){return '<li style="display:flex;justify-content:space-between;gap:14px"><span>'+d[1]+'</span><span>'+B.esc((s.hours||{})[d[0]]||'—')+'</span></li>';}).join(''));
    if(s.store_name&&document.title.indexOf(s.store_name)<0&&opt.title)document.title=opt.title+' · '+s.store_name;
  }
  if(!sb)B.toast('Connect Supabase: add the project URL and key to the pages');
  return s;
};

B.reveal=function(){
  var els=[].slice.call(document.querySelectorAll('.rv:not(.in)'));if(!els.length)return;
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in');});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{rootMargin:'0px 0px -8% 0px'});
  els.forEach(function(e){io.observe(e);});
};

B.subscribe=async function(e){
  e.preventDefault();var inp=e.target.querySelector('input');var em=inp.value.trim();if(!em)return;
  var r=sb?await sb.from('buns_subscribers').insert({email:em.toLowerCase()}):{error:{message:'offline'}};
  if(r.error&&!/duplicate|unique/i.test(r.error.message))B.toast('Could not sign you up — please try again');
  else{inp.value='';B.toast('You’re on the list — thank you!');}
};

/* ── cart drawer ── */
B.openCart=function(){B.renderCart();document.getElementById('bDrawer').classList.add('on');document.getElementById('bScrim').classList.add('on');document.body.style.overflow='hidden';};
B.closeCart=function(){document.getElementById('bDrawer').classList.remove('on');document.getElementById('bScrim').classList.remove('on');document.body.style.overflow='';};
B.optText=function(o){return Object.keys(o||{}).map(function(k){return o[k];}).filter(Boolean).join(' · ');};
B.renderCart=async function(){
  var lines=await B.cartLines(),body=document.getElementById('bCartBody'),foot=document.getElementById('bCartFoot');
  var n=lines.reduce(function(a,l){return a+l.qty;},0);
  document.getElementById('bCartTitle').textContent=n?n+' item'+(n!==1?'s':''):'Nothing yet';
  if(!lines.length){
    body.innerHTML='<div style="text-align:center;padding:60px 10px"><div class="serif italic" style="font-size:26px;margin-bottom:10px">Your bag is empty</div><p class="muted" style="margin:0 0 24px">Fresh bakes are waiting.</p><a class="btn btn-primary" href="Buns-shop.html">Browse the shop</a></div>';
    foot.innerHTML='';return;
  }
  body.innerHTML=lines.map(function(l){
    return '<div class="line">'+B.pimg(l.p)+'<div><div class="line-name">'+B.esc(l.p.name)+'</div>'+(B.optText(l.opts)?'<div class="line-opt">'+B.esc(B.optText(l.opts))+'</div>':'')
      +'<div class="qty"><button onclick="B.cart.set(\''+l.k.replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\','+(l.qty-1)+')" aria-label="One fewer">−</button><span>'+l.qty+'</span><button onclick="B.cart.set(\''+l.k.replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\','+(l.qty+1)+')" aria-label="One more">+</button></div></div>'
      +'<div class="price">'+B.money(l.line)+'</div></div>';
  }).join('');
  var sub=lines.reduce(function(a,l){return a+l.line;},0);
  foot.innerHTML='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><span class="eyebrow">Subtotal</span><span class="serif" style="font-size:28px">'+B.money(sub)+'</span></div>'
    +'<p class="muted" style="font-size:13px;margin:0 0 16px">Pickup, delivery or shipping and any tax are chosen at checkout.</p>'
    +'<a class="btn btn-primary btn-block" href="Buns-checkout.html">Checkout</a>';
};

/* ── call one of our server functions ── */
B.fn=async function(name,body){
  if(!sb)throw new Error('Not connected');
  var s=await sb.auth.getSession(),tok=s.data&&s.data.session?s.data.session.access_token:BUNS_CFG.key;
  var r=await fetch(BUNS_CFG.url+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok,'apikey':BUNS_CFG.key},body:JSON.stringify(body||{})});
  var j=await r.json().catch(function(){return {};});
  if(!r.ok||j.error)throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
};

</script>
<style>
.crumb{padding:26px 0;font-size:13px;color:var(--muted);}
.crumb a{text-decoration:none;}.crumb a:hover{color:var(--ink);}
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:start;}

.main-img .pimg{flex:0 0 100%;scroll-snap-align:start;border-radius:0;aspect-ratio:4/5;}
.dots{display:none;}
.info h1{font-size:clamp(38px,4.6vw,58px);margin:14px 0 14px;}
.info .price{font-size:22px;}
.info .short{font-size:17.5px;color:var(--muted);margin:22px 0 30px;}
.opt{margin-bottom:24px;}
.opt-l{font:500 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;}
.opt-c{display:flex;flex-wrap:wrap;gap:8px;}
.buy{display:flex;gap:12px;margin:30px 0 14px;}
.buy .qty{margin:0;height:52px;}
.buy .qty button{width:44px;height:50px;}

.note{font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;margin:8px 0;}

.acc{border-top:1px solid var(--line);margin-top:34px;}

}

<body>
<div id="bunsHeader"></div>
<main class="wrap" id="pd"><div class="pd" style="padding-top:30px"><div class="sk" style="aspect-ratio:4/5"></div><div><div class="sk" style="height:60px;margin-bottom:20px"></div><div class="sk" style="height:200px"></div></div></div></main>
<section class="wrap hide" id="more" style="padding-top:100px"><div class="eyebrow pink">You may also like</div><h2 style="margin:14px 0 36px">More from the bakery</h2><div class="pgrid" id="moreGrid"></div></section>
<div id="bunsFooter"></div>
<script>
var P=null,qty=1,pick={},S=null;
function opts(){return (P.options||[]).map(function(o,i){
  return '<div class="opt"><div class="opt-l"><span>'+B.esc(o.name)+'</span></div><div class="opt-c">'+(o.choices||[]).map(function(c){
    return '<button class="chip'+(pick[o.name]===c.label?' on':'')+'" onclick="choose('+i+',\''+B.esc(c.label).replace(/'/g,"\\'")+'\')">'+B.esc(c.label)+(+c.delta_cents?' <span style="opacity:.6">'+(c.delta_cents>0?'+':'−')+B.moneyShort(Math.abs(c.delta_cents))+'</span>':'')+'</button>';}).join('')+'</div></div>';}).join('');}
function choose(i,label){pick[P.options[i].name]=label;draw();}
function setQty(n){var max=P.max_per_order||(P.track_stock?P.stock:99);qty=Math.max(1,Math.min(n,max||99));draw();}
function add(){
  var miss=(P.options||[]).find(function(o){return !pick[o.name];});
  if(miss){B.toast('Please choose a '+miss.name.toLowerCase());return;}
  B.cart.add(P.id,qty,pick);B.toast(qty+' × '+P.name+' added');B.openCart();
}
function waysText(){
  var f=(S&&S.fulfillment)||{},w=[];
  (P.fulfillment||[]).forEach(function(k){if(k==='pickup'&&(!f.pickup||f.pickup.enabled))w.push('pickup');if(k==='delivery'&&f.delivery&&f.delivery.enabled)w.push('local delivery');if(k==='shipping'&&f.shipping&&f.shipping.enabled)w.push('shipping');});
  return w.length?'Available for '+w.join(', ').replace(/, ([^,]*)$/,' or $1'):'';
}
function draw(){
  var unit=B.unitPrice(P,pick),sold=B.soldOut(P);
  var lead=P.lead_days!=null?P.lead_days:((S&&S.fulfillment&&S.fulfillment.pickup&&S.fulfillment.pickup.lead_days)||1);
  var imgs=(P.images&&P.images.length?P.images:[null]);
  var qtyHtml='<div class="qty"><button onclick="setQty(qty-1)" aria-label="One fewer">−</button><span>'+qty+'</span><button onclick="setQty(qty+1)" aria-label="One more">+</button></div>';
  document.getElementById('pd').innerHTML='<div class="crumb"><a href="Buns-shop.html">Shop</a>'+(window._cat?' / <a href="Buns-shop.html?cat='+encodeURIComponent(window._cat.slug)+'">'+B.esc(window._cat.name)+'</a>':'')+' / '+B.esc(P.name)+'</div>'
    +'<div class="pd"><div class="gal"'+(imgs.length>1?'':' style="grid-template-columns:1fr"')+'>'+(imgs.length>1?'<div class="thumbs">'+imgs.map(function(s,i){return '<button class="'+(i===0?'on':'')+'" onclick="goImg('+i+')" aria-label="Photo '+(i+1)+'">'+B.pimg(P,i)+'</button>';}).join('')+'</div>':'')
    +'<div><div class="main-img" id="mainImg">'+imgs.map(function(s,i){return B.pimg(P,i);}).join('')+'</div>'+(imgs.length>1?'<div class="dots" id="dots">'+imgs.map(function(s,i){return '<i class="'+(i===0?'on':'')+'"></i>';}).join('')+'</div>':'')+'</div></div>'
    +'<div class="info rv in"><div style="display:flex;gap:8px;flex-wrap:wrap">'+(P.is_new?'<span class="tag dark">New</span>':'')+(P.badge?'<span class="tag">'+B.esc(P.badge)+'</span>':'')+(window._cat?'<span class="tag brand">'+B.esc(window._cat.name)+'</span>':'')+'</div>'
    +'<h1>'+B.esc(P.name)+'</h1><div class="price">'+B.money(unit)+(P.compare_cents>P.price_cents?'<s>'+B.money(P.compare_cents)+'</s>':'')+'</div>'
    +(P.short_desc?'<p class="short">'+B.esc(P.short_desc)+'</p>':'<div style="height:26px"></div>')
    +opts()
    +'<div class="buy">'+qtyHtml+'<button class="btn btn-primary" onclick="add()"'+(sold?' disabled':'')+'>'+(sold?'Sold out':'Add to bag · '+B.money(unit*qty))+'</button></div>'
    +'<div class="note">Order at least '+lead+' day'+(lead!==1?'s':'')+' ahead — baked fresh for your day</div>'
    +(waysText()?'<div class="note">'+waysText()+'</div>':'')
    +(P.track_stock&&P.stock>0&&P.stock<=6?'<div class="note">Only '+P.stock+' left</div>':'')
    +'<div class="acc">'+(P.description?'<details open><summary>Description</summary><div class="body">'+B.esc(P.description)+'</div></details>':'')
    +((P.ingredients||(P.allergens&&P.allergens.length))?'<details><summary>Ingredients &amp; allergens</summary><div class="body">'+B.esc(P.ingredients||'')+(P.allergens&&P.allergens.length?'<div class="allg">'+P.allergens.map(function(a){return '<span class="tag brand">Contains '+B.esc(a)+'</span>';}).join('')+'</div>':'')+'</div></details>':'')
    +'<details><summary>Ordering &amp; freshness</summary><div class="body">Choose your pickup, delivery or ship date at checkout. Most bakes are at their best the day you receive them — warm croissants and buns for 5 minutes at 350°F to bring them back to life.</div></details></div>'
    +'</div></div>';
  var mb=document.getElementById('mbuy');if(!mb){mb=document.createElement('div');mb.id='mbuy';mb.className='mbuy';document.body.appendChild(mb);}
  mb.innerHTML=qtyHtml+'<button class="btn btn-primary" onclick="add()"'+(sold?' disabled':'')+'>'+(sold?'Sold out':'Add · '+B.money(unit*qty))+'</button>';
  var m=document.getElementById('mainImg');if(m)m.addEventListener('scroll',function(){var i=Math.round(m.scrollLeft/m.clientWidth);document.querySelectorAll('#dots i,.thumbs button').forEach(function(d,j){d.classList.toggle('on',j%imgs.length===i);});},{passive:true});
}
function goImg(i){var m=document.getElementById('mainImg');m.scrollTo({left:i*m.clientWidth,behavior:'smooth'});}
(async function(){
  S=await B.init({page:'shop'});
  var key=B.qs('p'),cat=await B.catalog();
  P=cat.products.find(function(p){return p.slug===key||p.id===key;});
  if(!P){document.getElementById('pd').innerHTML='<div style="text-align:center;padding:100px 0"><div class="serif italic" style="font-size:34px;margin-bottom:12px">This bake isn’t on the menu right now</div><a class="btn btn-primary" href="Buns-shop.html">Back to the shop</a></div>';return;}
  window._cat=cat.categories.find(function(c){return c.id===P.category_id;});
  document.title=P.name+' · '+((S&&S.store_name)||'Buns Artisan Bakes');
  (P.options||[]).forEach(function(o){if(o.choices&&o.choices.length)pick[o.name]=o.choices[0].label;});
  draw();
  var more=cat.products.filter(function(p){return p.id!==P.id;}).sort(function(a,b){return (b.category_id===P.category_id)-(a.category_id===P.category_id)||(b.featured-a.featured);}).slice(0,4);
  if(more.length){document.getElementById('more').classList.remove('hide');document.getElementById('moreGrid').innerHTML=more.map(function(p){return '<a class="pc rv" href="Buns-product.html?p='+encodeURIComponent(p.slug||p.id)+'"><div class="flags">'+(p.is_new?'<span class="tag new">New</span>':'')+'</div>'+B.pimg(p)+'<h3 class="pc-name">'+B.esc(p.name)+'</h3><div class="price">'+B.money(p.price_cents)+'</div></a>';}).join('');B.reveal();}
})();
</script>
</body>
</html>

<script>
/* ── SharkLaw V4 style switch ─────────────────────────────────────────
   sl-style: 'legacy' (default until the project goes live) or 'v4'.
   In the v4 style, light/dark is stored separately in 'v4-mode' (light
   by default); the page's own theme code keeps using 'app-theme', and
   this shim quietly redirects it. Logout's localStorage.clear() keeps
   the display settings. */
(function(){
  var LS;try{LS=window.localStorage;}catch(e){return;}
  var P=Storage.prototype,g=P.getItem,s=P.setItem,c=P.clear;
  var st='legacy';try{st=g.call(LS,'sl-style')==='v4'?'v4':'legacy';}catch(e){}
  window.SL_STYLE=st;
  var KEEP=['sl-style','v4-mode','app-theme'];
  P.clear=function(){
    if(this!==LS)return c.call(this);
    var keep={};KEEP.forEach(function(k){var v=g.call(LS,k);if(v!==null)keep[k]=v;});
    c.call(this);Object.keys(keep).forEach(function(k){s.call(LS,k,keep[k]);});
  };
  var m='light';try{m=g.call(LS,'v4-mode')==='dark'?'dark':'light';}catch(e){}
  if(st==='v4'){
    P.getItem=function(k){if(this===LS&&k==='app-theme')return g.call(LS,'v4-mode')==='dark'?'dark':'light';return g.call(this,k);};
    P.setItem=function(k,v){
      if(this===LS&&k==='app-theme'){var md=String(v).indexOf('light')>=0?'light':'dark';s.call(LS,'v4-mode',md);document.documentElement.setAttribute('data-v4mode',md);return;}
      return s.call(this,k,v);
    };
  }
  var h=document.documentElement;h.setAttribute('data-style',st);h.setAttribute('data-v4mode',m);
})();
</script>

<style id="v4-style">
/* ═════════ SharkLaw V4 style layer ═════════
   Only rules under html[data-style="v4"] change the look. With the
   legacy style the page looks exactly like V2, plus the gear button. */

/* gear + display panel: shown in both styles (testing switch) */
.v4-gear{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.v4-gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.v4-gear.floating{position:fixed;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:3000;width:46px;height:46px;border-radius:50%;background:var(--bg-card);box-shadow:0 4px 16px rgba(0,0,0,.3);}
.v4-pop{position:fixed;top:68px;right:16px;width:min(310px,calc(100vw - 24px));background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-default);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.35);padding:16px;z-index:5000;display:none;font-size:14px;}
.v4-pop.on{display:block;}
.v4-pop h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);margin:0 0 8px;}
.v4-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg-hover);border:1px solid var(--border-default);border-radius:10px;padding:3px;margin-bottom:14px;}
.v4-seg button{border:none;background:transparent;border-radius:8px;min-height:40px;font-weight:600;font-size:14px;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
.v4-seg button.on{background:var(--accent-primary);color:#fff;}
.v4-pop p{font-size:12px;color:var(--text-secondary);margin:0;line-height:1.4;}
.v4-pop .v4-x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:22px;color:var(--text-secondary);cursor:pointer;}
.v4-logo-link,.v4-divider,.v4-mlogo,.v4-mnav,.v4-sheet,.v4-scrim{display:none;}
.top .v4-gear{margin-left:auto;order:1;}.top .sub{order:2;}

/* ───── tokens (override V2 variables) ───── */
html[data-style="v4"][data-v4mode="light"]{
  --bg-primary:#f5f6fa;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#eef0f6;--border-default:#dfe2ec;
  --text-primary:#191b2e;--text-secondary:#5a5f78;--accent-primary:#0404f4;--accent-light:#0404f4;
  --v4-brand:#22253d;--v4-shadow:0 1px 2px rgba(25,27,46,.06),0 4px 14px rgba(25,27,46,.05);
  --v4-danger:#c81e1e;--v4-warn:#a14a06;--v4-ok:#15803d;--v4-danger-soft:rgba(200,30,30,.09);--v4-warn-soft:rgba(217,119,6,.12);--v4-ok-soft:rgba(21,128,61,.10);
  --v4-violet:#6d28d9;--v4-blue:#1d4ed8;--v4-green:#15803d;--v4-amber:#a14a06;--v4-teal:#0f766e;--v4-gray:#4b5563;
}
html[data-style="v4"][data-v4mode="dark"]{
  --bg-primary:#161829;--bg-secondary:#1c1f33;--bg-card:#22253d;--bg-hover:#2b2f4a;--border-default:#363a58;
  --text-primary:#eef0f8;--text-secondary:#b4b8cc;--accent-primary:#3b45f5;--accent-light:#a5abff;
  --v4-brand:#0f1120;--v4-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --v4-danger:#fca5a5;--v4-warn:#fcd34d;--v4-ok:#86efac;--v4-danger-soft:rgba(248,113,113,.15);--v4-warn-soft:rgba(251,191,36,.14);--v4-ok-soft:rgba(74,222,128,.13);
  --v4-violet:#c4b5fd;--v4-blue:#93c5fd;--v4-green:#86efac;--v4-amber:#fcd34d;--v4-teal:#5eead4;--v4-gray:#d1d5db;
}
html[data-style="v4"],html[data-style="v4"] body{background:var(--bg-primary);color:var(--text-primary);}
html[data-style="v4"] body,html[data-style="v4"] button,html[data-style="v4"] input,html[data-style="v4"] select,html[data-style="v4"] textarea{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;}

html[data-style="v4"] .cal-cell{background:var(--bg-card)!important;border-color:var(--border-default)!important;}
html[data-style="v4"] .cal-cell:hover{background:var(--bg-hover)!important;}
html[data-style="v4"] .cal-strip,html[data-style="v4"] .week-ev,html[data-style="v4"] .day-ev,html[data-style="v4"] .mw-event{border-radius:6px!important;}
html[data-style="v4"] .sched-title{font-weight:800!important;letter-spacing:-.01em;}
html[data-style="v4"] .view-btn.active,html[data-style="v4"] .vt-btn.active{background:var(--accent-primary)!important;color:#fff!important;}
html[data-style="v4"] .mini-day.today,html[data-style="v4"] .cal-cell.today .cal-day-num,html[data-style="v4"] .mw-today .mw-day-num{background:var(--accent-primary)!important;color:#fff!important;}

/* ───── funnels ───── */
.v4-funnel{display:flex;flex-direction:column;gap:10px;}
.v4-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg-hover);}
.v4-stack div{height:100%;}
.v4-legend{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.v4-legend::-webkit-scrollbar{display:none;}
.v4-lg{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border-default);border-radius:10px;background:var(--bg-card);color:var(--text-primary);font-size:13px;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.v4-lg:hover{border-color:var(--accent-light);}
.v4-lg .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.v4-lg b{font-size:15px;}
.v4-lg.kpi{cursor:default;background:var(--bg-hover);}
.v4-due{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(217,119,6,.15);color:#b45309;margin-left:4px;}
[data-theme="dark"] .v4-due,html[data-style="v4"][data-v4mode="dark"] .v4-due{color:#fcd34d;}

/* ───── mobile bottom nav + More sheet (v4 only) ───── */
@media(max-width:768px){
  html[data-style="v4"] .mobile-bottom-nav{display:none!important;}
  html[data-style="v4"] .v4-mnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:2500;background:var(--bg-card);border-top:1px solid var(--border-default);padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
  html[data-style="v4"] body{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important;}
  html[data-style="v4"] .v4-gear.floating{bottom:calc(92px + env(safe-area-inset-bottom));}
  html[data-style="v4"] .desktop-header{display:none!important;}
}
.v4-mnav-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.v4-mnav a,.v4-mnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:10px;text-decoration:none;color:var(--text-secondary);font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;}
.v4-mnav svg,.v4-sheet svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.v4-mnav .on{color:var(--accent-light);background:color-mix(in srgb,var(--accent-primary) 10%,transparent);}
html[data-style="v4"] .v4-scrim.on{display:block;position:fixed;inset:0;background:rgba(10,12,24,.5);z-index:2600;}
html[data-style="v4"] .v4-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:2601;background:var(--bg-card);color:var(--text-primary);border-radius:20px 20px 0 0;padding:10px 0 calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:85vh;overflow-y:auto;}
html[data-style="v4"] .v4-sheet.on{transform:none;}
.v4-sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--border-default);margin:4px auto 10px;}
.v4-sheet a,.v4-sheet button.si{display:flex;align-items:center;gap:14px;width:100%;padding:13px 22px;font-size:16px;font-weight:500;color:var(--text-primary);text-decoration:none;background:none;border:none;text-align:left;cursor:pointer;min-height:50px;font-family:inherit;}
.v4-sheet a.on{color:var(--accent-light);font-weight:700;}
.v4-sheet a svg,.v4-sheet button.si svg{color:var(--text-secondary);}
.v4-sheet .sep{height:1px;background:var(--border-default);margin:6px 0;}
@media(min-width:769px){.v4-mnav,.v4-sheet,.v4-scrim{display:none!important;}}

</style>
</head>

<script>
(function(){
  var SB_URL='https://wiwbmvmgrutjfbnqhfnb.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd2Jtdm1ncnV0amZibnFoZm5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjY4NzQsImV4cCI6MjA5MDI0Mjg3NH0.puEaHAJijQPSi1ziuYsqTRZnSAALK0tpH1myrLz7dYk';
  var TENANT='55555555-5555-5555-5555-555555555555';
  var DASHBOARD='v4-sharklaw-dashboard.html';
  var OVERVIEW='v4-sharklaw-overview.html';
  /* owners, admins and managers open on the Overview; everyone else on the Dashboard */
  function homeFor(role){return ['owner','admin','manager'].indexOf(String(role||'').toLowerCase())>=0?OVERVIEW:DASHBOARD;}
  var sb=window.supabase.createClient(SB_URL,SB_KEY);

  var emailEl=document.getElementById('email');
  var pwEl=document.getElementById('password');
  var btn=document.getElementById('loginBtn');
  var pwToggle=document.getElementById('pwToggle');
  var errEl=document.getElementById('errorMsg');
  var okEl=document.getElementById('successMsg');

  var loginCard=document.getElementById('loginCard');
  var setPwCard=document.getElementById('setPwCard');
  var setPwTitle=document.getElementById('setPwTitle');
  var setPwSub=document.getElementById('setPwSub');
  var newPwEl=document.getElementById('newPassword');
  var confirmPwEl=document.getElementById('confirmPassword');
  var setPwBtn=document.getElementById('setPwBtn');
  var setPwErr=document.getElementById('setPwError');
  var setPwOk=document.getElementById('setPwSuccess');
  var newPwToggle=document.getElementById('newPwToggle');

  // Safe localStorage — Safari private mode throws on access
  function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function lsClear(){try{localStorage.clear();}catch(e){}}

  function showErr(m){errEl.textContent=m;errEl.classList.add('show');okEl.classList.remove('show');}
  function showOk(m){okEl.textContent=m;okEl.classList.add('show');errEl.classList.remove('show');}
  function clearMsgs(){errEl.classList.remove('show');okEl.classList.remove('show');}

  // Deactivated banner
  if(new URLSearchParams(location.search).get('reason')==='deactivated'){
    var bann=document.createElement('div');
    bann.className='deactivated-banner';
    bann.textContent='Your account has been deactivated. Contact your administrator.';
    document.querySelector('.card').insertBefore(bann,document.querySelector('.form-group'));
  }

  // Password show/hide
  pwToggle.addEventListener('click',function(){
    var pw=pwEl.type==='password';
    pwEl.type=pw?'text':'password';
    pwToggle.innerHTML=pw?'&#128584;':'&#128065;';
  });

  // ── Detect invite / password-recovery links ──────────────────────────────
  // Supabase sends the user here with a hash like:
  //   #access_token=...&refresh_token=...&type=invite&expires_in=3600
  // or type=recovery for password resets. We must NOT auto-redirect to the
  // dashboard in those cases — the user needs to set a password first.
  var _hashParams=new URLSearchParams((location.hash||'').replace(/^#/,''));
  var _authType=_hashParams.get('type');
  var isInviteFlow=(_authType==='invite'||_authType==='signup');
  var isRecoveryFlow=(_authType==='recovery');
  var authError=_hashParams.get('error_description')||_hashParams.get('error');

  function showSetPwErr(m){setPwErr.textContent=m;setPwErr.classList.add('show');setPwOk.classList.remove('show');}
  function showSetPwOk(m){setPwOk.textContent=m;setPwOk.classList.add('show');setPwErr.classList.remove('show');}

  function showSetPasswordUI(mode){
    loginCard.style.display='none';
    setPwCard.style.display='block';
    if(mode==='recovery'){
      setPwTitle.textContent='Reset Your Password';
      setPwSub.textContent='Enter a new password for your account.';
    } else {
      setPwTitle.textContent='Set Your Password';
      setPwSub.textContent='Welcome to Shark Law! Create a password to finish setting up your account.';
    }
  }

  // If the URL has an auth error (expired link, etc.), show it on the login form
  if(authError){
    showErr(decodeURIComponent(authError.replace(/\+/g,' ')));
    history.replaceState(null,'',location.pathname+location.search);
  }

  // Password toggle for the new-password field
  newPwToggle.addEventListener('click',function(){
    var pw=newPwEl.type==='password';
    newPwEl.type=pw?'text':'password';
    newPwToggle.innerHTML=pw?'&#128584;':'&#128065;';
  });

  // Submit handler for setting a new password (invite or recovery)
  async function setPassword(){
    setPwErr.classList.remove('show');setPwOk.classList.remove('show');
    var p1=(newPwEl.value||'').trim();
    var p2=(confirmPwEl.value||'').trim();
    if(p1.length<6){showSetPwErr('Password must be at least 6 characters.');return;}
    if(p1!==p2){showSetPwErr('Passwords do not match.');return;}
    setPwBtn.disabled=true;setPwBtn.textContent='Saving...';
    try{
      // supabase-js auto-consumed the hash and created a session. Update password using that session.
      var sess=await sb.auth.getSession();
      if(!sess.data||!sess.data.session){
        throw new Error('Your invite link may have expired. Please request a new one.');
      }
      var r=await sb.auth.updateUser({password:p1});
      if(r.error)throw r.error;
      // Save tokens for the dashboard
      var s2=await sb.auth.getSession();
      if(s2.data&&s2.data.session){
        lsSet('sb_access_token',s2.data.session.access_token);
        lsSet('sb_refresh_token',s2.data.session.refresh_token);
      }
      showSetPwOk('Password set! Redirecting...');
      // Clear the hash and go to dashboard
      history.replaceState(null,'',location.pathname);
      setTimeout(function(){location.replace(DASHBOARD);},800);
    }catch(err){
      showSetPwErr((err&&err.message)||'Could not set password. Try again.');
      setPwBtn.disabled=false;setPwBtn.textContent='Set Password & Sign In';
    }
  }
  setPwBtn.addEventListener('click',setPassword);
  confirmPwEl.addEventListener('keydown',function(e){if(e.key==='Enter')setPassword();});

  // If we detected an invite/recovery flow, show that UI immediately and skip auto-login
  if(isInviteFlow||isRecoveryFlow){
    showSetPasswordUI(isRecoveryFlow?'recovery':'invite');
  }

  // ── Verify the authenticated user belongs to SharkLaw team ──────────────
  // Returns true and redirects if valid. Returns false and shows error if not.
  async function verifyAndRedirect(session){
    var email=(session.user&&session.user.email||'').toLowerCase().trim();
    if(!email){
      showErr('Could not read account email. Please try again.');
      btn.disabled=false;btn.textContent='Sign In';
      return;
    }
    try{
      var r=await sb.from('team_members')
        .select('member_id,is_active,first_name,role')
        .eq('email',email)
        .eq('tenant_id',TENANT)
        .maybeSingle();

      if(!r.data){
        // Valid Supabase auth user but NOT a SharkLaw team member — block them
        await sb.auth.signOut();
        lsClear();
        showErr('No SharkLaw account found for '+email+'. Contact your administrator.');
        btn.disabled=false;btn.textContent='Sign In';
        return;
      }
      if(r.data.is_active===false){
        await sb.auth.signOut();
        lsClear();
        showErr('Your account has been deactivated. Contact your administrator.');
        btn.disabled=false;btn.textContent='Sign In';
        return;
      }
      // Valid SharkLaw team member — go to their home page
      location.replace(homeFor(r.data.role));
    }catch(e){
      // Network error during team check — do NOT redirect, show error
      await sb.auth.signOut();
      lsClear();
      showErr('Network error verifying account. Check your connection and try again.');
      btn.disabled=false;btn.textContent='Sign In';
    }
  }

  // ── Check existing session on page load (silent) ─────────────────────────
  // Uses maybeSingle so it never throws if user isn't found.
  // Only redirects on a clean confirmed SharkLaw session.
  (async function checkSession(){
    // Don't auto-redirect if user arrived via invite or password-recovery link —
    // they need to set a password first via the set-password UI.
    if(isInviteFlow||isRecoveryFlow)return;
    try{
      var r=await sb.auth.getSession();
      if(r.data&&r.data.session){
        var email=(r.data.session.user&&r.data.session.user.email||'').toLowerCase().trim();
        if(email){
          var chk=await sb.from('team_members')
            .select('is_active,role')
            .eq('email',email)
            .eq('tenant_id',TENANT)
            .maybeSingle();
          if(chk.data&&chk.data.is_active!==false){
            location.replace(homeFor(chk.data.role));
            return;
          }
          // Session exists but not a valid SharkLaw member — clear it silently
          await sb.auth.signOut();
          lsClear();
        }
        return;
      }
      // Try stored tokens
      var t=lsGet('sb_access_token'),rf=lsGet('sb_refresh_token');
      if(t&&rf){
        var sr=await sb.auth.setSession({access_token:t,refresh_token:rf});
        if(sr.data&&sr.data.session){
          var email2=(sr.data.session.user&&sr.data.session.user.email||'').toLowerCase().trim();
          if(email2){
            var chk2=await sb.from('team_members')
              .select('is_active,role')
              .eq('email',email2)
              .eq('tenant_id',TENANT)
              .maybeSingle();
            if(chk2.data&&chk2.data.is_active!==false){
              location.replace(homeFor(chk2.data.role));
              return;
            }
          }
          await sb.auth.signOut();
          lsClear();
        }
      }
    }catch(e){/* silent — just show login form */}
  })();

  // ── Login ────────────────────────────────────────────────────────────────
  async function login(){
    clearMsgs();
    // Lowercase + trim at submit time only — never on input events
    // (input events break Google/Apple autofill)
    var email=(emailEl.value||'').trim().toLowerCase();
    var password=(pwEl.value||'').trim();

    if(!email||!password){showErr('Please enter your email and password.');return;}
    if(email.indexOf('@')<0){showErr('Please enter a valid email address.');return;}

    btn.disabled=true;
    btn.textContent='Signing in...';

    try{
      var r=await sb.auth.signInWithPassword({email:email,password:password});
      if(r.error)throw r.error;

      lsSet('sb_access_token',r.data.session.access_token);
      lsSet('sb_refresh_token',r.data.session.refresh_token);

      showOk('Verified! Loading dashboard...');
      btn.textContent='Loading...';
      await verifyAndRedirect(r.data.session);

    }catch(err){
      var msg=(err&&err.message)||'Login failed. Please try again.';
      if(/invalid login|invalid credentials/i.test(msg)){
        msg='Wrong email or password. Check caps lock and try again.';
      }else if(/email not confirmed/i.test(msg)){
        msg='Please confirm your email before signing in.';
      }else if(/network|fetch/i.test(msg)){
        msg='Network error. Check your connection and try again.';
      }
      showErr(msg);
      btn.textContent='Sign In';
      btn.disabled=false;
    }
  }

  // ── Forgot password ──────────────────────────────────────────────────────
  window.handleForgot=async function(e){
    e.preventDefault();
    var email=(emailEl.value||'').trim().toLowerCase();
    if(!email){showErr('Enter your email address first.');return;}
    btn.disabled=true;
    try{
      var r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
      if(r.error)throw r.error;
      showOk('Password reset email sent. Check your inbox.');
    }catch(err){showErr((err&&err.message)||'Could not send reset email.');}
    btn.disabled=false;
  };

  // ── Event listeners ──────────────────────────────────────────────────────
  // No input/change listeners on fields — breaks autofill on mobile
  btn.addEventListener('click',login);
  emailEl.addEventListener('keydown',function(e){if(e.key==='Enter')pwEl.focus();});
  pwEl.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&emailEl.value.trim()&&pwEl.value)login();
  });

})();
</script>

    var m=curMode();
    pop.querySelectorAll('[data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
    pop.querySelectorAll('[data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===(v4?'v4':'legacy'));});
  }
  pop.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('v4-x')){pop.classList.remove('on');return;}
    if(b.dataset.m)setMode(b.dataset.m);
    if(b.dataset.s&&b.dataset.s!==(v4?'v4':'legacy'))setStyle(b.dataset.s);
  });
  document.addEventListener('click',function(e){if(pop.classList.contains('on')&&!pop.contains(e.target)&&!e.target.closest('.v4-gear'))pop.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){pop.classList.remove('on');closeSheet();}});
  function gearBtn(extra){var b=document.createElement('button');b.type='button';b.className='v4-gear'+(extra?' '+extra:'');b.title='Display settings';b.setAttribute('aria-label','Display settings');b.innerHTML=GEAR;
    b.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');});return b;}
  var placed=0;
  ['.desktop-header','.mobile-top-header','.top','.hdr-actions','#mobPickerBar'].forEach(function(sel){
    var box=document.querySelector(sel);if(!box)return;
    if(box.querySelector('.v4-gear'))return;
    var t=box.querySelector('.theme-btn,.theme-toggle-btn,.dark-toggle');
    if(t&&t.parentNode){t.parentNode.insertBefore(gearBtn(),t.nextSibling);placed++;}
    else if(sel==='.hdr-actions'||sel==='#mobPickerBar'||sel==='.top'){box.appendChild(gearBtn());placed++;}
    else if(sel==='.mobile-top-header'){var bar=box.querySelector('.mobile-header-bar,.mob-bar');if(bar){bar.appendChild(gearBtn());placed++;}}
  });
  if(!placed)document.body.appendChild(gearBtn('floating'));
  paint();

  if(!v4)return;   /* everything below is the new look only */

  /* ── logo in the desktop header ── */
  var dh=document.querySelector('.desktop-header,.top');
  if(dh&&!dh.querySelector('.v4-logo-link')){
    var h1=dh.querySelector('h1'),row,anchor,lead=false;
    if(!h1){row=dh;anchor=dh.firstChild;lead=true;}
    else if(h1.parentNode===dh){row=dh;anchor=dh.firstChild;lead=true;}          /* archive-style bar */
    else if(h1.parentNode.parentNode===dh){row=h1.parentNode;anchor=h1;}
    else{row=h1.parentNode.parentNode;anchor=h1.parentNode;}
    var a=document.createElement('a');a.className='v4-logo-link';a.href=(MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html');a.setAttribute('aria-label','Shark Law home');
    a.innerHTML='<img src="'+LOGO+'" alt="Shark Law — Motorcycle Attorneys">';
    var dv=document.createElement('span');dv.className='v4-divider';
    if(row){
      if(getComputedStyle(row).display.indexOf('flex')<0){row.style.display='flex';row.style.alignItems='center';}
      row.style.justifyContent='flex-start';
      if(!lead){var right=anchor&&anchor.nextElementSibling;if(right)right.style.marginLeft='auto';}
      row.insertBefore(a,anchor||row.firstChild);row.insertBefore(dv,anchor||a.nextSibling);
    }
  }
  /* ── uniform desktop navigation ── */
  var nav=document.querySelector('.desktop-header nav,.desktop-header .nav-bar');
  if(nav){
    nav.classList.add('v4-nav');
    Array.prototype.slice.call(nav.children).forEach(function(el){if(el.tagName==='A')el.remove();});
    var first=nav.firstChild;
    PAGES.forEach(function(p){
      var l=document.createElement('a');l.href=p.f;l.textContent=p.n;l.className='v4-tab'+(p.f===home?' on':'');
      if(p.f===home)l.setAttribute('aria-current','page');
      if(p.mg){l.dataset.mg='1';if(MGMT.indexOf(role)<0)l.style.display='none';}
      nav.insertBefore(l,first);
    });
  }
  /* ── mobile: logo in the top bar ── */
  var mh=document.querySelector('.mobile-top-header .mobile-header-bar,.mobile-top-header .mob-bar');
  if(mh&&!mh.querySelector('.v4-mlogo')){var im=document.createElement('img');im.className='v4-mlogo';im.src=LOGO;im.alt='Shark Law';mh.insertBefore(im,mh.firstChild);}
  /* ── mobile bottom nav + More sheet ── */
  function navItem(p,label){return'<a href="'+p.f+'"'+(p.mg?' data-mg="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+p.i+'</svg>'+(label||p.n)+'</a>';}
  function byF(f){for(var i=0;i<PAGES.length;i++)if(PAGES[i].f===f)return PAGES[i];}
  var mn=document.createElement('nav');mn.className='v4-mnav';mn.setAttribute('aria-label','Main');
  function buildMnav(){
    var firstP=MGMT.indexOf(role)>=0?byF('v4-sharklaw-overview.html'):byF('v4-sharklaw-dashboard.html');
    var p2=byF('v4-sharklaw-leads.html'),p3=byF('v4-sharklaw-scheduler.html'),p4=byF('v4-sharklaw-contacts.html');
    mn.innerHTML='<div class="v4-mnav-in">'+navItem(firstP)+navItem(p2)+navItem(p3,'Schedule')+navItem(p4)
      +'<button type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button></div>';
    mn.querySelector('button').onclick=openSheet;
  }
  buildMnav();document.body.appendChild(mn);
  var scrim=document.createElement('div');scrim.className='v4-scrim';scrim.onclick=closeSheet;document.body.appendChild(scrim);
  var sheet=document.createElement('div');sheet.className='v4-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','More');
  function buildSheet(){
    sheet.innerHTML='<div class="grab"></div>'+PAGES.filter(function(p){return !p.mg||MGMT.indexOf(role)>=0;}).map(function(p){return navItem(p);}).join('')
      +'<div class="sep"></div><button class="si" type="button" data-act="display"><svg viewBox="0 0 24 24">'+GEAR.replace(/<\/?svg[^>]*>/g,'')+'</svg>Display settings</button>'
      +'<button class="si" type="button" data-act="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</button>';
    sheet.querySelector('[data-act="display"]').onclick=function(e){e.stopPropagation();closeSheet();paint();pop.classList.add('on');};
    sheet.querySelector('[data-act="logout"]').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  buildSheet();document.body.appendChild(sheet);
  function openSheet(){scrim.classList.add('on');sheet.classList.add('on');}
  function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on');}
  window.v4CloseSheet=closeSheet;

  /* ── learn the signed-in role once the page has loaded it ── */
  var tries=0;(function poll(){
    var r=(window.currentUserRole||(window.me&&window.me.role)||'');
    if(r){r=String(r).toLowerCase();try{localStorage.setItem('sl-role',r);}catch(e){}
      if(r!==role){role=r;document.querySelectorAll('[data-mg]').forEach(function(el){el.style.display=MGMT.indexOf(role)>=0?'':'none';});buildMnav();buildSheet();
        var ll=document.querySelector('.v4-logo-link');if(ll)ll.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';}
      return;}
    if(++tries<40)setTimeout(poll,400);
  })();
})();
</script>
</body>
</html>

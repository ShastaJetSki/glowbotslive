<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>SharkLaw V2 - Leads</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <script>(function(){var t=localStorage.getItem('app-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="dark"]{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="light"]{--bg-primary:#f4f6fb;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#e8edf6;--border-default:#d3dbe8;--text-primary:#14213a;--text-secondary:#44546c;--accent-primary:#2563eb;--accent-light:#1d4ed8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg-primary);min-height:100%;}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;}
    button,input,select,textarea{font-family:inherit;}
    .theme-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;}

    /* headers / nav (same pattern as the other V2 pages) */
    .desktop-header{position:sticky;top:0;z-index:100;background:var(--bg-primary);border-bottom:1px solid var(--border-default);}
    .dnav a{padding:12px 0;text-decoration:none;font-size:14px;color:var(--text-secondary);}
    .dnav a.on{color:var(--accent-primary);border-bottom:2px solid var(--accent-primary);}
    .mobile-top-header{display:none;position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .mobile-header-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:12px;}
    .mobile-menu-toggle{background:transparent;border:none;color:var(--text-secondary);font-size:20px;width:36px;height:36px;cursor:pointer;}
    .mobile-menu-content{max-height:0;overflow:hidden;transition:max-height .3s;background:var(--bg-primary);border-top:1px solid var(--border-default);}
    .mobile-menu-content.expanded{max-height:200px;}
    .mobile-header-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px 12px;}
    .mobile-header-actions button{padding:10px;font-size:13px;background:color-mix(in srgb,var(--accent-primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent-primary) 30%,transparent);color:var(--accent-light);border-radius:8px;cursor:pointer;}
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-secondary);padding:8px;z-index:100;border-top:1px solid var(--border-default);}
    .mobile-nav-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px;}
    .mobile-nav-row:last-child{margin-bottom:0;}
    .mobile-nav-btn{padding:10px 8px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:44px;}
    .mobile-nav-btn.active{background:color-mix(in srgb,var(--accent-primary) 60%,transparent);border-color:var(--accent-primary);color:var(--text-primary);}

    .view-toggle{display:flex;border:1px solid var(--border-default);border-radius:20px;overflow:hidden;background:var(--bg-card);}
    .vt-btn{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);border-radius:20px;}
    .vt-btn.active{background:var(--accent-primary);color:#fff;}

    /* toolbar + KPIs */
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .toolbar select,.toolbar input{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:13px;}
    .toolbar input{min-width:180px;flex:1 1 200px;max-width:320px;}
    .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;}
    .btn:hover{border-color:var(--accent-primary);}
    .btn-p{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff;}
    .btn-p:hover{filter:brightness(1.1);}
    .btn-d{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45);color:#f87171;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .kpi-bar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .kpi-bar::-webkit-scrollbar{display:none;}
    .kpi-pill{padding:6px 14px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-default);white-space:nowrap;text-align:center;flex-shrink:0;min-width:92px;}
    .kpi-val{font-size:18px;font-weight:700;color:var(--accent-light);}
    .kpi-lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;}
    .main{max-width:1300px;margin:0 auto;padding:16px;}
    .panel{background:var(--bg-card);border:1px solid var(--border-default);border-radius:12px;margin-bottom:14px;overflow:hidden;}
    .panel-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-default);}
    .panel-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);}
    .panel-b{padding:14px 16px;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

    /* funnel */
    .fn-row{display:grid;grid-template-columns:120px 1fr 92px;gap:10px;align-items:center;margin-bottom:8px;}
    .fn-lbl{font-size:12px;font-weight:600;}
    .fn-track{height:26px;background:var(--bg-hover);border-radius:6px;overflow:hidden;}
    .fn-bar{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:700;color:#fff;min-width:28px;transition:width .4s;}
    .fn-pct{font-size:11px;color:var(--text-secondary);text-align:right;}
    .fn-foot{font-size:12px;color:var(--text-secondary);margin-top:6px;}

    /* leaderboard */
    table.lb{width:100%;border-collapse:collapse;font-size:13px;}
    .lb th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);padding:6px 8px;border-bottom:1px solid var(--border-default);}
    .lb td{padding:8px;border-bottom:1px solid color-mix(in srgb,var(--border-default) 50%,transparent);}
    .lb tr.click{cursor:pointer;} .lb tr.click:hover td{background:var(--bg-hover);}
    .lb td.n{text-align:right;font-variant-numeric:tabular-nums;} .lb th.n{text-align:right;}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}

    /* board */
    .board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;}
    .col{background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:10px;display:flex;flex-direction:column;min-height:120px;max-height:70vh;}
    .col-h{padding:9px 10px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid var(--border-default);border-top:3px solid;border-radius:10px 10px 0 0;}
    .col-b{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;}
    .col-empty{font-size:11px;color:var(--text-secondary);text-align:center;padding:14px 0;}
    .lc{background:var(--bg-card);border:1px solid var(--border-default);border-left:4px solid;border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;}
    .lc:hover{border-color:var(--accent-primary);}
    .lc-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
    .lc-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lc-no{font-size:10px;color:var(--text-secondary);flex-shrink:0;}
    .lc-sub{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lc-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--text-secondary);}
    .chip{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:4px;}
    .u-urgent{background:rgba(239,68,68,.2);color:#fca5a5;} .u-high{background:rgba(245,158,11,.2);color:#fcd34d;}
    [data-theme="light"] .u-urgent{color:#b91c1c;} [data-theme="light"] .u-high{color:#92400e;}

    /* my leads list */
    .ml-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
    .ml{background:var(--bg-card);border:1px solid var(--border-default);border-left:4px solid;border-radius:10px;padding:12px;cursor:pointer;}
    .ml:hover{border-color:var(--accent-primary);}
    .steps{display:flex;gap:4px;margin-top:10px;}
    .step{flex:1;height:5px;border-radius:3px;background:var(--bg-hover);}
    .step-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);margin-top:5px;}
    .empty{text-align:center;padding:36px 16px;color:var(--text-secondary);font-size:14px;}

    /* drawer */
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;}
    .scrim.on{display:block;}
    .drawer{position:fixed;top:0;right:-560px;bottom:0;width:100%;max-width:540px;background:var(--bg-secondary);border-left:1px solid var(--border-default);z-index:901;overflow-y:auto;transition:right .25s ease;}
    .drawer.on{right:0;}
    .dr-h{position:sticky;top:0;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:2;}
    .dr-t{font-size:18px;font-weight:700;}
    .dr-s{font-size:12px;color:var(--text-secondary);margin-top:2px;}
    .x{background:transparent;border:none;color:var(--text-secondary);font-size:26px;cursor:pointer;line-height:1;}
    .dr-b{padding:16px 18px 40px;}
    .sec{margin-bottom:18px;}
    .sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin-bottom:8px;}
    .stepper{display:flex;flex-wrap:wrap;gap:6px;}
    .sb{padding:7px 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:default;}
    .sb.can{cursor:pointer;} .sb.can:hover{border-color:currentColor;}
    .sb.cur{color:#fff!important;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
    .f-l{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);}
    .f-v{font-size:13px;margin-top:1px;word-break:break-word;}
    .f-v.mut{color:var(--text-secondary);font-style:italic;}
    .tl{position:relative;padding-left:16px;}
    .tl:before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border-default);}
    .tl-i{position:relative;margin-bottom:12px;}
    .tl-i:before{content:'';position:absolute;left:-16px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--tl,var(--accent-primary));}
    .tl-txt{font-size:13px;} .tl-meta{font-size:11px;color:var(--text-secondary);margin-top:1px;}
    .tl-note{font-size:12px;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:7px 9px;margin-top:4px;white-space:pre-wrap;}

    /* modal / form */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:16px;}
    .modal.on{display:flex;}
    .mbox{background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
    .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-secondary);}
    .mt{font-size:17px;font-weight:700;}
    .mb{padding:16px 18px;}
    .mf{padding:12px 18px 18px;display:flex;gap:10px;justify-content:flex-end;}
    .fg{margin-bottom:12px;} .fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .fl{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;}
    .fi{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:14px;}
    .fi:focus{outline:none;border-color:var(--accent-primary);}
    textarea.fi{min-height:74px;resize:vertical;}
    .req{color:#ef4444;}
    .msg{font-size:13px;margin-top:6px;}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-primary);color:var(--text-primary);padding:10px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
    .toast.show{opacity:1;}

    @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
    @media(max-width:768px){
      .desktop-header{display:none!important;} .mobile-top-header{display:block;} .mobile-bottom-nav{display:block!important;}
      body{padding-bottom:130px;} .main{padding:12px;}
      .fr,.grid2{grid-template-columns:1fr;}
      .fn-row{grid-template-columns:92px 1fr 70px;}
      .board{grid-template-columns:repeat(6,82vw);scroll-snap-type:x mandatory;} .col{scroll-snap-align:start;}
      .modal{align-items:flex-end;padding:0;} .mbox{border-radius:18px 18px 0 0;}
    }
    @media(min-width:769px){.mobile-top-header{display:none!important;}.mobile-bottom-nav{display:none!important;}}
  </style>
</head>
<body>

<div class="mobile-top-header">
  <div class="mobile-header-bar">
    <button class="mobile-menu-toggle" onclick="document.getElementById('mMenu').classList.toggle('expanded')">&#9776;</button>
    <div style="flex:1;"><div style="font-size:18px;font-weight:600;">Leads</div><div style="font-size:12px;color:var(--accent-light);" id="mUserName">Loading…</div></div>
    <button class="theme-btn" onclick="cycleTheme()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg></button>
  </div>
  <div class="mobile-menu-content" id="mMenu">
    <div class="mobile-header-actions">
      <button onclick="location.href='v2-sharklaw-contacts.html'">Contacts</button>
      <button onclick="location.href='v2-sharklaw-pipeline.html'">Pipeline</button>
      <button onclick="logout()">Logout</button>
    </div>
  </div>
</div>

<div class="desktop-header">
  <div style="padding:16px 24px 8px;display:flex;justify-content:space-between;align-items:center;">
    <div><h1 style="margin:0;font-size:28px;font-weight:700;">Leads</h1><div style="font-size:12px;color:var(--accent-light);" id="dUserName">Loading…</div></div>
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="theme-btn" onclick="cycleTheme()" title="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg></button>
      <a onclick="logout()" style="color:var(--text-secondary);cursor:pointer;font-size:14px;">Logout</a>
    </div>
  </div>
  <div style="padding:0 24px 12px;">
    <nav class="dnav" style="display:flex;gap:24px;align-items:center;">
      <a href="v2-sharklaw-dashboard.html">Dashboard</a>
      <a href="v2-sharklaw-scheduler.html">Scheduler</a>
      <a href="v2-sharklaw-contacts.html">Contacts</a>
      <a href="v2-sharklaw-pipeline.html">Pipeline</a>
      <a href="v2-sharklaw-swag.html">Swag</a>
      <a href="v2-communications.html">Comms</a>
      <a href="v2-sharklaw-leads.html" class="on">Leads</a>
      <a href="v2-sharklaw-settings.html">Settings</a>
    </nav>
  </div>
</div>

<div id="pageWrap" style="display:none;">
  <div class="toolbar">
    <div class="view-toggle" id="scopeToggle" style="display:none;">
      <button class="vt-btn active" id="vtMine" onclick="setScope('mine')">My Leads</button>
      <button class="vt-btn" id="vtAll" onclick="setScope('all')">All Leads</button>
    </div>
    <input type="text" id="q" placeholder="Search client, phone, #, county…" oninput="render()">
    <select id="fRange" onchange="render()">
      <option value="all">All time</option>
      <option value="month">This month</option>
      <option value="30">Last 30 days</option>
      <option value="90">Last 90 days</option>
      <option value="year">This year</option>
    </select>
    <select id="fStage" onchange="render()"><option value="">All stages</option></select>
    <select id="fWho" onchange="render()" style="display:none;"><option value="">All associates</option></select>
    <select id="fUrg" onchange="render()"><option value="">Any urgency</option><option value="urgent">Urgent</option><option value="high">High</option><option value="normal">Normal</option></select>
    <button class="btn btn-p" style="margin-left:auto;" onclick="openForm()">+ Submit Lead</button>
  </div>
  <div class="kpi-bar" id="kpiBar"></div>
  <div class="main" id="main"><div class="empty">Loading…</div></div>
</div>

<div class="mobile-bottom-nav">
  <div class="mobile-nav-row">
    <a href="v2-sharklaw-dashboard.html" class="mobile-nav-btn">Dashboard</a>
    <a href="v2-sharklaw-scheduler.html" class="mobile-nav-btn">Scheduler</a>
    <a href="v2-sharklaw-leads.html" class="mobile-nav-btn active">Leads</a>
  </div>
  <div class="mobile-nav-row">
    <a href="v2-sharklaw-contacts.html" class="mobile-nav-btn">Contacts</a>
    <a href="v2-sharklaw-pipeline.html" class="mobile-nav-btn">Pipeline</a>
    <a href="v2-communications.html" class="mobile-nav-btn">Comms</a>
  </div>
</div>

<!-- LEAD DETAIL DRAWER -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>

<!-- SUBMIT / EDIT MODAL -->
<div class="modal" id="formModal">
  <div class="mbox">
    <div class="mh"><div class="mt" id="formTitle">Submit a Lead</div><button class="x" onclick="closeForm()">&times;</button></div>
    <div class="mb">
      <div class="fr">
        <div class="fg"><label class="fl">Client first name <span class="req">*</span></label><input class="fi" id="lFirst"></div>
        <div class="fg"><label class="fl">Client last name</label><input class="fi" id="lLast"></div>
      </div>
      <div class="fr">
        <div class="fg"><label class="fl">Phone</label><input class="fi" id="lPhone" type="tel" maxlength="12" placeholder="510-235-1234" oninput="this.value=fmtPhone(this.value)"></div>
        <div class="fg"><label class="fl">Email</label><input class="fi" id="lEmail" type="email"></div>
      </div>
      <div class="fr">
        <div class="fg"><label class="fl">Incident type</label>
          <select class="fi" id="lType"><option value="">Select…</option><option>Motorcycle crash</option><option>Auto accident</option><option>Pedestrian</option><option>Bicycle</option><option>Truck / commercial</option><option>Other</option></select></div>
        <div class="fg"><label class="fl">Incident date</label><input class="fi" id="lDate" type="date"></div>
      </div>
      <div class="fr">
        <div class="fg"><label class="fl">Location</label><input class="fi" id="lLoc" placeholder="City / road"></div>
        <div class="fg"><label class="fl">County</label><select class="fi" id="lCounty"><option value="">Select…</option></select></div>
      </div>
      <div class="fg"><label class="fl">Injuries / what happened</label><textarea class="fi" id="lInjury"></textarea></div>
      <div class="fr">
        <div class="fg"><label class="fl">How you met them</label>
          <select class="fi" id="lSource"><option value="">Select…</option><option>Event / pop-up</option><option>Club referral</option><option>Partner referral</option><option>Friend / family</option><option>Phone / text</option><option>Social media</option><option>Walk-in</option><option>Other</option></select></div>
        <div class="fg"><label class="fl">Urgency</label>
          <select class="fi" id="lUrg"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></div>
      </div>
      <div class="fg" style="position:relative;"><label class="fl">Referred through a contact (optional)</label>
        <input class="fi" id="lContactQ" placeholder="Search your contacts…" autocomplete="off" oninput="contactSearch()" onfocus="contactSearch()">
        <input type="hidden" id="lContact">
        <div id="lContactDrop" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:8px;max-height:200px;overflow-y:auto;margin-top:4px;"></div>
      </div>
      <div class="fg"><label class="fl">Notes for management</label><textarea class="fi" id="lNotes"></textarea></div>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function stage(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i].k===k)return STAGES[i];return{k:k,n:k||'—',c:'#6b7280'};}
function rank(k){var i=FUNNEL.findIndex(function(s){return s.k===k;});return i<0?0:i+1;}
function mName(id){var m=memberById[id];return m?((m.first_name||'')+' '+(m.last_name||'')).trim()||m.email||'Member':(id?'Former member':'Unassigned');}
function mColor(id){var m=memberById[id];return(m&&m.color)||'#6b7280';}
function fmtPhone(v){var d=String(v||'').replace(/\D/g,'').slice(0,10);if(d.length<=3)return d;if(d.length<=6)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);}
function fmtDate(d){if(!d)return'';var x=/^\d{4}-\d{2}-\d{2}$/.test(d)?new Date(d+'T12:00:00'):new Date(d);return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDT(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+x.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function days(a,b){return Math.max(0,Math.floor(((b?new Date(b):new Date())-new Date(a))/86400000));}
function ago(d){var n=days(d);return n===0?'today':n===1?'1 day':n+' days';}

async function logout(){await sb.auth.signOut();localStorage.clear();location.replace('v2-login.html');}
async function fetchAll(build){

  for(var p=0;p<50;p++){var r=await build().range(p*size,(p+1)*size-1);if(r.error)return{data:out,error:r.error};var rows=r.data||[];out=out.concat(rows);if(rows.length<size)break;}
  return{data:out,error:null};
}

/* ── auth ── */

}

/* ── filtering ── */
function inRange(l){
  var v=document.getElementById('fRange').value;if(v==='all')return true;
  var c=new Date(l.created_at),n=new Date();
  if(v==='month')return c.getFullYear()===n.getFullYear()&&c.getMonth()===n.getMonth();
  if(v==='year')return c.getFullYear()===n.getFullYear();
  return days(l.created_at)<=parseInt(v,10);
}
function scoped(){
  return leads.filter(function(l){
    if(scope==='mine'&&l.submitted_by!==me.id)return false;
    if(scope==='all'){var w=document.getElementById('fWho').value;if(w&&l.submitted_by!==w)return false;}
    return inRange(l);
  });
}
function filtered(list){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var st=document.getElementById('fStage').value,u=document.getElementById('fUrg').value;
  var qd=q.replace(/\D/g,'');
  return list.filter(function(l){
    if(st&&l.stage!==st)return false;
    if(u&&l.urgency!==u)return false;
    if(q){
      var hay=[l.client_first_name,l.client_last_name,l.client_email,l.county,l.incident_location,l.incident_type,'#'+l.lead_no,mName(l.submitted_by)].join(' ').toLowerCase();
      var ph=String(l.client_phone||'').replace(/\D/g,'');
      if(hay.indexOf(q)<0&&!(qd.length>=3&&ph.indexOf(qd)>=0))return false;
    }
    return true;
  });
}

/* ── KPIs ── */
function kpis(list){
  var signed=list.filter(function(l){return l.stage==='signed';});
  var declined=list.filter(function(l){return l.stage==='declined';});
  var open=list.length-signed.length-declined.length;
  var closed=signed.length+declined.length;
  var rate=closed?Math.round(signed.length/closed*100):null;
  var dts=signed.filter(function(l){return l.signed_at;}).map(function(l){return days(l.created_at,l.signed_at);});
  var avg=dts.length?Math.round(dts.reduce(function(a,b){return a+b;},0)/dts.length):null;
  var n=new Date(),month=list.filter(function(l){var c=new Date(l.created_at);return c.getFullYear()===n.getFullYear()&&c.getMonth()===n.getMonth();}).length;
  return{total:list.length,open:open,signed:signed.length,declined:declined.length,rate:rate,avg:avg,month:month,
         waiting:list.filter(function(l){return l.stage==='submitted';}).length,
         unassigned:list.filter(function(l){return !l.assigned_to&&l.stage!=='signed'&&l.stage!=='declined';}).length};
}
function pill(v,l,title){return'<div class="kpi-pill"'+(title?' title="'+esc(title)+'"':'')+'><div class="kpi-val">'+v+'</div><div class="kpi-lbl">'+l+'</div></div>';}
function renderKpis(list){
  var k=kpis(list);
  var h=pill(k.total,scope==='mine'?'Submitted':'Leads')+pill(k.month,'This Month')+pill(k.open,'Open')+pill(k.signed,'Signed')+pill(k.declined,'Declined')
    +pill(k.rate===null?'—':k.rate+'%','Close Rate','Signed ÷ (Signed + Declined)')+pill(k.avg===null?'—':k.avg+'d','Avg to Sign','Average days from submission to signed');
  if(scope==='all')h+=pill(k.waiting,'Awaiting Review')+pill(k.unassigned,'Unassigned');
  document.getElementById('kpiBar').innerHTML=h;
}

/* ── render ── */
function render(){
  var base=scoped();
  renderKpis(base);
  var list=filtered(base);
  var main=document.getElementById('main');
  if(scope==='all')main.innerHTML=renderAll(base,list);
  else main.innerHTML=renderMine(list,base.length);
}

function funnelHtml(list){
  var tot=list.length;
  if(!tot)return'<div class="empty" style="padding:16px;">No leads in this period</div>';
  var reached=FUNNEL.map(function(s,i){return list.filter(function(l){return (l.furthest_rank||rank(l.stage))>=i+1;}).length;});
  var h='';
  FUNNEL.forEach(function(s,i){
    var n=reached[i],w=Math.max(4,Math.round(n/tot*100));
    var step=i===0?'':(reached[i-1]?Math.round(n/reached[i-1]*100)+'% of prev':'—');
    h+='<div class="fn-row"><div class="fn-lbl" style="color:'+s.c+';">'+esc(s.n)+'</div><div class="fn-track"><div class="fn-bar" style="width:'+w+'%;background:'+s.c+';">'+n+'</div></div><div class="fn-pct">'+(i===0?'100%':Math.round(n/tot*100)+'%')+(step?'<br>'+step:'')+'</div></div>';
  });
  var dec=list.filter(function(l){return l.stage==='declined';}).length;
  h+='<div class="fn-foot">Each bar counts leads that reached that stage, including ones later declined. Declined: <b>'+dec+'</b></div>';
  return h;
}

function leaderboardHtml(list){
  var by={};
  list.forEach(function(l){var b=by[l.submitted_by]||(by[l.submitted_by]={id:l.submitted_by,n:0,open:0,signed:0,declined:0,d:[]});b.n++;if(l.stage==='signed'){b.signed++;if(l.signed_at)b.d.push(days(l.created_at,l.signed_at));}else if(l.stage==='declined')b.declined++;else b.open++;});
  var rows=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.signed-a.signed||b.n-a.n;});
  if(!rows.length)return'<div class="empty" style="padding:16px;">No leads in this period</div>';
  return'<table class="lb"><thead><tr><th>Associate</th><th class="n">Leads</th><th class="n">Open</th><th class="n">Signed</th><th class="n">Close</th><th class="n">Avg</th></tr></thead><tbody>'+
    rows.map(function(r){var c=r.signed+r.declined;var avg=r.d.length?Math.round(r.d.reduce(function(a,b){return a+b;},0)/r.d.length)+'d':'—';
      return'<tr class="click" data-who="'+esc(r.id)+'" onclick="pickWho(this.dataset.who)"><td><span class="dot" style="background:'+esc(mColor(r.id))+'"></span>'+esc(mName(r.id))+'</td><td class="n">'+r.n+'</td><td class="n">'+r.open+'</td><td class="n">'+r.signed+'</td><td class="n">'+(c?Math.round(r.signed/c*100)+'%':'—')+'</td><td class="n">'+avg+'</td></tr>';}).join('')+'</tbody></table>';
}
function pickWho(id){document.getElementById('fWho').value=id;render();}

function cardHtml(l){
  var s=stage(l.stage);
  var urg=l.urgency&&l.urgency!=='normal'?'<span class="chip u-'+esc(l.urgency)+'">'+esc(l.urgency)+'</span>':'';
  var sub=[l.incident_type,l.county].filter(Boolean).join(' · ')||'No details';
  return'<div class="lc" style="border-left-color:'+s.c+';" data-id="'+esc(l.lead_id)+'" onclick="openDrawer(this.dataset.id)">'
    +'<div class="lc-top"><span class="lc-name">'+esc(clientName(l))+'</span><span class="lc-no">#'+esc(l.lead_no)+'</span></div>'
    +'<div class="lc-sub">'+esc(sub)+'</div>'
    +'<div class="lc-foot"><span><span class="dot" style="background:'+esc(mColor(l.submitted_by))+';width:7px;height:7px;"></span>'+esc(mName(l.submitted_by))+'</span>'+(urg||'<span>'+ago(l.stage_changed_at||l.created_at)+'</span>')+'</div>'
  +'</div>';
}
function clientName(l){return((l.client_first_name||'')+' '+(l.client_last_name||'')).trim()||'Unnamed';}

function renderAll(base,list){
  var h='<div class="two-col">'
    +'<div class="panel"><div class="panel-h"><div class="panel-t">Lead Funnel</div></div><div class="panel-b">'+funnelHtml(base)+'</div></div>'
    +'<div class="panel"><div class="panel-h"><div class="panel-t">By Associate</div><div style="font-size:11px;color:var(--text-secondary);">Click a row to filter</div></div><div class="panel-b" style="padding:6px 8px;">'+leaderboardHtml(base)+'</div></div>'
  +'</div>';
  h+='<div class="panel"><div class="panel-h"><div class="panel-t">All Leads by Stage</div><div style="font-size:12px;color:var(--text-secondary);">'+list.length+' shown</div></div><div class="panel-b"><div class="board">';
  STAGES.forEach(function(s){
    var cards=list.filter(function(l){return l.stage===s.k;});
    /* oldest-in-stage first so stuck leads float up */
    cards.sort(function(a,b){var u={urgent:0,high:1,normal:2};return(u[a.urgency]-u[b.urgency])||(new Date(a.stage_changed_at)-new Date(b.stage_changed_at));});
    h+='<div class="col"><div class="col-h" style="border-top-color:'+s.c+';color:'+s.c+';"><span>'+esc(s.n)+'</span><span>'+cards.length+'</span></div><div class="col-b">'
      +(cards.length?cards.map(cardHtml).join(''):'<div class="col-empty">None</div>')+'</div></div>';
  });
  h+='</div></div></div>';
  return h;
}

function renderMine(list,total){
  if(!total)return'<div class="empty">You haven’t submitted any leads'+(document.getElementById('fRange').value==='all'?'':' in this period')+'.<br><br><button class="btn btn-p" onclick="openForm()">+ Submit your first lead</button></div>';
  if(!list.length)return'<div class="empty">No leads match these filters.</div>';
  return'<div class="ml-list">'+list.map(function(l){
    var s=stage(l.stage),r=l.furthest_rank||rank(l.stage);
    var steps=FUNNEL.map(function(f,i){var on=i<r;return'<div class="step" style="'+(on?'background:'+(l.stage==='declined'?'#6b7280':f.c):'')+'"></div>';}).join('');
    var urg=l.urgency&&l.urgency!=='normal'?' <span class="chip u-'+esc(l.urgency)+'">'+esc(l.urgency)+'</span>':'';
    return'<div class="ml" style="border-left-color:'+s.c+';" data-id="'+esc(l.lead_id)+'" onclick="openDrawer(this.dataset.id)">'
      +'<div class="lc-top"><span class="lc-name" style="font-size:14px;">'+esc(clientName(l))+urg+'</span><span class="lc-no">#'+esc(l.lead_no)+'</span></div>'
      +'<div class="lc-sub" style="margin-top:3px;">'+esc([l.incident_type,l.county].filter(Boolean).join(' · ')||'No details')+'</div>'
      +'<div class="steps">'+steps+'</div>'
      +'<div class="step-lbls"><span style="color:'+s.c+';font-weight:700;">'+esc(s.n)+(l.stage==='declined'&&l.declined_reason?' — '+esc(l.declined_reason):'')+'</span><span>Submitted '+esc(fmtDate(l.created_at))+'</span></div>'
    +'</div>';
  }).join('')+'</div>';
}

/* ── drawer ── */
async function openDrawer(id){
  var l=leads.find(function(x){return x.lead_id===id;});
  if(!l){toast('Lead not found');return;}
  openLeadId=id;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('drawer').classList.add('on');
  drawDrawer(l,null);
  var a=await sb.from('lead_activity').select('*').eq('lead_id',id).order('created_at',{ascending:true});
  if(openLeadId===id)drawDrawer(l,a.error?[]:(a.data||[]));
}
function closeDrawer(){openLeadId=null;document.getElementById('scrim').classList.remove('on');document.getElementById('drawer').classList.remove('on');}

function canEdit(l){return isMgmt||(l.submitted_by===me.id&&l.stage==='submitted');}

function field(lbl,val,full){return'<div'+(full?' style="grid-column:1/-1;"':'')+'><div class="f-l">'+lbl+'</div><div class="f-v'+(val?'':' mut')+'">'+(val||'Not set')+'</div></div>';}

function drawDrawer(l,acts){
  var s=stage(l.stage);
  var h='<div class="dr-h"><div><div class="dr-t">'+esc(clientName(l))+'</div><div class="dr-s">Lead #'+esc(l.lead_no)+' · submitted by '+esc(mName(l.submitted_by))+' · '+esc(fmtDate(l.created_at))+'</div></div><button class="x" onclick="closeDrawer()">&times;</button></div><div class="dr-b">';

  /* stage */
  h+='<div class="sec"><div class="sec-t">Stage · '+(l.stage==='signed'||l.stage==='declined'?'closed '+esc(fmtDate(l.closed_at)):'in stage '+ago(l.stage_changed_at))+'</div><div class="stepper">';
  STAGES.forEach(function(x){
    var cur=x.k===l.stage,can=isMgmt&&!cur;
    var style='color:'+x.c+';'+(cur?'background:'+x.c+';border-color:'+x.c+';':'');
    h+='<button class="sb'+(cur?' cur':'')+(can?' can':'')+'" style="'+style+'"'+(can?' data-s="'+x.k+'" onclick="moveStage(this.dataset.s)"':' disabled')+'>'+esc(x.n)+'</button>';
  });
  h+='</div>';
  if(l.stage==='declined'&&l.declined_reason)h+='<div class="tl-note" style="margin-top:8px;">Declined: '+esc(l.declined_reason)+'</div>';
  if(!isMgmt)h+='<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;">Management moves leads through the funnel. You’ll get a message on your dashboard when it changes.</div>';
  h+='</div>';

  /* handler */
  if(isMgmt){
    var opts='<option value="">Unassigned</option>'+members.filter(function(m){return m.is_active!==false&&MGMT.indexOf((m.role||'').toLowerCase())>=0;}).map(function(m){return'<option value="'+esc(m.member_id)+'"'+(m.member_id===l.assigned_to?' selected':'')+'>'+esc(mName(m.member_id))+'</option>';}).join('');
    h+='<div class="sec"><div class="sec-t">Handled by</div><select class="fi" onchange="assignTo(this.value)">'+opts+'</select></div>';
  }else{
    h+='<div class="sec"><div class="sec-t">Handled by</div><div class="f-v'+(l.assigned_to?'':' mut')+'">'+esc(l.assigned_to?mName(l.assigned_to):'Not assigned yet')+'</div></div>';
  }

  /* details */
  var phone=l.client_phone?'<a href="tel:'+esc(l.client_phone)+'" style="color:var(--accent-light);">'+esc(l.client_phone)+'</a>':'';
  var mail=l.client_email?'<a href="mailto:'+esc(l.client_email)+'" style="color:var(--accent-light);">'+esc(l.client_email)+'</a>':'';
  var rc=l.related_contact_id?'<a href="v2-sharklaw-profiles.html?id='+encodeURIComponent(l.related_contact_id)+'" style="color:var(--accent-light);">Open contact</a>':'';
  h+='<div class="sec"><div class="sec-t" style="display:flex;justify-content:space-between;">Details'+(canEdit(l)?'<a style="color:var(--accent-light);cursor:pointer;text-transform:none;letter-spacing:0;" onclick="openForm(openLeadId)">Edit</a>':'')+'</div><div class="grid2">'
    +field('Phone',phone)+field('Email',mail)
    +field('Incident type',esc(l.incident_type))+field('Incident date',esc(fmtDate(l.incident_date)))
    +field('Location',esc(l.incident_location))+field('County',esc(l.county))
    +field('Source',esc(l.source))+field('Urgency',esc(l.urgency))
    +(rc?field('Referred through',rc):'')
    +field('Injuries / what happened',l.injury_summary?'<span style="white-space:pre-wrap;">'+esc(l.injury_summary)+'</span>':'',true)
    +field('Notes',l.notes?'<span style="white-space:pre-wrap;">'+esc(l.notes)+'</span>':'',true)
  +'</div></div>';

  /* add note */
  h+='<div class="sec"><div class="sec-t">Add an update</div><textarea class="fi" id="noteTxt" placeholder="Called client, left voicemail…"></textarea><div style="display:flex;justify-content:flex-end;margin-top:8px;"><button class="btn btn-p" onclick="addNote()">Add update</button></div></div>';

  /* timeline */
  h+='<div class="sec"><div class="sec-t">Lifecycle</div>';
  if(acts===null)h+='<div class="f-v mut">Loading…</div>';
  else if(!acts.length)h+='<div class="f-v mut">No history yet</div>';
  else{
    h+='<div class="tl">'+acts.slice().reverse().map(function(a){
      var txt='',col='var(--accent-primary)';
      if(a.action==='created'){txt='Lead submitted';col=stage('submitted').c;}
      else if(a.action==='stage_change'){var t=stage(a.new_stage);col=t.c;txt='Moved from <b>'+esc(stage(a.old_stage).n)+'</b> to <b style="color:'+t.c+';">'+esc(t.n)+'</b>';}
      else if(a.action==='assigned'){txt=a.note?'Assigned to <b>'+esc(mName(a.note))+'</b>':'Unassigned';col='#14b8a6';}
      else if(a.action==='note'){txt='Update';col='#94a3b8';}
      else txt=esc(a.action);
      var note=(a.action==='note'||(a.action==='stage_change'&&a.note))?'<div class="tl-note">'+esc(a.note)+'</div>':'';
      return'<div class="tl-i" style="--tl:'+col+';"><div class="tl-txt">'+txt+'</div><div class="tl-meta">'+esc(a.actor?mName(a.actor):'System')+' · '+esc(fmtDT(a.created_at))+'</div>'+note+'</div>';
    }).join('')+'</div>';
  }
  h+='</div>';

  if(['owner','admin'].indexOf(me.role)>=0)h+='<div class="sec" style="border-top:1px solid var(--border-default);padding-top:14px;"><button class="btn btn-d" onclick="deleteLead()">Delete lead</button> <span style="font-size:11px;color:var(--text-secondary);margin-left:8px;">Owners and admins only. Removes its history too.</span></div>';
  h+='</div>';
  document.getElementById('drawer').innerHTML=h;
}

async function refreshLead(id){
  var r=await sb.from('leads').select('*').eq('lead_id',id).maybeSingle();
  if(r.data){var i=leads.findIndex(function(x){return x.lead_id===id;});if(i>=0)leads[i]=r.data;else leads.unshift(r.data);}
  render();
  if(openLeadId===id)openDrawer(id);
}

async function moveStage(k){
  if(!isMgmt||!openLeadId)return;
  if(k==='declined'){document.getElementById('dReason').value='';document.getElementById('dDetail').value='';document.getElementById('declineModal').classList.add('on');return;}
  var r=await sb.from('leads').update({stage:k}).eq('lead_id',openLeadId);
  if(r.error){toast('Could not move: '+r.error.message);return;}
  toast('Moved to '+stage(k).n);
  refreshLead(openLeadId);
}
async function confirmDecline(){
  var reason=document.getElementById('dReason').value,det=document.getElementById('dDetail').value.trim();
  if(!reason){toast('Pick a reason');return;}
  var r=await sb.from('leads').update({stage:'declined',declined_reason:reason+(det?' — '+det:'')}).eq('lead_id',openLeadId);
  if(r.error){toast('Could not decline: '+r.error.message);return;}
  document.getElementById('declineModal').classList.remove('on');
  toast('Lead declined');refreshLead(openLeadId);
}
async function assignTo(id){
  var r=await sb.from('leads').update({assigned_to:id||null}).eq('lead_id',openLeadId);
  if(r.error){toast('Could not assign: '+r.error.message);return;}
  toast(id?'Assigned to '+mName(id):'Unassigned');refreshLead(openLeadId);
}
async function addNote(){
  var t=document.getElementById('noteTxt').value.trim();if(!t)return;
  var l=leads.find(function(x){return x.lead_id===openLeadId;});if(!l)return;
  var r=await sb.from('lead_activity').insert({tenant_id:l.tenant_id,lead_id:l.lead_id,action:'note',note:t,actor:me.id});
  if(r.error){toast('Could not save: '+r.error.message);return;}
  toast('Update added');openDrawer(l.lead_id);
}
async function deleteLead(){
  var l=leads.find(function(x){return x.lead_id===openLeadId;});if(!l)return;
  if(!confirm('Delete lead #'+l.lead_no+' ('+clientName(l)+')? This cannot be undone.'))return;
  var r=await sb.from('leads').delete().eq('lead_id',l.lead_id).select('lead_id');
  if(r.error||!r.data||!r.data.length){toast('Could not delete'+(r.error?': '+r.error.message:''));return;}
  leads=leads.filter(function(x){return x.lead_id!==l.lead_id;});
  closeDrawer();render();toast('Lead deleted');
}

/* ── submit / edit form ── */
var F={lFirst:'client_first_name',lLast:'client_last_name',lPhone:'client_phone',lEmail:'client_email',lType:'incident_type',lDate:'incident_date',lLoc:'incident_location',lCounty:'county',lInjury:'injury_summary',lSource:'source',lUrg:'urgency',lNotes:'notes',lContact:'related_contact_id'};
async function openForm(id){
  editingId=id||null;
  var l=id?leads.find(function(x){return x.lead_id===id;}):null;
  document.getElementById('formTitle').textContent=l?'Edit Lead #'+l.lead_no:'Submit a Lead';
  document.getElementById('formSave').textContent=l?'Save Changes':'Submit Lead';
  Object.keys(F).forEach(function(k){document.getElementById(k).value=l?(l[F[k]]||''):(k==='lUrg'?'normal':'');});
  document.getElementById('lContactQ').value='';
  document.getElementById('formMsg').innerHTML='';
  document.getElementById('formModal').classList.add('on');
  if(!myContacts.length){
    var q=sb.from('contacts').select('contact_id,first_name,last_name,organization_name,assigned_to').eq('tenant_id',TENANT).or('is_deleted.is.null,is_deleted.eq.false').order('first_name').limit(1000);
    if(!isMgmt)q=q.eq('assigned_to',me.id);
    var r=await q;myContacts=r.data||[];
  }
  if(l&&l.related_contact_id){var c=myContacts.find(function(x){return x.contact_id===l.related_contact_id;});document.getElementById('lContactQ').value=c?contactLabel(c):'(linked contact)';}
  setTimeout(function(){document.getElementById('lFirst').focus();},50);
}
function closeForm(){document.getElementById('formModal').classList.remove('on');editingId=null;}
function contactLabel(c){return(((c.first_name||'')+' '+(c.last_name||'')).trim()||'Unnamed')+(c.organization_name?' · '+c.organization_name:'');}
function contactSearch(){
  var q=document.getElementById('lContactQ').value.trim().toLowerCase(),d=document.getElementById('lContactDrop');
  if(!q){document.getElementById('lContact').value='';}
  var list=myContacts.filter(function(c){return !q||contactLabel(c).toLowerCase().indexOf(q)>=0;}).slice(0,12);
  d.innerHTML=list.length?list.map(function(c){return'<div style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border-default);" data-id="'+esc(c.contact_id)+'" onmousedown="pickContact(this.dataset.id)">'+esc(contactLabel(c))+'</div>';}).join(''):'<div style="padding:8px 12px;font-size:12px;color:var(--text-secondary);">No matching contacts</div>';
  d.style.display='block';
}
function pickContact(id){var c=myContacts.find(function(x){return x.contact_id===id;});document.getElementById('lContact').value=id;document.getElementById('lContactQ').value=c?contactLabel(c):'';document.getElementById('lContactDrop').style.display='none';}
document.addEventListener('click',function(e){var d=document.getElementById('lContactDrop');if(d&&e.target.id!=='lContactQ'&&!d.contains(e.target))d.style.display='none';});

async function saveLead(){
  var data={};
  Object.keys(F).forEach(function(k){var v=document.getElementById(k).value.trim();data[F[k]]=v||null;});
  data.urgency=data.urgency||'normal';
  var msg=document.getElementById('formMsg');
  if(!data.client_first_name){msg.innerHTML='<span style="color:#ef4444;">Client first name is required.</span>';return;}
  if(!data.client_phone&&!data.client_email){msg.innerHTML='<span style="color:#ef4444;">Add a phone number or email so management can reach them.</span>';return;}
  var btn=document.getElementById('formSave');btn.disabled=true;
  var r;
  if(editingId){r=await sb.from('leads').update(data).eq('lead_id',editingId).select().maybeSingle();}
  else{data.tenant_id=TENANT;data.submitted_by=me.id;r=await sb.from('leads').insert(data).select().single();}
  btn.disabled=false;
  if(r.error||!r.data){msg.innerHTML='<span style="color:#ef4444;">'+esc(r.error?r.error.message:'You can no longer edit this lead.')+'</span>';return;}
  var id=r.data.lead_id,wasEdit=!!editingId;
  closeForm();
  toast(wasEdit?'Lead updated':'Lead #'+r.data.lead_no+' sent to management');
  if(!wasEdit&&isMgmt===false)scope='mine';
  refreshLead(id);
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeForm();closeDrawer();document.getElementById('declineModal').classList.remove('on');}});
init().catch(function(e){console.error(e);document.getElementById('main').innerHTML='<div class="empty">Something went wrong: '+esc(e.message)+'</div>';});
</script>
</body>
</html>

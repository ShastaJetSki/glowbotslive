<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<script>
/* ── SharkLaw V4 style switch ─────────────────────────────────────────
   sl-style: 'legacy' (default until the project goes live) or 'v4'.
   In the v4 style, light/dark is stored separately in 'v4-mode' (light
   by default); the page's own theme code keeps using 'app-theme', and
   this shim quietly redirects it. Logout's localStorage.clear() keeps
   the display settings. */
(function(){
  var LS;try{LS=window.localStorage;}catch(e){return;}
  var P=Storage.prototype,g=P.getItem,s=P.setItem,c=P.clear;
  var st='legacy';try{st=g.call(LS,'sl-style')==='v4'?'v4':'legacy';}catch(e){}
  window.SL_STYLE=st;
  var KEEP=['sl-style','v4-mode','app-theme'];
  P.clear=function(){
    if(this!==LS)return c.call(this);
    var keep={};KEEP.forEach(function(k){var v=g.call(LS,k);if(v!==null)keep[k]=v;});
    c.call(this);Object.keys(keep).forEach(function(k){s.call(LS,k,keep[k]);});
  };
  var m='light';try{m=g.call(LS,'v4-mode')==='dark'?'dark':'light';}catch(e){}
  if(st==='v4'){
    P.getItem=function(k){if(this===LS&&k==='app-theme')return g.call(LS,'v4-mode')==='dark'?'dark':'light';return g.call(this,k);};
    P.setItem=function(k,v){
      if(this===LS&&k==='app-theme'){var md=String(v).indexOf('light')>=0?'light':'dark';s.call(LS,'v4-mode',md);document.documentElement.setAttribute('data-v4mode',md);return;}
      return s.call(this,k,v);
    };
  }
  var h=document.documentElement;h.setAttribute('data-style',st);h.setAttribute('data-v4mode',m);
})();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contact Profile</title>
  <script>
    (function() {
      var theme = localStorage.getItem('app-theme'); if(theme!=='light'&&theme!=='dark')theme='dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();

  <link rel="stylesheet" href="themes.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .ac-wrap{position:relative;}
    .ac-drop{display:none;position:absolute;top:100%;left:0;right:0;z-index:500;margin-top:4px;
      background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:8px;
      max-height:220px;overflow-y:auto;box-shadow:0 6px 24px rgba(0,0,0,.5);}
    .ac-item{padding:9px 12px;font-size:13px;cursor:pointer;color:var(--text-primary);border-bottom:1px solid var(--border-default);}
    .ac-item:last-child{border-bottom:none;}
    .ac-item:hover,.ac-item.sel{background:var(--accent-primary);color:#fff;}
    .ac-item b{color:var(--accent-light);font-weight:700;}
    .ac-item:hover b,.ac-item.sel b{color:#fff;}
    .ac-none{padding:9px 12px;font-size:12px;color:var(--text-secondary);}
    #eCounty{cursor:pointer;padding-right:30px;
      background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%239fb0c3' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
      background-repeat:no-repeat;background-position:right 11px center;}
    #eCounty:focus{cursor:text;}
    :root{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="dark"]{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="light"]{--bg-primary:#f4f6fb;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#e8edf6;--border-default:#d3dbe8;--text-primary:#14213a;--text-secondary:#44546c;--accent-primary:#2563eb;--accent-light:#1d4ed8;}

    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg-primary);min-height:100%;}
    body{font-family:system-ui;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;}

    .theme-toggle-btn,.theme-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-toggle-btn:hover,.theme-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
    .theme-toggle-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;}
    .theme-toast{position:fixed;bottom:200px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--border-default);color:var(--text-primary);padding:12px 20px;border-radius:10px;font-size:14px;z-index:1000;display:none;white-space:nowrap;}
    .theme-toast.show{display:block;}

    .mobile-top-header{display:none;position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .mobile-header-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:12px;}
    .mobile-menu-toggle{background:transparent;border:none;color:var(--text-secondary);font-size:20px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .mobile-header-center{flex:1;}
    .mobile-header-title{font-size:18px;font-weight:600;}
    .business-name{font-size:12px;color:var(--accent-light);}
    .mobile-menu-content{max-height:0;overflow:hidden;transition:max-height 0.3s ease;background:var(--bg-primary);border-top:1px solid var(--border-default);}
    .mobile-menu-content.expanded{max-height:200px;}
    .mobile-header-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px 12px;}
    .mobile-header-actions button{padding:10px;font-size:13px;background:color-mix(in srgb,var(--accent-primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent-primary) 30%,transparent);color:var(--accent-light);border-radius:8px;cursor:pointer;}
    .desktop-header{position:sticky;top:0;z-index:100;background:var(--bg-primary);border-bottom:1px solid var(--border-default);}

    /* PROFILE LAYOUT */
    .profile-wrap{max-width:860px;margin:0 auto;padding:16px 12px 40px;}

    /* HERO CARD */
    .hero-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:12px;padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
    .hero-avatar{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;flex-shrink:0;border:3px solid var(--border-default);}
    .hero-info{flex:1;min-width:200px;}
    .hero-name{font-size:24px;font-weight:700;margin-bottom:4px;}
    .hero-org{font-size:14px;color:var(--text-secondary);margin-bottom:8px;}
    .hero-badges{display:flex;gap:6px;flex-wrap:wrap;}
    .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border-default);background:var(--bg-hover);}
    .badge.type{background:color-mix(in srgb,var(--accent-primary) 15%,transparent);border-color:color-mix(in srgb,var(--accent-primary) 40%,transparent);color:var(--accent-light);}
    .hero-actions{display:flex;gap:8px;flex-wrap:wrap;}
    .action-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:13px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px;transition:all .15s;}
    .action-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
    .action-btn.primary{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff;}
    .action-btn.primary:hover{background:var(--accent-light);}

    /* KPI ROW */
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
    @media(max-width:500px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
    .kpi-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;padding:12px;text-align:center;}
    .kpi-val{font-size:20px;font-weight:700;color:var(--accent-light);}
    .kpi-lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}

    /* SECTION CARDS */
    .sec-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;margin-bottom:14px;overflow:hidden;}
    .sec-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-default);}
    .sec-title{font-size:13px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;}
    .sec-edit-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);font-size:12px;cursor:pointer;}
    .sec-edit-btn:hover{background:var(--bg-hover);color:var(--text-primary);}
    .sec-body{padding:14px 16px;}

    /* INFO GRID */
    .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:480px){.info-grid{grid-template-columns:1fr;}}
    .info-item{}
    .info-lbl{font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
    .info-val{font-size:14px;font-weight:500;}
    .info-val a{color:var(--accent-light);text-decoration:none;}
    .info-val a:hover{text-decoration:underline;}
    .info-val.empty{color:var(--text-secondary);font-style:italic;font-weight:400;}

    /* FUNNEL STAGE */
    .stage-dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 16px;}
    .stage-dot-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
    .stage-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-default);background:transparent;transition:all .2s;}
    .stage-dot.completed{border-color:currentColor;background:currentColor;}
    .stage-dot.current{border-color:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 25%,transparent);}50%{box-shadow:0 0 0 8px color-mix(in srgb,currentColor 8%,transparent);}}
    .stage-dot-lbl{font-size:9px;color:var(--text-secondary);text-align:center;max-width:60px;line-height:1.2;}
    .stage-dot-wrap:hover .stage-dot{opacity:.8;}

    /* NOTES */
    .notes-text{font-size:13px;color:var(--text-secondary);line-height:1.6;font-style:italic;white-space:pre-wrap;}
    .notes-empty{font-size:13px;color:var(--text-secondary);font-style:italic;}

    /* SWAG TABLE */
    .swag-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border-default);}
    .swag-row:last-child{border-bottom:none;}
    .swag-item-name{font-size:13px;font-weight:500;}
    .swag-item-sub{font-size:11px;color:var(--text-secondary);}
    .swag-val{font-size:13px;font-weight:700;color:var(--accent-light);}

    /* APPOINTMENTS */
    .appt-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-default);}
    .appt-row:last-child{border-bottom:none;}
    .appt-date{font-size:12px;font-weight:600;color:var(--accent-light);min-width:80px;}
    .appt-info{flex:1;}
    .appt-notes{font-size:12px;color:var(--text-secondary);}

    /* FUNNEL ACTIVITY */
    .activity-row{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border-default);}
    .activity-row:last-child{border-bottom:none;}
    .activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .activity-text{font-size:13px;flex:1;}
    .activity-date{font-size:11px;color:var(--text-secondary);}

    /* DANGER ZONE */
    .danger-zone{margin-bottom:14px;padding:14px 16px;background:color-mix(in srgb,#dc2626 8%,var(--bg-card));border:1px solid color-mix(in srgb,#dc2626 30%,var(--border-default));border-radius:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
    .danger-label{font-size:13px;color:var(--text-secondary);}
    .btn-danger{padding:8px 18px;border-radius:6px;border:1px solid #dc2626;background:transparent;color:#ef4444;font-size:13px;cursor:pointer;}
    .btn-danger:hover{background:#dc2626;color:#fff;}

    /* EDIT MODAL */
    .modal-bg{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px;}
    .modal-bg.active{display:flex;}
    .modal-box{background:var(--bg-secondary);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border:1px solid var(--border-default);}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border-default);}
    .modal-title{font-size:18px;font-weight:600;}
    .modal-x{background:transparent;border:none;color:var(--text-secondary);font-size:24px;cursor:pointer;}
    .modal-body{padding:20px;}
    .fg{margin-bottom:14px;}
    .fl{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:5px;}
    .req{color:#ef4444;}
    .fi,.fsel,.fta{width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:14px;}
    .fta{min-height:80px;resize:vertical;}
    .fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn-p{padding:10px 20px;border-radius:6px;border:none;background:var(--accent-primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;width:100%;}
    .btn-p:hover{background:var(--accent-light);}
    .btn-s{padding:10px 20px;border-radius:6px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);font-size:14px;cursor:pointer;width:100%;}
    .btn-s:hover{background:var(--bg-hover);}
    .sec-m{margin-bottom:16px;}
    .sec-m-title{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;margin-bottom:8px;}
    .stage-selector{display:flex;flex-direction:column;gap:6px;}
    .stage-option{padding:10px 14px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;}
    .stage-option::before{content:'';width:10px;height:10px;border-radius:50%;background:currentColor;flex-shrink:0;}
    .stage-option:hover{background:var(--bg-hover);}
    .stage-option.active{border-color:currentColor;background:color-mix(in srgb,currentColor 20%,transparent);}

    /* MOBILE BOTTOM NAV */
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-secondary);padding:8px;z-index:100;border-top:1px solid var(--border-default);}
    .mobile-nav-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
    .mobile-nav-row:last-child{margin-bottom:0;}
    .mobile-nav-row.three-col{grid-template-columns:1fr 1fr 1fr;}
    .mobile-nav-btn{padding:10px 8px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:44px;}
    .mobile-nav-btn.active{background:color-mix(in srgb,var(--accent-primary) 60%,transparent);border-color:var(--accent-primary);color:var(--text-primary);}
    .mobile-nav-btn.action-btn{background:color-mix(in srgb,var(--accent-primary) 20%,transparent);border-color:color-mix(in srgb,var(--accent-primary) 50%,transparent);color:var(--accent-light);}

    @media(max-width:768px){
      .desktop-header{display:none!important;}
      .mobile-top-header{display:block;}
      .mobile-bottom-nav{display:block!important;}
      body{padding-bottom:120px;}
      .fr{grid-template-columns:1fr;}
      .modal-bg{align-items:flex-end;padding:0;}
      .modal-box{border-radius:20px 20px 0 0;max-height:92vh;}
      .hero-card{flex-direction:column;align-items:flex-start;}
    }
    @media(min-width:769px){
      .mobile-top-header{display:none!important;}
      .mobile-bottom-nav{display:none!important;}
    }
  </style>
<style id="v4-style">
/* ═════════ SharkLaw V4 style layer ═════════
   Only rules under html[data-style="v4"] change the look. With the
   legacy style the page looks exactly like V2, plus the gear button. */

/* gear + display panel: shown in both styles (testing switch) */
.v4-gear{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.v4-gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.v4-gear.floating{position:fixed;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:3000;width:46px;height:46px;border-radius:50%;background:var(--bg-card);box-shadow:0 4px 16px rgba(0,0,0,.3);}
.v4-pop{position:fixed;top:68px;right:16px;width:min(310px,calc(100vw - 24px));background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border-default);border-radius:14px;box-shadow:0 14px 44px rgba(0,0,0,.35);padding:16px;z-index:5000;display:none;font-size:14px;}
.v4-pop.on{display:block;}
.v4-pop h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-secondary);margin:0 0 8px;}
.v4-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg-hover);border:1px solid var(--border-default);border-radius:10px;padding:3px;margin-bottom:14px;}
.v4-seg button{border:none;background:transparent;border-radius:8px;min-height:40px;font-weight:600;font-size:14px;color:var(--text-secondary);cursor:pointer;font-family:inherit;}
.v4-seg button.on{background:var(--accent-primary);color:#fff;}
.v4-pop p{font-size:12px;color:var(--text-secondary);margin:0;line-height:1.4;}
.v4-pop .v4-x{position:absolute;top:8px;right:10px;background:none;border:none;font-size:22px;color:var(--text-secondary);cursor:pointer;}
.v4-logo-link,.v4-divider,.v4-mlogo,.v4-mnav,.v4-sheet,.v4-scrim{display:none;}
.top .v4-gear{margin-left:auto;order:1;}.top .sub{order:2;}

/* ───── tokens (override V2 variables) ───── */
html[data-style="v4"][data-v4mode="light"]{
  --bg-primary:#f5f6fa;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#eef0f6;--border-default:#dfe2ec;
  --text-primary:#191b2e;--text-secondary:#5a5f78;--accent-primary:#0404f4;--accent-light:#0404f4;
  --v4-brand:#22253d;--v4-shadow:0 1px 2px rgba(25,27,46,.06),0 4px 14px rgba(25,27,46,.05);
  --v4-danger:#c81e1e;--v4-warn:#a14a06;--v4-ok:#15803d;--v4-danger-soft:rgba(200,30,30,.09);--v4-warn-soft:rgba(217,119,6,.12);--v4-ok-soft:rgba(21,128,61,.10);
  --v4-violet:#6d28d9;--v4-blue:#1d4ed8;--v4-green:#15803d;--v4-amber:#a14a06;--v4-teal:#0f766e;--v4-gray:#4b5563;
}
html[data-style="v4"][data-v4mode="dark"]{
  --bg-primary:#161829;--bg-secondary:#1c1f33;--bg-card:#22253d;--bg-hover:#2b2f4a;--border-default:#363a58;
  --text-primary:#eef0f8;--text-secondary:#b4b8cc;--accent-primary:#3b45f5;--accent-light:#a5abff;
  --v4-brand:#0f1120;--v4-shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.22);
  --v4-danger:#fca5a5;--v4-warn:#fcd34d;--v4-ok:#86efac;--v4-danger-soft:rgba(248,113,113,.15);--v4-warn-soft:rgba(251,191,36,.14);--v4-ok-soft:rgba(74,222,128,.13);
  --v4-violet:#c4b5fd;--v4-blue:#93c5fd;--v4-green:#86efac;--v4-amber:#fcd34d;--v4-teal:#5eead4;--v4-gray:#d1d5db;
}
html[data-style="v4"],html[data-style="v4"] body{background:var(--bg-primary);color:var(--text-primary);}
html[data-style="v4"] body,html[data-style="v4"] button,html[data-style="v4"] input,html[data-style="v4"] select,html[data-style="v4"] textarea{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;}
html[data-style="v4"] :focus-visible{outline:3px solid var(--accent-light);outline-offset:2px;}

/* ───── brand header (navy band, white logo) ───── */
html[data-style="v4"] .desktop-header,html[data-style="v4"] .mobile-top-header{
  background:var(--v4-brand)!important;color:#fff;border-bottom:1px solid #363a58!important;

}

html[data-style="v4"] .mobile-top-header .theme-btn,html[data-style="v4"] .mobile-top-header .theme-toggle-btn,html[data-style="v4"] .mobile-top-header .v4-gear{width:40px;height:40px;border-radius:10px;border:1px solid #3d4163;color:#fff;background:transparent;}

html[data-style="v4"] .v4-tab{padding:11px 12px!important;color:#c4cbe0!important;text-decoration:none!important;font-size:14px!important;font-weight:500;border-bottom:3px solid transparent!important;white-space:nowrap;}

html[data-style="v4"] .desktop-header .vt-btn.active,html[data-style="v4"] .desktop-header .view-toggle .active{background:#0404f4!important;color:#fff!important;}
/* mobile header: logo instead of the hamburger menu (the More sheet replaces it) */

html[data-style="v4"] .v4-mlogo{display:block;height:28px;width:auto;flex-shrink:0;}

/* ───── surfaces ───── */

html[data-style="v4"] .kpi-pill,html[data-style="v4"] .kpi-card,html[data-style="v4"] .kpi-item,html[data-style="v4"] .kpi-chip,html[data-style="v4"] .stat-chip,html[data-style="v4"] .lead-kpi{background:var(--bg-card)!important;border:1px solid var(--border-default)!important;border-radius:12px!important;box-shadow:var(--v4-shadow);}
html[data-style="v4"] .kpi-val,html[data-style="v4"] .kpi-value,html[data-style="v4"] .stat-chip span,html[data-style="v4"] .lead-kpi .v{color:var(--text-primary)!important;font-weight:800!important;}
html[data-style="v4"] .kpi-lbl,html[data-style="v4"] .kpi-label{color:var(--text-secondary)!important;}
html[data-style="v4"] .dash-section,html[data-style="v4"] .today-card,html[data-style="v4"] .sec-card,html[data-style="v4"] .hero-card,html[data-style="v4"] .card,html[data-style="v4"] .panel,html[data-style="v4"] .inv-card,html[data-style="v4"] .table-wrap,html[data-style="v4"] .settings-panel,html[data-style="v4"] .danger-zone{border-radius:14px!important;box-shadow:var(--v4-shadow);border-color:var(--border-default)!important;}
html[data-style="v4"] .twin-wrap .dash-section,html[data-style="v4"] .today-card{background:var(--bg-card)!important;}
html[data-style="v4"] .today-card-header,html[data-style="v4"] .evt-card .today-card-header{background:var(--bg-card)!important;border-bottom:1px solid var(--border-default);}
html[data-style="v4"] .today-card-title,html[data-style="v4"] .evt-card .today-card-title{color:var(--text-primary)!important;}
html[data-style="v4"] .sec-title,html[data-style="v4"] .section-title{color:var(--text-secondary);}
html[data-style="v4"] .cc,html[data-style="v4"] .task-item,html[data-style="v4"] .inbox-item,html[data-style="v4"] .emp-row,html[data-style="v4"] .followup-item,html[data-style="v4"] .appt-item,html[data-style="v4"] .swag-item,html[data-style="v4"] .lead-row,html[data-style="v4"] .lc,html[data-style="v4"] .ml{border-radius:10px!important;}
html[data-style="v4"] .modal-box,html[data-style="v4"] .modal-content,html[data-style="v4"] .mbox{border-radius:16px!important;border-color:var(--border-default)!important;}
html[data-style="v4"] input,html[data-style="v4"] select,html[data-style="v4"] textarea{border-radius:10px;}
html[data-style="v4"] .btn-primary,html[data-style="v4"] .btn-p,html[data-style="v4"] .add-btn,html[data-style="v4"] .btn-add,html[data-style="v4"] .compose-send,html[data-style="v4"] .sched-add-btn{background:var(--accent-primary)!important;color:#fff!important;border-radius:10px!important;}
/* status colours that were pastel-on-tint and hard to read in light mode */
html[data-style="v4"] .pri-urgent,html[data-style="v4"] .u-urgent,html[data-style="v4"] .p-hot{background:var(--v4-danger-soft)!important;color:var(--v4-danger)!important;}
html[data-style="v4"] .pri-high,html[data-style="v4"] .u-high{background:var(--v4-warn-soft)!important;color:var(--v4-warn)!important;}
html[data-style="v4"] .role-owner{background:var(--v4-warn-soft)!important;color:var(--v4-amber)!important;}
html[data-style="v4"] .role-admin{background:var(--v4-danger-soft)!important;color:var(--v4-danger)!important;}
html[data-style="v4"] .role-manager{background:rgba(124,58,237,.12)!important;color:var(--v4-violet)!important;}
html[data-style="v4"] .role-associate{background:rgba(37,99,235,.12)!important;color:var(--v4-blue)!important;}
html[data-style="v4"] .role-jr{background:rgba(13,148,136,.12)!important;color:var(--v4-teal)!important;}
html[data-style="v4"] .cr-channel.email,html[data-style="v4"] .msg-channel-badge.email,html[data-style="v4"] .tp-action-btn.email,html[data-style="v4"] .dp-quick-btn.email,html[data-style="v4"] .compose-tab.active.email{color:var(--v4-blue)!important;}
html[data-style="v4"] .cr-channel.sms,html[data-style="v4"] .msg-channel-badge.sms,html[data-style="v4"] .tp-action-btn.sms,html[data-style="v4"] .dp-quick-btn.sms,html[data-style="v4"] .compose-tab.active.sms{color:var(--v4-green)!important;}
html[data-style="v4"] .dp-quick-btn.call{color:var(--v4-amber)!important;}
html[data-style="v4"] .fu-days{color:var(--v4-warn)!important;}
html[data-style="v4"] .msg-row.outbound .msg-bubble{background:var(--accent-primary);}
html[data-style="v4"] .col-body{scrollbar-color:var(--border-default) transparent!important;}
html[data-style="v4"] .col-body::-webkit-scrollbar-track{background:transparent!important;}
html[data-style="v4"] .col-body::-webkit-scrollbar-thumb{background:var(--border-default)!important;}

/* ───── calendar (scheduler) ───── */
html[data-style="v4"] .sidebar{background:var(--bg-primary)!important;border-color:var(--border-default)!important;}
html[data-style="v4"] .cal-card,html[data-style="v4"] .sidebar-section{background:var(--bg-card)!important;border-radius:14px!important;box-shadow:var(--v4-shadow);border:1px solid var(--border-default)!important;}
html[data-style="v4"] .cal-header-day,html[data-style="v4"] .week-header-day{font-size:11px!important;font-weight:700!important;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)!important;}
html[data-style="v4"] .cal-cell{background:var(--bg-card)!important;border-color:var(--border-default)!important;}
html[data-style="v4"] .cal-cell:hover{background:var(--bg-hover)!important;}
html[data-style="v4"] .cal-strip,html[data-style="v4"] .week-ev,html[data-style="v4"] .day-ev,html[data-style="v4"] .mw-event{border-radius:6px!important;}
html[data-style="v4"] .sched-title{font-weight:800!important;letter-spacing:-.01em;}
html[data-style="v4"] .view-btn.active,html[data-style="v4"] .vt-btn.active{background:var(--accent-primary)!important;color:#fff!important;}
html[data-style="v4"] .mini-day.today,html[data-style="v4"] .cal-cell.today .cal-day-num,html[data-style="v4"] .mw-today .mw-day-num{background:var(--accent-primary)!important;color:#fff!important;}

/* ───── funnels ───── */
.v4-funnel{display:flex;flex-direction:column;gap:10px;}
.v4-stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg-hover);}
.v4-stack div{height:100%;}
.v4-legend{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.v4-legend::-webkit-scrollbar{display:none;}
.v4-lg{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--border-default);border-radius:10px;background:var(--bg-card);color:var(--text-primary);font-size:13px;white-space:nowrap;cursor:pointer;flex-shrink:0;}
.v4-lg:hover{border-color:var(--accent-light);}
.v4-lg .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.v4-lg b{font-size:15px;}
.v4-lg.kpi{cursor:default;background:var(--bg-hover);}
.v4-due{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(217,119,6,.15);color:#b45309;margin-left:4px;}
[data-theme="dark"] .v4-due,html[data-style="v4"][data-v4mode="dark"] .v4-due{color:#fcd34d;}

/* ───── mobile bottom nav + More sheet (v4 only) ───── */
@media(max-width:768px){
  html[data-style="v4"] .mobile-bottom-nav{display:none!important;}
  html[data-style="v4"] .v4-mnav{display:block;position:fixed;left:0;right:0;bottom:0;z-index:2500;background:var(--bg-card);border-top:1px solid var(--border-default);padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
  html[data-style="v4"] body{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important;}
  html[data-style="v4"] .v4-gear.floating{bottom:calc(92px + env(safe-area-inset-bottom));}
  html[data-style="v4"] .desktop-header{display:none!important;}
}
.v4-mnav-in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.v4-mnav a,.v4-mnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;border-radius:10px;text-decoration:none;color:var(--text-secondary);font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;font-family:inherit;}
.v4-mnav svg,.v4-sheet svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.v4-mnav .on{color:var(--accent-light);background:color-mix(in srgb,var(--accent-primary) 10%,transparent);}
html[data-style="v4"] .v4-scrim.on{display:block;position:fixed;inset:0;background:rgba(10,12,24,.5);z-index:2600;}
html[data-style="v4"] .v4-sheet{display:block;position:fixed;left:0;right:0;bottom:0;z-index:2601;background:var(--bg-card);color:var(--text-primary);border-radius:20px 20px 0 0;padding:10px 0 calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s;max-height:85vh;overflow-y:auto;}
html[data-style="v4"] .v4-sheet.on{transform:none;}
.v4-sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--border-default);margin:4px auto 10px;}
.v4-sheet a,.v4-sheet button.si{display:flex;align-items:center;gap:14px;width:100%;padding:13px 22px;font-size:16px;font-weight:500;color:var(--text-primary);text-decoration:none;background:none;border:none;text-align:left;cursor:pointer;min-height:50px;font-family:inherit;}
.v4-sheet a.on{color:var(--accent-light);font-weight:700;}
.v4-sheet a svg,.v4-sheet button.si svg{color:var(--text-secondary);}
.v4-sheet .sep{height:1px;background:var(--border-default);margin:6px 0;}
@media(min-width:769px){.v4-mnav,.v4-sheet,.v4-scrim{display:none!important;}}

/* ═════ standard header (same measurements as the Overview header) ═════ */
html{scrollbar-gutter:stable;}
/* always reserve the scrollbar so the header sits in the same place on every page */
html[data-style="v4"]{overflow-y:scroll!important;scrollbar-width:auto!important;}
.v4-hdr{display:none;}
html[data-style="v4"] .desktop-header{padding:0!important;position:sticky;top:0;z-index:100;border-bottom:1px solid #363a58!important;}
html[data-style="v4"][data-v4mode="dark"] .desktop-header{border-bottom-color:#2b2f4a!important;}
html[data-style="v4"] .desktop-header>*:not(.v4-hdr){display:none!important;}
html[data-style="v4"] .v4-hdr{display:block;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;line-height:1.45;font-size:15px;}
.v4h-top{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:14px 24px 8px;box-sizing:border-box;}
.v4h-logo-a{display:block;flex-shrink:0;}
.v4h-logo{height:42px;width:auto;display:block;}
.v4h-title{margin-left:auto;font-size:26px;font-weight:700;letter-spacing:-.01em;color:#fff;line-height:1;white-space:nowrap;}
.v4h-row{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:0 24px;box-sizing:border-box;position:relative;}
.v4h-tabs{flex:0 1 auto;min-width:0;display:flex;gap:4px;margin-left:-12px;overflow-x:auto;scrollbar-width:none;}
.v4h-tabs::-webkit-scrollbar{display:none;}
.v4h-tabs a{display:inline-flex;flex-direction:column;align-items:center;color:#c4cbe0;text-decoration:none;font-size:14px;font-weight:500;padding:11px 12px;border-bottom:3px solid transparent;white-space:nowrap;line-height:1.45;}
.v4h-tabs a::after{content:attr(data-label);font-weight:600;height:0;visibility:hidden;overflow:hidden;}
.v4h-tabs a:hover{color:#fff;}
.v4h-tabs a.on{color:#fff;border-bottom-color:#4a55ff;font-weight:600;}
.v4h-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.v4h-extra{display:flex;align-items:center;gap:8px;margin-left:4px;}
.v4h-extra:empty{display:none;}
.v4h-user{font-size:13px;color:#c4cbe0;margin-right:6px;white-space:nowrap;}
.v4h-btn{width:36px;height:36px;border-radius:10px;border:1px solid #363a58;background:transparent;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0;}
html[data-v4mode="dark"] .v4h-btn{border-color:#2b2f4a;}
.v4h-btn:hover{background:rgba(255,255,255,.08);}
.v4h-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.v4h-out{background:none;border:none;color:#c4cbe0;cursor:pointer;font-size:14px;padding:8px 6px;font-family:inherit;}
.v4h-out:hover{color:#fff;}
/* page-specific controls moved onto the tab row */
.v4h-extra .view-toggle{background:rgba(255,255,255,.06)!important;border-color:#363a58!important;}
.v4h-extra .vt-btn{color:#c4cbe0!important;}
.v4h-extra .vt-btn.active{background:#0404f4!important;color:#fff!important;}
.v4h-extra .hdr-btn{height:36px;border-radius:10px;border:1px solid #363a58;background:transparent;color:#fff;padding:0 12px;font-size:13px;font-family:inherit;cursor:pointer;}
/* archive: the old navy bar becomes the page heading area under the standard header */
html[data-style="v4"] .top{background:var(--bg-primary)!important;border-bottom:1px solid var(--border-default)!important;position:static!important;}
@media(min-width:769px){html[data-style="v4"] .top h1{display:none;}}

/* ═════ V4 design system: KPI blocks, cards and page layout matched to the Overview ═════ */

/* page width + spacing (Overview: 1280px, 22px 24px) */
html[data-style="v4"] .main,html[data-style="v4"] .page-wrap,html[data-style="v4"] .wrap,html[data-style="v4"] .builder-content{max-width:1280px!important;margin-left:auto!important;margin-right:auto!important;padding:20px 24px 40px!important;}
html[data-style="v4"] .content{max-width:1000px!important;padding:22px 24px 40px!important;}
html[data-style="v4"] .profile-wrap{max-width:1000px!important;margin:0 auto;padding:20px 24px 40px!important;}

/* page heading (eyebrow + large title) */
html[data-style="v4"] .greeting-bar{background:transparent!important;border:none!important;max-width:1280px;margin:0 auto;padding:22px 24px 6px!important;}
html[data-style="v4"] .greeting-time{font-size:13px!important;font-weight:600;color:var(--text-secondary)!important;text-transform:uppercase;letter-spacing:.08em!important;}
html[data-style="v4"] .greeting-name{font-size:32px!important;font-weight:800!important;letter-spacing:-.02em;line-height:1.1;margin-top:4px;}

/* ───── KPI blocks: big number, label underneath, left aligned ───── */
html[data-style="v4"] .kpi-bar{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px!important;max-width:1280px;margin:0 auto!important;padding:14px 24px 4px!important;overflow:visible!important;background:transparent!important;border:none!important;}
html[data-style="v4"] .kpi-row{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px!important;overflow:visible!important;margin-bottom:18px!important;}
html[data-style="v4"] .kpi-pill,html[data-style="v4"] .kpi-card,html[data-style="v4"] .kpi-item,html[data-style="v4"] .lead-kpi{
  display:flex!important;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;text-align:left!important;
  padding:14px 16px!important;min-height:92px;min-width:0!important;white-space:normal!important;
  background:var(--bg-card)!important;border:1px solid var(--border-default)!important;border-radius:14px!important;box-shadow:var(--v4-shadow);}
html[data-style="v4"] .kpi-card::before{display:none!important;}
html[data-style="v4"] .kpi-val,html[data-style="v4"] .kpi-value,html[data-style="v4"] .lead-kpi .v{font-size:28px!important;font-weight:800!important;line-height:1.1!important;letter-spacing:-.01em;color:var(--text-primary)!important;text-align:left!important;}
html[data-style="v4"] .kpi-lbl,html[data-style="v4"] .kpi-label,html[data-style="v4"] .lead-kpi .l{font-size:13px!important;font-weight:500!important;color:var(--text-secondary)!important;text-transform:none!important;letter-spacing:0!important;margin-top:4px!important;text-align:left!important;line-height:1.3;}
html[data-style="v4"] .kpi-pill[onclick],html[data-style="v4"] .kpi-pill[style*="cursor"]{cursor:pointer;}
html[data-style="v4"] .kpi-pill:hover,html[data-style="v4"] .kpi-card:hover{border-color:var(--accent-light)!important;}
/* needs-attention colouring, same as the Overview */
html[data-style="v4"] .v4-hot{background:var(--v4-danger-soft)!important;border-color:color-mix(in srgb,var(--v4-danger) 40%,var(--border-default))!important;}
html[data-style="v4"] .v4-hot .kpi-val{color:var(--v4-danger)!important;}
html[data-style="v4"] .v4-warm{background:var(--v4-warn-soft)!important;border-color:color-mix(in srgb,var(--v4-warn) 35%,var(--border-default))!important;}
html[data-style="v4"] .v4-warm .kpi-val{color:var(--v4-warn)!important;}
html[data-style="v4"] .v4-clear .kpi-val{color:var(--v4-ok)!important;}
html[data-style="v4"] .lead-kpis{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important;gap:10px!important;}

/* contacts: total / showing / mine / pipeline / partners as KPI blocks (still clickable filters) */
html[data-style="v4"] .stats-bar{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px!important;margin:6px 0 14px!important;}
html[data-style="v4"] .stat-chip{display:flex!important;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px!important;min-height:84px;font-size:13px!important;font-weight:500;color:var(--text-secondary)!important;border-radius:14px!important;cursor:pointer;}
html[data-style="v4"] .stat-chip span{display:block;font-size:28px!important;font-weight:800!important;line-height:1.1;color:var(--text-primary)!important;}
html[data-style="v4"] .stat-chip.active{border-color:var(--accent-light)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-primary) 25%,transparent)!important;}
html[data-style="v4"] .stat-chip.active,html[data-style="v4"] .stat-chip.active span{background:var(--bg-card)!important;color:var(--text-primary)!important;}
html[data-style="v4"] .stats-bar .btn-add{align-self:center;}

/* ───── cards: header bar + title like the Overview ───── */
html[data-style="v4"] .dash-section,html[data-style="v4"] .today-card,html[data-style="v4"] .sec-card,html[data-style="v4"] .panel,html[data-style="v4"] .card,html[data-style="v4"] .hero-card,html[data-style="v4"] .inv-card,html[data-style="v4"] .settings-panel{background:var(--bg-card)!important;border:1px solid var(--border-default)!important;border-radius:14px!important;box-shadow:var(--v4-shadow)!important;overflow:hidden;}
html[data-style="v4"] .dash-section{margin-top:16px!important;}

<script>
var SB_URL='https://wiwbmvmgrutjfbnqhfnb.supabase.co';

var contact=null,allMembers=[],funnelStages={},contactAppts=[],contactSwag=[],contactActivity=[];

var DEFAULT_STAGES={1:{name:'1st Contact',color:'#6366f1'},2:{name:'Follow Up',color:'#14b8a6'},3:{name:'Swag Approved',color:'#a855f7'},4:{name:'Receive Artwork',color:'#f59e0b'},5:{name:'Deliver Pop Up',color:'#22c55e'},6:{name:'Confirmed Partnership',color:'#3b82f6'},7:{name:'Follow Up (Old)',color:'#6b7280'}};

var THEME_NAMES={'dark-blue':'Dark Blue','blue-light':'Blue Light','slate-dark':'Slate Dark','slate-light':'Slate Light','ocean-dark':'Ocean Dark','ocean-light':'Ocean Light','midnight-dark':'Midnight','lavender-light':'Lavender','forest-dark':'Forest','mint-light':'Mint','crimson-dark':'Crimson','coral-light':'Coral','amber-dark':'Amber','honey-light':'Honey','rose-dark':'Rose','sky-light':'Sky','cyber-dark':'Cyber','sand-light':'Sand'};
var userThemeBank=['dark-blue'],themeIndex=0;
function loadTheme(){var t=localStorage.getItem('app-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);try{document.querySelectorAll('.theme-btn,.theme-toggle-btn').forEach(function(b){b.title=t==='light'?'Switch to dark mode':'Switch to light mode';});}catch(e){}}
function cycleTheme(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('app-theme',t);try{document.querySelectorAll('.theme-btn,.theme-toggle-btn').forEach(function(b){b.title=t==='light'?'Switch to dark mode':'Switch to light mode';});}catch(e){}if(typeof showToast==='function')showToast(t==='light'?'Light mode':'Dark mode');}
async function loadUserThemeBank(){loadTheme();}
loadTheme();

function showToast(msg){var t=document.getElementById('themeToast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2000);}
async function logout(){await sb.auth.signOut();localStorage.clear();location.replace('v4-login.html');}
function toggleMobileMenu(){document.getElementById('mobileMenuContent').classList.toggle('expanded');}
/* Import wrote the literal text "null" into name columns. Treat those
   sentinels as empty so they never reach a contact card. */
function nm(v){var t=String(v==null?'':v).trim();
  return /^(null|undefined|n\/a|na|none|nil|-)$/i.test(t)?'':t;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function isAdmin(){return['owner','admin'].includes((currentUserRole||'').toLowerCase());}
function isManager(){return['manager','sr_associate'].includes((currentUserRole||'').toLowerCase());}

function getStageIds(){return Object.keys(funnelStages).map(Number).sort(function(a,b){return a-b;});}
async function reloadActivity(){
  var r=await sb.from('funnel_activity')
    .select('*')
    .eq('contact_id',contact.contact_id)
    .order('created_at',{ascending:false}).limit(10);
  if(r.error){console.warn('funnel_activity read:',r.error.message);contactActivity=[];return;}
  contactActivity=r.data||[];
}

function getStageName(id){return funnelStages[id]?funnelStages[id].name:'Stage '+id;}
function getStageColor(id){return funnelStages[id]?funnelStages[id].color:'#9fb0c3';}
function memberName(id){var m=allMembers.find(function(x){return x.member_id===id;});if(!m)return'Unassigned';return(nm(m.first_name)+' '+nm(m.last_name)).trim();}
function memberColor(id){var m=allMembers.find(function(x){return x.member_id===id;});return(m&&m.color)||'#6b7280';}

function fmtDate(d){if(!d)return'—';return new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
/* appointment_time is a 'HH:MM[:SS]' string */
function fmt12(t){if(!t)return'';var p=String(t).split(':'),h=parseInt(p[0],10),m=(p[1]||'00').slice(0,2);if(isNaN(h))return'';return(h%12||12)+':'+m+(h>=12?' PM':' AM');}
function fmtTime(d){if(!d)return'';return new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}
function daysAgo(d){if(!d)return null;var diff=Math.floor((Date.now()-new Date(d).getTime())/(1000*60*60*24));return diff===0?'Today':diff===1?'Yesterday':diff+'d ago';}

/* ===== RENDER PROFILE ===== */
function renderProfile(){
  if(!contact){document.getElementById('profileWrap').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-secondary);">Contact not found.</div>';return;}
  var c=contact;
  var name=(nm(c.first_name)+' '+nm(c.last_name)).trim()||'Unknown';
  var initials=((nm(c.first_name)[0]||'')+(nm(c.last_name)[0]||'')).toUpperCase()||'?';
  var ec=memberColor(c.assigned_to);
  var stage=c.funnel_stage||getStageIds()[0]||1;
  var ids=getStageIds();
  var stageIdx=ids.indexOf(stage);

  document.getElementById('breadcrumbName').textContent=name;
  if(document.getElementById('mUserName'))document.getElementById('mUserName').textContent=name;

  // Days in funnel
  var dif=c.created_at?Math.floor((Date.now()-new Date(c.created_at).getTime())/(1000*60*60*24)):null;
  var difStr=dif===null?'—':dif===0?'Today':dif+'d';
  var lastUpd=daysAgo(c.updated_at||c.created_at);
  var swagTotal=contactSwag.reduce(function(s,g){return s+(parseFloat(g.value)||0);},0);

  // Funnel dots
  var checkmark='<svg viewBox="0 0 16 16" style="width:13px;height:13px;display:block;"><polyline points="3,9 6.5,13 13,5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
  var dotsHtml=ids.map(function(id,i){
    var col=getStageColor(id);
    var isDone=i<stageIdx;
    var isCurrent=id===stage;
    var dc='stage-dot'+(isDone?' completed':isCurrent?' current':'');
    var wc='stage-dot-wrap'+(isCurrent?' scurrent':'');
    return '<div class="'+wc+'" onclick="quickStage('+id+')" style="color:'+col+';">'
      +'<div class="'+dc+'" style="color:'+col+';">'+(isCurrent?checkmark:'')+'</div>'
      +'<div class="stage-dot-lbl">'+esc(getStageName(id))+'</div>'
    +'</div>';
  }).join('');

  // Swag rows
  var swagHtml=contactSwag.length===0?'<div style="padding:14px 16px;font-size:13px;color:var(--text-secondary);font-style:italic;">No swag given yet</div>':
    contactSwag.map(function(g){
      return '<div class="swag-row"><div><div class="swag-item-name">'+esc(g.item_name||'Unknown Item')+'</div><div class="swag-item-sub">Qty: '+(g.quantity||1)+' · '+fmtDate(g.given_date)+'</div></div><div class="swag-val">$'+parseFloat(g.value||0).toFixed(2)+'</div></div>';
    }).join('');

  // Appointments
  var apptsHtml=contactAppts.length===0?'<div style="padding:14px 16px;font-size:13px;color:var(--text-secondary);font-style:italic;">No appointments</div>':
    contactAppts.slice(0,5).map(function(a){
      return '<div class="appt-row"><div class="appt-date">'+fmtDate(a.appointment_date?a.appointment_date+'T00:00:00':null)+'<br><span style="font-weight:400;font-size:11px;">'+fmt12(a.appointment_time)+'</span></div><div class="appt-info"><div class="appt-notes">'+esc(a.notes||'No notes')+'</div><div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">Assigned: '+esc(memberName(a.assigned_to))+'</div></div></div>';
    }).join('');

  // Activity

/* ===== QUICK STAGE CHANGE ===== */
async function quickStage(stageId){
  if(!contact||contact.funnel_stage===stageId)return;
  var oldStage=contact.funnel_stage;
  contact.funnel_stage=stageId;
  var r=await sb.from('contacts').update({funnel_stage:stageId}).eq('contact_id',contact.contact_id);
  if(r.error){contact.funnel_stage=oldStage;showToast('Error saving stage');return;}
  /* history row is written by the database trigger (sql/01) */
  await reloadActivity();
  renderProfile();showToast('Stage updated');
}

/* ===== REMOVE CONTACT ===== */
async function removeContact(){
  if(!confirm('Remove this contact from your list? It will move to your vault.'))return;
  /* the column is removed_by; member_id does not exist on this table */
  var r=await sb.from('contact_removals').insert({tenant_id:currentTenantId,contact_id:contact.contact_id,removed_by:currentUserId,removed_at:new Date().toISOString()});
  if(r.error){alert('Error: '+r.error.message);return;}
  showToast('Contact removed');
  setTimeout(function(){location.replace('v4-sharklaw-contacts.html');},1000);
}

/* ===== EDIT MODAL ===== */
/* ── CALIFORNIA COUNTIES ── */
var COUNTIES=['Alameda','Alpine','Amador','Butte','Calaveras','Colusa','Contra Costa','Del Norte',
'El Dorado','Fresno','Glenn','Humboldt','Imperial','Inyo','Kern','Kings','Lake','Lassen',
'Los Angeles','Madera','Marin','Mariposa','Mendocino','Merced','Modoc','Mono','Monterey','Napa',
'Nevada','Orange','Placer','Plumas','Riverside','Sacramento','San Benito','San Bernardino',
'San Diego','San Francisco','San Joaquin','San Luis Obispo','San Mateo','Santa Barbara',
'Santa Clara','Santa Cruz','Shasta','Sierra','Siskiyou','Solano','Sonoma','Stanislaus','Sutter',
'Tehama','Trinity','Tulare','Tuolumne','Ventura','Yolo','Yuba'];
var acIdx=-1,acList=[];

function acOpts(){
  var out=[{v:'',label:'— No county —'}];
  COUNTIES.forEach(function(c){out.push({v:c,label:c});});
  return out;
}

/* Prefix matches rank above substring matches, so "san" leads with
   San Benito rather than burying it under Mariposa. */
function acFilter(q){
  q=(q||'').trim().toLowerCase();
  var opts=acOpts();
  if(!q)return opts;
  var a=[],b=[];
  opts.forEach(function(o){
    if(o.v==='')return;
    var i=o.label.toLowerCase().indexOf(q);
    if(i===0)a.push(o); else if(i>0)b.push(o);
  });
  return a.concat(b);
}

function acOpen(){
  var el=document.getElementById('eCounty'),d=document.getElementById('countyDrop');
  var q=el.readOnly?'':el.value;
  acList=acFilter(q); acIdx=-1;
  if(!acList.length){
    d.innerHTML='<div class="ac-none">No California county matches that</div>';
    d.style.display='block';return;
  }
  var lq=(q||'').trim().toLowerCase();
  d.innerHTML=acList.map(function(o,i){
    var label=esc(o.label),k=lq?o.label.toLowerCase().indexOf(lq):-1;
    if(k>=0&&lq)label=esc(o.label.slice(0,k))+'<b>'+esc(o.label.slice(k,k+lq.length))+'</b>'+esc(o.label.slice(k+lq.length));
    return '<div class="ac-item" data-i="'+i+'" onmousedown="acPick('+i+')">'+label+'</div>';
  }).join('');
  d.style.display='block';
}

function acClose(){document.getElementById('countyDrop').style.display='none';acIdx=-1;}

function acPick(i){
  if(!acList[i])return;
  var el=document.getElementById('eCounty');
  el.dataset.val=acList[i].v; el.value=acList[i].v;
  acClose(); el.readOnly=true; el.blur();
}

function acKey(e){
  var d=document.getElementById('countyDrop');
  if(e.key==='Escape'){acClose();return;}
  /* read-only until you type, so it behaves like a picker but stays searchable */
  if(e.key.length===1&&/[a-z ]/i.test(e.key)){
    var el=document.getElementById('eCounty');
    if(el.readOnly){el.readOnly=false;el.value='';}
  }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(d.style.display!=='block'){acOpen();return;}
    if(!acList.length)return;
    acIdx=e.key==='ArrowDown'?(acIdx+1)%acList.length:(acIdx<=0?acList.length-1:acIdx-1);
    var it=d.querySelectorAll('.ac-item');
    for(var i=0;i<it.length;i++)it[i].classList.toggle('sel',i===acIdx);
    if(it[acIdx])it[acIdx].scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Enter'||e.key==='Tab'){
    if(d.style.display==='block'&&acList.length){
      if(e.key==='Enter')e.preventDefault();
      acPick(acIdx>=0?acIdx:0);
    }
  }
}

function acBlur(){
  setTimeout(function(){
    var el=document.getElementById('eCounty');
    if(el){el.readOnly=true;el.value=el.dataset.val||'';}
    acClose();
  },150);
}

function openEdit(){
  if(!contact)return;
  var c=contact;
  var stage=c.funnel_stage||getStageIds()[0]||1;
  document.getElementById('eF').value=c.first_name||'';
  document.getElementById('eL').value=c.last_name||'';
  document.getElementById('eO').value=nm(c.organization_name);
  document.getElementById('eP').value=c.phone||'';
  document.getElementById('eE').value=c.email||'';
  document.getElementById('eT').value=c.customer_type||'';
  document.getElementById('eBd').value=c.birthday?c.birthday.split('T')[0]:'';
  document.getElementById('eAn').value=c.anniversary?c.anniversary.split('T')[0]:'';
  document.getElementById('eN').value=c.notes||'';
  document.getElementById('eCounty').value=c.county||'';
  document.getElementById('eCounty').dataset.val=c.county||'';
  document.getElementById('eStage').value=stage;

  // Assign dropdown
  var aSel=document.getElementById('eA');
  aSel.innerHTML='<option value="">-- Unassigned --</option>';
  allMembers.forEach(function(m){var n=(nm(m.first_name)+' '+nm(m.last_name)).trim()||m.email;aSel.innerHTML+='<option value="'+m.member_id+'"'+(m.member_id===c.assigned_to?' selected':'')+'>'+esc(n)+'</option>';});

  // Stage selector
  var ss=document.getElementById('editStageSelector');
  ss.innerHTML=getStageIds().map(function(s){return'<button type="button" class="stage-option'+(s===stage?' active':'')+'" style="color:'+getStageColor(s)+'" data-stage="'+s+'" onclick="selectStage('+s+')">'+getStageName(s)+'</button>';}).join('');

  document.getElementById('editModal').classList.add('active');
}

function selectStage(s){
  document.getElementById('eStage').value=s;
  document.querySelectorAll('#editStageSelector .stage-option').forEach(function(btn){btn.classList.toggle('active',parseInt(btn.dataset.stage)===s);});
}
function closeEdit(){document.getElementById('editModal').classList.remove('active');}

async function saveEdit(){
  var newStage=parseInt(document.getElementById('eStage').value)||getStageIds()[0];
  var oldStage=contact.funnel_stage;
  var u={
    first_name:document.getElementById('eF').value.trim()||null,
    last_name:document.getElementById('eL').value.trim()||null,
    organization_name:document.getElementById('eO').value.trim()||null,
    phone:document.getElementById('eP').value.trim()||null,
    email:document.getElementById('eE').value.trim()||null,
    customer_type:document.getElementById('eT').value||null,
    assigned_to:document.getElementById('eA').value||null,
    funnel_stage:newStage,
    birthday:document.getElementById('eBd').value||null,
    anniversary:document.getElementById('eAn').value||null,
    notes:document.getElementById('eN').value.trim()||null,
    county:document.getElementById('eCounty').value.trim()||null,
    updated_at:new Date().toISOString()
  };
  var r=await sb.from('contacts').update(u).eq('contact_id',contact.contact_id);
  if(r.error){alert('Error: '+r.error.message);return;}
  Object.assign(contact,u);
  if(oldStage!==newStage){
    /* history row is written by the database trigger (sql/01) */
    await reloadActivity();
  }
  closeEdit();renderProfile();showToast('Saved!');
}

/* ===== AUTH & INIT ===== */
async function checkAuth(){
  var r=await sb.auth.getSession(),s=r.data.session;
  if(!s){var t=localStorage.getItem('sb_access_token'),rf=localStorage.getItem('sb_refresh_token');if(t&&rf){var sr=await sb.auth.setSession({access_token:t,refresh_token:rf});s=sr.data?.session;}if(!s){location.href='v4-login.html';return null;}}
  return s;
}

async function init(){
  var s=await checkAuth();if(!s)return;
  var email=s.user?.email;

  // Get contact ID from URL
  var params=new URLSearchParams(location.search);
  var contactId=params.get('id');
  if(!contactId){document.getElementById('profileWrap').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-secondary);">No contact ID provided. <a href="v4-sharklaw-contacts.html" style="color:var(--accent-light);">Go back</a></div>';return;}

  var TENANT='55555555-5555-5555-5555-555555555555';
  var authId=s?.user?.id;
  var tmRow=null;
  if(authId){var ra=await sb.from('team_members').select('member_id,tenant_id,role,is_active,first_name,last_name').eq('auth_user_id',authId).eq('tenant_id',TENANT).maybeSingle();if(ra.data)tmRow=ra.data;}
  if(!tmRow&&email){var rb=await sb.from('team_members').select('member_id,tenant_id,role,is_active,first_name,last_name').eq('email',email).eq('tenant_id',TENANT).maybeSingle();if(rb.data)tmRow=rb.data;}
  if(tmRow){
    if(tmRow.is_active===false){await sb.auth.signOut();localStorage.clear();location.replace('v4-login.html?reason=deactivated');return;}
    currentTenantId=tmRow.tenant_id;currentUserId=tmRow.member_id;currentUserRole=tmRow.role;
    var userName=(nm(tmRow.first_name)+' '+nm(tmRow.last_name)).trim()||email||'';
    if(document.getElementById('dUserName'))document.getElementById('dUserName').textContent=userName;
    if(document.getElementById('mUserName'))document.getElementById('mUserName').textContent=userName;
  }
  if(!currentTenantId){var r2=await sb.from('business_settings').select('tenant_id').limit(1).single();if(r2.data?.tenant_id)currentTenantId=r2.data.tenant_id;}
  // Load funnel stages
  funnelStages=JSON.parse(JSON.stringify(DEFAULT_STAGES));

  // Load team members
  var mr=await sb.from('team_members').select('member_id,first_name,last_name,email,color').eq('tenant_id',currentTenantId).eq('is_active',true).order('last_name');
  allMembers=mr.data||[];

  // Load contact
  var cr=await sb.from('contacts').select('*').eq('contact_id',contactId).single();
  if(!cr.data){document.getElementById('profileWrap').innerHTML='<div style="text-align:center;padding:60px;color:var(--text-secondary);">Contact not found. <a href="v4-sharklaw-contacts.html" style="color:var(--accent-light);">Go back</a></div>';return;}
  contact=cr.data;

  // Load related data in parallel
  var [apptR,swagR,actR]=await Promise.all([
    sb.from('sales_appointments').select('appointment_id,appointment_date,appointment_time,notes,assigned_to,customer_name').eq('contact_id',contactId).order('appointment_date',{ascending:false}),
    sb.from('swag_given').select('*').eq('contact_id',contactId).eq('tenant_id',TENANT).order('given_date',{ascending:false}),
    Promise.resolve({data:[]})
  ]); // funnel_activity is read separately below
  contactAppts=apptR.data||[];
  contactSwag=swagR.data||[];
  contactActivity=[];
  /* Was disabled with a note blaming RLS. The table has two working
     policies — the real fault was the column names, now fixed. */
  reloadActivity().then(function(){renderProfile();});

  renderProfile();
}

init();

    var m=curMode();
    pop.querySelectorAll('[data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
    pop.querySelectorAll('[data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===(v4?'v4':'legacy'));});
  }
  pop.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('v4-x')){pop.classList.remove('on');return;}
    if(b.dataset.m)setMode(b.dataset.m);
    if(b.dataset.s&&b.dataset.s!==(v4?'v4':'legacy'))setStyle(b.dataset.s);
  });
  document.addEventListener('click',function(e){if(pop.classList.contains('on')&&!pop.contains(e.target)&&!e.target.closest('.v4-gear,.v4h-gear'))pop.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){pop.classList.remove('on');closeSheet();}});
  function gearBtn(extra){var b=document.createElement('button');b.type='button';b.className='v4-gear'+(extra?' '+extra:'');b.title='Display settings';b.setAttribute('aria-label','Display settings');b.innerHTML=GEAR;
    b.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(b);});return b;}
  function placePop(btn){var r=btn.getBoundingClientRect();if(window.innerWidth<=768||r.top>window.innerHeight/2){pop.style.top='';pop.style.right='';return;}
    pop.style.top=Math.round(r.bottom+6)+'px';pop.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';}
  var placed=0;
  ['.desktop-header','.mobile-top-header','.top','.hdr-actions','#mobPickerBar'].forEach(function(sel){
    var box=document.querySelector(sel);if(!box)return;
    if(box.querySelector('.v4-gear'))return;
    var t=box.querySelector('.theme-btn,.theme-toggle-btn,.dark-toggle');
    if(t&&t.parentNode){t.parentNode.insertBefore(gearBtn(),t.nextSibling);placed++;}
    else if(sel==='.hdr-actions'||sel==='#mobPickerBar'||sel==='.top'){box.appendChild(gearBtn());placed++;}
    else if(sel==='.mobile-top-header'){var bar=box.querySelector('.mobile-header-bar,.mob-bar');if(bar){bar.appendChild(gearBtn());placed++;}}
  });
  if(!placed)document.body.appendChild(gearBtn('floating'));
  paint();

  if(!v4)return;   /* everything below is the new look only */

  /* ── standard desktop header: identical to the Overview header on every page,
        so the logo, title and tabs never move when you change page ── */
  var MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var dh=document.querySelector('.desktop-header');
  var oldTop=document.querySelector('.top');
  if(!dh&&oldTop){dh=document.createElement('div');dh.className='desktop-header v4-made';oldTop.parentNode.insertBefore(dh,oldTop);}
  if(dh&&!dh.querySelector('.v4-hdr')){
    var h1=(dh.querySelector('h1')||(oldTop&&oldTop.querySelector('h1')));
    var title=h1?h1.textContent.trim():document.title.split(/[–-]/)[0].trim();
    var hdr=document.createElement('div');hdr.className='v4-hdr';
    var tabs=PAGES.map(function(p){
      var hide=(p.mg&&MGMT.indexOf(role)<0)||(p.n==='Settings'&&role&&['owner','admin'].indexOf(role)<0);
      return '<a href="'+p.f+'" data-label="'+p.n+'"'+(p.mg?' data-mg="1"':'')+(p.n==='Settings'?' data-adm="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+(hide?' style="display:none"':'')+'>'+p.n+'</a>';
    }).join('');
    hdr.innerHTML='<div class="v4h-top"><a class="v4h-logo-a" href="'+(MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html')+'" aria-label="Shark Law home"><img class="v4h-logo" src="'+LOGO+'" alt="Shark Law — Motorcycle Attorneys"></a><div class="v4h-title"></div></div>'
      +'<div class="v4h-row"><nav class="v4h-tabs" aria-label="Main">'+tabs+'</nav><span class="v4h-extra"></span><div class="v4h-right"><span class="v4h-user"></span>'
      +'<button type="button" class="v4h-btn v4h-mode" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"></svg></button>'
      +'<button type="button" class="v4h-btn v4h-gear" aria-label="Display settings" title="Display settings">'+GEAR+'</button>'
      +'<button type="button" class="v4h-out">Logout</button></div></div>';
    hdr.querySelector('.v4h-title').textContent=title;
    dh.appendChild(hdr);
    /* page-specific controls that lived in the old header keep working, now on the tab row */
    var extra=hdr.querySelector('.v4h-extra');
    var vt=document.getElementById('viewToggleWrap');if(vt){vt.style.marginLeft='0';extra.appendChild(vt);}
    dh.querySelectorAll('.hdr-actions .hdr-btn').forEach(function(b){extra.appendChild(b);});
    /* name of the signed-in person, mirrored from the page */
    var src=document.getElementById('dUserName')||document.getElementById('dBizName')||document.getElementById('legacyUser');
    var uEl=hdr.querySelector('.v4h-user');
    function syncUser(){var t=src?src.textContent.trim():'';uEl.textContent=/^loading/i.test(t)?'':t;}
    syncUser();if(src)new MutationObserver(syncUser).observe(src,{childList:true,characterData:true,subtree:true});
    var mb=hdr.querySelector('.v4h-mode');
    function modeIcon(){mb.querySelector('svg').innerHTML=curMode()==='dark'?SUN:MOON;mb.title=curMode()==='dark'?'Switch to light mode':'Switch to dark mode';}
    modeIcon();mb.onclick=function(){setMode(curMode()==='dark'?'light':'dark');modeIcon();};
    new MutationObserver(modeIcon).observe(document.documentElement,{attributes:true,attributeFilter:['data-v4mode','data-theme']});
    var gb=hdr.querySelector('.v4h-gear');
    gb.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(gb);});
    hdr.querySelector('.v4h-out').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  /* ── mobile: logo in the top bar ── */
  var mh=document.querySelector('.mobile-top-header .mobile-header-bar,.mobile-top-header .mob-bar');
  if(mh&&!mh.querySelector('.v4-mlogo')){var im=document.createElement('img');im.className='v4-mlogo';im.src=LOGO;im.alt='Shark Law';mh.insertBefore(im,mh.firstChild);}
  /* ── mobile bottom nav + More sheet ── */
  function navItem(p,label){return'<a href="'+p.f+'"'+(p.mg?' data-mg="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+p.i+'</svg>'+(label||p.n)+'</a>';}
  function byF(f){for(var i=0;i<PAGES.length;i++)if(PAGES[i].f===f)return PAGES[i];}
  var mn=document.createElement('nav');mn.className='v4-mnav';mn.setAttribute('aria-label','Main');
  function buildMnav(){
    var firstP=MGMT.indexOf(role)>=0?byF('v4-sharklaw-overview.html'):byF('v4-sharklaw-dashboard.html');
    var p2=byF('v4-sharklaw-leads.html'),p3=byF('v4-sharklaw-scheduler.html'),p4=byF('v4-sharklaw-contacts.html');
    mn.innerHTML='<div class="v4-mnav-in">'+navItem(firstP)+navItem(p2)+navItem(p3,'Schedule')+navItem(p4)
      +'<button type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button></div>';
    mn.querySelector('button').onclick=openSheet;
  }
  buildMnav();document.body.appendChild(mn);
  var scrim=document.createElement('div');scrim.className='v4-scrim';scrim.onclick=closeSheet;document.body.appendChild(scrim);
  var sheet=document.createElement('div');sheet.className='v4-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','More');
  function buildSheet(){
    sheet.innerHTML='<div class="grab"></div>'+PAGES.filter(function(p){return !p.mg||MGMT.indexOf(role)>=0;}).map(function(p){return navItem(p);}).join('')
      +'<div class="sep"></div><button class="si" type="button" data-act="display"><svg viewBox="0 0 24 24">'+GEAR.replace(/<\/?svg[^>]*>/g,'')+'</svg>Display settings</button>'
      +'<button class="si" type="button" data-act="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</button>';
    sheet.querySelector('[data-act="display"]').onclick=function(e){e.stopPropagation();closeSheet();paint();pop.classList.add('on');};
    sheet.querySelector('[data-act="logout"]').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  buildSheet();document.body.appendChild(sheet);
  function openSheet(){scrim.classList.add('on');sheet.classList.add('on');}
  function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on');}
  window.v4CloseSheet=closeSheet;

  /* ── needs-attention colouring for KPI blocks (red/amber when above zero) ── */
  function alerts(){document.querySelectorAll('[data-v4-alert]').forEach(function(el){
    var v=el.querySelector('.kpi-val,.kpi-value');var t=(v&&v.textContent||'').trim();var n=parseFloat(t.replace(/[^0-9.]/g,''));
    var known=/[0-9]/.test(t);el.classList.toggle('v4-hot',known&&n>0&&el.dataset.v4Alert==='hot');el.classList.toggle('v4-warm',known&&n>0&&el.dataset.v4Alert==='warm');el.classList.toggle('v4-clear',known&&n===0);});}
  alerts();setInterval(alerts,1200);

  /* ── learn the signed-in role once the page has loaded it ── */
  var tries=0;(function poll(){
    var r=(window.currentUserRole||(window.me&&window.me.role)||'');
    if(r){r=String(r).toLowerCase();try{localStorage.setItem('sl-role',r);}catch(e){}
      if(r!==role){role=r;document.querySelectorAll('[data-mg]').forEach(function(el){el.style.display=MGMT.indexOf(role)>=0?'':'none';});
        document.querySelectorAll('.v4-hdr [data-adm]').forEach(function(el){el.style.display=['owner','admin'].indexOf(role)>=0?'':'none';});
        var hl=document.querySelector('.v4h-logo-a');if(hl)hl.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';buildMnav();buildSheet();
        var ll=document.querySelector('.v4-logo-link');if(ll)ll.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';}
      return;}
    if(++tries<40)setTimeout(poll,400);
  })();
})();
</script>
</body>
</html>

<script>
/* Mine/All: one choice shared by every page in this browser tab, Mine by default.
   Only owners, admins and managers see the switch; everyone else is always Mine. */
window.SLScope={ROLES:['owner','admin','manager'],
  can:function(r){return this.ROLES.indexOf(String(r||'').toLowerCase())>=0;},
  get:function(){try{return sessionStorage.getItem('sl-scope')==='all'?'all':'mine';}catch(e){return 'mine';}},
  set:function(m){try{sessionStorage.setItem('sl-scope',m==='all'?'all':'mine');}catch(e){}}};
/* a fresh sign-in starts on Mine */
if(/login\.html$/i.test(location.pathname)){try{sessionStorage.removeItem('sl-scope');}catch(e){}}
</script>
<script>
/* ── SharkLaw V4 style switch ─────────────────────────────────────────
   sl-style: 'legacy' (default until the project goes live) or 'v4'.
   In the v4 style, light/dark is stored separately in 'v4-mode' (light
   by default); the page's own theme code keeps using 'app-theme', and
   this shim quietly redirects it. Logout's localStorage.clear() keeps
   the display settings. */
(function(){
  var LS;try{LS=window.localStorage;}catch(e){return;}
  var P=Storage.prototype,g=P.getItem,s=P.setItem,c=P.clear;
  var st='legacy';try{st=g.call(LS,'sl-style')==='v4'?'v4':'legacy';}catch(e){}
  window.SL_STYLE=st;
  var KEEP=['sl-style','v4-mode','app-theme'];
  P.clear=function(){
    if(this!==LS)return c.call(this);
    var keep={};KEEP.forEach(function(k){var v=g.call(LS,k);if(v!==null)keep[k]=v;});
    c.call(this);Object.keys(keep).forEach(function(k){s.call(LS,k,keep[k]);});
  };
  var m='light';try{m=g.call(LS,'v4-mode')==='dark'?'dark':'light';}catch(e){}
  if(st==='v4'){
    P.getItem=function(k){if(this===LS&&k==='app-theme')return g.call(LS,'v4-mode')==='dark'?'dark':'light';return g.call(this,k);};
    P.setItem=function(k,v){
      if(this===LS&&k==='app-theme'){var md=String(v).indexOf('light')>=0?'light':'dark';s.call(LS,'v4-mode',md);document.documentElement.setAttribute('data-v4mode',md);return;}
      return s.call(this,k,v);
    };
  }
  var h=document.documentElement;h.setAttribute('data-style',st);h.setAttribute('data-v4mode',m);
})();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <title>SharkLaw V2 - Leads</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <script>(function(){var t=localStorage.getItem('app-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="dark"]{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="light"]{--bg-primary:#f4f6fb;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#e8edf6;--border-default:#d3dbe8;--text-primary:#14213a;--text-secondary:#44546c;--accent-primary:#2563eb;--accent-light:#1d4ed8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg-primary);min-height:100%;}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;}
    button,input,select,textarea{font-family:inherit;}
    .theme-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .theme-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;}

    /* headers / nav (same pattern as the other V2 pages) */
    .desktop-header{position:sticky;top:0;z-index:100;background:var(--bg-primary);border-bottom:1px solid var(--border-default);}
    .dnav a{padding:12px 0;text-decoration:none;font-size:14px;color:var(--text-secondary);}
    .dnav a.on{color:var(--accent-primary);border-bottom:2px solid var(--accent-primary);}
    .mobile-top-header{display:none;position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .mobile-header-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:12px;}
    .mobile-menu-toggle{background:transparent;border:none;color:var(--text-secondary);font-size:20px;width:36px;height:36px;cursor:pointer;}
    .mobile-menu-content{max-height:0;overflow:hidden;transition:max-height .3s;background:var(--bg-primary);border-top:1px solid var(--border-default);}
    .mobile-menu-content.expanded{max-height:200px;}
    .mobile-header-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px 12px;}
    .mobile-header-actions button{padding:10px;font-size:13px;background:color-mix(in srgb,var(--accent-primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent-primary) 30%,transparent);color:var(--accent-light);border-radius:8px;cursor:pointer;}
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-secondary);padding:8px;z-index:100;border-top:1px solid var(--border-default);}
    .mobile-nav-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px;}
    .mobile-nav-row:last-child{margin-bottom:0;}
    .mobile-nav-btn{padding:10px 8px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:44px;}
    .mobile-nav-btn.active{background:color-mix(in srgb,var(--accent-primary) 60%,transparent);border-color:var(--accent-primary);color:var(--text-primary);}

    .view-toggle{display:flex;border:1px solid var(--border-default);border-radius:20px;overflow:hidden;background:var(--bg-card);}
    .vt-btn{padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);border-radius:20px;}
    .vt-btn.active{background:var(--accent-primary);color:#fff;}

    /* toolbar + KPIs */
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .toolbar select,.toolbar input{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:13px;}
    .toolbar input{min-width:180px;flex:1 1 200px;max-width:320px;}
    .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:13px;font-weight:600;cursor:pointer;}
    .btn:hover{border-color:var(--accent-primary);}
    .btn-p{background:var(--accent-primary);border-color:var(--accent-primary);color:#fff;}
    .btn-p:hover{filter:brightness(1.1);}
    .btn-d{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.45);color:#f87171;}
    .btn:disabled{opacity:.5;cursor:not-allowed;}
    .kpi-bar{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .kpi-bar::-webkit-scrollbar{display:none;}
    .kpi-pill{padding:6px 14px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border-default);white-space:nowrap;text-align:center;flex-shrink:0;min-width:92px;}
    .kpi-val{font-size:18px;font-weight:700;color:var(--accent-light);}
    .kpi-lbl{font-size:10px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;}
    .main{max-width:1300px;margin:0 auto;padding:16px;}
    .panel{background:var(--bg-card);border:1px solid var(--border-default);border-radius:12px;margin-bottom:14px;overflow:hidden;}
    .panel-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border-default);}
    .panel-t{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);}
    .panel-b{padding:14px 16px;}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

    /* funnel */
    .fn-row{display:grid;grid-template-columns:120px 1fr 92px;gap:10px;align-items:center;margin-bottom:8px;}
    .fn-lbl{font-size:12px;font-weight:600;}
    .fn-track{height:14px;background:var(--bg-hover);border-radius:6px;overflow:hidden;}
    .fn-bar{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:12px;font-weight:700;color:#fff;min-width:28px;transition:width .4s;}
    .fn-pct{font-size:11px;color:var(--text-secondary);text-align:right;}
    .fn-foot{font-size:12px;color:var(--text-secondary);margin-top:6px;}

    /* leaderboard */
    table.lb{width:100%;border-collapse:collapse;font-size:13px;}
    .lb th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);padding:6px 8px;border-bottom:1px solid var(--border-default);}
    .lb td{padding:8px;border-bottom:1px solid color-mix(in srgb,var(--border-default) 50%,transparent);}
    .lb tr.click{cursor:pointer;} .lb tr.click:hover td{background:var(--bg-hover);}
    .lb td.n{text-align:right;font-variant-numeric:tabular-nums;} .lb th.n{text-align:right;}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}

    /* board */
    .board{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;}
    .col{background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:10px;display:flex;flex-direction:column;min-height:120px;max-height:70vh;}
    .col-h{padding:9px 10px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;border-bottom:1px solid var(--border-default);border-top:3px solid;border-radius:10px 10px 0 0;}
    .col-b{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;}
    .col-empty{font-size:11px;color:var(--text-secondary);text-align:center;padding:14px 0;}
    .lc{background:var(--bg-card);border:1px solid var(--border-default);border-left:4px solid;border-radius:8px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;}
    .lc:hover{border-color:var(--accent-primary);}
    .lc-top{display:flex;justify-content:space-between;gap:6px;align-items:baseline;}
    .lc-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lc-no{font-size:10px;color:var(--text-secondary);flex-shrink:0;}
    .lc-sub{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .lc-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--text-secondary);}
    .chip{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:4px;}
    .u-urgent{background:rgba(239,68,68,.2);color:#fca5a5;} .u-high{background:rgba(245,158,11,.2);color:#fcd34d;}
    [data-theme="light"] .u-urgent{color:#b91c1c;} [data-theme="light"] .u-high{color:#92400e;}

    /* my leads list */
    .ml-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
    .ml{background:var(--bg-card);border:1px solid var(--border-default);border-left:4px solid;border-radius:10px;padding:12px;cursor:pointer;}
    .ml:hover{border-color:var(--accent-primary);}
    .steps{display:flex;gap:4px;margin-top:10px;}
    .step{flex:1;height:5px;border-radius:3px;background:var(--bg-hover);}
    .step-lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);margin-top:5px;}
    .empty{text-align:center;padding:36px 16px;color:var(--text-secondary);font-size:14px;}

    /* drawer */
    .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;}
    .scrim.on{display:block;}
    .drawer{position:fixed;top:0;right:-560px;bottom:0;width:100%;max-width:540px;background:var(--bg-secondary);border-left:1px solid var(--border-default);z-index:901;overflow-y:auto;transition:right .25s ease;}
    .drawer.on{right:0;}
    .dr-h{position:sticky;top:0;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:2;}
    .dr-t{font-size:18px;font-weight:700;}
    .dr-s{font-size:12px;color:var(--text-secondary);margin-top:2px;}
    .x{background:transparent;border:none;color:var(--text-secondary);font-size:26px;cursor:pointer;line-height:1;}
    .dr-b{padding:16px 18px 40px;}
    .sec{margin-bottom:18px;}
    .sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin-bottom:8px;}
    .stepper{display:flex;flex-wrap:wrap;gap:6px;}
    .sb{padding:7px 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:default;}
    .sb.can{cursor:pointer;} .sb.can:hover{border-color:currentColor;}
    .sb.cur{color:#fff!important;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
    .f-l{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-secondary);}
    .f-v{font-size:13px;margin-top:1px;word-break:break-word;}
    .f-v.mut{color:var(--text-secondary);font-style:italic;}
    .tl{position:relative;padding-left:16px;}
    .tl:before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:2px;background:var(--border-default);}
    .tl-i{position:relative;margin-bottom:12px;}
    .tl-i:before{content:'';position:absolute;left:-16px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--tl,var(--accent-primary));}
    .tl-txt{font-size:13px;} .tl-meta{font-size:11px;color:var(--text-secondary);margin-top:1px;}
    .tl-note{font-size:12px;background:var(--bg-card);border:1px solid var(--border-default);border-radius:8px;padding:7px 9px;margin-top:4px;white-space:pre-wrap;}

    /* modal / form */
    .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:center;justify-content:center;padding:16px;}
    .modal.on{display:flex;}
    .mbox{background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;}
    .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-default);position:sticky;top:0;background:var(--bg-secondary);}
    .mt{font-size:17px;font-weight:700;}
    .mb{padding:16px 18px;}
    .mf{padding:12px 18px 18px;display:flex;gap:10px;justify-content:flex-end;}
    .fg{margin-bottom:12px;} .fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .fl{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;}
    .fi{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:14px;}
    .fi:focus{outline:none;border-color:var(--accent-primary);}
    textarea.fi{min-height:74px;resize:vertical;}
    .req{color:#ef4444;}
    .msg{font-size:13px;margin-top:6px;}
    .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-primary);color:var(--text-primary);padding:10px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
    .toast.show{opacity:1;}

    @media(max-width:900px){.two-col{grid-template-columns:1fr;}}
    @media(max-width:768px){
      .desktop-header{display:none!important;} .mobile-top-header{display:block;} .mobile-bottom-nav{display:block!important;}
      body{padding-bottom:130px;} .main{padding:12px;}
      .fr,.grid2{grid-template-columns:1fr;}
      .fn-row{grid-template-columns:92px 1fr 70px;}
      .board{grid-template-columns:repeat(6,82vw);scroll-snap-type:x mandatory;} .col{scroll-snap-align:start;}
      .modal{align-items:flex-end;padding:0;} .mbox{border-radius:18px 18px 0 0;}
    }
    @media(min-width:769px){.mobile-top-header{display:none!important;}.mobile-bottom-nav{display:none!important;}}
  /* ── Shared board layout (Pipeline + Leads) ── */
.bx-page{max-width:1280px;margin:0 auto;padding:14px 24px 16px;display:flex;flex-direction:column;gap:12px;}
.bx-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.bx-toolbar .bx-grow{flex:1 1 140px;min-width:120px;}
.bx-toolbar input[type=text],.bx-toolbar select{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font:inherit;font-size:13px;}
.bx-toolbar input[type=text]{width:100%;}
.bx-toolbar select{cursor:pointer;max-width:150px;padding:0 8px;}
.bx-seg{display:inline-flex;border:1px solid var(--border-default);background:var(--bg-card);border-radius:999px;padding:3px;gap:2px;flex-shrink:0;}
.bx-seg button{border:0;background:transparent;color:var(--text-secondary);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.bx-seg button.on,.bx-seg button.active{background:var(--accent-primary);color:#fff;}
.bx-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;user-select:none;white-space:nowrap;padding:0 4px;}
.bx-chk input{width:16px;height:16px;accent-color:var(--accent-primary);}
.bx-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.bx-primary{height:38px;padding:0 16px;border-radius:10px;border:0;background:var(--accent-primary);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:auto;text-decoration:none;display:inline-flex;align-items:center;}
.bx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;}
.bx-kpis .kpi-pill{background:var(--bg-card);border:1px solid var(--border-default);border-radius:12px;padding:12px 14px;min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.bx-kpis .kpi-pill[onclick]{cursor:pointer;}
.bx-kpis .kpi-val{font-size:24px;font-weight:800;line-height:1.1;color:var(--text-primary);}
.bx-kpis .kpi-lbl{font-size:12px;color:var(--text-secondary);line-height:1.3;}
.bx-kpis .kpi-pill.v4-hot .kpi-val{color:#dc2626;}
.bx-kpis .kpi-pill.v4-warm .kpi-val{color:#c2410c;}

/* board */
.bx-board{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;align-items:stretch;min-height:420px;padding-bottom:4px;scrollbar-width:thin;}
.bx-col{flex:1 1 0;min-width:190px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg-card) 55%,transparent);border:1px solid var(--border-default);border-top:4px solid var(--bx-c,#6b7280);border-radius:12px;min-height:0;transition:box-shadow .12s,background .12s;}
.bx-col-h{display:flex;align-items:center;gap:6px;padding:10px 12px 8px;font-size:13px;font-weight:700;color:var(--text-primary);border-bottom:1px solid var(--border-default);}
.bx-col-h .bx-t{flex:1;min-width:0;line-height:1.2;overflow-wrap:anywhere;}
.bx-n{font-size:12px;font-weight:700;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--bg-hover);color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;}
.bx-due{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,#f59e0b 22%,transparent);color:#b45309;white-space:nowrap;}
[data-theme="dark"] .bx-due,html[data-v4mode="dark"] .bx-due{color:#fbbf24;}
.bx-col-b{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px;scrollbar-width:thin;}
.bx-empty{font-size:12px;color:var(--text-secondary);text-align:center;padding:18px 6px;border:1px dashed var(--border-default);border-radius:10px;}
.bx-note{font-size:11px;color:var(--text-secondary);text-align:center;padding:6px;border:1px dashed var(--border-default);border-radius:8px;}

<script>/* ── Shared board helpers (Pipeline + Leads) ──────────────────────────────
   BX.drag(root, {canDrag(card), onDrop(id, stage, card)})
     cards:   [data-drag-id]       drop targets: [data-drop-stage]
     mouse:   press and move 6px to pick up
     touch:   hold 0.35s, then drag (a quick swipe still scrolls)
   After a drag the click that follows is swallowed so cards don't open. */
window.BX = (function () {
  var S = null, swallowClick = false;

  function targetAt(x, y) {
    var el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('[data-drop-stage]') : null;
  }
  function setOver(t) {
    if (S.over === t) return;
    if (S.over) S.over.classList.remove('bx-over');
    S.over = t;
    if (t && t.getAttribute('data-drop-stage') !== S.from) t.classList.add('bx-over');
  }
  function start() {
    var r = S.card.getBoundingClientRect();
    var g = S.card.cloneNode(true);
    g.classList.add('bx-ghost');
    g.removeAttribute('id');
    g.style.width = r.width + 'px';
    g.style.left = r.left + 'px';
    g.style.top = r.top + 'px';
    document.body.appendChild(g);
    S.ghost = g; S.dx = S.x0 - r.left; S.dy = S.y0 - r.top; S.active = true;
    S.card.classList.add('bx-lifted');
    document.documentElement.classList.add('bx-dragging');
    if (navigator.vibrate && S.touch) try { navigator.vibrate(12); } catch (e) {}
    move(S.x0, S.y0);
  }
  function autoScroll(x, y) {
    var t = S.over;
    var board = S.root.querySelector('.bx-board');
    if (board) {
      var br = board.getBoundingClientRect();
      if (x < br.left + 40) board.scrollLeft -= 14;
      else if (x > br.right - 40) board.scrollLeft += 14;
    }
    var body = t && t.querySelector('.bx-col-b');
    if (body) {
      var r = body.getBoundingClientRect();
      if (y < r.top + 36) body.scrollTop -= 12;
      else if (y > r.bottom - 36) body.scrollTop += 12;
    }
    if (y < 60) window.scrollBy(0, -12);
    else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
  }
  function move(x, y) {
    S.x = x; S.y = y;
    S.ghost.style.transform = 'translate(' + (x - S.dx - parseFloat(S.ghost.style.left)) + 'px,' + (y - S.dy - parseFloat(S.ghost.style.top)) + 'px) rotate(1.5deg)';
    setOver(targetAt(x, y));
  }
  function end(drop) {
    if (!S) return;
    clearTimeout(S.timer);
    clearInterval(S.scroller);
    var s = S; S = null;
    document.removeEventListener('pointermove', onMove, true);
    document.removeEventListener('pointerup', onUp, true);
    document.removeEventListener('pointercancel', onCancel, true);
    document.removeEventListener('touchmove', onTouchMove, { capture: true, passive: false });
    document.removeEventListener('keydown', onKey, true);
    if (!s.active) return;
    swallowClick = true; setTimeout(function () { swallowClick = false; }, 350);
    if (s.ghost) s.ghost.remove();
    s.card.classList.remove('bx-lifted');
    document.documentElement.classList.remove('bx-dragging');
    if (s.over) s.over.classList.remove('bx-over');
    var to = drop && s.over ? s.over.getAttribute('data-drop-stage') : null;
    if (to && to !== s.from) s.opt.onDrop(s.card.getAttribute('data-drag-id'), to, s.card, s.from);
  }
  function onMove(e) {
    if (!S || e.pointerId !== S.pid) return;
    if (!S.active) {
      var far = Math.abs(e.clientX - S.x0) + Math.abs(e.clientY - S.y0);
      if (S.touch) { if (far > 10) end(false); return; }  /* finger moved before the hold: let it scroll */
      if (far < 6) return;
      start();
    }
    e.preventDefault();
    move(e.clientX, e.clientY);
  }
  function onTouchMove(e) { if (S && S.active) e.preventDefault(); }
  function onUp(e) { if (S && e.pointerId === S.pid) end(true); }
  function onCancel(e) { if (S && e.pointerId === S.pid) end(!!(S.active && S.touch)); }
  function onKey(e) { if (e.key === 'Escape') end(false); }

  function drag(root, opt) {
    if (root._bx) { root._bx.opt = opt; return; }
    root._bx = { opt: opt };
    root.addEventListener('pointerdown', function (e) {
      if (e.button > 0 || S) return;
      var card = e.target.closest('[data-drag-id]');
      if (!card || !root.contains(card)) return;
      if (e.target.closest('button,a,input,select,textarea')) return;
      var o = root._bx.opt;
      if (o.canDrag && !o.canDrag(card)) return;
      var col = card.closest('[data-drop-stage]');
      S = { root: root, opt: o, card: card, pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
            touch: e.pointerType !== 'mouse', from: col ? col.getAttribute('data-drop-stage') : card.getAttribute('data-stage') };
      if (S.touch) S.timer = setTimeout(function () { if (S && !S.active) start(); }, 350);
      S.scroller = setInterval(function () { if (S && S.active) { autoScroll(S.x, S.y); setOver(targetAt(S.x, S.y)); } }, 30);
      document.addEventListener('pointermove', onMove, true);
      document.addEventListener('pointerup', onUp, true);
      document.addEventListener('pointercancel', onCancel, true);
      document.addEventListener('touchmove', onTouchMove, { capture: true, passive: false });
      document.addEventListener('keydown', onKey, true);
    });
    /* stop the long-press menu / text selection from fighting the drag */
    root.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-drag-id]') && (S || e.pointerType !== 'mouse')) e.preventDefault(); });
    root.addEventListener('click', function (e) { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  }

  /* Fill the rest of the screen with the board so each column scrolls on its own */
  function fit(board) {
    if (!board) return;
    if (window.innerWidth <= 768) { board.style.height = ''; return; }
    var top = board.getBoundingClientRect().top + window.scrollY;
    board.style.height = Math.max(420, window.innerHeight - top - 16) + 'px';
  }
  function hex(c) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c || '') ? c : '#6b7280'; }
  function pref(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  return { drag: drag, fit: fit, hex: hex, pref: pref };
})();
</script>

/* ── helpers ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function stage(k){for(var i=0;i<STAGES.length;i++)if(STAGES[i].k===k)return STAGES[i];return{k:k,n:k||'—',c:'#6b7280'};}
function rank(k){var i=FUNNEL.findIndex(function(s){return s.k===k;});return i<0?0:i+1;}
function mName(id){var m=memberById[id];return m?((m.first_name||'')+' '+(m.last_name||'')).trim()||m.email||'Member':(id?'Former member':'Unassigned');}
function mColor(id){var m=memberById[id];return(m&&m.color)||'#6b7280';}
function fmtPhone(v){var d=String(v||'').replace(/\D/g,'').slice(0,10);if(d.length<=3)return d;if(d.length<=6)return d.slice(0,3)+'-'+d.slice(3);return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);}
function fmtDate(d){if(!d)return'';var x=/^\d{4}-\d{2}-\d{2}$/.test(d)?new Date(d+'T12:00:00'):new Date(d);return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDT(d){if(!d)return'';var x=new Date(d);return x.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+x.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
function days(a,b){return Math.max(0,Math.floor(((b?new Date(b):new Date())-new Date(a))/86400000));}
function ago(d){var n=days(d);return n===0?'today':n===1?'1 day':n+' days';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2400);}
function loadTheme(){var t=localStorage.getItem('app-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t);}
function cycleTheme(){var t=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('app-theme',t);toast(t==='light'?'Light mode':'Dark mode');}
loadTheme();
async function logout(){await sb.auth.signOut();localStorage.clear();location.replace('v4-login.html');}
async function fetchAll(build){
  var out=[],size=1000;
  for(var p=0;p<50;p++){var r=await build().range(p*size,(p+1)*size-1);if(r.error)return{data:out,error:r.error};var rows=r.data||[];out=out.concat(rows);if(rows.length<size)break;}
  return{data:out,error:null};
}

/* ── auth ── */
async function checkAuth(){
  var r=await sb.auth.getSession(),s=r.data.session;
  if(!s){var t=localStorage.getItem('sb_access_token'),rf=localStorage.getItem('sb_refresh_token');if(t&&rf){var sr=await sb.auth.setSession({access_token:t,refresh_token:rf});s=sr.data&&sr.data.session;}if(!s){location.href='v4-login.html';return null;}}
  return s;
}

  var s=await checkAuth();if(!s)return;
  var row=null,authId=s.user&&s.user.id,email=s.user&&s.user.email;
  if(authId){var r1=await sb.from('team_members').select('member_id,role,is_active,first_name,last_name').eq('auth_user_id',authId).eq('tenant_id',TENANT).maybeSingle();if(r1.data)row=r1.data;}

  isMgmt=MGMT.indexOf(me.role)>=0;
  document.getElementById('dUserName').textContent=me.name;
  document.getElementById('mUserName').textContent=me.name;

  var params=new URLSearchParams(location.search);
  scope=isMgmt?(params.get('view')==='all'?'all':params.get('view')==='mine'?'mine':SLScope.get()):'mine';
  if(isMgmt){document.getElementById('viewToggleWrap').style.display='flex';}

  /* members incl. deactivated, so old leads still show who submitted them */
  var mr=await sb.from('team_members').select('member_id,first_name,last_name,email,role,color,is_active').eq('tenant_id',TENANT).order('first_name');
  members=mr.data||[];members.forEach(function(m){memberById[m.member_id]=m;});

  var sel=document.getElementById('fStage');STAGES.forEach(function(s){sel.innerHTML+='<option value="'+s.k+'">'+esc(s.n)+'</option>';});
  var cs=document.getElementById('lCounty');COUNTIES.forEach(function(c){cs.innerHTML+='<option>'+esc(c)+'</option>';});

  document.getElementById('pageWrap').style.display='';

  if(!ok)return;
  initLeadBoard();fillWho();setScope(scope,true);

  if(params.get('new')==='1')openForm();
}

async function loadLeads(){
  var r=await fetchAll(function(){return sb.from('leads').select('*').eq('tenant_id',TENANT).order('created_at',{ascending:false}).order('lead_id');});
  if(r.error){
    var missing=/does not exist|relation|schema cache/i.test(r.error.message||'');
    document.getElementById('main').innerHTML='<div class="empty">'+(missing?'The lead tracker tables are not set up yet.<br>Run <b>sql/01-security-and-history-fixes.sql</b> and then <b>sql/02-lead-tracker.sql</b> in Supabase.':'Could not load leads: '+esc(r.error.message))+'</div>';
    return false;
  }
  leads=r.data||[];
  return true;
}

function fillWho(){
  var w=document.getElementById('fWho');if(!isMgmt)return;
  var ids={};leads.forEach(function(l){ids[l.submitted_by]=1;});
  members.forEach(function(m){if(m.is_active!==false)ids[m.member_id]=1;});

}

function setScope(s,silent){
  scope=isMgmt?s:'mine';
  if(isMgmt)SLScope.set(scope);

/* ── filtering ── */
function inRange(l){
  var v=document.getElementById('fRange').value;if(v==='all')return true;
  var c=new Date(l.created_at),n=new Date();
  if(v==='month')return c.getFullYear()===n.getFullYear()&&c.getMonth()===n.getMonth();
  if(v==='year')return c.getFullYear()===n.getFullYear();
  return days(l.created_at)<=parseInt(v,10);
}
function scoped(){
  return leads.filter(function(l){
    if(scope==='mine'&&l.submitted_by!==me.id)return false;
    if(scope==='all'){var w=document.getElementById('fWho').value;if(w&&l.submitted_by!==w)return false;}
    return inRange(l);
  });
}
function filtered(list){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var st=document.getElementById('fStage').value,u=document.getElementById('fUrg').value;
  var qd=q.replace(/\D/g,'');
  return list.filter(function(l){
    if(st&&l.stage!==st)return false;
    if(u&&l.urgency!==u)return false;
    if(q){
      var hay=[l.client_first_name,l.client_last_name,l.client_email,l.county,l.incident_location,l.incident_type,'#'+l.lead_no,mName(l.submitted_by)].join(' ').toLowerCase();
      var ph=String(l.client_phone||'').replace(/\D/g,'');
      if(hay.indexOf(q)<0&&!(qd.length>=3&&ph.indexOf(qd)>=0))return false;
    }
    return true;
  });
}

/* ── KPIs ── */
function kpis(list){
  var signed=list.filter(function(l){return l.stage==='signed';});
  var declined=list.filter(function(l){return l.stage==='declined';});
  var open=list.length-signed.length-declined.length;
  var closed=signed.length+declined.length;
  var rate=closed?Math.round(signed.length/closed*100):null;
  var dts=signed.filter(function(l){return l.signed_at;}).map(function(l){return days(l.created_at,l.signed_at);});
  var avg=dts.length?Math.round(dts.reduce(function(a,b){return a+b;},0)/dts.length):null;
  var n=new Date(),month=list.filter(function(l){var c=new Date(l.created_at);return c.getFullYear()===n.getFullYear()&&c.getMonth()===n.getMonth();}).length;
  return{total:list.length,open:open,signed:signed.length,declined:declined.length,rate:rate,avg:avg,month:month,
         waiting:list.filter(function(l){return l.stage==='submitted';}).length,
         unassigned:list.filter(function(l){return !l.assigned_to&&l.stage!=='signed'&&l.stage!=='declined';}).length};
}
function funnelHtml(list){
  var tot=list.length;
  if(!tot)return'<div class="empty" style="padding:16px;">No leads in this period</div>';
  var reached=FUNNEL.map(function(s,i){return list.filter(function(l){return (l.furthest_rank||rank(l.stage))>=i+1;}).length;});
  var h='';
  FUNNEL.forEach(function(s,i){
    var n=reached[i],w=Math.max(4,Math.round(n/tot*100));
    var step=i===0?'':(reached[i-1]?Math.round(n/reached[i-1]*100)+'% of prev':'—');
    h+='<div class="fn-row"><div class="fn-lbl"><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:'+s.c+';margin-right:7px;"></span>'+esc(s.n)+'</div><div class="fn-track"><div class="fn-bar" style="width:'+w+'%;background:'+s.c+';"></div></div><div class="fn-pct"><b style="color:var(--text-primary);font-size:13px;">'+n+'</b> '+(i===0?'100%':Math.round(n/tot*100)+'%')+(step?'<br>'+step:'')+'</div></div>';
  });
  var dec=list.filter(function(l){return l.stage==='declined';}).length;
  h+='<div class="fn-foot">Each bar counts leads that reached that stage, including ones later declined. Declined: <b>'+dec+'</b></div>';
  return h;
}

function leaderboardHtml(list){
  var by={};
  list.forEach(function(l){var b=by[l.submitted_by]||(by[l.submitted_by]={id:l.submitted_by,n:0,open:0,signed:0,declined:0,d:[]});b.n++;if(l.stage==='signed'){b.signed++;if(l.signed_at)b.d.push(days(l.created_at,l.signed_at));}else if(l.stage==='declined')b.declined++;else b.open++;});
  var rows=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.signed-a.signed||b.n-a.n;});
  if(!rows.length)return'<div class="empty" style="padding:16px;">No leads in this period</div>';
  return'<table class="lb"><thead><tr><th>Associate</th><th class="n">Leads</th><th class="n">Open</th><th class="n">Signed</th><th class="n">Close</th><th class="n">Avg</th></tr></thead><tbody>'+
    rows.map(function(r){var c=r.signed+r.declined;var avg=r.d.length?Math.round(r.d.reduce(function(a,b){return a+b;},0)/r.d.length)+'d':'—';
      return'<tr class="click" data-who="'+esc(r.id)+'" onclick="pickWho(this.dataset.who)"><td><span class="dot" style="background:'+esc(mColor(r.id))+'"></span>'+esc(mName(r.id))+'</td><td class="n">'+r.n+'</td><td class="n">'+r.open+'</td><td class="n">'+r.signed+'</td><td class="n">'+(c?Math.round(r.signed/c*100)+'%':'—')+'</td><td class="n">'+avg+'</td></tr>';}).join('')+'</tbody></table>';
}
/* ── Leads board (v4 restructure, shared look with Pipeline) ─────────────── */
var leadView=BX.pref('leads-view')==='insights'?'insights':'board',leadTab=BX.pref('leads-tab')||'submitted';
function pill(v,l,title,alert){
  var cls='kpi-pill'+(alert&&+String(v).replace(/[^0-9.]/g,'')>0?(alert==='hot'?' v4-hot':' v4-warm'):'');
  return'<div class="'+cls+'"'+(alert?' data-v4-alert="'+alert+'"':'')+(title?' title="'+esc(title)+'"':'')+'><div class="kpi-val">'+v+'</div><div class="kpi-lbl">'+l+'</div></div>';
}
function renderKpis(list){
  var k=kpis(list);
  var h=pill(k.total,scope==='mine'?'Submitted':'Leads')+pill(k.month,'This Month')+pill(k.open,'Open')+pill(k.signed,'Signed')+pill(k.declined,'Declined')
    +pill(k.rate===null?'—':k.rate+'%','Close Rate','Signed ÷ (Signed + Declined)')+pill(k.avg===null?'—':k.avg+'d','Avg to Sign','Average days from submission to signed');
  if(scope==='all')h+=pill(k.waiting,'Awaiting Review','Submitted and not yet picked up','warm')+pill(k.unassigned,'Unassigned','Open leads with nobody assigned','hot');
  document.getElementById('kpiBar').innerHTML=h;
}
function cardHtml(l){
  var col=BX.hex(mColor(l.submitted_by));
  var sub=l.stage==='declined'&&l.declined_reason?l.declined_reason:([l.incident_type,l.county].filter(Boolean).join(' · ')||'No details');
  var badge=l.urgency&&l.urgency!=='normal'&&l.stage!=='signed'&&l.stage!=='declined'
    ?'<span class="bx-badge u-'+esc(l.urgency)+'">'+esc(l.urgency)+'</span>'
    :'<span class="bx-badge" title="Time in this stage">'+ago(l.stage_changed_at||l.created_at)+'</span>';
  return'<div class="bx-card" style="--bx-m:'+col+';"'+(isMgmt?' data-drag-id="'+esc(l.lead_id)+'"':'')+' data-id="'+esc(l.lead_id)+'" data-stage="'+esc(l.stage)+'" onclick="openDrawer(this.dataset.id)" title="'+(isMgmt?'Click to open · drag to move':'Click to open')+'">'
    +'<div class="bx-top"><span class="bx-name">'+esc(clientName(l))+'</span><span class="bx-ref">#'+esc(l.lead_no)+'</span></div>'
    +'<div class="bx-sub">'+esc(sub)+'</div>'
    +'<div class="bx-foot"><span class="bx-who"><span class="bx-dot" style="background:'+col+'"></span>'+esc(mName(l.submitted_by))+'</span>'+badge+'</div>'
  +'</div>';
}
function clientName(l){return((l.client_first_name||'')+' '+(l.client_last_name||'')).trim()||'Unnamed';}

function render(){
  var base=scoped();
  renderKpis(base);
  var list=filtered(base);
  var main=document.getElementById('main');
  document.getElementById('leadCount').textContent=list.length+' lead'+(list.length!==1?'s':'');
  if(!base.length&&scope==='mine'){
    main.innerHTML='<div class="bx-panel"><div class="bx-panel-b" style="text-align:center;padding:36px 16px;color:var(--text-secondary);">You haven’t submitted any leads'+(document.getElementById('fRange').value==='all'?'':' in this period')+'.<br><br><button class="bx-primary" style="margin:0 auto;" onclick="openForm()">+ Submit your first lead</button></div></div>';
    return;
  }
  if(leadView==='insights'){
    main.innerHTML='<div class="bx-insights">'
      +'<div class="bx-panel"><div class="bx-panel-h"><div class="bx-panel-t">Lead Funnel</div><div class="bx-panel-s">'+base.length+' leads</div></div><div class="bx-panel-b">'+funnelHtml(base)+'</div></div>'
      +'<div class="bx-panel"><div class="bx-panel-h"><div class="bx-panel-t">By Associate</div><div class="bx-panel-s">'+(scope==='all'?'Click a row to filter':'Your leads')+'</div></div><div class="bx-panel-b" style="padding:6px 10px;">'+leaderboardHtml(base)+'</div></div>'
    +'</div>';
    return;
  }
  if(!STAGES.some(function(s){return s.k===leadTab;}))leadTab=STAGES[0].k;
  var tabs='',cols='';
  STAGES.forEach(function(s){
    var cards=list.filter(function(l){return l.stage===s.k;});
    /* urgent first, then longest in stage */
    cards.sort(function(a,b){var u={urgent:0,high:1,normal:2};return((u[a.urgency]||2)-(u[b.urgency]||2))||(new Date(a.stage_changed_at||a.created_at)-new Date(b.stage_changed_at||b.created_at));});
    var hot=cards.filter(function(l){return l.urgency==='urgent'&&s.k!=='signed'&&s.k!=='declined';}).length;
    tabs+='<button class="bx-tab'+(s.k===leadTab?' on':'')+'" style="--bx-c:'+s.c+'" data-drop-stage="'+s.k+'" onclick="setLeadTab(\''+s.k+'\')"><span class="sw" style="background:'+s.c+'"></span>'+esc(s.n)+' <b>'+cards.length+'</b></button>';
    cols+='<div class="bx-col'+(s.k===leadTab?' on':'')+'" style="--bx-c:'+s.c+'" data-drop-stage="'+s.k+'">'
      +'<div class="bx-col-h"><span class="bx-t">'+esc(s.n)+'</span>'+(hot?'<span class="bx-due" style="background:color-mix(in srgb,#dc2626 16%,transparent);color:#b91c1c;">'+hot+' urgent</span>':'')+'<span class="bx-n">'+cards.length+'</span></div>'
      +'<div class="bx-col-b">'+(cards.length?cards.map(cardHtml).join(''):'<div class="bx-empty">'+(isMgmt?'Drop a lead here':'None')+'</div>')+'</div></div>';
  });
  main.innerHTML='<div class="bx-tabs">'+tabs+'</div><div class="bx-board" id="leadBoard">'+cols+'</div>';
  setTimeout(function(){BX.fit(document.getElementById('leadBoard'));},0);
}
function setLeadView(v){leadView=v;BX.pref('leads-view',v);
  document.getElementById('lvBoard').classList.toggle('on',v==='board');
  document.getElementById('lvInsights').classList.toggle('on',v==='insights');render();}
function setLeadTab(k){leadTab=k;BX.pref('leads-tab',k);
  document.querySelectorAll('#main .bx-tab,#main .bx-col').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-drop-stage')===k);});}
function pickWho(id){document.getElementById('fWho').value=id;setLeadView('board');}

/* drag a lead to another stage (management only) */
async function moveLeadTo(id,k){
  if(!isMgmt)return;
  var l=leads.find(function(x){return x.lead_id===id;});if(!l||l.stage===k)return;
  if(k==='declined'){window._dragDeclineId=id;document.getElementById('dReason').value='';document.getElementById('dDetail').value='';document.getElementById('declineModal').classList.add('on');return;}
  var old=l.stage,oldAt=l.stage_changed_at;l.stage=k;l.stage_changed_at=new Date().toISOString();render();
  var r=await sb.from('leads').update({stage:k}).eq('lead_id',id).select('lead_id');
  if(r.error||!r.data||!r.data.length){l.stage=old;l.stage_changed_at=oldAt;render();toast(r.error?'Could not move: '+r.error.message:'You don’t have permission to move this lead');return;}
  toast(clientName(l)+' moved to '+stage(k).n);
  refreshLead(id);
}
function initLeadBoard(){
  BX.drag(document.getElementById('main'),{canDrag:function(){return isMgmt;},onDrop:function(id,to){moveLeadTo(id,to);}});
  window.addEventListener('resize',function(){clearTimeout(window._bxr);window._bxr=setTimeout(function(){BX.fit(document.getElementById('leadBoard'));},120);});
  document.getElementById('lvBoard').classList.toggle('on',leadView==='board');
  document.getElementById('lvInsights').classList.toggle('on',leadView==='insights');
}

/* ── drawer ── */
async function openDrawer(id){
  var l=leads.find(function(x){return x.lead_id===id;});
  if(!l){toast('Lead not found');return;}
  openLeadId=id;
  document.getElementById('scrim').classList.add('on');
  document.getElementById('drawer').classList.add('on');
  drawDrawer(l,null);
  var a=await sb.from('lead_activity').select('*').eq('lead_id',id).order('created_at',{ascending:true});
  if(openLeadId===id)drawDrawer(l,a.error?[]:(a.data||[]));
}
function closeDrawer(){openLeadId=null;document.getElementById('scrim').classList.remove('on');document.getElementById('drawer').classList.remove('on');}

function canEdit(l){return isMgmt||(l.submitted_by===me.id&&l.stage==='submitted');}

function field(lbl,val,full){return'<div'+(full?' style="grid-column:1/-1;"':'')+'><div class="f-l">'+lbl+'</div><div class="f-v'+(val?'':' mut')+'">'+(val||'Not set')+'</div></div>';}

function drawDrawer(l,acts){
  var s=stage(l.stage);
  var h='<div class="dr-h"><div><div class="dr-t">'+esc(clientName(l))+'</div><div class="dr-s">Lead #'+esc(l.lead_no)+' · submitted by '+esc(mName(l.submitted_by))+' · '+esc(fmtDate(l.created_at))+'</div></div><button class="x" onclick="closeDrawer()">&times;</button></div><div class="dr-b">';

  /* stage */
  h+='<div class="sec"><div class="sec-t">Stage · '+(l.stage==='signed'||l.stage==='declined'?'closed '+esc(fmtDate(l.closed_at)):'in stage '+ago(l.stage_changed_at))+'</div><div class="stepper">';
  STAGES.forEach(function(x){
    var cur=x.k===l.stage,can=isMgmt&&!cur;
    var style=(cur?'color:#fff;background:'+x.c+';border-color:'+x.c+';':'color:var(--text-primary);border-left:4px solid '+x.c+';');
    h+='<button class="sb'+(cur?' cur':'')+(can?' can':'')+'" style="'+style+'"'+(can?' data-s="'+x.k+'" onclick="moveStage(this.dataset.s)"':' disabled')+'>'+esc(x.n)+'</button>';
  });
  h+='</div>';
  if(l.stage==='declined'&&l.declined_reason)h+='<div class="tl-note" style="margin-top:8px;">Declined: '+esc(l.declined_reason)+'</div>';
  if(!isMgmt)h+='<div style="font-size:11px;color:var(--text-secondary);margin-top:6px;">Management moves leads through the funnel. You’ll get a message on your dashboard when it changes.</div>';
  h+='</div>';

  /* handler */
  if(isMgmt){
    var opts='<option value="">Unassigned</option>'+members.filter(function(m){return m.is_active!==false&&MGMT.indexOf((m.role||'').toLowerCase())>=0;}).map(function(m){return'<option value="'+esc(m.member_id)+'"'+(m.member_id===l.assigned_to?' selected':'')+'>'+esc(mName(m.member_id))+'</option>';}).join('');
    h+='<div class="sec"><div class="sec-t">Handled by</div><select class="fi" onchange="assignTo(this.value)">'+opts+'</select></div>';
  }else{
    h+='<div class="sec"><div class="sec-t">Handled by</div><div class="f-v'+(l.assigned_to?'':' mut')+'">'+esc(l.assigned_to?mName(l.assigned_to):'Not assigned yet')+'</div></div>';
  }

  /* details */
  var phone=l.client_phone?'<a href="tel:'+esc(l.client_phone)+'" style="color:var(--accent-light);">'+esc(l.client_phone)+'</a>':'';
  var mail=l.client_email?'<a href="mailto:'+esc(l.client_email)+'" style="color:var(--accent-light);">'+esc(l.client_email)+'</a>':'';
  var rc=l.related_contact_id?'<a href="v4-sharklaw-profiles.html?id='+encodeURIComponent(l.related_contact_id)+'" style="color:var(--accent-light);">Open contact</a>':'';
  h+='<div class="sec"><div class="sec-t" style="display:flex;justify-content:space-between;">Details'+(canEdit(l)?'<a style="color:var(--accent-light);cursor:pointer;text-transform:none;letter-spacing:0;" onclick="openForm(openLeadId)">Edit</a>':'')+'</div><div class="grid2">'
    +field('Phone',phone)+field('Email',mail)
    +field('Incident type',esc(l.incident_type))+field('Incident date',esc(fmtDate(l.incident_date)))
    +field('Location',esc(l.incident_location))+field('County',esc(l.county))
    +field('Source',esc(l.source))+field('Urgency',esc(l.urgency))
    +(rc?field('Referred through',rc):'')
    +field('Injuries / what happened',l.injury_summary?'<span style="white-space:pre-wrap;">'+esc(l.injury_summary)+'</span>':'',true)
    +field('Notes',l.notes?'<span style="white-space:pre-wrap;">'+esc(l.notes)+'</span>':'',true)
  +'</div></div>';

  /* add note */
  h+='<div class="sec"><div class="sec-t">Add an update</div><textarea class="fi" id="noteTxt" placeholder="Called client, left voicemail…"></textarea><div style="display:flex;justify-content:flex-end;margin-top:8px;"><button class="btn btn-p" onclick="addNote()">Add update</button></div></div>';

  /* timeline */
  h+='<div class="sec"><div class="sec-t">Lifecycle</div>';
  if(acts===null)h+='<div class="f-v mut">Loading…</div>';
  else if(!acts.length)h+='<div class="f-v mut">No history yet</div>';
  else{
    h+='<div class="tl">'+acts.slice().reverse().map(function(a){
      var txt='',col='var(--accent-primary)';
      if(a.action==='created'){txt='Lead submitted';col=stage('submitted').c;}
      else if(a.action==='stage_change'){var t=stage(a.new_stage);col=t.c;txt='Moved from <b>'+esc(stage(a.old_stage).n)+'</b> to <b style="color:'+t.c+';">'+esc(t.n)+'</b>';}
      else if(a.action==='assigned'){txt=a.note?'Assigned to <b>'+esc(mName(a.note))+'</b>':'Unassigned';col='#14b8a6';}
      else if(a.action==='note'){txt='Update';col='#94a3b8';}
      else txt=esc(a.action);
      var note=(a.action==='note'||(a.action==='stage_change'&&a.note))?'<div class="tl-note">'+esc(a.note)+'</div>':'';
      return'<div class="tl-i" style="--tl:'+col+';"><div class="tl-txt">'+txt+'</div><div class="tl-meta">'+esc(a.actor?mName(a.actor):'System')+' · '+esc(fmtDT(a.created_at))+'</div>'+note+'</div>';
    }).join('')+'</div>';
  }
  h+='</div>';

  if(['owner','admin'].indexOf(me.role)>=0)h+='<div class="sec" style="border-top:1px solid var(--border-default);padding-top:14px;"><button class="btn btn-d" onclick="deleteLead()">Delete lead</button> <span style="font-size:11px;color:var(--text-secondary);margin-left:8px;">Owners and admins only. Removes its history too.</span></div>';
  h+='</div>';
  document.getElementById('drawer').innerHTML=h;
}

async function refreshLead(id){
  var r=await sb.from('leads').select('*').eq('lead_id',id).maybeSingle();
  if(r.data){var i=leads.findIndex(function(x){return x.lead_id===id;});if(i>=0)leads[i]=r.data;else leads.unshift(r.data);}
  render();
  if(openLeadId===id)openDrawer(id);
}

async function moveStage(k){
  if(!isMgmt||!openLeadId)return;
  if(k==='declined'){window._dragDeclineId=null;document.getElementById('dReason').value='';document.getElementById('dDetail').value='';document.getElementById('declineModal').classList.add('on');return;}
  var r=await sb.from('leads').update({stage:k}).eq('lead_id',openLeadId);
  if(r.error){toast('Could not move: '+r.error.message);return;}
  toast('Moved to '+stage(k).n);
  refreshLead(openLeadId);
}
async function confirmDecline(){
  var reason=document.getElementById('dReason').value,det=document.getElementById('dDetail').value.trim();
  if(!reason){toast('Pick a reason');return;}
  var _did=window._dragDeclineId||openLeadId;window._dragDeclineId=null;
  var r=await sb.from('leads').update({stage:'declined',declined_reason:reason+(det?' — '+det:'')}).eq('lead_id',_did);
  if(r.error){toast('Could not decline: '+r.error.message);return;}
  document.getElementById('declineModal').classList.remove('on');
  toast('Lead declined');refreshLead(_did);
}
async function assignTo(id){
  var r=await sb.from('leads').update({assigned_to:id||null}).eq('lead_id',openLeadId);
  if(r.error){toast('Could not assign: '+r.error.message);return;}
  toast(id?'Assigned to '+mName(id):'Unassigned');refreshLead(openLeadId);
}
async function addNote(){
  var t=document.getElementById('noteTxt').value.trim();if(!t)return;
  var l=leads.find(function(x){return x.lead_id===openLeadId;});if(!l)return;
  var r=await sb.from('lead_activity').insert({tenant_id:l.tenant_id,lead_id:l.lead_id,action:'note',note:t,actor:me.id});
  if(r.error){toast('Could not save: '+r.error.message);return;}
  toast('Update added');openDrawer(l.lead_id);
}
async function deleteLead(){
  var l=leads.find(function(x){return x.lead_id===openLeadId;});if(!l)return;
  if(!confirm('Delete lead #'+l.lead_no+' ('+clientName(l)+')? This cannot be undone.'))return;
  var r=await sb.from('leads').delete().eq('lead_id',l.lead_id).select('lead_id');
  if(r.error||!r.data||!r.data.length){toast('Could not delete'+(r.error?': '+r.error.message:''));return;}
  leads=leads.filter(function(x){return x.lead_id!==l.lead_id;});
  closeDrawer();render();toast('Lead deleted');
}

/* ── submit / edit form ── */
var F={lFirst:'client_first_name',lLast:'client_last_name',lPhone:'client_phone',lEmail:'client_email',lType:'incident_type',lDate:'incident_date',lLoc:'incident_location',lCounty:'county',lInjury:'injury_summary',lSource:'source',lUrg:'urgency',lNotes:'notes',lContact:'related_contact_id'};
async function openForm(id){
  editingId=id||null;
  var l=id?leads.find(function(x){return x.lead_id===id;}):null;
  document.getElementById('formTitle').textContent=l?'Edit Lead #'+l.lead_no:'Submit a Lead';
  document.getElementById('formSave').textContent=l?'Save Changes':'Submit Lead';
  Object.keys(F).forEach(function(k){document.getElementById(k).value=l?(l[F[k]]||''):(k==='lUrg'?'normal':'');});
  document.getElementById('lContactQ').value='';
  document.getElementById('formMsg').innerHTML='';
  document.getElementById('formModal').classList.add('on');
  if(!myContacts.length){
    var q=sb.from('contacts').select('contact_id,first_name,last_name,organization_name,assigned_to').eq('tenant_id',TENANT).or('is_deleted.is.null,is_deleted.eq.false').order('first_name').limit(1000);
    if(!isMgmt)q=q.eq('assigned_to',me.id);
    var r=await q;myContacts=r.data||[];
  }
  if(l&&l.related_contact_id){var c=myContacts.find(function(x){return x.contact_id===l.related_contact_id;});document.getElementById('lContactQ').value=c?contactLabel(c):'(linked contact)';}
  setTimeout(function(){document.getElementById('lFirst').focus();},50);
}
function closeForm(){document.getElementById('formModal').classList.remove('on');editingId=null;}
function contactLabel(c){return(((c.first_name||'')+' '+(c.last_name||'')).trim()||'Unnamed')+(c.organization_name?' · '+c.organization_name:'');}
function contactSearch(){
  var q=document.getElementById('lContactQ').value.trim().toLowerCase(),d=document.getElementById('lContactDrop');
  if(!q){document.getElementById('lContact').value='';}
  var list=myContacts.filter(function(c){return !q||contactLabel(c).toLowerCase().indexOf(q)>=0;}).slice(0,12);
  d.innerHTML=list.length?list.map(function(c){return'<div style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border-default);" data-id="'+esc(c.contact_id)+'" onmousedown="pickContact(this.dataset.id)">'+esc(contactLabel(c))+'</div>';}).join(''):'<div style="padding:8px 12px;font-size:12px;color:var(--text-secondary);">No matching contacts</div>';
  d.style.display='block';
}
function pickContact(id){var c=myContacts.find(function(x){return x.contact_id===id;});document.getElementById('lContact').value=id;document.getElementById('lContactQ').value=c?contactLabel(c):'';document.getElementById('lContactDrop').style.display='none';}
document.addEventListener('click',function(e){var d=document.getElementById('lContactDrop');if(d&&e.target.id!=='lContactQ'&&!d.contains(e.target))d.style.display='none';});

async function saveLead(){
  var data={};
  Object.keys(F).forEach(function(k){var v=document.getElementById(k).value.trim();data[F[k]]=v||null;});
  data.urgency=data.urgency||'normal';
  var msg=document.getElementById('formMsg');
  if(!data.client_first_name){msg.innerHTML='<span style="color:#ef4444;">Client first name is required.</span>';return;}
  if(!data.client_phone&&!data.client_email){msg.innerHTML='<span style="color:#ef4444;">Add a phone number or email so management can reach them.</span>';return;}
  var btn=document.getElementById('formSave');btn.disabled=true;
  var r;
  if(editingId){r=await sb.from('leads').update(data).eq('lead_id',editingId).select().maybeSingle();}
  else{data.tenant_id=TENANT;data.submitted_by=me.id;r=await sb.from('leads').insert(data).select().single();}
  btn.disabled=false;
  if(r.error||!r.data){msg.innerHTML='<span style="color:#ef4444;">'+esc(r.error?r.error.message:'You can no longer edit this lead.')+'</span>';return;}
  var id=r.data.lead_id,wasEdit=!!editingId;
  closeForm();
  toast(wasEdit?'Lead updated':'Lead #'+r.data.lead_no+' sent to management');
  if(!wasEdit&&isMgmt===false)scope='mine';
  refreshLead(id);
}

document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeForm();closeDrawer();document.getElementById('declineModal').classList.remove('on');}});
init().catch(function(e){console.error(e);document.getElementById('main').innerHTML='<div class="empty">Something went wrong: '+esc(e.message)+'</div>';});
</script>

    {f:'v4-sharklaw-contacts.html',n:'Contacts',i:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'},
    {f:'v4-sharklaw-pipeline.html',n:'Pipeline',i:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>'},
    {f:'v4-sharklaw-leads.html',n:'Leads',i:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'},
    {f:'v4-sharklaw-swag.html',n:'Swag',i:'<path d="M20.6 13.4 12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.5"/>'},
    {f:'v4-communications.html',n:'Comms',i:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'},
    {f:'v4-sharklaw-settings.html',n:'Settings',i:'<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'}
  ];
  /* the page a tab "belongs" to (profiles live under Contacts, archive under Scheduler) */
  var home=page.indexOf('profiles')>=0?'v4-sharklaw-contacts.html':page.indexOf('archive')>=0?'v4-sharklaw-scheduler.html':page;
  var GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  var v4=window.SL_STYLE==='v4';
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var role=(ls('sl-role')||'').toLowerCase();

  /* ── display panel (gear) ── */
  function curMode(){
    if(v4)return document.documentElement.getAttribute('data-v4mode')==='dark'?'dark':'light';
    var t=document.documentElement.getAttribute('data-theme')||'';return t.indexOf('light')>=0?'light':'dark';
  }
  function setMode(m){
    var h=document.documentElement,cur=h.getAttribute('data-theme')||'';
    var named=cur.indexOf('-')>=0;  /* comms uses dark-blue / blue-light */
    try{localStorage.setItem('app-theme',m);}catch(e){}
    if(v4)h.setAttribute('data-v4mode',m);
    if(cur||!h.hasAttribute('data-theme'))h.setAttribute('data-theme',named?(m==='light'?'blue-light':'dark-blue'):m);
    paint();
  }
  function setStyle(s){try{localStorage.setItem('sl-style',s);}catch(e){}location.reload();}
  var pop=document.createElement('div');pop.className='v4-pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Display settings');
  pop.innerHTML='<button class="v4-x" aria-label="Close">&times;</button><h3>Appearance</h3><div class="v4-seg"><button data-m="light">Light</button><button data-m="dark">Dark</button></div>'
    +'<h3>Style</h3><div class="v4-seg"><button data-s="legacy">Legacy</button><button data-s="v4">New</button></div>'
    +'<p>Testing switch. Legacy is the current SharkLaw look and stays the default until the new style goes live.</p>';
  document.body.appendChild(pop);
  function paint(){
    var m=curMode();
    pop.querySelectorAll('[data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
    pop.querySelectorAll('[data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===(v4?'v4':'legacy'));});
  }
  pop.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('v4-x')){pop.classList.remove('on');return;}
    if(b.dataset.m)setMode(b.dataset.m);
    if(b.dataset.s&&b.dataset.s!==(v4?'v4':'legacy'))setStyle(b.dataset.s);
  });
  document.addEventListener('click',function(e){if(pop.classList.contains('on')&&!pop.contains(e.target)&&!e.target.closest('.v4-gear,.v4h-gear'))pop.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){pop.classList.remove('on');closeSheet();}});
  function gearBtn(extra){var b=document.createElement('button');b.type='button';b.className='v4-gear'+(extra?' '+extra:'');b.title='Display settings';b.setAttribute('aria-label','Display settings');b.innerHTML=GEAR;
    b.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(b);});return b;}
  function placePop(btn){var r=btn.getBoundingClientRect();if(window.innerWidth<=768||r.top>window.innerHeight/2){pop.style.top='';pop.style.right='';return;}
    pop.style.top=Math.round(r.bottom+6)+'px';pop.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';}
  var placed=0;
  ['.desktop-header','.mobile-top-header','.top','.hdr-actions','#mobPickerBar'].forEach(function(sel){
    var box=document.querySelector(sel);if(!box)return;
    if(box.querySelector('.v4-gear'))return;
    var t=box.querySelector('.theme-btn,.theme-toggle-btn,.dark-toggle');
    if(t&&t.parentNode){t.parentNode.insertBefore(gearBtn(),t.nextSibling);placed++;}
    else if(sel==='.hdr-actions'||sel==='#mobPickerBar'||sel==='.top'){box.appendChild(gearBtn());placed++;}
    else if(sel==='.mobile-top-header'){var bar=box.querySelector('.mobile-header-bar,.mob-bar');if(bar){bar.appendChild(gearBtn());placed++;}}
  });
  if(!placed)document.body.appendChild(gearBtn('floating'));
  paint();

  if(!v4)return;   /* everything below is the new look only */

  /* ── standard desktop header: identical to the Overview header on every page,
        so the logo, title and tabs never move when you change page ── */
  var MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var dh=document.querySelector('.desktop-header');
  var oldTop=document.querySelector('.top');
  if(!dh&&oldTop){dh=document.createElement('div');dh.className='desktop-header v4-made';oldTop.parentNode.insertBefore(dh,oldTop);}
  if(dh&&!dh.querySelector('.v4-hdr')){
    var h1=(dh.querySelector('h1')||(oldTop&&oldTop.querySelector('h1')));
    var title=h1?h1.textContent.trim():document.title.split(/[–-]/)[0].trim();
    var hdr=document.createElement('div');hdr.className='v4-hdr';
    var tabs=PAGES.map(function(p){
      var hide=(p.mg&&MGMT.indexOf(role)<0)||(p.n==='Settings'&&ADM.indexOf(role)<0);
      return '<a href="'+p.f+'" data-label="'+p.n+'"'+(p.mg?' data-mg="1"':'')+(p.n==='Settings'?' data-adm="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+(hide?' style="display:none"':'')+'>'+p.n+'</a>';
    }).join('');
    hdr.innerHTML='<div class="v4h-top"><a class="v4h-logo-a" href="'+(MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html')+'" aria-label="Shark Law home"><img class="v4h-logo" src="'+LOGO+'" alt="Shark Law — Motorcycle Attorneys"></a><div class="v4h-title"></div></div>'
      +'<div class="v4h-row"><nav class="v4h-tabs" aria-label="Main">'+tabs+'</nav><span class="v4h-extra"></span><div class="v4h-right"><span class="v4h-user"></span>'
      +'<button type="button" class="v4h-btn v4h-mode" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"></svg></button>'
      +'<button type="button" class="v4h-btn v4h-gear" aria-label="Display settings" title="Display settings">'+GEAR+'</button>'
      +'<button type="button" class="v4h-out">Logout</button></div></div>';
    hdr.querySelector('.v4h-title').textContent=title;
    dh.appendChild(hdr);
    /* page-specific controls that lived in the old header keep working, now on the tab row */
    var extra=hdr.querySelector('.v4h-extra');
    var vt=document.getElementById('viewToggleWrap');
    if(vt){
      vt.style.marginLeft='0';
      /* on phones the tab row is hidden, so Mine/All sits just under the phone header instead */
      var mslot=document.createElement('div');mslot.className='v4-mscope';
      var mt=document.querySelector('.mobile-top-header');if(mt&&mt.parentNode)mt.parentNode.insertBefore(mslot,mt.nextSibling);
      var mq=window.matchMedia('(max-width:768px)');
      var place=function(){(mq.matches&&mslot.parentNode?mslot:extra).appendChild(vt);};
      if(mq.addEventListener)mq.addEventListener('change',place);else if(mq.addListener)mq.addListener(place);
      place();
    }
    dh.querySelectorAll('.hdr-actions .hdr-btn').forEach(function(b){extra.appendChild(b);});
    /* name of the signed-in person, mirrored from the page */
    var src=document.getElementById('dUserName')||document.getElementById('dBizName')||document.getElementById('legacyUser');
    var uEl=hdr.querySelector('.v4h-user');
    function syncUser(){var t=src?src.textContent.trim():'';uEl.textContent=/^loading/i.test(t)?'':t;}
    syncUser();if(src)new MutationObserver(syncUser).observe(src,{childList:true,characterData:true,subtree:true});
    var mb=hdr.querySelector('.v4h-mode');
    function modeIcon(){mb.querySelector('svg').innerHTML=curMode()==='dark'?SUN:MOON;mb.title=curMode()==='dark'?'Switch to light mode':'Switch to dark mode';}
    modeIcon();mb.onclick=function(){setMode(curMode()==='dark'?'light':'dark');modeIcon();};
    new MutationObserver(modeIcon).observe(document.documentElement,{attributes:true,attributeFilter:['data-v4mode','data-theme']});
    var gb=hdr.querySelector('.v4h-gear');
    gb.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(gb);});
    hdr.querySelector('.v4h-out').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  /* ── mobile: logo in the top bar ── */
  var mh=document.querySelector('.mobile-top-header .mobile-header-bar,.mobile-top-header .mob-bar');
  if(mh&&!mh.querySelector('.v4-mlogo')){var im=document.createElement('img');im.className='v4-mlogo';im.src=LOGO;im.alt='Shark Law';mh.insertBefore(im,mh.firstChild);}
  /* ── mobile bottom nav + More sheet ── */
  function navItem(p,label){return'<a href="'+p.f+'"'+(p.mg?' data-mg="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+p.i+'</svg>'+(label||p.n)+'</a>';}
  function byF(f){for(var i=0;i<PAGES.length;i++)if(PAGES[i].f===f)return PAGES[i];}
  var mn=document.createElement('nav');mn.className='v4-mnav';mn.setAttribute('aria-label','Main');
  function buildMnav(){
    var firstP=MGMT.indexOf(role)>=0?byF('v4-sharklaw-overview.html'):byF('v4-sharklaw-dashboard.html');
    var p2=byF('v4-sharklaw-leads.html'),p3=byF('v4-sharklaw-scheduler.html'),p4=byF('v4-sharklaw-contacts.html');
    mn.innerHTML='<div class="v4-mnav-in">'+navItem(firstP)+navItem(p2)+navItem(p3,'Schedule')+navItem(p4)
      +'<button type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button></div>';
    mn.querySelector('button').onclick=openSheet;
  }
  buildMnav();document.body.appendChild(mn);
  var scrim=document.createElement('div');scrim.className='v4-scrim';scrim.onclick=closeSheet;document.body.appendChild(scrim);
  var sheet=document.createElement('div');sheet.className='v4-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','More');
  function buildSheet(){
    sheet.innerHTML='<div class="grab"></div>'+PAGES.filter(function(p){return(!p.mg||MGMT.indexOf(role)>=0)&&(p.n!=='Settings'||ADM.indexOf(role)>=0);}).map(function(p){return navItem(p);}).join('')
      +'<div class="sep"></div><button class="si" type="button" data-act="display"><svg viewBox="0 0 24 24">'+GEAR.replace(/<\/?svg[^>]*>/g,'')+'</svg>Display settings</button>'
      +'<button class="si" type="button" data-act="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</button>';
    sheet.querySelector('[data-act="display"]').onclick=function(e){e.stopPropagation();closeSheet();paint();pop.classList.add('on');};
    sheet.querySelector('[data-act="logout"]').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  buildSheet();document.body.appendChild(sheet);
  function openSheet(){scrim.classList.add('on');sheet.classList.add('on');}
  function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on');}
  window.v4CloseSheet=closeSheet;

  /* ── needs-attention colouring for KPI blocks (red/amber when above zero) ── */
  function alerts(){document.querySelectorAll('[data-v4-alert]').forEach(function(el){
    var v=el.querySelector('.kpi-val,.kpi-value');var t=(v&&v.textContent||'').trim();var n=parseFloat(t.replace(/[^0-9.]/g,''));
    var known=/[0-9]/.test(t);el.classList.toggle('v4-hot',known&&n>0&&el.dataset.v4Alert==='hot');el.classList.toggle('v4-warm',known&&n>0&&el.dataset.v4Alert==='warm');el.classList.toggle('v4-clear',known&&n===0);});}
  alerts();setInterval(alerts,1200);

  /* ── learn the signed-in role once the page has loaded it ── */
  var tries=0;(function poll(){
    var r=(window.currentUserRole||(window.me&&window.me.role)||'');
    if(r){r=String(r).toLowerCase();try{localStorage.setItem('sl-role',r);}catch(e){}
      if(r!==role){role=r;document.querySelectorAll('[data-mg]').forEach(function(el){el.style.display=MGMT.indexOf(role)>=0?'':'none';});
        document.querySelectorAll('.v4-hdr [data-adm]').forEach(function(el){el.style.display=ADM.indexOf(role)>=0?'':'none';});
        var hl=document.querySelector('.v4h-logo-a');if(hl)hl.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';buildMnav();buildSheet();
        var ll=document.querySelector('.v4-logo-link');if(ll)ll.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';}
      return;}
    if(++tries<40)setTimeout(poll,400);
  })();
})();

/* ── Settings is for owners, admins and the superadmin — in every style ──
   Hides every link to it (legacy nav, phone menus, "Manage →" shortcuts) until
   the page has confirmed the signed-in person's role. */
(function(){
  var ADM=['owner','admin','superadmin'],tries=0;
  function role(){return String(window.currentUserRole||(window.me&&window.me.role)||'').toLowerCase();}
  function apply(){var ok=ADM.indexOf(role())>=0;
    document.querySelectorAll('a[href*="sharklaw-settings.html"],button[onclick*="sharklaw-settings.html"],[onclick*="sharklaw-settings.html"]').forEach(function(el){
      if(el.closest('.v4-hdr'))return;el.style.display=ok?'':'none';});}
  apply();
  (function poll(){apply();if(!role()&&++tries<40)setTimeout(poll,400);})();
})();
</script>
</body>
</html>

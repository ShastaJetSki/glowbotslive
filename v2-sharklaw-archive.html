<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Archive – SharkLaw V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-primary:#0b0f14;--bg-secondary:#131c2b;--bg-card:#1a2535;
    --border-default:#2c3d54;--text-primary:#e8eef6;--text-secondary:#9fb0c3;
    --accent-primary:#3b82f6;--accent-light:#60a5fa;
  }
  [data-theme="light"]{
    --bg-primary:#f5f7fa;--bg-secondary:#fff;--bg-card:#fff;
    --border-default:#dde3ea;--text-primary:#16202c;--text-secondary:#5b6b7d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg-primary);color:var(--text-primary);min-height:100vh;line-height:1.5}
  .top{display:flex;align-items:center;gap:14px;padding:14px 18px;
    border-bottom:1px solid var(--border-default);background:var(--bg-secondary);
    position:sticky;top:0;z-index:50;flex-wrap:wrap}
  .back{color:var(--accent-light);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
  h1{font-size:17px;font-weight:700}
  .sub{font-size:12px;color:var(--text-secondary);width:100%}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  input,select{background:var(--bg-card);border:1px solid var(--border-default);
    color:var(--text-primary);border-radius:8px;padding:0 12px;height:40px;font-size:14px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent-primary)}
  #q{flex:1 1 260px;min-width:180px}
  .btn{height:40px;padding:0 18px;border:none;border-radius:8px;font-size:14px;
    font-weight:600;cursor:pointer;background:var(--accent-primary);color:#fff;font-family:inherit}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-ghost{background:transparent;border:1px solid var(--border-default);color:var(--text-primary)}
  .stat{font-size:12px;color:var(--text-secondary);margin-bottom:10px}
  .card{background:var(--bg-card);border:1px solid var(--border-default);border-left:4px solid var(--accent-primary);
    border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .card-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .name{font-size:15px;font-weight:700;flex:1;min-width:0}
  .date{font-size:12.5px;color:var(--text-secondary);font-weight:600;white-space:nowrap}
  .meta{font-size:12.5px;color:var(--text-secondary);margin-top:3px}
  .who{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;
    font-size:11.5px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border-default)}
  .dot{width:8px;height:8px;border-radius:50%}
  .own{font-size:8.5px;opacity:.7;letter-spacing:.05em}
  .restore{float:right;background:transparent;border:1px solid var(--border-default);
    color:var(--text-secondary);border-radius:6px;padding:3px 10px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .restore:hover{border-color:var(--accent-primary);color:var(--accent-light)}
  .empty{text-align:center;padding:50px 20px;color:var(--text-secondary);font-size:14px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;
    padding:11px 20px;font-size:13.5px;transition:transform .22s;z-index:200;box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media(max-width:600px){.wrap{padding:12px}.bar{gap:8px}}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="v2-sharklaw-scheduler.html">&larr; Scheduler</a>
  <h1>Event Archive</h1>
  <div class="sub">Events older than 180 days. Out of the calendar to keep it fast, but kept in full here.</div>
</div>

<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="Search name, location or organization…" autocomplete="off">
    <select id="yr"><option value="">All years</option></select>
    <button class="btn" onclick="search(true)">Search</button>
    <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
  </div>
  <div class="stat" id="stat">Loading…</div>
  <div id="list"></div>
  <div style="text-align:center;margin:18px 0">
    <button class="btn btn-ghost" id="more" onclick="search(false)" style="display:none">Load more</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB_URL='https://wiwbmvmgrutjfbnqhfnb.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd2Jtdm1ncnV0amZibnFoZm5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjY4NzQsImV4cCI6MjA5MDI0Mjg3NH0.puEaHAJijQPSi1ziuYsqTRZnSAALK0tpH1myrLz7dYk';
var sb=supabase.createClient(SB_URL,SB_KEY);
var TENANT='55555555-5555-5555-5555-555555555555';
var PAGE=50;

var members={}, offset=0, total=0, canRestore=false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2400);}
function loadTheme(){var t=localStorage.getItem('app-theme');
  document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}
loadTheme();

function fmtDate(d){
  if(!d)return '';
  var p=String(d).slice(0,10).split('-');
  var dt=new Date(+p[0],+p[1]-1,+p[2]);
  return dt.toLocaleDateString(undefined,{weekday:'short',year:'numeric',month:'short',day:'numeric'});
}
function fmtTime(t){
  if(!t)return '';
  var p=String(t).split(':'),h=+p[0],m=p[1]||'00';
  var ap=h>=12?'PM':'AM';h=h%12||12;
  return h+':'+m+' '+ap;
}

async function checkAuth(){
  var r=await sb.auth.getSession(),s=r.data.session;
  if(!s){
    var t=localStorage.getItem('sb_access_token'),rf=localStorage.getItem('sb_refresh_token');
    if(t&&rf){var sr=await sb.auth.setSession({access_token:t,refresh_token:rf});s=sr.data&&sr.data.session;}
    if(!s){location.href='v2-login.html';return null;}
  }
  return s;
}

async function init(){
  var s=await checkAuth(); if(!s)return;

  var m=await sb.from('team_members').select('member_id,first_name,last_name,color,role')
    .eq('tenant_id',TENANT);
  (m.data||[]).forEach(function(x){members[x.member_id]=x;});

  // only owners and admins may pull an event back into the calendar
  var me=await sb.from('team_members').select('role').eq('auth_user_id',s.user.id).maybeSingle();
  if(!me.data)me=await sb.from('team_members').select('role').eq('email',s.user.email).maybeSingle();
  canRestore=me.data&&['owner','admin'].indexOf(me.data.role)>=0;

  var y=await sb.from('events_archive').select('event_date')
    .eq('tenant_id',TENANT).order('event_date',{ascending:false}).limit(1000);
  var years={};
  (y.data||[]).forEach(function(r){if(r.event_date)years[String(r.event_date).slice(0,4)]=1;});
  var sel=document.getElementById('yr');
  Object.keys(years).sort().reverse().forEach(function(yy){
    sel.innerHTML+='<option value="'+yy+'">'+yy+'</option>';
  });

  search(true);
}

function buildQuery(head){
  var q=sb.from('events_archive')
    .select('event_id,event_name,event_date,event_time,location,organization,notes,event_type',
            head?{count:'exact'}:undefined)
    .eq('tenant_id',TENANT);
  var term=document.getElementById('q').value.trim();
  if(term){
    var t=term.replace(/[,()]/g,' ');
    q=q.or('event_name.ilike.%'+t+'%,location.ilike.%'+t+'%,organization.ilike.%'+t+'%');
  }
  var yr=document.getElementById('yr').value;
  if(yr)q=q.gte('event_date',yr+'-01-01').lte('event_date',yr+'-12-31');
  return q.order('event_date',{ascending:false});
}

async function search(reset){
  if(reset){offset=0;document.getElementById('list').innerHTML='';}
  document.getElementById('stat').textContent='Searching…';

  var r=await buildQuery(reset).range(offset,offset+PAGE-1);
  if(r.error){
    document.getElementById('stat').textContent='Error: '+r.error.message;
    if(String(r.error.message).indexOf('does not exist')>=0)
      document.getElementById('list').innerHTML='<div class="empty">The archive table does not exist yet.<br>Run <b>01-create-archive-tables.sql</b> first.</div>';
    return;
  }
  if(reset&&typeof r.count==='number')total=r.count;

  var rows=r.data||[];
  offset+=rows.length;

  if(!rows.length&&offset===0){
    document.getElementById('list').innerHTML='<div class="empty">Nothing archived yet.<br><span style="font-size:12.5px">Events move here once they are more than 180 days old.</span></div>';
    document.getElementById('stat').textContent='';
    document.getElementById('more').style.display='none';
    return;
  }

  var ids=rows.map(function(x){return x.event_id;});
  var who={};
  if(ids.length){
    var a=await sb.from('event_assignees_archive').select('event_id,member_id,is_owner').in('event_id',ids);
    (a.data||[]).forEach(function(x){
      if(!who[x.event_id])who[x.event_id]=[];
      if(x.is_owner)who[x.event_id].unshift(x.member_id); else who[x.event_id].push(x.member_id);
    });
  }

  document.getElementById('list').insertAdjacentHTML('beforeend',
    rows.map(function(e){return card(e,who[e.event_id]||[]);}).join(''));
  document.getElementById('stat').textContent=
    'Showing '+offset+' of '+total+' archived event'+(total===1?'':'s');
  document.getElementById('more').style.display=offset<total?'':'none';
}

function card(e,ids){
  var col=(ids.length&&members[ids[0]]&&members[ids[0]].color)||'#64748b';
  var people=ids.map(function(id,i){
    var m=members[id];
    var nm=m?((m.first_name||'')+' '+(m.last_name||'')).trim():'Unknown';
    return '<span class="pill"><span class="dot" style="background:'+esc((m&&m.color)||'#64748b')+'"></span>'+
      esc(nm)+(i===0?'<span class="own">OWNER</span>':'')+'</span>';
  }).join('');

  var bits=[];
  if(e.event_time)bits.push(fmtTime(e.event_time));
  if(e.location)bits.push(esc(e.location));
  if(e.organization)bits.push(esc(e.organization));
  if(e.event_type)bits.push(esc(e.event_type));

  return '<div class="card" style="border-left-color:'+esc(col)+'">'+
    (canRestore?'<button class="restore" onclick="restore(\''+esc(e.event_id)+'\',this)">Restore</button>':'')+
    '<div class="card-top"><span class="name">'+esc(e.event_name||'Untitled event')+'</span>'+
    '<span class="date">'+esc(fmtDate(e.event_date))+'</span></div>'+
    (bits.length?'<div class="meta">'+bits.join(' &middot; ')+'</div>':'')+
    (e.notes?'<div class="meta" style="opacity:.85">'+esc(String(e.notes).slice(0,160))+
      (String(e.notes).length>160?'…':'')+'</div>':'')+
    (people?'<div class="who">'+people+'</div>':'')+
    '</div>';
}

async function restore(id,btn){
  if(!confirm('Put this event back on the calendar?'))return;
  btn.disabled=true;btn.textContent='…';
  var r=await sb.rpc('restore_archived_event',{p_event_id:id});
  if(r.error){toast('Could not restore: '+r.error.message);btn.disabled=false;btn.textContent='Restore';return;}
  toast(r.data||'Restored');
  search(true);
}

function clearAll(){
  document.getElementById('q').value='';
  document.getElementById('yr').value='';
  search(true);
}

document.getElementById('q').addEventListener('keydown',function(e){
  if(e.key==='Enter')search(true);
});

init();
</script>
</body>
</html>

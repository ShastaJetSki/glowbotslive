<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Superadmin — Platform Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script>(function(){try{var m=localStorage.getItem('sa-mode')||'light';document.documentElement.setAttribute('data-mode',m);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--navy:#22253d;--accent:#0404f4;--bg:#f4f6fb;--card:#fff;--line:#e3e7f0;--text:#14182b;--muted:#5b6478;--hover:#eef1f8;--ok:#16a34a;--warn:#c2410c;--bad:#dc2626;}
html[data-mode="dark"]{--navy:#0f1120;--accent:#3b45f5;--bg:#0b0d18;--card:#15182a;--line:#262a44;--text:#eef0fa;--muted:#a4abc6;--hover:#1d2138;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;}
a{color:var(--accent);} html[data-mode="dark"] a{color:#a5abff;}
.hdr{background:var(--navy);color:#fff;}
.hdr-in{max-width:1280px;margin:0 auto;padding:14px 24px 0;display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.brand{font-size:20px;font-weight:800;letter-spacing:.2px;}
.brand small{display:block;font-size:12px;font-weight:500;color:#c4cbe0;}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hbtn{height:36px;border-radius:10px;border:1px solid #363a58;background:transparent;color:#fff;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;}
.hbtn:hover{background:rgba(255,255,255,.08);}
.tabs{max-width:1280px;margin:0 auto;padding:6px 24px 0;display:flex;gap:4px;overflow-x:auto;}
.tabs button{background:none;border:0;color:#c4cbe0;font:inherit;font-size:14px;font-weight:500;padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
.tabs button.on{color:#fff;border-bottom-color:#4a55ff;font-weight:600;}
.page{max-width:1280px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:14px;}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
select,input,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;}
textarea{width:100%;min-height:70px;resize:vertical;}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);}
label.f input,label.f select{width:100%;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:86px;}
.k .v{font-size:26px;font-weight:800;line-height:1.1;}
.k .l{font-size:12px;color:var(--muted);margin-top:4px;}
.k .s{font-size:11px;color:var(--muted);margin-top:2px;}
.k.hot .v{color:var(--bad);} .k.warm .v{color:var(--warn);} .k.good .v{color:var(--ok);}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 -4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
.card-t{font-size:16px;font-weight:700;}
.card-s{font-size:12px;color:var(--muted);}
.card-b{padding:14px 16px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.sm{height:30px;padding:0 10px;font-size:12px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--hover);color:var(--muted);}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);}
.pill.warn{background:color-mix(in srgb,#f59e0b 20%,transparent);color:var(--warn);}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:700;}
td{padding:9px 8px;border-bottom:1px solid var(--line);}
td.n,th.n{text-align:right;}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;}
.switch input{width:18px;height:18px;accent-color:var(--accent);}
.steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:13px;}
.steps li{margin:3px 0;}
.note{font-size:12px;color:var(--muted);}
.empty{padding:24px;text-align:center;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;}
.toast.on{opacity:1;}
.gate{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;}
.modal{position:fixed;inset:0;background:rgba(10,12,24,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40;}
.modal.on{display:flex;}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow:auto;border:1px solid var(--line);}
.li-row{display:grid;grid-template-columns:1fr 120px 34px;gap:8px;margin-bottom:8px;}
@media(max-width:800px){.two{grid-template-columns:1fr;}.hdr-in,.tabs,.page{padding-left:14px;padding-right:14px;}.grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <div class="brand">Platform Superadmin<small id="who">Checking access…</small></div>
    <div class="hdr-r">
      <select id="tenantSel" onchange="pickTenant(this.value)" style="display:none;background:transparent;color:#fff;border-color:#363a58;"></select>
      <a class="hbtn" href="v4-sharklaw-settings.html" style="display:inline-flex;align-items:center;text-decoration:none;" title="Client settings (team, stages, reminders)">Client Settings</a>
      <button class="hbtn" onclick="toggleMode()" title="Light / dark">◐</button>
      <button class="hbtn" onclick="signOut()">Logout</button>
    </div>
  </div>
  <div class="tabs" id="tabs" style="display:none;">
    <button data-t="overview" class="on" onclick="setTab('overview')">Overview</button>
    <button data-t="integrations" onclick="setTab('integrations')">Integrations</button>
    <button data-t="billing" onclick="setTab('billing')">Billing</button>
    <button data-t="invoices" onclick="setTab('invoices')">Invoices</button>
  </div>
</div>
<div class="page" id="page"><div class="empty">Loading…</div></div>

<div class="modal" id="invModal"><div class="mbox">
  <div class="card-h"><div class="card-t" id="invTitle">New invoice</div><button class="btn sm" style="margin-left:auto" onclick="closeInv()">Close</button></div>
  <div class="card-b">
    <div class="form">
      <label class="f">Invoice #<input id="iNo"></label>
      <label class="f">Period start<input type="date" id="iStart"></label>
      <label class="f">Period end<input type="date" id="iEnd"></label>
      <label class="f">Due date<input type="date" id="iDue"></label>
    </div>
    <div class="grp" style="margin:14px 0 8px">Line items</div>
    <div id="iLines"></div>
    <button class="btn sm" onclick="addLine()">+ Add line</button>
    <div style="display:flex;justify-content:flex-end;font-size:18px;font-weight:800;margin-top:10px;">Total&nbsp;<span id="iTotal">$0.00</span></div>
    <label class="f" style="margin-top:8px">Notes (shown on the invoice)<textarea id="iNotes"></textarea></label>
    <div id="iMsg" class="note" style="color:var(--bad);margin-top:6px;"></div>
    <div class="bar" style="margin-top:12px;justify-content:flex-end;"><button class="btn" onclick="closeInv()">Cancel</button><button class="btn p" onclick="saveInv()">Save invoice</button></div>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
var SB_URL='https://wiwbmvmgrutjfbnqhfnb.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indpd2Jtdm1ncnV0amZibnFoZm5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2NjY4NzQsImV4cCI6MjA5MDI0Mjg3NH0.puEaHAJijQPSi1ziuYsqTRZnSAALK0tpH1myrLz7dYk';
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var SUPER='glowbotsapp@gmail.com';
var clients=[],cur=null,tab='overview',charges=[],invoices=[],editInv=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){n=+n||0;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function num(n){return (+n||0).toLocaleString('en-US');}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},2600);}
function ago(d){if(!d)return 'never';var s=(Date.now()-new Date(d))/1000;if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function day(s){if(!s)return null;var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);return m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s);}
function fmtDay(s){var d=day(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';}
function toggleMode(){var m=document.documentElement.getAttribute('data-mode')==='dark'?'light':'dark';document.documentElement.setAttribute('data-mode',m);try{localStorage.setItem('sa-mode',m);}catch(e){}}
async function signOut(){await sb.auth.signOut();try{localStorage.removeItem('sb_access_token');localStorage.removeItem('sb_refresh_token');}catch(e){}location.replace('v4-login.html');}
function gate(msg){document.getElementById('page').innerHTML='<div class="gate"><div style="font-size:20px;font-weight:800;margin-bottom:8px;">Superadmin only</div><div class="note" style="font-size:14px;">'+msg+'</div><div style="margin-top:16px;"><a href="v4-login.html">Go to sign in</a></div></div>';document.getElementById('who').textContent='Not signed in as superadmin';}

/* ── access: the page AND the database both check it's you ── */
async function init(){
  var r=await sb.auth.getSession(),s=r.data&&r.data.session;
  if(!s){var t=localStorage.getItem('sb_access_token'),rf=localStorage.getItem('sb_refresh_token');if(t&&rf){var sr=await sb.auth.setSession({access_token:t,refresh_token:rf});s=sr.data&&sr.data.session;}}
  if(!s)return gate('Sign in with the superadmin account to open this page.');
  var email=String(s.user&&s.user.email||'').toLowerCase();
  if(email!==SUPER)return gate('This page is only for the platform owner.');
  var ok=await sb.rpc('sl_is_superadmin');
  if(ok.error)return gate('Run <b>sql/06-comms-and-superadmin.sql</b> in Supabase first. ('+esc(ok.error.message)+')');
  if(ok.data!==true)return gate('Your email must be confirmed in Supabase Auth before this page opens.');
  document.getElementById('who').textContent=email;
  document.getElementById('tabs').style.display='';
  await loadAll();
}
async function loadAll(keep){
  var r=await sb.rpc('sl_superadmin_overview');
  if(r.error){document.getElementById('page').innerHTML='<div class="empty">Could not load: '+esc(r.error.message)+'</div>';return;}
  clients=r.data||[];
  var sel=document.getElementById('tenantSel');
  sel.innerHTML=clients.map(function(c){return '<option value="'+esc(c.tenant_id)+'">'+esc(c.name)+'</option>';}).join('');
  sel.style.display=clients.length>1?'':'none';
  var id=keep&&cur?cur.tenant_id:(clients[0]&&clients[0].tenant_id);
  if(!id){document.getElementById('page').innerHTML='<div class="empty">No clients yet.</div>';return;}
  sel.value=id;await pickTenant(id);
}
async function pickTenant(id){
  cur=clients.find(function(c){return c.tenant_id===id;});
  var a=await Promise.all([
    sb.from('platform_charges').select('*').eq('tenant_id',id).order('created_at'),
    sb.from('platform_invoices').select('*').eq('tenant_id',id).order('issued_at',{ascending:false}).order('created_at',{ascending:false})
  ]);
  charges=a[0].data||[];invoices=a[1].data||[];
  render();
}
function setTab(t){tab=t;document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===t);});render();}
function render(){({overview:renderOverview,integrations:renderIntegrations,billing:renderBilling,invoices:renderInvoices})[tab]();}

/* ── billing state, worked out from the settings + invoices ── */
function billingState(){
  var st=cur.settings||{},today=day(ymd(new Date()));
  var open=invoices.filter(function(i){return i.status==='sent';}).sort(function(a,b){return day(a.due_at)-day(b.due_at);});
  var oldest=open[0],ext=st.extension_until?day(st.extension_until):null;
  var res={label:'Paid up',cls:'ok',detail:st.paid_through?'Paid through '+fmtDay(st.paid_through):'No invoices yet'};
  if(st.subscription_status==='trial')res={label:'Trial',cls:'warn',detail:'Trial account'};
  if(st.subscription_status==='canceled')return{label:'Canceled',cls:'bad',detail:'Subscription canceled'};
  if(st.subscription_status==='suspended')return{label:'Suspended',cls:'bad',detail:'Suspended by you'};
  if(oldest&&oldest.due_at){
    var due=day(oldest.due_at),late=Math.floor((today-due)/86400000),grace=+st.grace_days||0;
    if(late<0)res={label:'Invoice open',cls:'warn',detail:'Due '+fmtDay(oldest.due_at)};
    else if(ext&&ext>=today)res={label:'Extension',cls:'warn',detail:'Extended to '+fmtDay(st.extension_until)};
    else if(late<=grace)res={label:'In grace period',cls:'warn',detail:late+' of '+grace+' grace days used'};
    else res={label:'Past due',cls:'bad',detail:(late-grace)+' days past the grace period'};
  }
  return res;
}
function k(v,l,s,cls){return '<div class="k'+(cls?' '+cls:'')+'"><div class="v">'+v+'</div><div class="l">'+l+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';}
function renderOverview(){
  var c=cur,bs=billingState(),ch=c.comms_by_channel_30d||{};
  document.getElementById('page').innerHTML=
   '<div class="bar"><div style="font-size:22px;font-weight:800;">'+esc(c.name)+'</div><span class="pill '+bs.cls+'">'+bs.label+'</span><span class="note">'+esc(bs.detail)+'</span><button class="btn sm" style="margin-left:auto" onclick="loadAll(true)">Refresh</button></div>'
   +'<div class="grp">Account</div><div class="grid">'
     +k(money((c.settings||{}).monthly_price),'Monthly price')+k(money(c.balance_due),'Balance due',c.open_invoices+' open invoice'+(c.open_invoices==1?'':'s'),+c.balance_due>0?'warm':'')
     +k(c.team_active,'Active users')+k(c.team_signed_in_7d,'Signed in (7 days)','Last sign-in '+ago(c.last_sign_in),c.team_active&&!c.team_signed_in_7d?'hot':'')
     +k(((c.settings||{}).email_enabled?'On':'Off'),'Email (Resend)','',(c.settings||{}).email_enabled?'good':'')+k(((c.settings||{}).sms_enabled?'On':'Off'),'Texts (Twilio)','',(c.settings||{}).sms_enabled?'good':'')
   +'</div><div class="grp">CRM activity</div><div class="grid">'
     +k(num(c.contacts),'Contacts',num(c.contacts_new_month)+' new this month')+k(num(c.partners),'Partners','Confirmed + follow-up')
     +k(num(c.comms_30d),'Communications (30d)',['call','sms','email','note'].map(function(x){return (ch[x]||0)+' '+(x==='sms'?'texts':x+'s');}).join(' · '))
     +k(num(c.events_next_30d),'Events (next 30d)')+k(num(c.appts_month),'Appointments this month')
     +k(num(c.leads_open),'Open leads',num(c.leads_signed_month)+' signed this month · '+num(c.leads_total)+' total')
   +'</div>';
}

function v(id){return document.getElementById(id).value;}
function renderIntegrations(){
  var s=cur.settings||{};
  document.getElementById('page').innerHTML='<div class="two">'
   +'<div class="card"><div class="card-h"><div class="card-t">Email — Resend</div><span class="pill '+(s.email_enabled?'ok':'')+'">'+(s.email_enabled?'On':'Off')+'</span></div><div class="card-b">'
     +'<label class="switch"><input type="checkbox" id="eOn"'+(s.email_enabled?' checked':'')+'> Turn on email sending for this client</label>'
     +'<div class="form" style="margin-top:12px;"><label class="f">From name<input id="eName" value="'+esc(s.email_from_name||'')+'" placeholder="Shark Law"></label><label class="f">From address<input id="eAddr" value="'+esc(s.email_from_address||'')+'" placeholder="team@yourdomain.com"></label><label class="f">Sending domain<input id="eDom" value="'+esc(s.email_domain||'')+'" placeholder="yourdomain.com"></label></div>'
     +'<div class="grp" style="margin-top:14px;">Setup (Phase 2)</div><ol class="steps"><li>Create a Resend account and add + verify the domain (DNS records).</li><li>In Supabase → Edge Functions → Secrets, add <code>RESEND_API_KEY</code>.</li><li>Deploy the <code>send-email</code> function I’ll provide in Phase 2.</li><li>Then turn this switch on — the Comms page starts sending from the app.</li></ol>'
     +'<p class="note">The API key never goes in this page or the database tables — only in Supabase secrets.</p></div></div>'
   +'<div class="card"><div class="card-h"><div class="card-t">Texts &amp; calls — Twilio</div><span class="pill '+(s.sms_enabled?'ok':'')+'">'+(s.sms_enabled?'On':'Off')+'</span></div><div class="card-b">'
     +'<label class="switch"><input type="checkbox" id="sOn"'+(s.sms_enabled?' checked':'')+'> Turn on texting through Twilio</label>'
     +'<div class="form" style="margin-top:12px;"><label class="f">Business number<input id="sNum" value="'+esc(s.sms_from_number||'')+'" placeholder="+15105550123"></label></div>'
     +'<div class="grp" style="margin-top:14px;">Setup (Phase 3)</div><ol class="steps"><li>Twilio account + a local number.</li><li>US carrier registration (A2P 10DLC) — brand + campaign approval.</li><li>Add <code>TWILIO_ACCOUNT_SID</code> / <code>TWILIO_AUTH_TOKEN</code> as Supabase secrets.</li><li>Deploy the text + webhook functions (Phase 3), then switch on.</li></ol>'
     +'<p class="note">Until then, team members text from their own phones and the app logs it.</p></div></div>'
   +'</div><div class="bar" style="justify-content:flex-end;"><button class="btn p" onclick="saveIntegrations()">Save integrations</button></div>';
}
async function saveSettings(up,msg){
  up.updated_at=new Date().toISOString();
  var r=await sb.from('platform_settings').update(up).eq('tenant_id',cur.tenant_id).select();
  if(r.error||!r.data||!r.data.length){toast('Not saved: '+(r.error?r.error.message:'no access'));return false;}
  toast(msg||'Saved');await loadAll(true);return true;
}
function saveIntegrations(){
  var on=document.getElementById('eOn').checked,addr=v('eAddr').trim();
  if(on&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)){toast('Add a valid From address before turning email on');return;}
  saveSettings({email_enabled:on,email_from_name:v('eName').trim()||null,email_from_address:addr||null,email_domain:v('eDom').trim()||null,
    sms_enabled:document.getElementById('sOn').checked,sms_from_number:v('sNum').trim()||null},'Integrations saved');
}

function renderBilling(){
  var s=cur.settings||{},bs=billingState();
  var rec=charges.filter(function(c){return c.active!==false&&c.recurring;}),once=charges.filter(function(c){return c.active!==false&&!c.recurring&&!c.billed_on;});
  var monthly=(+s.monthly_price||0)+rec.reduce(function(a,c){return a+(+c.amount||0);},0);
  document.getElementById('page').innerHTML=
   '<div class="bar"><span class="pill '+bs.cls+'">'+bs.label+'</span><span class="note">'+esc(bs.detail)+'</span></div>'
   +'<div class="card"><div class="card-h"><div class="card-t">Subscription</div><div class="card-s">Next invoice ≈ '+money(monthly)+' / month + '+money(once.reduce(function(a,c){return a+(+c.amount||0);},0))+' one-time</div></div><div class="card-b"><div class="form">'
     +'<label class="f">Client name<input id="bName" value="'+esc(s.client_name||cur.name||'')+'"></label>'
     +'<label class="f">Billing email (invoices go here)<input id="bEmail" value="'+esc(s.billing_email||'')+'" placeholder="owner@client.com"></label>'
     +'<label class="f">Monthly price ($)<input id="bPrice" type="number" min="0" step="0.01" value="'+esc(s.monthly_price||0)+'"></label>'
     +'<label class="f">Billing day (1–28)<input id="bDay" type="number" min="1" max="28" value="'+esc(s.billing_day||1)+'"></label>'
     +'<label class="f">Grace period (days)<input id="bGrace" type="number" min="0" max="90" value="'+esc(s.grace_days==null?7:s.grace_days)+'"></label>'
     +'<label class="f">Status<select id="bStatus">'+['trial','active','past_due','suspended','canceled'].map(function(x){return '<option'+(s.subscription_status===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select></label>'
     +'<label class="f">Paid through<input id="bPaid" type="date" value="'+esc(s.paid_through||'')+'"></label>'
     +'<label class="f">Extension until (overrides grace)<input id="bExt" type="date" value="'+esc(s.extension_until||'')+'"></label>'
     +'<label class="f">Stripe customer ID (Phase 2)<input id="bStripe" value="'+esc(s.stripe_customer_id||'')+'" placeholder="cus_…"></label>'
   +'</div><label class="f" style="margin-top:12px;">Private notes<textarea id="bNotes">'+esc(s.notes||'')+'</textarea></label>'
   +'<div class="bar" style="justify-content:flex-end;margin-top:10px;"><button class="btn p" onclick="saveBilling()">Save billing</button></div></div></div>'
   +'<div class="card"><div class="card-h"><div class="card-t">Add-ons &amp; up-charges</div><div class="card-s">Recurring ones go on every invoice; one-time ones go on the next invoice only</div></div><div class="card-b">'
     +(charges.length?'<table><thead><tr><th>Description</th><th class="n">Amount</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>'+charges.map(function(c){
        var st=c.active===false?'Off':c.billed_on?'Billed':'Pending';
        return '<tr><td>'+esc(c.description)+'</td><td class="n">'+money(c.amount)+'</td><td>'+(c.recurring?'Monthly':'One-time')+'</td><td><span class="pill '+(st==='Pending'?'warn':st==='Billed'?'ok':'')+'">'+st+'</span></td><td class="n">'+(c.active!==false&&!c.billed_on?'<button class="btn sm d" data-id="'+esc(c.charge_id)+'" onclick="stopCharge(this.dataset.id)">Remove</button>':'')+'</td></tr>';}).join('')+'</tbody></table>':'<div class="note">No add-ons yet.</div>')
     +'<div class="form" style="margin-top:12px;grid-template-columns:2fr 1fr 1fr auto;align-items:end;"><label class="f">Description<input id="cDesc" placeholder="Extra user seats, custom report…"></label><label class="f">Amount ($)<input id="cAmt" type="number" step="0.01"></label><label class="f">Type<select id="cRec"><option value="0">One-time</option><option value="1">Monthly</option></select></label><button class="btn" onclick="addCharge()">Add</button></div>'
   +'</div></div>';
}
function saveBilling(){
  var price=parseFloat(v('bPrice')),bd=parseInt(v('bDay'),10),gr=parseInt(v('bGrace'),10);
  if(isNaN(price)||price<0)return toast('Price must be 0 or more');
  if(!(bd>=1&&bd<=28))return toast('Billing day must be 1–28');
  if(!(gr>=0&&gr<=90))return toast('Grace period must be 0–90 days');
  saveSettings({client_name:v('bName').trim()||null,billing_email:v('bEmail').trim()||null,monthly_price:price,billing_day:bd,grace_days:gr,
    subscription_status:v('bStatus'),paid_through:v('bPaid')||null,extension_until:v('bExt')||null,stripe_customer_id:v('bStripe').trim()||null,notes:v('bNotes').trim()||null},'Billing saved');
}
async function addCharge(){
  var d=v('cDesc').trim(),a=parseFloat(v('cAmt'));
  if(!d||isNaN(a))return toast('Add a description and an amount');
  var r=await sb.from('platform_charges').insert({tenant_id:cur.tenant_id,description:d,amount:a,recurring:v('cRec')==='1'});
  if(r.error)return toast(r.error.message);
  toast('Added');pickTenant(cur.tenant_id);
}
async function stopCharge(id){if(!confirm('Remove this add-on?'))return;var r=await sb.from('platform_charges').update({active:false}).eq('charge_id',id);if(r.error)return toast(r.error.message);pickTenant(cur.tenant_id);}

/* ── invoices ── */
function nextNo(){var y=new Date().getFullYear(),max=0;invoices.concat([]).forEach(function(i){var m=/-(\d+)$/.exec(i.invoice_no||'');if(m)max=Math.max(max,+m[1]);});return 'INV-'+y+'-'+String(max+1).padStart(4,'0');}
function nextPeriod(){
  var s=cur.settings||{},bd=+s.billing_day||1,start;
  var last=invoices.filter(function(i){return i.status!=='void'&&i.period_end;}).sort(function(a,b){return day(b.period_end)-day(a.period_end);})[0];
  if(last){start=day(last.period_end);start.setDate(start.getDate()+1);}
  else{var n=new Date();start=new Date(n.getFullYear(),n.getMonth(),bd);if(start<day(ymd(n))&&n.getDate()>bd){/* this month's billing day has passed: bill from it */}}
  var end=new Date(start.getFullYear(),start.getMonth()+1,start.getDate()-1);
  return{start:start,end:end};
}
function renderInvoices(){
  var st=cur.settings||{};
  document.getElementById('page').innerHTML='<div class="card"><div class="card-h"><div class="card-t">Invoices</div><div class="card-s">'+invoices.length+' total · balance due '+money(cur.balance_due)+'</div><button class="btn p sm" style="margin-left:auto" onclick="newInv()">+ New invoice</button></div>'
   +(invoices.length?'<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Period</th><th>Issued</th><th>Due</th><th class="n">Total</th><th>Status</th><th class="n">Actions</th></tr></thead><tbody>'+invoices.map(function(i){
      var cls=i.status==='paid'?'ok':i.status==='sent'?'warn':i.status==='void'?'':'';
      return '<tr><td><b>'+esc(i.invoice_no)+'</b></td><td>'+fmtDay(i.period_start)+' – '+fmtDay(i.period_end)+'</td><td>'+fmtDay(i.issued_at)+'</td><td>'+fmtDay(i.due_at)+'</td><td class="n">'+money(i.total)+'</td><td><span class="pill '+cls+'">'+esc(i.status)+(i.paid_at?' · '+fmtDay(i.paid_at):'')+'</span></td>'
       +'<td class="n" style="white-space:nowrap">'
       +'<button class="btn sm" data-id="'+esc(i.invoice_id)+'" onclick="printInv(this.dataset.id)">View / PDF</button> '
       +(i.status==='draft'?'<button class="btn sm" data-id="'+esc(i.invoice_id)+'" onclick="editInvoice(this.dataset.id)">Edit</button> <button class="btn sm p" data-id="'+esc(i.invoice_id)+'" onclick="sendInv(this.dataset.id)">Send</button> ':'')
       +(i.status==='sent'?'<button class="btn sm" data-id="'+esc(i.invoice_id)+'" onclick="sendInv(this.dataset.id)">Resend</button> <button class="btn sm p" data-id="'+esc(i.invoice_id)+'" onclick="markPaid(this.dataset.id)">Mark paid</button> ':'')
       +(i.status!=='void'&&i.status!=='paid'?'<button class="btn sm d" data-id="'+esc(i.invoice_id)+'" onclick="voidInv(this.dataset.id)">Void</button>':'')
       +'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">No invoices yet — “New invoice” fills in this month’s subscription and any add-ons.</div>')
   +'</div><p class="note">'+(st.email_enabled?'Send emails the invoice through Resend once the Phase 2 function is deployed; until then it opens your mail app with the invoice filled in.':'Send opens your mail app with the invoice filled in (to '+esc(st.billing_email||'the billing email')+'). With Resend + Stripe (Phase 2) it emails automatically with a “Pay now” link.')+'</p>';
}
function lineRow(d,a){return '<div class="li-row"><input class="liD" value="'+esc(d||'')+'" placeholder="Description"><input class="liA" type="number" step="0.01" value="'+(a==null?'':a)+'" placeholder="0.00" oninput="sumInv()"><button class="btn sm d" onclick="this.parentNode.remove();sumInv()">×</button></div>';}
function addLine(){document.getElementById('iLines').insertAdjacentHTML('beforeend',lineRow('',''));}
function sumInv(){var t=0;document.querySelectorAll('#iLines .liA').forEach(function(e){t+=parseFloat(e.value)||0;});document.getElementById('iTotal').textContent=money(t);return t;}
function newInv(){
  var s=cur.settings||{},p=nextPeriod(),lines=[];
  lines.push(['Subscription — '+p.start.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' to '+p.end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),+s.monthly_price||0]);
  charges.filter(function(c){return c.active!==false&&(c.recurring||!c.billed_on);}).forEach(function(c){lines.push([c.description+(c.recurring?' (monthly)':''),+c.amount]);});
  editInv=null;openInvForm({invoice_no:nextNo(),period_start:ymd(p.start),period_end:ymd(p.end),due_at:ymd(p.start),notes:''},lines);
}
function editInvoice(id){var i=invoices.find(function(x){return x.invoice_id===id;});editInv=i;openInvForm(i,(i.line_items||[]).map(function(l){return[l.description,l.amount];}));}
function openInvForm(i,lines){
  document.getElementById('invTitle').textContent=editInv?'Edit '+i.invoice_no:'New invoice';
  document.getElementById('iNo').value=i.invoice_no||'';document.getElementById('iStart').value=i.period_start||'';document.getElementById('iEnd').value=i.period_end||'';document.getElementById('iDue').value=i.due_at||'';
  document.getElementById('iNotes').value=i.notes||'';document.getElementById('iLines').innerHTML=lines.map(function(l){return lineRow(l[0],l[1]);}).join('');document.getElementById('iMsg').textContent='';
  sumInv();document.getElementById('invModal').classList.add('on');
}
function closeInv(){document.getElementById('invModal').classList.remove('on');}
async function saveInv(){
  var items=[];document.querySelectorAll('#iLines .li-row').forEach(function(r){var d=r.querySelector('.liD').value.trim(),a=parseFloat(r.querySelector('.liA').value);if(d||!isNaN(a))items.push({description:d||'Item',amount:isNaN(a)?0:Math.round(a*100)/100});});
  var msg=document.getElementById('iMsg');
  if(!v('iNo').trim())return msg.textContent='Invoice # is required.';
  if(!items.length)return msg.textContent='Add at least one line.';
  if(!v('iDue'))return msg.textContent='Pick a due date.';
  var total=Math.round(items.reduce(function(a,l){return a+l.amount;},0)*100)/100;
  var row={tenant_id:cur.tenant_id,invoice_no:v('iNo').trim(),period_start:v('iStart')||null,period_end:v('iEnd')||null,due_at:v('iDue'),line_items:items,total:total,notes:v('iNotes').trim()||null};
  var r=editInv?await sb.from('platform_invoices').update(row).eq('invoice_id',editInv.invoice_id).select():await sb.from('platform_invoices').insert(Object.assign({status:'draft'},row)).select();
  if(r.error)return msg.textContent=r.error.message;
  /* one-time add-ons are now on an invoice */
  if(!editInv&&r.data&&r.data[0]){var once=charges.filter(function(c){return c.active!==false&&!c.recurring&&!c.billed_on;}).map(function(c){return c.charge_id;});if(once.length)await sb.from('platform_charges').update({billed_on:r.data[0].invoice_id}).in('charge_id',once);}
  closeInv();toast('Invoice saved as draft');await loadAll(true);
}
function invoiceHtml(i){
  var s=cur.settings||{};
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(i.invoice_no)+'</title><style>body{font-family:Outfit,Arial,sans-serif;color:#14182b;max-width:720px;margin:40px auto;padding:0 24px}h1{margin:0;font-size:28px}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:10px;border-bottom:1px solid #e3e7f0;text-align:left}td.n,th.n{text-align:right}.tot td{font-weight:800;font-size:18px;border-bottom:0}.muted{color:#5b6478}.top{display:flex;justify-content:space-between;align-items:flex-start}</style></head><body>'
   +'<div class="top"><div><h1>Invoice</h1><div class="muted">'+esc(i.invoice_no)+'</div></div><div style="text-align:right"><b>Bill to</b><br>'+esc(s.client_name||cur.name)+'<br><span class="muted">'+esc(s.billing_email||'')+'</span></div></div>'
   +'<p class="muted">Issued '+fmtDay(i.issued_at)+' · Due '+fmtDay(i.due_at)+(i.period_start?' · Period '+fmtDay(i.period_start)+' – '+fmtDay(i.period_end):'')+'</p>'
   +'<table><thead><tr><th>Description</th><th class="n">Amount</th></tr></thead><tbody>'+(i.line_items||[]).map(function(l){return '<tr><td>'+esc(l.description)+'</td><td class="n">'+money(l.amount)+'</td></tr>';}).join('')+'<tr class="tot"><td>Total due</td><td class="n">'+money(i.total)+'</td></tr></tbody></table>'
   +(i.pay_url?'<p><a href="'+esc(i.pay_url)+'">Pay online</a></p>':'')+(i.notes?'<p class="muted">'+esc(i.notes)+'</p>':'')+'<p class="muted">Status: '+esc(i.status)+'</p></body></html>';
}
function printInv(id){var i=invoices.find(function(x){return x.invoice_id===id;});var w=window.open('','_blank');if(!w)return toast('Allow pop-ups to view the invoice');w.document.write(invoiceHtml(i));w.document.close();setTimeout(function(){try{w.print();}catch(e){}},400);}
async function sendInv(id){
  var i=invoices.find(function(x){return x.invoice_id===id;}),s=cur.settings||{},to=s.billing_email;
  if(!to){toast('Add a billing email on the Billing tab first');setTab('billing');return;}
  var sent=false;
  if(s.email_enabled){
    try{var r=await sb.functions.invoke('send-invoice',{body:{invoice_id:id}});if(!r.error)sent=true;}catch(e){}
    if(!sent)toast('Resend isn’t deployed yet — opening your mail app instead');
  }
  if(!sent){
    var body='Hi,\n\nYour invoice '+i.invoice_no+' for '+money(i.total)+' is due '+fmtDay(i.due_at)+'.\n\n'+(i.line_items||[]).map(function(l){return '• '+l.description+': '+money(l.amount);}).join('\n')+'\n\nTotal due: '+money(i.total)+(i.pay_url?'\nPay online: '+i.pay_url:'')+'\n\nThank you!';
    location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('Invoice '+i.invoice_no+' — '+money(i.total))+'&body='+encodeURIComponent(body);
  }
  var u=await sb.from('platform_invoices').update({status:'sent',sent_at:new Date().toISOString(),sent_to:to}).eq('invoice_id',id);
  if(u.error)return toast(u.error.message);
  toast('Marked as sent');await loadAll(true);
}
async function markPaid(id){
  var i=invoices.find(function(x){return x.invoice_id===id;});
  if(!confirm('Mark '+i.invoice_no+' ('+money(i.total)+') as paid?'))return;
  var r=await sb.from('platform_invoices').update({status:'paid',paid_at:new Date().toISOString()}).eq('invoice_id',id);
  if(r.error)return toast(r.error.message);
  var s=cur.settings||{},up={};
  if(i.period_end&&(!s.paid_through||day(i.period_end)>day(s.paid_through)))up.paid_through=i.period_end;
  if(s.subscription_status==='past_due')up.subscription_status='active';
  if(Object.keys(up).length)await sb.from('platform_settings').update(up).eq('tenant_id',cur.tenant_id);
  toast('Marked paid');await loadAll(true);
}
async function voidInv(id){
  var i=invoices.find(function(x){return x.invoice_id===id;});
  if(!confirm('Void '+i.invoice_no+'? It stays on record but no longer counts as owed.'))return;
  var r=await sb.from('platform_invoices').update({status:'void'}).eq('invoice_id',id);
  if(r.error)return toast(r.error.message);
  /* one-time add-ons on a voided invoice go back to "pending" */
  await sb.from('platform_charges').update({billed_on:null}).eq('billed_on',id);
  toast('Invoice voided');await loadAll(true);
}
init();
</script>
</body>
</html>

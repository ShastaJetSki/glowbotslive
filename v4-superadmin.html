<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Superadmin — Platform Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script>(function(){try{var m=localStorage.getItem('sa-mode')||'light';document.documentElement.setAttribute('data-mode',m);}catch(e){}})();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--navy:#22253d;--accent:#0404f4;--bg:#f4f6fb;--card:#fff;--line:#e3e7f0;--text:#14182b;--muted:#5b6478;--hover:#eef1f8;--ok:#16a34a;--warn:#c2410c;--bad:#dc2626;}
html[data-mode="dark"]{--navy:#0f1120;--accent:#3b45f5;--bg:#0b0d18;--card:#15182a;--line:#262a44;--text:#eef0fa;--muted:#a4abc6;--hover:#1d2138;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;}
a{color:var(--accent);} html[data-mode="dark"] a{color:#a5abff;}
.hdr{background:var(--navy);color:#fff;}
.hdr-in{max-width:1280px;margin:0 auto;padding:14px 24px 0;display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.brand{font-size:20px;font-weight:800;letter-spacing:.2px;}
.brand small{display:block;font-size:12px;font-weight:500;color:#c4cbe0;}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.hbtn{height:36px;border-radius:10px;border:1px solid #363a58;background:transparent;color:#fff;padding:0 12px;font:inherit;font-size:13px;cursor:pointer;}
.hbtn:hover{background:rgba(255,255,255,.08);}
.tabs{max-width:1280px;margin:0 auto;padding:6px 24px 0;display:flex;gap:4px;overflow-x:auto;}
.tabs button{background:none;border:0;color:#c4cbe0;font:inherit;font-size:14px;font-weight:500;padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;}
.tabs button.on{color:#fff;border-bottom-color:#4a55ff;font-weight:600;}
.page{max-width:1280px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:14px;}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
select,input,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;}
textarea{width:100%;min-height:70px;resize:vertical;}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);}
label.f input,label.f select{width:100%;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-height:86px;}
.k .v{font-size:26px;font-weight:800;line-height:1.1;}
.k .l{font-size:12px;color:var(--muted);margin-top:4px;}
.k .s{font-size:11px;color:var(--muted);margin-top:2px;}
.k.hot .v{color:var(--bad);} .k.warm .v{color:var(--warn);} .k.good .v{color:var(--ok);}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 -4px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);}
.card-t{font-size:16px;font-weight:700;}
.card-s{font-size:12px;color:var(--muted);}
.card-b{padding:14px 16px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
.btn{height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;}
.btn:hover{border-color:var(--accent);}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.d{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.sm{height:30px;padding:0 10px;font-size:12px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--hover);color:var(--muted);}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);}
.pill.warn{background:color-mix(in srgb,#f59e0b 20%,transparent);color:var(--warn);}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-weight:700;}
td{padding:9px 8px;border-bottom:1px solid var(--line);}
td.n,th.n{text-align:right;}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;}
.switch input{width:18px;height:18px;accent-color:var(--accent);}
.steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:13px;}
.steps li{margin:3px 0;}
.note{font-size:12px;color:var(--muted);}
.empty{padding:24px;text-align:center;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;}
.toast.on{opacity:1;}
.gate{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;}
.modal{position:fixed;inset:0;background:rgba(10,12,24,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:40;}
.modal.on{display:flex;}
.mbox{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow:auto;border:1px solid var(--line);}
.li-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--bg);}
@media(max-width:800px){.two{grid-template-columns:1fr;}.hdr-in,.tabs,.page{padding-left:14px;padding-right:14px;}.grid{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-in">
    <div class="brand">Platform Superadmin<small id="who">Checking access…</small></div>
    <div class="hdr-r">
      <select id="tenantSel" onchange="pickTenant(this.value)" style="display:none;background:transparent;color:#fff;border-color:#363a58;"></select>
      <a class="hbtn" href="v4-sharklaw-settings.html" style="display:inline-flex;align-items:center;text-decoration:none;" title="Client settings (team, stages, reminders)">Client Settings</a>
      <button class="hbtn" onclick="toggleMode()" title="Light / dark">◐</button>
      <button class="hbtn" onclick="signOut()">Logout</button>
    </div>
  </div>
  <div class="tabs" id="tabs" style="display:none;">
    <button data-t="overview" class="on" onclick="setTab('overview')">Overview</button>
    <button data-t="integrations" onclick="setTab('integrations')">Integrations</button>
    <button data-t="billing" onclick="setTab('billing')">Billing</button>
    <button data-t="invoices" onclick="setTab('invoices')">Invoices</button>
  </div>
</div>
<div class="page" id="page"><div class="empty">Loading…</div></div>

<div class="modal" id="invModal"><div class="mbox" style="max-width:760px">
  <div class="card-h" style="position:sticky;top:0;background:var(--card);z-index:2"><div class="card-t" id="invTitle">New invoice</div><button class="btn sm" style="margin-left:auto" onclick="previewForm()">Preview</button><button class="btn sm" onclick="closeInv()">Close</button></div>
  <div class="card-b">
    <div class="form">
      <label class="f">Invoice #<input id="iNo"></label>
      <label class="f">Type<select id="iKind" onchange="document.getElementById('iPay').value=this.value==='monthly'?'card':'all'"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="custom">Custom</option></select></label>
      <label class="f">Payment options<select id="iPay"><option value="card">Card only</option><option value="all">Card, check or Zelle</option></select></label>
      <label class="f">Invoice date<input type="date" id="iDate"></label>
      <label class="f">Due date<input type="date" id="iDue" onchange="dueChanged()"></label>
      <label class="f">Send on (email date)<input type="date" id="iSendOn"></label>
      <label class="f">Next invoice date<input type="date" id="iNext"></label>
      <label class="f">Period start<input type="date" id="iStart"></label>
      <label class="f">Period end<input type="date" id="iEnd"></label>
    </div>
    <div class="grp" style="margin:16px 0 8px">Services</div>
    <div id="iLines"></div>
    <button class="btn sm" onclick="addLine()">+ Add service line</button>
    <div style="display:flex;justify-content:flex-end;font-size:20px;font-weight:800;margin-top:10px;">Total due&nbsp;<span id="iTotal">$0.00</span></div>
    <label class="f" style="margin-top:8px">Extra note on the invoice (optional)<textarea id="iNotes"></textarea></label>
    <div id="iMsg" class="note" style="color:var(--bad);margin-top:6px;"></div>
    <div class="bar" style="margin-top:12px;justify-content:flex-end;"><button class="btn" onclick="closeInv()">Cancel</button><button class="btn" onclick="previewForm()">Preview</button><button class="btn p" onclick="saveInv()">Save</button></div>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>/* GlowBots invoice — one template for the app preview / PDF and the email.
   Table layout + inline styles so Gmail, Outlook and Apple Mail all show it the same.
   renderInvoice(inv, profile, opts)
     inv:     platform_invoices row  { invoice_no, issued_at, due_at, next_invoice_date, line_items[], total, pay_url, status }
              line_items[i] = { title, description, features[], period_label, period_note, amount }
     profile: platform_settings.invoice_profile (from / bill-to / payment options / terms)
     opts:    { assets: { header, footer, logo, zelle }, forEmail: bool, clientName } */
(function (root) {
  var PINK = '#ff2e88', TEAL = '#14c3c3', INK = '#14182b', MUTED = '#4b5563', LINE = '#d9dde5';
  var COND = "'Oswald','Arial Narrow','Helvetica Neue',Arial,sans-serif";
  var BODY = "'Helvetica Neue',Arial,sans-serif";

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function money(n) { n = +n || 0; return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function day(s) { if (!s) return null; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(s); }
  function longDate(s) { var d = day(s); return d ? d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '—'; }

  function label(txt, color) {
    return '<div style="font-family:' + COND + ';font-size:20px;font-weight:600;letter-spacing:.5px;color:' + color + ';text-transform:uppercase;">' + esc(txt) + '</div>'
      + '<div style="width:74px;height:3px;background:' + color + ';margin:8px 0 18px;"></div>';
  }
  function icon(glyph, bg, size) {
    size = size || 46;
    return '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr><td style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + bg + ';text-align:center;vertical-align:middle;font-size:' + Math.round(size * .46) + 'px;line-height:' + size + 'px;color:#fff;">' + glyph + '</td></tr></table>';
  }
  function contactRow(glyph, color, text) {
    return '<tr><td style="width:34px;padding:7px 0;font-size:18px;color:' + color + ';vertical-align:top;">' + glyph + '</td><td style="padding:7px 0;font-family:' + BODY + ';font-size:15px;color:' + INK + ';line-height:1.5;">' + text + '</td></tr>';
  }

  function renderInvoice(inv, p, opts) {
    p = p || {}; opts = opts || {}; var A = opts.assets || {};
    var items = (inv.line_items || []).map(function (l) { return typeof l === 'object' ? l : { title: String(l) }; });
    var total = inv.total != null ? +inv.total : items.reduce(function (a, l) { return a + (+l.amount || 0); }, 0);
    var clientName = p.bill_name || opts.clientName || 'Client';

    var head =
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;background:#000;">'
      + '<tr><td style="width:62%;padding:0;vertical-align:top;">' + (A.header ? '<img src="' + esc(A.header) + '" alt="GlowBots — Automate. Elevate. Glow." width="430" style="display:block;width:100%;max-width:430px;height:auto;border:0;">' : '<div style="font-family:' + COND + ';font-size:64px;font-weight:700;padding:40px;color:' + PINK + ';">GLOW<span style="color:' + TEAL + '">BOTS</span></div>') + '</td>'
      + '<td style="padding:26px 22px 18px 6px;vertical-align:top;">'
      + '<div style="font-family:' + COND + ';font-size:52px;font-weight:700;letter-spacing:3px;color:#fff;line-height:1;margin-bottom:16px;">INVOICE</div>'
      + '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-family:' + COND + ';font-size:15px;">'
      + [['INVOICE #:', inv.invoice_no, TEAL], ['INVOICE DATE:', longDate(inv.issued_at), TEAL], ['DUE DATE:', longDate(inv.due_at), PINK], ['NEXT INVOICE:', inv.next_invoice_date ? longDate(inv.next_invoice_date) : '—', TEAL]]
        .map(function (r) { return '<tr><td style="color:#fff;padding:5px 12px 5px 0;white-space:nowrap;">' + r[0] + '</td><td style="color:' + r[2] + ';font-weight:600;padding:5px 0;white-space:nowrap;">' + esc(r[1]) + '</td></tr>'; }).join('')
      + '</table></td></tr></table>';

    var parties =
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">'
      + '<tr><td style="width:38%;padding:8px 18px 16px 0;vertical-align:top;border-right:1px solid ' + LINE + ';">'
      + label('From', PINK)
      + '<div style="font-family:' + COND + ';font-size:22px;color:' + INK + ';margin-bottom:12px;">' + esc(p.from_name || 'GlowBots') + '</div>'
      + '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">'
      + (p.from_phone ? contactRow('&#9990;', PINK, esc(p.from_phone)) : '')
      + (p.from_email ? contactRow('&#9993;', PINK, esc(p.from_email)) : '')
      + (p.from_web ? contactRow('&#127760;', PINK, esc(p.from_web)) : '')
      + '</table></td>'
      + '<td style="padding:8px 0 16px 20px;vertical-align:top;">'
      + '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr><td style="vertical-align:top;">'
      + label('Bill To', TEAL)
      + '<div style="font-family:' + COND + ';font-size:22px;color:' + INK + ';margin-bottom:12px;">' + esc(clientName) + '</div>'
      + '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">'
      + (p.bill_phone ? contactRow('&#9990;', '#1d4ed8', esc(p.bill_phone)) : '')
      + ((p.bill_address1 || p.bill_address2) ? contactRow('&#128205;', '#1d4ed8', esc(p.bill_address1 || '') + (p.bill_address2 ? '<br>' + esc(p.bill_address2) : '')) : '')
      + '</table></td>'
      + (A.logo ? '<td style="width:130px;vertical-align:middle;text-align:right;padding-top:40px;"><img src="' + esc(A.logo) + '" alt="' + esc(clientName) + '" width="130" style="display:block;width:130px;height:auto;border:0;margin-left:auto;"></td>' : '')
      + '</tr></table></td></tr></table>';

    var rows = items.map(function (l) {
      var feats = (l.features || []).filter(Boolean);
      return '<tr>'
        + '<td style="padding:18px 16px;vertical-align:top;border-right:1px solid ' + LINE + ';">'
        + '<div style="font-family:' + COND + ';font-size:17px;font-weight:600;color:' + INK + ';margin-bottom:6px;">' + esc(l.title || 'Service') + '</div>'
        + (l.description ? '<div style="font-family:' + BODY + ';font-size:13.5px;color:' + MUTED + ';line-height:1.55;">' + esc(l.description) + '</div>' : '')
        + (feats.length ? '<div style="font-family:' + BODY + ';font-size:13.5px;font-weight:700;color:' + INK + ';margin-top:10px;">Features added.</div><ol style="margin:4px 0 0;padding-left:20px;font-family:' + BODY + ';font-size:13.5px;color:' + INK + ';line-height:1.6;">' + feats.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ol>' : '')
        + '</td>'
        + '<td style="padding:18px 12px;vertical-align:top;text-align:center;border-right:1px solid ' + LINE + ';"><div style="font-family:' + COND + ';font-size:16px;font-weight:600;color:' + INK + ';padding-top:24px;">' + esc(l.period_label || '') + '</div>' + (l.period_note ? '<div style="font-family:' + BODY + ';font-size:13px;color:' + MUTED + ';margin-top:4px;">' + esc(l.period_note) + '</div>' : '') + '</td>'
        + '<td style="padding:18px 16px;vertical-align:top;text-align:center;"><div style="font-family:' + COND + ';font-size:17px;font-weight:600;color:' + INK + ';padding-top:24px;">' + money(l.amount) + '</div></td>'
        + '</tr>';
    }).join('');

    var services =
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-top:6px;"><tr>'
      + '<td style="width:60px;vertical-align:middle;">' + icon('&#9881;', PINK, 54) + '</td>'
      + '<td style="vertical-align:middle;padding-left:12px;"><div style="font-family:' + COND + ';font-size:22px;font-weight:600;color:' + TEAL + ';text-transform:uppercase;">Services Rendered</div>'
      + '<div style="font-family:' + BODY + ';font-size:14px;color:' + INK + ';margin-top:2px;">' + esc(p.services_blurb || ('Professional CRM services and ongoing support for ' + clientName + '.')) + '</div></td></tr></table>'
      + '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-top:16px;border:1px solid ' + LINE + ';">'
      + '<tr style="background:' + PINK + ';background-image:linear-gradient(90deg,' + PINK + ' 0%,#2a1430 45%,#0e3c45 70%,' + TEAL + ' 100%);">'
      + ['Description', 'Service Period', 'Amount'].map(function (h, i) { return '<td style="padding:13px 12px;text-align:center;font-family:' + COND + ';font-size:17px;font-weight:600;color:#fff;letter-spacing:.5px;text-transform:uppercase;' + (i === 0 ? 'width:46%;' : i === 1 ? 'width:30%;' : '') + '">' + h + '</td>'; }).join('')
      + '</tr>' + rows
      + '<tr><td style="border-top:1px solid ' + LINE + ';"></td><td style="border-top:1px solid ' + LINE + ';border-left:1px solid ' + LINE + ';padding:12px 16px;font-family:' + COND + ';font-size:16px;font-weight:600;color:' + INK + ';">SUBTOTAL</td><td style="border-top:1px solid ' + LINE + ';border-left:1px solid ' + LINE + ';padding:12px 16px;text-align:right;font-family:' + COND + ';font-size:16px;font-weight:600;color:' + INK + ';">' + money(total) + '</td></tr>'
      + '<tr><td></td><td style="background:#0d3a44;padding:14px 16px;font-family:' + COND + ';font-size:21px;font-weight:600;color:#fff;">TOTAL DUE</td><td style="background:' + TEAL + ';padding:14px 16px;text-align:right;font-family:' + COND + ';font-size:24px;font-weight:700;color:#fff;">' + money(total) + '</td></tr>'
      + '</table>';

    var payBtn = inv.pay_url && inv.status !== 'paid'
      ? '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:4px 0 14px;"><tr><td style="background:' + PINK + ';border-radius:8px;"><a href="' + esc(inv.pay_url) + '" style="display:inline-block;padding:12px 24px;font-family:' + COND + ';font-size:17px;font-weight:600;color:#fff;text-decoration:none;letter-spacing:.5px;">PAY ONLINE WITH CARD &rarr;</a></td></tr></table>'
      : (inv.status === 'paid' ? '<div style="display:inline-block;margin:4px 0 14px;padding:8px 18px;border:2px solid #16a34a;border-radius:8px;font-family:' + COND + ';font-size:18px;font-weight:700;color:#16a34a;">PAID' + (inv.paid_at ? ' · ' + longDate(inv.paid_at) : '') + '</div>' : '');

    /* monthly invoices are card-only; the quarterly one also takes check / Zelle */
    var cardOnly = (inv.pay_methods || (inv.kind === 'monthly' ? 'card' : 'all')) === 'card';
    var cardNote = cardOnly && !inv.pay_url && inv.status !== 'paid'
      ? '<div style="font-family:' + COND + ';font-size:17px;color:' + PINK + ';margin:4px 0 8px;">PAY BY CARD</div><div style="font-family:' + BODY + ';font-size:13px;color:' + INK + ';line-height:1.5;">Use the secure &ldquo;Pay online&rdquo; link in your invoice email. Cards on file are charged automatically on the due date.</div>' : '';
    var bottom =
      '<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin-top:18px;"><tr>'
      + '<td style="width:50%;vertical-align:top;padding:6px 18px 10px 0;border-right:1px solid ' + LINE + ';">'
      + '<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr><td>' + icon('&#128179;', PINK, 46) + '</td><td style="padding-left:14px;font-family:' + COND + ';font-size:22px;font-weight:600;color:' + PINK + ';">PAYMENT OPTIONS</td></tr></table>'
      + '<div style="height:10px"></div>' + payBtn + cardNote
      + (cardOnly && inv.pay_url && inv.status !== 'paid' ? '<div style="font-family:' + BODY + ';font-size:13px;color:' + INK + ';">Card payments only. Cards on file are charged automatically on the due date.</div>' : '')

  if(st.subscription_status==='trial')res={label:'Trial',cls:'warn',detail:'Trial account'};
  if(st.subscription_status==='canceled')return{label:'Canceled',cls:'bad',detail:'Subscription canceled'};
  if(st.subscription_status==='suspended')return{label:'Suspended',cls:'bad',detail:'Suspended by you'};
  if(oldest&&oldest.due_at){
    var due=day(oldest.due_at),late=Math.floor((today-due)/86400000),grace=+st.grace_days||0;

function saveBilling(){

function nextMonthlyDraft(){
  var s=cur.settings||{},mi=s.monthly_item||{},last=invoices.filter(function(i){return i.status!=='void'&&i.period_end;}).sort(function(a,b){return day(b.period_end)-day(a.period_end);})[0];
  var start=last?day(last.period_end):null;
  if(start)start.setDate(start.getDate()+1);else{var n=new Date();start=new Date(n.getFullYear(),n.getMonth()+1,1);}
  var end=new Date(start.getFullYear(),start.getMonth()+1,0),next=new Date(start.getFullYear(),start.getMonth()+1,1),due=ymd(start),sendOn=new Date(start);sendOn.setDate(sendOn.getDate()-(s.send_days_before==null?10:+s.send_days_before));
  var mon=start.toLocaleDateString('en-US',{month:'long'}),label=mon+' 1 – '+mon+' '+end.getDate()+', '+start.getFullYear();
  var lines=[{title:mi.title||'CRM – Ongoing Support',description:mi.description||'',features:[],period_label:label,period_note:'(1 Month)',amount:+s.monthly_price||0}];
  charges.filter(function(c){return c.active!==false&&(c.recurring||!c.billed_on);}).forEach(function(c){lines.push({title:c.description,description:c.recurring?'Monthly add-on':'One-time charge',features:[],period_label:c.recurring?label:fmtDay(due),period_note:c.recurring?'(1 Month)':'',amount:+c.amount});});
  var no=(s.invoice_prefix||'GB-SL')+'-'+due.slice(0,4)+'-'+due.slice(5,7)+due.slice(8,10);if(invoices.some(function(i){return i.invoice_no===no;}))no+='-M';
  return{invoice_no:no,kind:'monthly',pay_methods:'card',period_start:due,period_end:ymd(end),issued_at:due,due_at:due,send_on:ymd(sendOn),next_invoice_date:ymd(next),line_items:lines,notes:''};
}

function openDoc(i){var w=window.open('','_blank');if(!w)return toast('Allow pop-ups to view the invoice');w.document.write(GBInvoice.invoiceDocument(i,P(),{assets:ASSETS,clientName:cur.name}));w.document.close();}
function printInv(id){openDoc(invoices.find(function(x){return x.invoice_id===id;}));}
async function scheduleInv(id){var i=invoices.find(function(x){return x.invoice_id===id;});
  if(!i.send_on)return toast('Set a send date first (Edit)');
  if(!confirm(i.invoice_no+' will email itself on '+fmtDay(i.send_on)+(i.send_on<=ymd(new Date())?' — that’s today or earlier, so it goes out on the next billing run':'')+'. Continue?'))return;
  var r=await sb.from('platform_invoices').update({status:'scheduled'}).eq('invoice_id',id);if(r.error)return toast(r.error.message);toast('Scheduled');loadAll(true);}
async function sendInv(id){
  var i=invoices.find(function(x){return x.invoice_id===id;}),s=cur.settings||{};
  if(!s.billing_email){toast('Add the invoice email on the Billing tab first');setTab('billing');return;}
  if(!confirm('Email '+i.invoice_no+' ('+money(i.total)+') to '+s.billing_email+' now?'))return;
  var r=await fn('send-invoice',{invoice_id:id});
  if(!r.error){toast('Invoice emailed with a Pay now link');return loadAll(true);}
  if(!confirm('Sending from the app isn’t set up yet ('+r.error+').\n\nOpen the invoice so you can save it as a PDF and email it yourself, and mark it as sent?'))return;
  openDoc(i);
  var u=await sb.from('platform_invoices').update({status:'sent',sent_at:new Date().toISOString(),sent_to:s.billing_email}).eq('invoice_id',id);if(u.error)return toast(u.error.message);
  loadAll(true);
}
async function markPaid(id){
  var i=invoices.find(function(x){return x.invoice_id===id;});
  if(!confirm('Mark '+i.invoice_no+' ('+money(i.total)+') as paid? (check / Zelle)'))return;
  var r=await sb.from('platform_invoices').update({status:'paid',paid_at:new Date().toISOString(),last_error:null}).eq('invoice_id',id);if(r.error)return toast(r.error.message);
  var s=cur.settings||{},up={};
  if(i.period_end&&(!s.paid_through||day(i.period_end)>day(s.paid_through)))up.paid_through=i.period_end;
  if(s.subscription_status==='past_due')up.subscription_status='active';
  if(Object.keys(up).length)await sb.from('platform_settings').update(up).eq('tenant_id',cur.tenant_id);
  toast('Marked paid');await loadAll(true);
}
async function voidInv(id){
  var i=invoices.find(function(x){return x.invoice_id===id;});
  if(!confirm('Void '+i.invoice_no+'? It stays on record but no longer counts as owed.'))return;
  var r=await sb.from('platform_invoices').update({status:'void'}).eq('invoice_id',id);if(r.error)return toast(r.error.message);
  await sb.from('platform_charges').update({billed_on:null}).eq('billed_on',id);
  toast('Invoice voided');await loadAll(true);
}

init();
</script>

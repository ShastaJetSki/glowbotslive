<script>
/* Mine/All: one choice shared by every page in this browser tab, Mine by default.
   Only owners, admins and managers see the switch; everyone else is always Mine. */
window.SLScope={ROLES:['owner','admin','manager'],
  can:function(r){return this.ROLES.indexOf(String(r||'').toLowerCase())>=0;},
  get:function(){try{var v=sessionStorage.getItem('sl-scope');if(v)return v==='all'?'all':'mine';return localStorage.getItem('sl-super')==='1'?'all':'mine';}catch(e){return 'mine';}},
  set:function(m){try{sessionStorage.setItem('sl-scope',m==='all'?'all':'mine');}catch(e){}}};
/* the platform superadmin (glowbotsapp) isn't a team member: let it see every page as an owner, on All */
window.SLSuper=async function(tenant){
  try{var r=await sb.rpc('sl_is_superadmin');if(r.data!==true)return null;}catch(e){return null;}
  window.SL_SUPER=true;
  var first=false;
  try{first=localStorage.getItem('sl-super')!=='1';localStorage.setItem('sl-super','1');}catch(e){}
  try{if(!sessionStorage.getItem('sl-super')){sessionStorage.setItem('sl-super','1');sessionStorage.setItem('sl-scope','all');}}catch(e){}
  /* first page opened this session was set up for Mine: reload once so it opens on All */
  if(first&&SLScope.get()==='all'&&!window._slSuperReloaded){window._slSuperReloaded=1;location.reload();return new Promise(function(){});}
  var add=function(){if(document.getElementById('slSuperBack'))return;var a=document.createElement('a');a.id='slSuperBack';a.href='v4-superadmin.html';a.textContent='← Superadmin';
    a.style.cssText='position:fixed;left:14px;bottom:14px;z-index:9999;background:#111827;color:#fff;font:600 12px/1 system-ui,sans-serif;padding:9px 14px;border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25);';document.body.appendChild(a);};
  if(document.body)add();else document.addEventListener('DOMContentLoaded',add);
  return {member_id:null,tenant_id:tenant||'55555555-5555-5555-5555-555555555555',role:'owner',is_active:true,first_name:'Superadmin',last_name:'',email:''};
};
/* a fresh sign-in starts on Mine */
if(/login(-sharklaw)?\.html$/i.test(location.pathname)){try{sessionStorage.removeItem('sl-scope');sessionStorage.removeItem('sl-super');localStorage.removeItem('sl-super');}catch(e){}}
</script>
<script>
/* ── SharkLaw V4 style switch ─────────────────────────────────────────
   sl-style: 'legacy' (default until the project goes live) or 'v4'.
   In the v4 style, light/dark is stored separately in 'v4-mode' (light
   by default); the page's own theme code keeps using 'app-theme', and
   this shim quietly redirects it. Logout's localStorage.clear() keeps
   the display settings. */
(function(){
  var LS;try{LS=window.localStorage;}catch(e){return;}
  var P=Storage.prototype,g=P.getItem,s=P.setItem,c=P.clear;
  var st='legacy';try{st=g.call(LS,'sl-style')==='v4'?'v4':'legacy';}catch(e){}
  window.SL_STYLE=st;
  var KEEP=['sl-style','v4-mode','app-theme'];
  P.clear=function(){
    if(this!==LS)return c.call(this);
    var keep={};KEEP.forEach(function(k){var v=g.call(LS,k);if(v!==null)keep[k]=v;});
    c.call(this);Object.keys(keep).forEach(function(k){s.call(LS,k,keep[k]);});
  };
  var m='light';try{m=g.call(LS,'v4-mode')==='dark'?'dark':'light';}catch(e){}
  if(st==='v4'){
    P.getItem=function(k){if(this===LS&&k==='app-theme')return g.call(LS,'v4-mode')==='dark'?'dark':'light';return g.call(this,k);};
    P.setItem=function(k,v){
      if(this===LS&&k==='app-theme'){var md=String(v).indexOf('light')>=0?'light':'dark';s.call(LS,'v4-mode',md);document.documentElement.setAttribute('data-v4mode',md);return;}
      return s.call(this,k,v);
    };
  }
  var h=document.documentElement;h.setAttribute('data-style',st);h.setAttribute('data-v4mode',m);
})();
</script>

  <style>
    :root{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}

    [data-theme="light"]{--bg-primary:#f4f6fb;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#e8edf6;--border-default:#d3dbe8;--text-primary:#14213a;--text-secondary:#44546c;--accent-primary:#2563eb;--accent-light:#1d4ed8;}

    .theme-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .mobile-top-header{display:none;position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}

    .mobile-header-title{font-size:18px;font-weight:600;}
    .mobile-menu-content{max-height:0;overflow:hidden;transition:max-height 0.3s ease;background:var(--bg-primary);border-top:1px solid var(--border-default);}
    .mobile-menu-content.expanded{max-height:200px;}
    .mobile-header-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px 12px;}
    .mobile-header-actions button{padding:10px;font-size:13px;background:color-mix(in srgb,var(--accent-primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent-primary) 30%,transparent);color:var(--accent-light);border-radius:8px;cursor:pointer;}
    .desktop-header{position:sticky;top:0;z-index:100;background:var(--bg-primary);border-bottom:1px solid var(--border-default);}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-primary);color:var(--text-primary);padding:10px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;}
    .toast.show{opacity:1;}
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-secondary);padding:8px;z-index:100;border-top:1px solid var(--border-default);}
    .mobile-nav-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}

    .mobile-nav-btn{padding:10px 8px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:44px;}

    @media(max-width:768px){

      .mobile-top-header{display:block;}
      .mobile-bottom-nav{display:block!important;}

      /* Board: vertical stack of stage rows */

        flex-direction:column !important;
        overflow-y:auto;
        overflow-x:hidden;
      }
      /* Each stage = horizontal row with label left, cards scrolling right */

        flex:0 0 auto !important;

        font-weight:700;
        line-height:1.5;
        text-align:center;

      .col-count{margin-left:0;margin-top:4px;display:block;}

    .cc-rep{font-size:10px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;}

    .sp{padding:6px 16px;border-radius:20px;background:var(--bg-card);border:1px solid;white-space:nowrap;text-align:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
    .sp-val{font-size:18px;font-weight:700;}
    .sp-lbl{font-size:10px;color:var(--text-secondary);margin-top:2px;}
    .pipeline-toolbar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);flex-wrap:wrap;flex-shrink:0;}
    .tb-label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;}
    .tb-select{padding:7px 10px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:13px;cursor:pointer;}

    .board-col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--border-default);min-height:0;}

    /* ── Shared board layout (Pipeline + Leads) ── */

.bx-toolbar select{cursor:pointer;max-width:150px;padding:0 8px;}

.bx-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.bx-primary{height:38px;padding:0 16px;border-radius:10px;border:0;background:var(--accent-primary);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:auto;text-decoration:none;display:inline-flex;align-items:center;}

/* board */

.bx-col{flex:1 1 0;min-width:190px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg-card) 55%,transparent);border:1px solid var(--border-default);border-top:4px solid var(--bx-c,#6b7280);border-radius:12px;min-height:0;transition:box-shadow .12s,background .12s;}

/* ═════ V4 design system: KPI blocks, cards and page layout matched to the Overview ═════ */

/* page width + spacing (Overview: 1280px, 22px 24px) */

/* ───── KPI blocks: big number, label underneath, left aligned ───── */
html[data-style="v4"] .kpi-bar{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px!important;max-width:1280px;margin:0 auto!important;padding:14px 24px 4px!important;overflow:visible!important;background:transparent!important;border:none!important;}

html[data-style="v4"] .kpi-pill:hover,html[data-style="v4"] .kpi-card:hover{border-color:var(--accent-light)!important;}
/* needs-attention colouring, same as the Overview */

<script>/* ── Shared board helpers (Pipeline + Leads) ──────────────────────────────
   BX.drag(root, {canDrag(card), onDrop(id, stage, card)})
     cards:   [data-drag-id]       drop targets: [data-drop-stage]
     mouse:   press and move 6px to pick up
     touch:   hold 0.35s, then drag (a quick swipe still scrolls)
   After a drag the click that follows is swallowed so cards don't open. */
window.BX = (function () {
  var S = null, swallowClick = false;

  function targetAt(x, y) {
    var el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('[data-drop-stage]') : null;
  }
  function setOver(t) {
    if (S.over === t) return;
    if (S.over) S.over.classList.remove('bx-over');
    S.over = t;
    if (t && t.getAttribute('data-drop-stage') !== S.from) t.classList.add('bx-over');
  }
  function start() {
    var r = S.card.getBoundingClientRect();
    var g = S.card.cloneNode(true);
    g.classList.add('bx-ghost');
    g.removeAttribute('id');
    g.style.width = r.width + 'px';
    g.style.left = r.left + 'px';
    g.style.top = r.top + 'px';
    document.body.appendChild(g);
    S.ghost = g; S.dx = S.x0 - r.left; S.dy = S.y0 - r.top; S.active = true;
    S.card.classList.add('bx-lifted');
    document.documentElement.classList.add('bx-dragging');
    if (navigator.vibrate && S.touch) try { navigator.vibrate(12); } catch (e) {}
    move(S.x0, S.y0);
  }
  function autoScroll(x, y) {
    var t = S.over;
    var board = S.root.querySelector('.bx-board');
    if (board) {
      var br = board.getBoundingClientRect();
      if (x < br.left + 40) board.scrollLeft -= 14;
      else if (x > br.right - 40) board.scrollLeft += 14;
    }
    var body = t && t.querySelector('.bx-col-b');
    if (body) {
      var r = body.getBoundingClientRect();
      if (y < r.top + 36) body.scrollTop -= 12;
      else if (y > r.bottom - 36) body.scrollTop += 12;
    }
    if (y < 60) window.scrollBy(0, -12);
    else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
  }
  function move(x, y) {
    S.x = x; S.y = y;
    S.ghost.style.transform = 'translate(' + (x - S.dx - parseFloat(S.ghost.style.left)) + 'px,' + (y - S.dy - parseFloat(S.ghost.style.top)) + 'px) rotate(1.5deg)';
    setOver(targetAt(x, y));
  }
  function end(drop) {
    if (!S) return;
    clearTimeout(S.timer);
    clearInterval(S.scroller);
    var s = S; S = null;
    document.removeEventListener('pointermove', onMove, true);
    document.removeEventListener('pointerup', onUp, true);
    document.removeEventListener('pointercancel', onCancel, true);
    document.removeEventListener('touchmove', onTouchMove, { capture: true, passive: false });
    document.removeEventListener('keydown', onKey, true);
    if (!s.active) return;
    swallowClick = true; setTimeout(function () { swallowClick = false; }, 350);
    if (s.ghost) s.ghost.remove();
    s.card.classList.remove('bx-lifted');
    document.documentElement.classList.remove('bx-dragging');
    if (s.over) s.over.classList.remove('bx-over');
    var to = drop && s.over ? s.over.getAttribute('data-drop-stage') : null;
    if (to && to !== s.from) s.opt.onDrop(s.card.getAttribute('data-drag-id'), to, s.card, s.from);
  }
  function onMove(e) {
    if (!S || e.pointerId !== S.pid) return;
    if (!S.active) {
      var far = Math.abs(e.clientX - S.x0) + Math.abs(e.clientY - S.y0);
      if (S.touch) { if (far > 10) end(false); return; }  /* finger moved before the hold: let it scroll */
      if (far < 6) return;
      start();
    }
    e.preventDefault();
    move(e.clientX, e.clientY);
  }
  function onTouchMove(e) { if (S && S.active) e.preventDefault(); }
  function onUp(e) { if (S && e.pointerId === S.pid) end(true); }
  function onCancel(e) { if (S && e.pointerId === S.pid) end(!!(S.active && S.touch)); }
  function onKey(e) { if (e.key === 'Escape') end(false); }

  function drag(root, opt) {
    if (root._bx) { root._bx.opt = opt; return; }
    root._bx = { opt: opt };
    root.addEventListener('pointerdown', function (e) {
      if (e.button > 0 || S) return;
      var card = e.target.closest('[data-drag-id]');
      if (!card || !root.contains(card)) return;
      if (e.target.closest('button,a,input,select,textarea')) return;
      var o = root._bx.opt;
      if (o.canDrag && !o.canDrag(card)) return;
      var col = card.closest('[data-drop-stage]');
      S = { root: root, opt: o, card: card, pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
            touch: e.pointerType !== 'mouse', from: col ? col.getAttribute('data-drop-stage') : card.getAttribute('data-stage') };
      if (S.touch) S.timer = setTimeout(function () { if (S && !S.active) start(); }, 350);
      S.scroller = setInterval(function () { if (S && S.active) { autoScroll(S.x, S.y); setOver(targetAt(S.x, S.y)); } }, 30);
      document.addEventListener('pointermove', onMove, true);
      document.addEventListener('pointerup', onUp, true);
      document.addEventListener('pointercancel', onCancel, true);
      document.addEventListener('touchmove', onTouchMove, { capture: true, passive: false });
      document.addEventListener('keydown', onKey, true);
    });
    /* stop the long-press menu / text selection from fighting the drag */
    root.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-drag-id]') && (S || e.pointerType !== 'mouse')) e.preventDefault(); });
    root.addEventListener('click', function (e) { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  }

  /* Fill the rest of the screen with the board so each column scrolls on its own */
  function fit(board) {
    if (!board) return;
    if (window.innerWidth <= 768) { board.style.height = ''; return; }
    var top = board.getBoundingClientRect().top + window.scrollY;
    board.style.height = Math.max(420, window.innerHeight - top - 16) + 'px';
  }
  function hex(c) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c || '') ? c : '#6b7280'; }
  function pref(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  return { drag: drag, fit: fit, hex: hex, pref: pref };
})();

// ── Stage 6 → 7 auto-promotion ──────────────────────────────────────────────
// Contacts in Stage 6 whose updated_at is >= stage 6 reminder days old get
// moved to Stage 7. The stage 6 reminder (default 30 days) is the threshold.
async function promoteStage6(){
  var promoteDays=parseInt(stageReminders['6']||30);
  var toPromote=allContacts.filter(function(c){
    return String(c.funnel_stage)==='6' && daysSince(touched(c))>=promoteDays;
  });
  if(!toPromote.length)return;

  var ids=toPromote.map(function(c){return c.contact_id;});
  // Batch update — Supabase supports IN filter
  var r=await sb.from('contacts')
    .update({funnel_stage:7, updated_at:new Date().toISOString()})
    .in('contact_id',ids)
    .eq('tenant_id',TENANT);

  if(!r.error){
    // Update local data so the board reflects immediately without a reload
    toPromote.forEach(function(c){
      c.funnel_stage=7;
      c.updated_at=c.last_activity_at=new Date().toISOString();
    });
    showToast(toPromote.length+' contact'+(toPromote.length>1?'s':'')+' moved to Follow Up (Old)');
  }
}

// ── Stage 7 visibility logic ─────────────────────────────────────────────────
// Stage 7 reminder = R days (default 90).
// A contact reappears in the last 30 days before R expires.
// Hide window: days 0 to (R-30). Show window: days (R-30) to R (and beyond).
function stage7Visibility(c){
  var R=parseInt(stageReminders['7']||90);
  var showAfter=Math.max(0,R-30); // first day they become visible again
  var ds=daysSince(touched(c));
  return{
    visible: ds>=showAfter,
    daysSince: ds,
    showAfter: showAfter,
    totalDays: R,
    daysUntilVisible: Math.max(0,showAfter-ds)
  };
}

/* ── Pipeline board (v4 restructure) ─────────────────────────────────────── */
var pipeScope='mine',pipeView=BX.pref('pipe-view')==='insights'?'insights':'board',pipeShowOld=BX.pref('pipe-show-old')==='1',pipeTab=BX.pref('pipe-tab')||'1';
function isOwnerAdmin(){return SLScope.can(currentUserRole);}
function stageDue(c){var st=String(c.funnel_stage||'');var d=parseInt(stageReminders[st]||0,10);if(!d)return false;if(st==='7'&&!stage7Visibility(c).visible)return false;return daysSince(touched(c))>=d;}
function stageOver(c){var st=String(c.funnel_stage||'');var d=parseInt(stageReminders[st]||0,10);if(!d||!stageDue(c))return false;return daysSince(touched(c))>=d+7;}
function goProfile(id){location.href='v4-sharklaw-profiles.html?id='+id;}
function scrollToCol(id){setPipeTab(id);var el=document.getElementById('col-'+id);if(el&&window.innerWidth>768)el.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}

function getFiltered(){
  var teamId=document.getElementById('teamFilter').value;
  var typeVal=document.getElementById('typeFilter').value;
  var q=(document.getElementById('pipeQ').value||'').trim().toLowerCase(),qd=q.replace(/\D/g,'');
  return allContacts.filter(function(c){
    if(pipeScope==='mine'&&c.assigned_to!==currentUserId)return false;
    if(pipeScope!=='mine'&&teamId&&c.assigned_to!==teamId)return false;
    if(typeVal&&(c.customer_type||'')!==typeVal)return false;
    if(q){
      var hay=[c.first_name,c.last_name,c.organization_name,c.email,c.customer_type,memberName(c.assigned_to)].join(' ').toLowerCase();
      var ph=String(c.phone||'').replace(/\D/g,'');
      if(hay.indexOf(q)<0&&!(qd.length>=3&&ph.indexOf(qd)>=0))return false;
    }
    return true;
  });
}
function liveStage(c){var k=String(c.funnel_stage||'');return STAGE_MAP[k]!==undefined&&(k!=='7'||stage7Visibility(c).visible);}

function buildCard(c){
  var col=BX.hex(memberColor(c.assigned_to));
  var name=((c.first_name||'')+' '+(c.last_name||'')).trim()||c.organization_name||'Unknown';
  var ref=c.organization_name&&name!==c.organization_name?c.organization_name:'';
  var sub=[fmt(c.phone||''),c.customer_type].filter(Boolean).join(' · ')||'No phone';
  var d=daysSince(touched(c)),badge;
  if(stageOver(c))badge='<span class="bx-badge over" title="More than a week past this stage’s reminder">'+d+'d · overdue</span>';
  else if(stageDue(c))badge='<span class="bx-badge due" title="Past this stage’s follow-up reminder">'+d+'d · due</span>';
  else badge='<span class="bx-badge" title="Days since last worked">'+(d===0?'today':d+'d')+'</span>';
  return '<div class="bx-card" style="--bx-m:'+col+';" data-drag-id="'+esc(c.contact_id)+'" data-stage="'+esc(String(c.funnel_stage||''))+'" onclick="goProfile(this.dataset.dragId)" title="Click to open · drag to move">'

    +'<div class="bx-sub">'+esc(sub)+'</div>'

function pill(v,l,title,alert,click){

}
function renderStageSummary(){
  var list=getFiltered(),live=list.filter(liveStage);

  var wk=list.filter(function(c){return c.last_activity_at&&daysSince(c.last_activity_at)<7;}).length;
  var n=new Date(),month=list.filter(function(c){var d=new Date(c.created_at);return c.created_at&&d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth();}).length;
  var staged=list.filter(function(c){return STAGE_MAP[String(c.funnel_stage||'')]!==undefined;});
  var partners=staged.filter(function(c){var k=String(c.funnel_stage);return k==='6'||k==='7';}).length;
  document.getElementById('pipeKpis').innerHTML=
     pill(live.length,'Active Contacts','Contacts on the board (Follow Up (Old) only while visible)')
    +pill(due,'Follow-ups Due','Past their stage’s reminder','warm')
    +pill(over,'Overdue','More than a week past the reminder','hot')

    +pill(month,'New This Month','Contacts added this month')
    +pill(staged.length?Math.round(partners/staged.length*100)+'%':'—','Partnership Rate','Confirmed Partnership + Follow Up (Old) as a share of all staged contacts');
}

function stagesShown(){return STAGE_ORDER.filter(function(id){return id!=='7'||pipeShowOld;});}
function renderBoard(){
  var filtered=getFiltered();
  var R7=parseInt(stageReminders['7']||90);
  var shown=stagesShown();
  if(shown.indexOf(pipeTab)<0)pipeTab=shown[0];

function renderInsights(list){
  list=list||getFiltered();
  var staged=list.filter(function(c){return STAGE_MAP[String(c.funnel_stage||'')]!==undefined;});
  var max=1;STAGE_ORDER.forEach(function(id){var n=staged.filter(function(c){return String(c.funnel_stage)===id;}).length;if(n>max)max=n;});
  var bars=STAGE_ORDER.map(function(id,i){
    var inStage=staged.filter(function(c){return String(c.funnel_stage)===id;});

    return '<div class="bx-bar"><span class="lbl"><span class="sw" style="background:'+STAGE_COLORS[id]+'"></span>'+esc(stageName(id))+'</span>'
      +'<span class="trk"><span class="fil" style="display:block;width:'+Math.max(3,Math.round(inStage.length/max*100))+'%;background:'+STAGE_COLORS[id]+'"></span></span>'
      +'<span class="num"><b>'+inStage.length+'</b>'+(due?' · '+due+' due':'')+'<br>'+(staged.length?Math.round(atOrPast/staged.length*100):0)+'% reached</span></div>';
  }).join('');
  var by={};
  staged.forEach(function(c){var k=c.assigned_to||'';var b=by[k]||(by[k]={id:k,n:0,due:0,wk:0,p:0});b.n++;if(stageDue(c))b.due++;if(c.last_activity_at&&daysSince(c.last_activity_at)<7)b.wk++;var s=String(c.funnel_stage);if(s==='6'||s==='7')b.p++;});
  var rows=Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.p-a.p||b.n-a.n;});

    +rows.map(function(r){return '<tr class="click" data-who="'+esc(r.id)+'" onclick="pickPipeWho(this.dataset.who)"><td><span class="bx-dot" style="background:'+BX.hex(memberColor(r.id))+';margin-right:7px;"></span>'+esc(memberName(r.id))+'</td><td class="n">'+r.n+'</td><td class="n">'+r.due+'</td><td class="n">'+r.wk+'</td><td class="n">'+r.p+'</td><td class="n">'+(r.n?Math.round(r.p/r.n*100)+'%':'—')+'</td></tr>';}).join('')+'</tbody></table>'
    :'<div class="bx-empty">No contacts match these filters</div>';
  document.getElementById('pipeInsights').innerHTML=
     '<div class="bx-panel"><div class="bx-panel-h"><div class="bx-panel-t">Stage Funnel</div><div class="bx-panel-s">'+staged.length+' contacts</div></div><div class="bx-panel-b">'+bars+'<div class="bx-foot-note">“Reached” counts contacts at that stage or further along.</div></div></div>'
    +'<div class="bx-panel"><div class="bx-panel-h"><div class="bx-panel-t">By Associate</div><div class="bx-panel-s">'+(pipeScope==='mine'?'Your contacts':'Click a row to filter')+'</div></div><div class="bx-panel-b" style="padding:6px 10px;">'+tbl+'</div></div>';
}

function setPipeScope(s){
  pipeScope=isOwnerAdmin()&&s==='all'?'all':'mine';if(isOwnerAdmin())SLScope.set(pipeScope);

  document.getElementById('psAll').classList.toggle('active',pipeScope!=='mine');
  document.getElementById('teamFilter').style.display=pipeScope==='mine'?'none':'';
  renderAll();
}
function setPipeTab(id){pipeTab=String(id);BX.pref('pipe-tab',pipeTab);
  document.querySelectorAll('#pipeTabs .bx-tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-drop-stage')===pipeTab);});
  document.querySelectorAll('#boardWrap .bx-col').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-drop-stage')===pipeTab);});}
function toggleOld(on){pipeShowOld=!!on;BX.pref('pipe-show-old',on?'1':'0');renderBoard();}

/* drag a card to another column (or stage tab on phones) */
async function moveContact(id,to){
  var c=allContacts.find(function(x){return x.contact_id===id;});if(!c)return;
  var from=c.funnel_stage,fromAct=c.last_activity_at,fromUpd=c.updated_at,now=new Date().toISOString();
  c.funnel_stage=parseInt(to,10);c.last_activity_at=now;c.updated_at=now;
  renderAll();
  var r=await sb.from('contacts').update({funnel_stage:parseInt(to,10),updated_at:now}).eq('contact_id',id).eq('tenant_id',TENANT).select('contact_id');
  if(r.error||!r.data||!r.data.length){
    c.funnel_stage=from;c.last_activity_at=fromAct;c.updated_at=fromUpd;renderAll();
    showToast(r.error?'Could not move: '+r.error.message:'You don’t have permission to move this contact');return;
  }
  showToast(((c.first_name||'Contact')+' moved to '+stageName(to)));
}
function initPipeBoard(){
  var vt=document.getElementById('viewToggleWrap');
  if(isOwnerAdmin()){vt.style.display='flex';pipeScope=SLScope.get();}else{vt.style.display='none';pipeScope='mine';}
  document.getElementById('pipeOld').checked=pipeShowOld;
  BX.drag(document.getElementById('pageWrap'),{onDrop:function(id,to){moveContact(id,to);}});
  window.addEventListener('resize',function(){clearTimeout(window._bxr);window._bxr=setTimeout(function(){BX.fit(document.getElementById('boardWrap'));},120);});
  setPipeScope(pipeScope);setPipeView(pipeView);
}

/* Supabase returns at most 1,000 rows per request. Page through so
   lists and counts aren't silently cut off. build() must return a fresh query. */
async function fetchAll(build){
  var out=[],size=1000;
  for(var page=0;page<50;page++){
    var r=await build().range(page*size,(page+1)*size-1);
    if(r.error){console.warn('fetchAll:',r.error.message);return{data:out,error:r.error};}
    var rows=r.data||[];out=out.concat(rows);
    if(rows.length<size)break;
  }
  return{data:out,error:null};
}

async function init(){
  var session=await checkAuth();if(!session)return;
  var authId=session.user?.id,email=session.user?.email;
  var row=null;
  if(authId){var r1=await sb.from('team_members').select('member_id,role,is_active,first_name,last_name').eq('auth_user_id',authId).eq('tenant_id',TENANT).maybeSingle();if(r1.data)row=r1.data;}
  if(!row&&email){var r2=await sb.from('team_members').select('member_id,role,is_active,first_name,last_name').eq('email',email).eq('tenant_id',TENANT).maybeSingle();if(r2.data)row=r2.data;}
  if(!row)row=await SLSuper(TENANT);
  if(!row){await sb.auth.signOut();location.replace('v4-login.html');return;}
  if(row.is_active===false){await sb.auth.signOut();location.replace('v4-login.html?reason=deactivated');return;}

  currentUserId=row.member_id;currentUserRole=row.role;
  currentUserName=((row.first_name||'')+' '+(row.last_name||'')).trim();
  document.getElementById('dUserName').textContent=currentUserName;
  document.getElementById('mUserName').textContent=currentUserName;
  document.getElementById('pageWrap').style.display='';

  // Load team members
  var mr=await sb.from('team_members').select('member_id,first_name,last_name,color,role').eq('tenant_id',TENANT).eq('is_active',true).order('last_name');
  allMembers=mr.data||[];
  var sel=document.getElementById('teamFilter');
  sel.innerHTML='<option value="">All Team</option>';
  allMembers.forEach(function(m){sel.innerHTML+='<option value="'+m.member_id+'">'+((m.first_name||'')+' '+(m.last_name||'')).trim()+'</option>';});

  // Load stage reminders from business_settings
  try{
    var br=await sb.from('business_settings').select('stage_reminders').eq('tenant_id',TENANT).single();
    if(br.data&&br.data.stage_reminders&&Object.keys(br.data.stage_reminders).length){
      stageReminders=br.data.stage_reminders;
    }
  }catch(e){}

  // Load contacts
  var cr=await fetchAll(function(){return sb.from('contacts').select('*').eq('tenant_id',TENANT).or('is_deleted.is.null,is_deleted.eq.false').order('contact_id');});
  var rm=await fetchAll(function(){return sb.from('contact_removals').select('contact_id').eq('tenant_id',TENANT).order('contact_id');});
  var removed={};(rm.data||[]).forEach(function(x){removed[x.contact_id]=1;});
  allContacts=(cr.data||[]).filter(function(c){return !removed[c.contact_id];});

  // Auto-promote Stage 6 → 7 after reminder threshold
  await promoteStage6();

  initPipeBoard();
}
init();
</script>

    {f:'v4-sharklaw-contacts.html',n:'Contacts',i:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>'},
    {f:'v4-sharklaw-pipeline.html',n:'Pipeline',i:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>'},
    {f:'v4-sharklaw-leads.html',n:'Leads',i:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'},
    {f:'v4-sharklaw-swag.html',n:'Swag',i:'<path d="M20.6 13.4 12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.5"/>'},
    {f:'v4-communications.html',n:'Comms',i:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'},
    {f:'v4-sharklaw-settings.html',n:'Settings',i:'<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'}
  ];
  /* the page a tab "belongs" to (profiles live under Contacts, archive under Scheduler) */
  var home=page.indexOf('profiles')>=0?'v4-sharklaw-contacts.html':page.indexOf('archive')>=0?'v4-sharklaw-scheduler.html':page;
  var GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  var v4=window.SL_STYLE==='v4';
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var role=(ls('sl-role')||'').toLowerCase();

  /* ── display panel (gear) ── */
  function curMode(){
    if(v4)return document.documentElement.getAttribute('data-v4mode')==='dark'?'dark':'light';
    var t=document.documentElement.getAttribute('data-theme')||'';return t.indexOf('light')>=0?'light':'dark';
  }
  function setMode(m){
    var h=document.documentElement,cur=h.getAttribute('data-theme')||'';
    var named=cur.indexOf('-')>=0;  /* comms uses dark-blue / blue-light */
    try{localStorage.setItem('app-theme',m);}catch(e){}
    if(v4)h.setAttribute('data-v4mode',m);
    if(cur||!h.hasAttribute('data-theme'))h.setAttribute('data-theme',named?(m==='light'?'blue-light':'dark-blue'):m);
    paint();
  }
  function setStyle(s){try{localStorage.setItem('sl-style',s);}catch(e){}location.reload();}
  var pop=document.createElement('div');pop.className='v4-pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Display settings');
  pop.innerHTML='<button class="v4-x" aria-label="Close">&times;</button><h3>Appearance</h3><div class="v4-seg"><button data-m="light">Light</button><button data-m="dark">Dark</button></div>'
    +'<h3>Style</h3><div class="v4-seg"><button data-s="legacy">Legacy</button><button data-s="v4">New</button></div>'
    +'<p>Testing switch. Legacy is the current SharkLaw look and stays the default until the new style goes live.</p>';
  document.body.appendChild(pop);
  function paint(){
    var m=curMode();
    pop.querySelectorAll('[data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
    pop.querySelectorAll('[data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===(v4?'v4':'legacy'));});
  }
  pop.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('v4-x')){pop.classList.remove('on');return;}
    if(b.dataset.m)setMode(b.dataset.m);
    if(b.dataset.s&&b.dataset.s!==(v4?'v4':'legacy'))setStyle(b.dataset.s);
  });
  document.addEventListener('click',function(e){if(pop.classList.contains('on')&&!pop.contains(e.target)&&!e.target.closest('.v4-gear,.v4h-gear'))pop.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){pop.classList.remove('on');closeSheet();}});
  function gearBtn(extra){var b=document.createElement('button');b.type='button';b.className='v4-gear'+(extra?' '+extra:'');b.title='Display settings';b.setAttribute('aria-label','Display settings');b.innerHTML=GEAR;
    b.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(b);});return b;}
  function placePop(btn){var r=btn.getBoundingClientRect();if(window.innerWidth<=768||r.top>window.innerHeight/2){pop.style.top='';pop.style.right='';return;}
    pop.style.top=Math.round(r.bottom+6)+'px';pop.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';}
  var placed=0;
  ['.desktop-header','.mobile-top-header','.top','.hdr-actions','#mobPickerBar'].forEach(function(sel){
    var box=document.querySelector(sel);if(!box)return;
    if(box.querySelector('.v4-gear'))return;
    var t=box.querySelector('.theme-btn,.theme-toggle-btn,.dark-toggle');
    if(t&&t.parentNode){t.parentNode.insertBefore(gearBtn(),t.nextSibling);placed++;}
    else if(sel==='.hdr-actions'||sel==='#mobPickerBar'||sel==='.top'){box.appendChild(gearBtn());placed++;}
    else if(sel==='.mobile-top-header'){var bar=box.querySelector('.mobile-header-bar,.mob-bar');if(bar){bar.appendChild(gearBtn());placed++;}}
  });
  if(!placed)document.body.appendChild(gearBtn('floating'));
  paint();

  if(!v4)return;   /* everything below is the new look only */

  /* ── standard desktop header: identical to the Overview header on every page,
        so the logo, title and tabs never move when you change page ── */
  var MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var dh=document.querySelector('.desktop-header');
  var oldTop=document.querySelector('.top');
  if(!dh&&oldTop){dh=document.createElement('div');dh.className='desktop-header v4-made';oldTop.parentNode.insertBefore(dh,oldTop);}
  if(dh&&!dh.querySelector('.v4-hdr')){
    var h1=(dh.querySelector('h1')||(oldTop&&oldTop.querySelector('h1')));
    var title=h1?h1.textContent.trim():document.title.split(/[–-]/)[0].trim();
    var hdr=document.createElement('div');hdr.className='v4-hdr';
    var tabs=PAGES.map(function(p){
      var hide=(p.mg&&MGMT.indexOf(role)<0)||(p.n==='Settings'&&ADM.indexOf(role)<0);
      return '<a href="'+p.f+'" data-label="'+p.n+'"'+(p.mg?' data-mg="1"':'')+(p.n==='Settings'?' data-adm="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+(hide?' style="display:none"':'')+'>'+p.n+'</a>';
    }).join('');
    hdr.innerHTML='<div class="v4h-top"><a class="v4h-logo-a" href="'+(MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html')+'" aria-label="Shark Law home"><img class="v4h-logo" src="'+LOGO+'" alt="Shark Law — Motorcycle Attorneys"></a><div class="v4h-title"></div></div>'
      +'<div class="v4h-row"><nav class="v4h-tabs" aria-label="Main">'+tabs+'</nav><span class="v4h-extra"></span><div class="v4h-right"><span class="v4h-user"></span>'
      +'<button type="button" class="v4h-btn v4h-mode" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"></svg></button>'
      +'<button type="button" class="v4h-btn v4h-gear" aria-label="Display settings" title="Display settings">'+GEAR+'</button>'
      +'<button type="button" class="v4h-out">Logout</button></div></div>';
    hdr.querySelector('.v4h-title').textContent=title;
    dh.appendChild(hdr);
    /* page-specific controls that lived in the old header keep working, now on the tab row */
    var extra=hdr.querySelector('.v4h-extra');
    var vt=document.getElementById('viewToggleWrap');
    if(vt){
      vt.style.marginLeft='0';
      /* on phones the tab row is hidden, so Mine/All sits just under the phone header instead */
      var mslot=document.createElement('div');mslot.className='v4-mscope';
      var mt=document.querySelector('.mobile-top-header');if(mt&&mt.parentNode)mt.parentNode.insertBefore(mslot,mt.nextSibling);
      var mq=window.matchMedia('(max-width:768px)');
      var place=function(){(mq.matches&&mslot.parentNode?mslot:extra).appendChild(vt);};
      if(mq.addEventListener)mq.addEventListener('change',place);else if(mq.addListener)mq.addListener(place);
      place();
    }
    dh.querySelectorAll('.hdr-actions .hdr-btn').forEach(function(b){extra.appendChild(b);});
    /* name of the signed-in person, mirrored from the page */
    var src=document.getElementById('dUserName')||document.getElementById('dBizName')||document.getElementById('legacyUser');
    var uEl=hdr.querySelector('.v4h-user');
    function syncUser(){var t=src?src.textContent.trim():'';uEl.textContent=/^loading/i.test(t)?'':t;}
    syncUser();if(src)new MutationObserver(syncUser).observe(src,{childList:true,characterData:true,subtree:true});
    var mb=hdr.querySelector('.v4h-mode');
    function modeIcon(){mb.querySelector('svg').innerHTML=curMode()==='dark'?SUN:MOON;mb.title=curMode()==='dark'?'Switch to light mode':'Switch to dark mode';}
    modeIcon();mb.onclick=function(){setMode(curMode()==='dark'?'light':'dark');modeIcon();};
    new MutationObserver(modeIcon).observe(document.documentElement,{attributes:true,attributeFilter:['data-v4mode','data-theme']});
    var gb=hdr.querySelector('.v4h-gear');
    gb.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(gb);});
    hdr.querySelector('.v4h-out').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  /* ── mobile: logo in the top bar ── */
  var mh=document.querySelector('.mobile-top-header .mobile-header-bar,.mobile-top-header .mob-bar');
  if(mh&&!mh.querySelector('.v4-mlogo')){var im=document.createElement('img');im.className='v4-mlogo';im.src=LOGO;im.alt='Shark Law';mh.insertBefore(im,mh.firstChild);}
  /* ── mobile bottom nav + More sheet ── */
  function navItem(p,label){return'<a href="'+p.f+'"'+(p.mg?' data-mg="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+p.i+'</svg>'+(label||p.n)+'</a>';}
  function byF(f){for(var i=0;i<PAGES.length;i++)if(PAGES[i].f===f)return PAGES[i];}
  var mn=document.createElement('nav');mn.className='v4-mnav';mn.setAttribute('aria-label','Main');
  function buildMnav(){
    var firstP=MGMT.indexOf(role)>=0?byF('v4-sharklaw-overview.html'):byF('v4-sharklaw-dashboard.html');
    var p2=byF('v4-sharklaw-leads.html'),p3=byF('v4-sharklaw-scheduler.html'),p4=byF('v4-sharklaw-contacts.html');
    mn.innerHTML='<div class="v4-mnav-in">'+navItem(firstP)+navItem(p2)+navItem(p3,'Schedule')+navItem(p4)
      +'<button type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button></div>';
    mn.querySelector('button').onclick=openSheet;
  }
  buildMnav();document.body.appendChild(mn);
  var scrim=document.createElement('div');scrim.className='v4-scrim';scrim.onclick=closeSheet;document.body.appendChild(scrim);
  var sheet=document.createElement('div');sheet.className='v4-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','More');
  function buildSheet(){
    sheet.innerHTML='<div class="grab"></div>'+PAGES.filter(function(p){return(!p.mg||MGMT.indexOf(role)>=0)&&(p.n!=='Settings'||ADM.indexOf(role)>=0);}).map(function(p){return navItem(p);}).join('')
      +'<div class="sep"></div><button class="si" type="button" data-act="display"><svg viewBox="0 0 24 24">'+GEAR.replace(/<\/?svg[^>]*>/g,'')+'</svg>Display settings</button>'
      +'<button class="si" type="button" data-act="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</button>';
    sheet.querySelector('[data-act="display"]').onclick=function(e){e.stopPropagation();closeSheet();paint();pop.classList.add('on');};
    sheet.querySelector('[data-act="logout"]').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  buildSheet();document.body.appendChild(sheet);
  function openSheet(){scrim.classList.add('on');sheet.classList.add('on');}
  function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on');}
  window.v4CloseSheet=closeSheet;

  /* ── needs-attention colouring for KPI blocks (red/amber when above zero) ── */
  function alerts(){document.querySelectorAll('[data-v4-alert]').forEach(function(el){
    var v=el.querySelector('.kpi-val,.kpi-value');var t=(v&&v.textContent||'').trim();var n=parseFloat(t.replace(/[^0-9.]/g,''));
    var known=/[0-9]/.test(t);el.classList.toggle('v4-hot',known&&n>0&&el.dataset.v4Alert==='hot');el.classList.toggle('v4-warm',known&&n>0&&el.dataset.v4Alert==='warm');el.classList.toggle('v4-clear',known&&n===0);});}
  alerts();setInterval(alerts,1200);

  /* ── learn the signed-in role once the page has loaded it ── */
  var tries=0;(function poll(){
    var r=(window.currentUserRole||(window.me&&window.me.role)||'');
    if(r){r=String(r).toLowerCase();try{localStorage.setItem('sl-role',r);}catch(e){}
      if(r!==role){role=r;document.querySelectorAll('[data-mg]').forEach(function(el){el.style.display=MGMT.indexOf(role)>=0?'':'none';});
        document.querySelectorAll('.v4-hdr [data-adm]').forEach(function(el){el.style.display=ADM.indexOf(role)>=0?'':'none';});
        var hl=document.querySelector('.v4h-logo-a');if(hl)hl.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';buildMnav();buildSheet();
        var ll=document.querySelector('.v4-logo-link');if(ll)ll.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';}
      return;}
    if(++tries<40)setTimeout(poll,400);
  })();
})();

/* ── Settings is for owners, admins and the superadmin — in every style ──
   Hides every link to it (legacy nav, phone menus, "Manage →" shortcuts) until
   the page has confirmed the signed-in person's role. */
(function(){
  var ADM=['owner','admin','superadmin'],tries=0;
  function role(){return String(window.currentUserRole||(window.me&&window.me.role)||'').toLowerCase();}
  function apply(){var ok=ADM.indexOf(role())>=0;
    document.querySelectorAll('a[href*="sharklaw-settings.html"],button[onclick*="sharklaw-settings.html"],[onclick*="sharklaw-settings.html"]').forEach(function(el){
      if(el.closest('.v4-hdr'))return;el.style.display=ok?'':'none';});}
  apply();
  (function poll(){apply();if(!role()&&++tries<40)setTimeout(poll,400);})();
})();

/* ── Billing reminders: owners & admins only (the team never sees these) ──
   1–10 days late: yellow banner · 11–20: orange · 21–30: red · after that: Pay now screen. */
(function(){
  var tries=0;
  function role(){return String(window.currentUserRole||(window.me&&window.me.role)||'').toLowerCase();}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function money(n){return '$'+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function day(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';}
  function show(b){
    if(!b||!b.level||b.level==='none')return;
    var pay=b.pay_url?'<a href="'+esc(b.pay_url)+'" target="_blank" rel="noopener" class="slb-pay">Pay now</a>':'<a href="mailto:glowbotsapp@gmail.com?subject='+encodeURIComponent('Invoice '+(b.invoice_no||''))+'" class="slb-pay">Contact billing</a>';
    if(b.level==='locked'){
      var o=document.createElement('div');o.className='slb-lock';
      o.innerHTML='<div class="slb-box"><div class="slb-t">Payment needed</div><p>Invoice <b>'+esc(b.invoice_no)+'</b> was due '+esc(day(b.due_at))+' and is now <b>'+b.days_late+' days</b> past due.</p>'
        +'<div class="slb-amt">'+money(b.balance)+'<span>balance due</span></div>'+pay.replace('slb-pay','slb-pay big')
        +'<p class="slb-s">Your team can keep working — this screen is only shown to owners and admins. It clears as soon as the payment comes through.</p>'
        +'<p class="slb-s">Questions? GlowBots · 530-440-3863 · glowbotsapp@gmail.com</p><button type="button" class="slb-out">Log out</button></div>';
      document.body.appendChild(o);document.documentElement.style.overflow='hidden';
      o.querySelector('.slb-out').onclick=function(){if(typeof window.logout==='function')window.logout();else location.href='v4-login.html';};
      return;
    }
    var bar=document.createElement('div');bar.className='slb-bar slb-'+b.level;
    bar.innerHTML='<span>Invoice <b>'+esc(b.invoice_no)+'</b> ('+money(b.total)+') was due '+esc(day(b.due_at))+' — <b>'+b.days_late+' day'+(b.days_late===1?'':'s')+' past due</b>.'+(b.level==='red'?' Pay within '+Math.max(0,(b.lock_after_days||30)-b.days_late)+' days to avoid interruption.':'')+'</span>'+pay;
    document.body.insertBefore(bar,document.body.firstChild);
  }
  var css=document.createElement('style');
  css.textContent='.slb-bar{position:relative;z-index:1200;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:9px 16px;font:600 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}'
   +'.slb-yellow{background:#fde047;color:#422006}.slb-orange{background:#f97316;color:#fff}.slb-red{background:#dc2626;color:#fff}'
   +'.slb-pay{display:inline-block;padding:6px 14px;border-radius:8px;background:#111827;color:#fff!important;text-decoration:none;font-weight:700}.slb-pay.big{padding:13px 26px;font-size:17px;background:#ff2e88;margin:6px 0 4px}'
   +'.slb-lock{position:fixed;inset:0;z-index:100000;background:rgba(5,6,15,.92);display:flex;align-items:center;justify-content:center;padding:18px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}'
   +'.slb-box{background:#fff;color:#14182b;max-width:440px;width:100%;border-radius:18px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}'
   +'.slb-t{font-size:24px;font-weight:800;color:#dc2626;margin-bottom:6px}.slb-box p{margin:8px 0;line-height:1.5}.slb-s{font-size:13px;color:#4b5563}'
   +'.slb-amt{font-size:34px;font-weight:800;margin:10px 0 6px}.slb-amt span{display:block;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.06em}'
   +'.slb-out{margin-top:10px;background:none;border:0;color:#4b5563;text-decoration:underline;cursor:pointer;font:inherit}';
  document.head.appendChild(css);
  (function poll(){
    var r=role();
    if(!r){if(++tries<40)setTimeout(poll,400);return;}
    if(['owner','admin'].indexOf(r)<0||!window.sb||!window.sb.rpc)return;
    window.sb.rpc('sl_billing_status').then(function(res){if(res&&!res.error)show(res.data);}).catch(function(){});
  })();
})();
</script>

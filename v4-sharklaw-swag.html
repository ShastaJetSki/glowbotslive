<script>
/* Mine/All: one choice shared by every page in this browser tab, Mine by default.
   Only owners, admins and managers see the switch; everyone else is always Mine. */
window.SLScope={ROLES:['owner','admin','manager'],
  can:function(r){return this.ROLES.indexOf(String(r||'').toLowerCase())>=0;},
  get:function(){try{return sessionStorage.getItem('sl-scope')==='all'?'all':'mine';}catch(e){return 'mine';}},
  set:function(m){try{sessionStorage.setItem('sl-scope',m==='all'?'all':'mine');}catch(e){}}};
/* a fresh sign-in starts on Mine */
if(/login\.html$/i.test(location.pathname)){try{sessionStorage.removeItem('sl-scope');}catch(e){}}
</script>
<script>
/* ── SharkLaw V4 style switch ─────────────────────────────────────────
   sl-style: 'legacy' (default until the project goes live) or 'v4'.
   In the v4 style, light/dark is stored separately in 'v4-mode' (light
   by default); the page's own theme code keeps using 'app-theme', and
   this shim quietly redirects it. Logout's localStorage.clear() keeps
   the display settings. */
(function(){
  var LS;try{LS=window.localStorage;}catch(e){return;}
  var P=Storage.prototype,g=P.getItem,s=P.setItem,c=P.clear;
  var st='legacy';try{st=g.call(LS,'sl-style')==='v4'?'v4':'legacy';}catch(e){}
  window.SL_STYLE=st;
  var KEEP=['sl-style','v4-mode','app-theme'];
  P.clear=function(){
    if(this!==LS)return c.call(this);
    var keep={};KEEP.forEach(function(k){var v=g.call(LS,k);if(v!==null)keep[k]=v;});
    c.call(this);Object.keys(keep).forEach(function(k){s.call(LS,k,keep[k]);});
  };
  var m='light';try{m=g.call(LS,'v4-mode')==='dark'?'dark':'light';}catch(e){}
  if(st==='v4'){
    P.getItem=function(k){if(this===LS&&k==='app-theme')return g.call(LS,'v4-mode')==='dark'?'dark':'light';return g.call(this,k);};
    P.setItem=function(k,v){
      if(this===LS&&k==='app-theme'){var md=String(v).indexOf('light')>=0?'light':'dark';s.call(LS,'v4-mode',md);document.documentElement.setAttribute('data-v4mode',md);return;}
      return s.call(this,k,v);
    };
  }
  var h=document.documentElement;h.setAttribute('data-style',st);h.setAttribute('data-v4mode',m);
})();
</script>

  <style>
    :root{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="dark"]{--bg-primary:#0b1220;--bg-secondary:#131c2b;--bg-card:#1b2738;--bg-hover:#26354a;--border-default:#2c3d54;--text-primary:#eef4fb;--text-secondary:#aebccf;--accent-primary:#3b82f6;--accent-light:#60a5fa;}
    [data-theme="light"]{--bg-primary:#f4f6fb;--bg-secondary:#ffffff;--bg-card:#ffffff;--bg-hover:#e8edf6;--border-default:#d3dbe8;--text-primary:#14213a;--text-secondary:#44546c;--accent-primary:#2563eb;--accent-light:#1d4ed8;}
    *{margin:0;padding:0;box-sizing:border-box;}
    html{background:var(--bg-primary);min-height:100%;}
    body{font-family:system-ui;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;}
    .theme-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-default);background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .mobile-top-header{display:none;position:sticky;top:0;z-index:100;background:var(--bg-secondary);border-bottom:1px solid var(--border-default);}
    .mobile-header-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:12px;}
    .mobile-menu-toggle{background:transparent;border:none;color:var(--text-secondary);font-size:20px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .mobile-header-center{flex:1;}
    .mobile-header-title{font-size:18px;font-weight:600;}
    .mobile-menu-content{max-height:0;overflow:hidden;transition:max-height 0.3s ease;background:var(--bg-primary);border-top:1px solid var(--border-default);}
    .mobile-menu-content.expanded{max-height:200px;}
    .mobile-header-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 12px 12px;}
    .mobile-header-actions button{padding:10px;font-size:13px;background:color-mix(in srgb,var(--accent-primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent-primary) 30%,transparent);color:var(--accent-light);border-radius:8px;cursor:pointer;}
    .desktop-header{position:sticky;top:0;z-index:100;background:var(--bg-primary);border-bottom:1px solid var(--border-default);}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg-card);border:1px solid var(--accent-primary);color:var(--text-primary);padding:10px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s;}
    .toast.show{opacity:1;}
    .mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-secondary);padding:8px;z-index:100;border-top:1px solid var(--border-default);}
    .mobile-nav-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
    .mobile-nav-row:last-child{margin-bottom:0;}
    .mobile-nav-row.three-col{grid-template-columns:1fr 1fr 1fr;}
    .mobile-nav-btn{padding:10px 8px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:44px;}
    .mobile-nav-btn.active{background:color-mix(in srgb,var(--accent-primary) 60%,transparent);border-color:var(--accent-primary);color:var(--text-primary);}
    @media(max-width:768px){
      .desktop-header{display:none!important;}
      .mobile-top-header{display:block;}
      .mobile-bottom-nav{display:block!important;}
      body{padding-bottom:120px;}
      .fr2{grid-template-columns:1fr;}
      .modal-overlay{align-items:flex-end;padding:0;}
      .modal-box{border-radius:20px 20px 0 0;max-height:92vh;}
    }
    @media(min-width:769px){.mobile-top-header{display:none!important;}.mobile-bottom-nav{display:none!important;}}
    .page-wrap{max-width:1200px;margin:0 auto;padding:16px 16px 100px;}
    .kpi-row{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;}
    .kpi-row::-webkit-scrollbar{display:none;}
    .kpi-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;padding:12px 16px;text-align:center;position:relative;overflow:hidden;flex:1;min-width:100px;white-space:nowrap;}
    .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
    .kpi-card.blue::before{background:#3b82f6;} .kpi-card.green::before{background:#22c55e;}
    .kpi-card.amber::before{background:#f59e0b;} .kpi-card.purple::before{background:#8b5cf6;}
    .kpi-card.red::before{background:#ef4444;}
    .kpi-val{font-size:22px;font-weight:800;color:var(--text-primary);line-height:1;}
    .kpi-lbl{font-size:10px;color:var(--text-secondary);margin-top:4px;text-transform:uppercase;letter-spacing:.4px;}
    .tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border-default);margin-bottom:16px;}
    .tab-btn{padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;}
    .tab-btn.active{color:var(--accent-primary);border-bottom-color:var(--accent-primary);}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
    .search-inp{flex:1;min-width:180px;padding:8px 12px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font-size:14px;}
    .btn-add{padding:8px 16px;border-radius:8px;background:var(--accent-primary);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;}
    .btn-add:hover{opacity:.9;}
    .inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
    .inv-card{background:var(--bg-card);border:1px solid var(--border-default);border-radius:10px;padding:14px;cursor:pointer;transition:transform .1s,border-color .15s;}
    .inv-card:hover{transform:translateY(-2px);border-color:var(--accent-primary);}
    .inv-card.out{border-left:4px solid #ef4444;} .inv-card.low{border-left:4px solid #f59e0b;} .inv-card.good{border-left:4px solid #22c55e;}
    .inv-name{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:4px;}
    .inv-desc{font-size:11px;color:var(--text-secondary);margin-bottom:10px;text-transform:uppercase;letter-spacing:.4px;}
    .inv-qty-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
    .inv-qty{font-size:26px;font-weight:800;}
    .inv-qty.out{color:#ef4444;} .inv-qty.low{color:#f59e0b;} .inv-qty.good{color:#22c55e;}
    .inv-qty-lbl{font-size:11px;color:var(--text-secondary);}
    .inv-bar-wrap{height:4px;background:var(--bg-hover);border-radius:2px;margin-bottom:8px;overflow:hidden;}
    .inv-bar{height:100%;border-radius:2px;}
    .inv-val{font-size:11px;color:var(--text-secondary);margin-bottom:8px;}
    .given-table{width:100%;border-collapse:collapse;}
    .given-table th{text-align:left;padding:8px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);border-bottom:1px solid var(--border-default);}
    .given-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border-default);}
    .given-table tr:hover td{background:var(--bg-hover);}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:20px;}
    .modal-overlay.active{display:flex;}
    .modal-box{background:var(--bg-card);border:1px solid var(--border-default);border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border-default);}
    .modal-title{font-size:16px;font-weight:700;}
    .modal-x{background:none;border:none;color:var(--text-secondary);font-size:22px;cursor:pointer;}
    .modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
    .modal-foot{padding:14px 20px;border-top:1px solid var(--border-default);display:flex;gap:10px;}
    .fg{display:flex;flex-direction:column;gap:5px;}
    .fl{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;}
    .fi,.fsel,.fta{padding:9px 12px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-primary);color:var(--text-primary);font-size:14px;width:100%;}
    .fta{min-height:70px;resize:vertical;}
    .fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn-primary{padding:10px 20px;border-radius:8px;background:var(--accent-primary);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;flex:1;}
    .btn-danger{padding:10px 20px;border-radius:8px;background:#dc2626;color:#fff;border:none;font-size:14px;cursor:pointer;}
    .btn-secondary{padding:10px 20px;border-radius:8px;background:transparent;border:1px solid var(--border-default);color:var(--text-secondary);font-size:14px;cursor:pointer;flex:1;}
    .empty-state{text-align:center;padding:40px;color:var(--text-secondary);font-size:14px;grid-column:1/-1;}
    .contact-drop{position:absolute;top:100%;left:0;right:0;background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:8px;z-index:500;max-height:220px;overflow-y:auto;margin-top:4px;box-shadow:0 4px 20px rgba(0,0,0,.4);display:none;}
    .cdr{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--border-default);}
    .cdr:hover{background:var(--bg-hover);}
  /* ── Shared board layout (Pipeline + Leads) ── */
.bx-page{max-width:1280px;margin:0 auto;padding:14px 24px 16px;display:flex;flex-direction:column;gap:12px;}
.bx-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.bx-toolbar .bx-grow{flex:1 1 140px;min-width:120px;}
.bx-toolbar input[type=text],.bx-toolbar select{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--border-default);background:var(--bg-card);color:var(--text-primary);font:inherit;font-size:13px;}
.bx-toolbar input[type=text]{width:100%;}
.bx-toolbar select{cursor:pointer;max-width:150px;padding:0 8px;}
.bx-seg{display:inline-flex;border:1px solid var(--border-default);background:var(--bg-card);border-radius:999px;padding:3px;gap:2px;flex-shrink:0;}
.bx-seg button{border:0;background:transparent;color:var(--text-secondary);font:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.bx-seg button.on,.bx-seg button.active{background:var(--accent-primary);color:#fff;}
.bx-chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);cursor:pointer;user-select:none;white-space:nowrap;padding:0 4px;}
.bx-chk input{width:16px;height:16px;accent-color:var(--accent-primary);}
.bx-count{font-size:12px;color:var(--text-secondary);white-space:nowrap;}
.bx-primary{height:38px;padding:0 16px;border-radius:10px;border:0;background:var(--accent-primary);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:auto;text-decoration:none;display:inline-flex;align-items:center;}
.bx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;}
.bx-kpis .kpi-pill{background:var(--bg-card);border:1px solid var(--border-default);border-radius:12px;padding:12px 14px;min-height:76px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.bx-kpis .kpi-pill[onclick]{cursor:pointer;}
.bx-kpis .kpi-val{font-size:24px;font-weight:800;line-height:1.1;color:var(--text-primary);}
.bx-kpis .kpi-lbl{font-size:12px;color:var(--text-secondary);line-height:1.3;}
.bx-kpis .kpi-pill.v4-hot .kpi-val{color:#dc2626;}
.bx-kpis .kpi-pill.v4-warm .kpi-val{color:#c2410c;}

/* board */
.bx-board{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;align-items:stretch;min-height:420px;padding-bottom:4px;scrollbar-width:thin;}
.bx-col{flex:1 1 0;min-width:190px;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg-card) 55%,transparent);border:1px solid var(--border-default);border-top:4px solid var(--bx-c,#6b7280);border-radius:12px;min-height:0;transition:box-shadow .12s,background .12s;}
.bx-col-h{display:flex;align-items:center;gap:6px;padding:10px 12px 8px;font-size:13px;font-weight:700;color:var(--text-primary);border-bottom:1px solid var(--border-default);}
.bx-col-h .bx-t{flex:1;min-width:0;line-height:1.2;overflow-wrap:anywhere;}
.bx-n{font-size:12px;font-weight:700;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--bg-hover);color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;}
.bx-due{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,#f59e0b 22%,transparent);color:#b45309;white-space:nowrap;}
[data-theme="dark"] .bx-due,html[data-v4mode="dark"] .bx-due{color:#fbbf24;}
.bx-col-b{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:60px;scrollbar-width:thin;}
.bx-empty{font-size:12px;color:var(--text-secondary);text-align:center;padding:18px 6px;border:1px dashed var(--border-default);border-radius:10px;}
.bx-note{font-size:11px;color:var(--text-secondary);text-align:center;padding:6px;border:1px dashed var(--border-default);border-radius:8px;}
.bx-col.bx-over{box-shadow:0 0 0 2px var(--bx-c,var(--accent-primary));background:color-mix(in srgb,var(--bx-c,#3b82f6) 10%,var(--bg-card));}

/* cards */
.bx-card{position:relative;background:color-mix(in srgb,var(--bx-m,#6b7280) 9%,var(--bg-card));border:1px solid var(--border-default);border-left:4px solid var(--bx-m,#6b7280);border-radius:10px;padding:9px 10px 8px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:box-shadow .12s,transform .12s;}
.bx-card:hover{box-shadow:0 2px 10px rgba(15,17,32,.12);}
.bx-card[data-drag-id]{cursor:grab;}
.bx-top{display:flex;align-items:baseline;gap:8px;min-width:0;}
.bx-name{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bx-ref{font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48%;}
.bx-sub{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bx-foot{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--text-secondary);min-width:0;}
.bx-who{flex:1;min-width:0;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.bx-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg-hover);color:var(--text-secondary);white-space:nowrap;text-transform:none;}
.bx-badge.due{background:color-mix(in srgb,#f59e0b 22%,transparent);color:#b45309;}
.bx-badge.over,.bx-badge.u-urgent{background:color-mix(in srgb,#dc2626 16%,transparent);color:#b91c1c;}
.bx-badge.u-high{background:color-mix(in srgb,#f59e0b 22%,transparent);color:#b45309;}
[data-theme="dark"] .bx-badge.due,[data-theme="dark"] .bx-badge.u-high,html[data-v4mode="dark"] .bx-badge.due,html[data-v4mode="dark"] .bx-badge.u-high{color:#fbbf24;}
[data-theme="dark"] .bx-badge.over,[data-theme="dark"] .bx-badge.u-urgent,html[data-v4mode="dark"] .bx-badge.over,html[data-v4mode="dark"] .bx-badge.u-urgent{color:#fca5a5;}
.bx-lifted{opacity:.35;}
.bx-ghost{position:fixed;z-index:5000;pointer-events:none;box-shadow:0 14px 34px rgba(15,17,32,.28);opacity:.96;margin:0;}
html.bx-dragging,html.bx-dragging *{cursor:grabbing!important;user-select:none!important;}

/* insights */
.bx-insights{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.bx-panel{background:var(--bg-card);border:1px solid var(--border-default);border-radius:12px;overflow:hidden;min-width:0;}
.bx-panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border-default);}
.bx-panel-t{font-size:15px;font-weight:700;color:var(--text-primary);}
.bx-panel-s{font-size:12px;color:var(--text-secondary);}
.bx-panel-b{padding:12px 16px;}
.bx-bar{display:grid;grid-template-columns:160px 1fr 112px;gap:10px;align-items:center;padding:7px 0;font-size:13px;color:var(--text-primary);}
.bx-bar .lbl{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bx-bar .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.bx-bar .trk{height:14px;background:var(--bg-hover);border-radius:999px;overflow:hidden;}
.bx-bar .fil{height:100%;border-radius:999px;}
.bx-bar .num{text-align:right;font-size:12px;color:var(--text-secondary);line-height:1.25;}
.bx-bar .num b{color:var(--text-primary);font-size:13px;}
.bx-tbl{width:100%;border-collapse:collapse;font-size:13px;color:var(--text-primary);}
.bx-tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);text-align:left;font-weight:700;padding:8px 6px;border-bottom:1px solid var(--border-default);}
.bx-tbl td{padding:9px 6px;border-bottom:1px solid var(--border-default);}
.bx-tbl .n{text-align:right;}
.bx-tbl tr.click{cursor:pointer;}
.bx-tbl tr.click:hover td{background:var(--bg-hover);}
.bx-foot-note{font-size:12px;color:var(--text-secondary);margin-top:8px;}

/* stage tabs: phones only */
.bx-tabs{display:none;}
@media(max-width:768px){
  .bx-page{padding:10px 12px 16px;gap:10px;}
  .bx-toolbar select{flex:1 1 40%;max-width:none;}
  .bx-toolbar{gap:6px;}

.v4h-extra .view-toggle{background:rgba(255,255,255,.06)!important;border-color:#363a58!important;}
.v4h-extra .vt-btn{color:#c4cbe0!important;}
.v4h-extra .vt-btn.active{background:#0404f4!important;color:#fff!important;}
.v4h-extra .hdr-btn{height:36px;border-radius:10px;border:1px solid #363a58;background:transparent;color:#fff;padding:0 12px;font-size:13px;font-family:inherit;cursor:pointer;}
/* archive: the old navy bar becomes the page heading area under the standard header */
html[data-style="v4"] .top{background:var(--bg-primary)!important;border-bottom:1px solid var(--border-default)!important;position:static!important;}

/* Mine/All on phones: right under the phone header */
.v4-mscope{display:none;}

  html[data-style="v4"] .v4-mscope .view-toggle{display:flex!important;border:1px solid var(--border-default);border-radius:20px;overflow:hidden;background:var(--bg-card);}

}
/* scheduler's phone header bar had its own white background */

/* ═════ V4 design system: KPI blocks, cards and page layout matched to the Overview ═════ */

/* page width + spacing (Overview: 1280px, 22px 24px) */
html[data-style="v4"] .main,html[data-style="v4"] .page-wrap,html[data-style="v4"] .wrap,html[data-style="v4"] .builder-content{max-width:1280px!important;margin-left:auto!important;margin-right:auto!important;padding:20px 24px 40px!important;}
html[data-style="v4"] .content{max-width:1000px!important;padding:22px 24px 40px!important;}
html[data-style="v4"] .profile-wrap{max-width:1000px!important;margin:0 auto;padding:20px 24px 40px!important;}

/* page heading (eyebrow + large title) */
html[data-style="v4"] .greeting-bar{background:transparent!important;border:none!important;max-width:1280px;margin:0 auto;padding:22px 24px 6px!important;}
html[data-style="v4"] .greeting-time{font-size:13px!important;font-weight:600;color:var(--text-secondary)!important;text-transform:uppercase;letter-spacing:.08em!important;}
html[data-style="v4"] .greeting-name{font-size:32px!important;font-weight:800!important;letter-spacing:-.02em;line-height:1.1;margin-top:4px;}

/* ───── KPI blocks: big number, label underneath, left aligned ───── */
html[data-style="v4"] .kpi-bar{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px!important;max-width:1280px;margin:0 auto!important;padding:14px 24px 4px!important;overflow:visible!important;background:transparent!important;border:none!important;}
html[data-style="v4"] .kpi-row{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px!important;overflow:visible!important;margin-bottom:18px!important;}
html[data-style="v4"] .kpi-pill,html[data-style="v4"] .kpi-card,html[data-style="v4"] .kpi-item,html[data-style="v4"] .lead-kpi{
  display:flex!important;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;text-align:left!important;
  padding:14px 16px!important;min-height:92px;min-width:0!important;white-space:normal!important;
  background:var(--bg-card)!important;border:1px solid var(--border-default)!important;border-radius:14px!important;box-shadow:var(--v4-shadow);}
html[data-style="v4"] .kpi-card::before{display:none!important;}
html[data-style="v4"] .kpi-val,html[data-style="v4"] .kpi-value,html[data-style="v4"] .lead-kpi .v{font-size:28px!important;font-weight:800!important;line-height:1.1!important;letter-spacing:-.01em;color:var(--text-primary)!important;text-align:left!important;}
html[data-style="v4"] .kpi-lbl,html[data-style="v4"] .kpi-label,html[data-style="v4"] .lead-kpi .l{font-size:13px!important;font-weight:500!important;color:var(--text-secondary)!important;text-transform:none!important;letter-spacing:0!important;margin-top:4px!important;text-align:left!important;line-height:1.3;}
html[data-style="v4"] .kpi-pill[onclick],html[data-style="v4"] .kpi-pill[style*="cursor"]{cursor:pointer;}
html[data-style="v4"] .kpi-pill:hover,html[data-style="v4"] .kpi-card:hover{border-color:var(--accent-light)!important;}
/* needs-attention colouring, same as the Overview */
html[data-style="v4"] .v4-hot{background:var(--v4-danger-soft)!important;border-color:color-mix(in srgb,var(--v4-danger) 40%,var(--border-default))!important;}
html[data-style="v4"] .v4-hot .kpi-val{color:var(--v4-danger)!important;}
html[data-style="v4"] .v4-warm{background:var(--v4-warn-soft)!important;border-color:color-mix(in srgb,var(--v4-warn) 35%,var(--border-default))!important;}
html[data-style="v4"] .v4-warm .kpi-val{color:var(--v4-warn)!important;}
html[data-style="v4"] .v4-clear .kpi-val{color:var(--v4-ok)!important;}
html[data-style="v4"] .lead-kpis{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))!important;gap:10px!important;}

/* contacts: total / showing / mine / pipeline / partners as KPI blocks (still clickable filters) */
html[data-style="v4"] .stats-bar{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px!important;margin:6px 0 14px!important;}
html[data-style="v4"] .stat-chip{display:flex!important;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px!important;min-height:84px;font-size:13px!important;font-weight:500;color:var(--text-secondary)!important;border-radius:14px!important;cursor:pointer;}
html[data-style="v4"] .stat-chip span{display:block;font-size:28px!important;font-weight:800!important;line-height:1.1;color:var(--text-primary)!important;}
html[data-style="v4"] .stat-chip.active{border-color:var(--accent-light)!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent-primary) 25%,transparent)!important;}
html[data-style="v4"] .stat-chip.active,html[data-style="v4"] .stat-chip.active span{background:var(--bg-card)!important;color:var(--text-primary)!important;}
html[data-style="v4"] .stats-bar .btn-add{align-self:center;}

/* ───── cards: header bar + title like the Overview ───── */
html[data-style="v4"] .dash-section,html[data-style="v4"] .today-card,html[data-style="v4"] .sec-card,html[data-style="v4"] .panel,html[data-style="v4"] .card,html[data-style="v4"] .hero-card,html[data-style="v4"] .inv-card,html[data-style="v4"] .settings-panel{background:var(--bg-card)!important;border:1px solid var(--border-default)!important;border-radius:14px!important;box-shadow:var(--v4-shadow)!important;overflow:hidden;}
html[data-style="v4"] .dash-section{margin-top:16px!important;}
html[data-style="v4"] .twin-wrap,html[data-style="v4"] .today-cards-wrap{gap:16px!important;margin-bottom:0!important;margin-top:16px;}
html[data-style="v4"] .twin-wrap .dash-section{margin-top:0!important;}
html[data-style="v4"] .sec-header,html[data-style="v4"] .today-card-header,html[data-style="v4"] .panel-h,html[data-style="v4"] .sec-head,html[data-style="v4"] .card-header,html[data-style="v4"] .twin-wrap .sec-header{padding:14px 18px!important;border-bottom:1px solid var(--border-default)!important;background:var(--bg-card)!important;}
html[data-style="v4"] .sec-title,html[data-style="v4"] .panel-t,html[data-style="v4"] .card-header h2,html[data-style="v4"] .today-card-title{font-size:16px!important;font-weight:700!important;color:var(--text-primary)!important;text-transform:none!important;letter-spacing:0!important;}
html[data-style="v4"] .sec-link,html[data-style="v4"] .panel-h a,html[data-style="v4"] .sec-head a,html[data-style="v4"] .sec-edit-btn{font-size:13px!important;font-weight:600!important;color:var(--accent-light)!important;text-decoration:none;}
html[data-style="v4"] .dash-section-body,html[data-style="v4"] .panel-b,html[data-style="v4"] .sec-body,html[data-style="v4"] .card-inner{padding:14px 18px!important;}
html[data-style="v4"] .dash-section-body.collapsed{padding:0!important;}
html[data-style="v4"] .today-card-count,html[data-style="v4"] .emp-count,html[data-style="v4"] .role-group-count{background:var(--bg-hover)!important;border:1px solid var(--border-default)!important;color:var(--text-secondary)!important;font-weight:700;}
html[data-style="v4"] .today-dot{display:none;}
html[data-style="v4"] .drag-hint{display:none;}
html[data-style="v4"] .empty-state{background:transparent!important;border:none!important;color:var(--text-secondary)!important;padding:20px 8px!important;}

/* rows inside cards: divider list, team colour kept on the left edge */
html[data-style="v4"] .task-item,html[data-style="v4"] .inbox-item,html[data-style="v4"] .emp-row{background:var(--bg-card)!important;border:1px solid var(--border-default)!important;box-shadow:none!important;min-height:48px;}
html[data-style="v4"] .inbox-item.unread{background:color-mix(in srgb,var(--accent-primary) 6%,var(--bg-card))!important;border-left:3px solid var(--accent-primary)!important;}
html[data-style="v4"] .task-item.is-overdue{border-left:3px solid var(--v4-danger)!important;}
html[data-style="v4"] .task-due.overdue{color:var(--v4-danger)!important;}
html[data-style="v4"] .week-day{background:var(--bg-card)!important;border:1px solid var(--border-default)!important;border-radius:12px!important;}
html[data-style="v4"] .week-day.today-col{border-color:var(--accent-light)!important;background:color-mix(in srgb,var(--accent-primary) 5%,var(--bg-card))!important;}
html[data-style="v4"] .week-day-label{color:var(--text-primary)!important;font-size:12px!important;}
html[data-style="v4"] .followup-item{border-radius:10px!important;}
html[data-style="v4"] .today-item{border-radius:10px!important;background:var(--bg-card)!important;border:1px solid var(--border-default)!important;}

/* profiles */
html[data-style="v4"] .hero-card{padding:18px 20px!important;}
html[data-style="v4"] .hero-name{font-size:26px!important;font-weight:800!important;letter-spacing:-.01em;}
html[data-style="v4"] .info-lbl{font-size:11px!important;font-weight:700!important;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary)!important;}
html[data-style="v4"] .stage-dots{display:grid!important;grid-template-columns:repeat(7,1fr);gap:2px!important;padding:18px 14px!important;}
html[data-style="v4"] .stage-dot-wrap{position:relative;padding:2px;gap:8px!important;}
html[data-style="v4"] .stage-dot-wrap::before{content:'';position:absolute;top:13px;left:-50%;right:50%;height:3px;border-radius:2px;background:var(--border-default);z-index:0;}
html[data-style="v4"] .stage-dot-wrap:first-child::before{display:none;}
html[data-style="v4"] .stage-dot{width:24px!important;height:24px!important;position:relative;z-index:1;background:var(--bg-card);display:flex;align-items:center;justify-content:center;}
html[data-style="v4"] .stage-dot.completed,html[data-style="v4"] .stage-dot.current{background:currentColor;}
html[data-style="v4"] .stage-dot-lbl{font-size:12px!important;font-weight:500;color:var(--text-primary)!important;max-width:none!important;}
@media(max-width:600px){html[data-style="v4"] .stage-dot-lbl{font-size:10px!important;}}

/* swag tabs, settings, leads toolbar */
html[data-style="v4"] .tab-btn.active,html[data-style="v4"] .tab.active{color:var(--accent-light)!important;border-bottom-color:var(--accent-primary)!important;}
html[data-style="v4"] .card-header:hover{background:var(--bg-hover)!important;}
html[data-style="v4"] .toolbar,html[data-style="v4"] .pipeline-toolbar,html[data-style="v4"] .filter-bar{max-width:1280px;margin:0 auto;padding:14px 24px 4px!important;}
html[data-style="v4"] .stage-summary{padding:14px 24px 6px!important;}

@media(max-width:768px){
  html[data-style="v4"] .kpi-bar{grid-template-columns:1fr 1fr;padding:12px 14px 4px!important;gap:10px!important;}
  html[data-style="v4"] .kpi-row,html[data-style="v4"] .stats-bar{grid-template-columns:1fr 1fr!important;gap:10px!important;}
  html[data-style="v4"] .kpi-pill,html[data-style="v4"] .kpi-card,html[data-style="v4"] .stat-chip{min-height:80px;padding:12px 14px!important;}
  html[data-style="v4"] .kpi-val,html[data-style="v4"] .stat-chip span{font-size:24px!important;}
  html[data-style="v4"] .main,html[data-style="v4"] .page-wrap,html[data-style="v4"] .wrap,html[data-style="v4"] .content,html[data-style="v4"] .profile-wrap{padding:14px 14px 30px!important;}
  html[data-style="v4"] .greeting-bar{padding:16px 14px 4px!important;}
  html[data-style="v4"] .greeting-name{font-size:26px!important;}
  html[data-style="v4"] .toolbar,html[data-style="v4"] .pipeline-toolbar,html[data-style="v4"] .filter-bar,html[data-style="v4"] .stage-summary{padding:12px 14px 4px!important;}
  html[data-style="v4"] .stats-bar .mobile-add-btn{grid-column:1/-1;justify-content:center;}
}

/* header icon buttons always draw as outline icons */
html[data-style="v4"] .desktop-header .theme-btn svg,html[data-style="v4"] .mobile-top-header .theme-btn svg,html[data-style="v4"] .desktop-header .theme-toggle-btn svg,html[data-style="v4"] .mobile-top-header .theme-toggle-btn svg{width:20px!important;height:20px!important;stroke:#fff!important;fill:none!important;stroke-width:2;}

</style>

<script>/* ── Shared board helpers (Pipeline + Leads) ──────────────────────────────
   BX.drag(root, {canDrag(card), onDrop(id, stage, card)})
     cards:   [data-drag-id]       drop targets: [data-drop-stage]
     mouse:   press and move 6px to pick up
     touch:   hold 0.35s, then drag (a quick swipe still scrolls)
   After a drag the click that follows is swallowed so cards don't open. */
window.BX = (function () {
  var S = null, swallowClick = false;

  function targetAt(x, y) {
    var el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('[data-drop-stage]') : null;
  }
  function setOver(t) {
    if (S.over === t) return;
    if (S.over) S.over.classList.remove('bx-over');
    S.over = t;
    if (t && t.getAttribute('data-drop-stage') !== S.from) t.classList.add('bx-over');
  }
  function start() {
    var r = S.card.getBoundingClientRect();
    var g = S.card.cloneNode(true);
    g.classList.add('bx-ghost');
    g.removeAttribute('id');
    g.style.width = r.width + 'px';
    g.style.left = r.left + 'px';
    g.style.top = r.top + 'px';
    document.body.appendChild(g);
    S.ghost = g; S.dx = S.x0 - r.left; S.dy = S.y0 - r.top; S.active = true;
    S.card.classList.add('bx-lifted');
    document.documentElement.classList.add('bx-dragging');
    if (navigator.vibrate && S.touch) try { navigator.vibrate(12); } catch (e) {}
    move(S.x0, S.y0);
  }
  function autoScroll(x, y) {
    var t = S.over;
    var board = S.root.querySelector('.bx-board');
    if (board) {
      var br = board.getBoundingClientRect();
      if (x < br.left + 40) board.scrollLeft -= 14;
      else if (x > br.right - 40) board.scrollLeft += 14;
    }
    var body = t && t.querySelector('.bx-col-b');
    if (body) {
      var r = body.getBoundingClientRect();
      if (y < r.top + 36) body.scrollTop -= 12;
      else if (y > r.bottom - 36) body.scrollTop += 12;
    }
    if (y < 60) window.scrollBy(0, -12);
    else if (y > window.innerHeight - 60) window.scrollBy(0, 12);
  }
  function move(x, y) {
    S.x = x; S.y = y;
    S.ghost.style.transform = 'translate(' + (x - S.dx - parseFloat(S.ghost.style.left)) + 'px,' + (y - S.dy - parseFloat(S.ghost.style.top)) + 'px) rotate(1.5deg)';
    setOver(targetAt(x, y));
  }
  function end(drop) {
    if (!S) return;
    clearTimeout(S.timer);
    clearInterval(S.scroller);
    var s = S; S = null;
    document.removeEventListener('pointermove', onMove, true);
    document.removeEventListener('pointerup', onUp, true);
    document.removeEventListener('pointercancel', onCancel, true);
    document.removeEventListener('touchmove', onTouchMove, { capture: true, passive: false });
    document.removeEventListener('keydown', onKey, true);
    if (!s.active) return;
    swallowClick = true; setTimeout(function () { swallowClick = false; }, 350);
    if (s.ghost) s.ghost.remove();
    s.card.classList.remove('bx-lifted');
    document.documentElement.classList.remove('bx-dragging');
    if (s.over) s.over.classList.remove('bx-over');
    var to = drop && s.over ? s.over.getAttribute('data-drop-stage') : null;
    if (to && to !== s.from) s.opt.onDrop(s.card.getAttribute('data-drag-id'), to, s.card, s.from);
  }
  function onMove(e) {
    if (!S || e.pointerId !== S.pid) return;
    if (!S.active) {
      var far = Math.abs(e.clientX - S.x0) + Math.abs(e.clientY - S.y0);
      if (S.touch) { if (far > 10) end(false); return; }  /* finger moved before the hold: let it scroll */
      if (far < 6) return;
      start();
    }
    e.preventDefault();
    move(e.clientX, e.clientY);
  }
  function onTouchMove(e) { if (S && S.active) e.preventDefault(); }
  function onUp(e) { if (S && e.pointerId === S.pid) end(true); }
  function onCancel(e) { if (S && e.pointerId === S.pid) end(!!(S.active && S.touch)); }
  function onKey(e) { if (e.key === 'Escape') end(false); }

  function drag(root, opt) {
    if (root._bx) { root._bx.opt = opt; return; }
    root._bx = { opt: opt };
    root.addEventListener('pointerdown', function (e) {
      if (e.button > 0 || S) return;
      var card = e.target.closest('[data-drag-id]');
      if (!card || !root.contains(card)) return;
      if (e.target.closest('button,a,input,select,textarea')) return;
      var o = root._bx.opt;
      if (o.canDrag && !o.canDrag(card)) return;
      var col = card.closest('[data-drop-stage]');
      S = { root: root, opt: o, card: card, pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY,
            touch: e.pointerType !== 'mouse', from: col ? col.getAttribute('data-drop-stage') : card.getAttribute('data-stage') };
      if (S.touch) S.timer = setTimeout(function () { if (S && !S.active) start(); }, 350);
      S.scroller = setInterval(function () { if (S && S.active) { autoScroll(S.x, S.y); setOver(targetAt(S.x, S.y)); } }, 30);
      document.addEventListener('pointermove', onMove, true);
      document.addEventListener('pointerup', onUp, true);
      document.addEventListener('pointercancel', onCancel, true);
      document.addEventListener('touchmove', onTouchMove, { capture: true, passive: false });
      document.addEventListener('keydown', onKey, true);
    });
    /* stop the long-press menu / text selection from fighting the drag */
    root.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-drag-id]') && (S || e.pointerType !== 'mouse')) e.preventDefault(); });
    root.addEventListener('click', function (e) { if (swallowClick) { e.stopPropagation(); e.preventDefault(); } }, true);
  }

  /* Fill the rest of the screen with the board so each column scrolls on its own */
  function fit(board) {
    if (!board) return;
    if (window.innerWidth <= 768) { board.style.height = ''; return; }
    var top = board.getBoundingClientRect().top + window.scrollY;
    board.style.height = Math.max(420, window.innerHeight - top - 16) + 'px';
  }
  function hex(c) { return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(c || '') ? c : '#6b7280'; }
  function pref(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  return { drag: drag, fit: fit, hex: hex, pref: pref };
})();
</script>

/* ── Swag (v4 restructure, same look as Pipeline / Leads) ─────────────────
   Every number on the page comes from the same helpers below, so the KPI row,
   the inventory cards, the Given Log totals and the By Member totals all agree. */
var swagView=['inventory','given','team'].indexOf(BX.pref('swag-view'))>=0?BX.pref('swag-view'):'inventory';
var swagScope='mine',memberById={},contactById={};

function canScope(){return SLScope.can(currentUserRole);}
/* where a record went: picked contact = given out; team member only = handed to staff (internal); neither = needs review */
function recType(g){return g.contact_id?'client':g.assigned_to?'team':'none';}
function isOut(g){return recType(g)==='client';}
function isPopup(g){return /pop[\s\-_]*ups?\b|canopy/i.test(g.item_name||'');}
/* a record with no quantity counts as 1 unit everywhere */
function qtyOf(g){var n=parseInt(g.quantity,10);return isNaN(n)?1:n;}
/* value stored on the record = unit cost × qty when it was given; if it was never stored, use today's unit cost */
function valOf(g){
  if(g.value!==null&&g.value!==undefined&&g.value!==''&&!isNaN(parseFloat(g.value)))return parseFloat(g.value);
  var it=itemFor(g);return it&&it.unit_cost?parseFloat(it.unit_cost)*qtyOf(g):0;
}
function keyName(s){return String(s||'').trim().toLowerCase();}
function itemFor(g){var k=keyName(g.item_name);return allItems.find(function(i){return keyName(i.part_name)===k;})||null;}
/* "2026-11-01" is a calendar day, not midnight UTC — read it as a local date so it never shows a day early */
function gDate(g){var v=g.given_date;if(!v)return null;var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));return m?new Date(+m[1],+m[2]-1,+m[3],12):new Date(v);}
function money(n){n=+n||0;return '$'+n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
/* KPI money is exact (cents included) so it matches the tables; only very large amounts are shortened */
function moneyShort(n){n=+n||0;return n>=100000?'$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k':money(n);}
function fmtMoney(n){return money(n);}
function mName(id){if(!id)return '—';var m=memberById[id];return m?(((m.first_name||'')+' '+(m.last_name||'')).trim()||'Team member')+(m.is_active===false?' (inactive)':''):'Unknown';}
function mColor(id){var m=memberById[id];return BX.hex(m&&m.color);}
function cName(id){if(!id)return '—';var c=contactById[id];if(!c)return 'Removed contact';return ((c.first_name||'')+' '+(c.last_name||'')).trim()||c.organization_name||'Unnamed';}
function stock(i){var n=parseInt(i.quantity_on_hand,10);return isNaN(n)?0:n;}
function reorderAt(i){var n=parseInt(i.reorder_point,10);return isNaN(n)?5:n;}
function stockState(i){var q=stock(i);return q<=0?'out':q<=reorderAt(i)?'low':'good';}

function rangeStart(){
  var v=document.getElementById('swRange').value,n=new Date();
  if(v==='month')return new Date(n.getFullYear(),n.getMonth(),1);
  if(v==='30')return new Date(n.getFullYear(),n.getMonth(),n.getDate()-29);
  if(v==='ytd')return new Date(n.getFullYear(),0,1);
  if(v==='last')return new Date(n.getFullYear()-1,0,1);
  return null;
}
function rangeEnd(){var v=document.getElementById('swRange').value,n=new Date();return v==='last'?new Date(n.getFullYear(),0,1):null;}
function rangeLabel(){var o=document.getElementById('swRange');return o.options[o.selectedIndex].text;}
function inRange(g){var s=rangeStart(),e=rangeEnd(),d=gDate(g);if(!s&&!e)return true;if(!d)return false;return(!s||d>=s)&&(!e||d<e);}
function inScope(g){return swagScope!=='mine'||g.given_by===currentUserId||g.assigned_to===currentUserId;}
/* records for the KPIs: scope + period (no item / rep / search filters) */
function scopedGiven(){return allGiven.filter(function(g){return inScope(g)&&inRange(g);});}
/* records for the Given Log: everything above + the toolbar filters */
function filteredGiven(ignoreKind){
  var it=document.getElementById('givenItemFilter').value,rep=document.getElementById('givenMemberFilter').value;
  var q=keyName(document.getElementById('searchBox').value),kind=document.getElementById('swKind').value;
  return scopedGiven().filter(function(g){
    if(kind&&!ignoreKind&&recType(g)!==kind)return false;
    if(it&&keyName(g.item_name)!==keyName(it))return false;
    if(rep&&g.given_by!==rep&&g.assigned_to!==rep)return false;
    if(q){var hay=[g.item_name,cName(g.contact_id),mName(g.given_by),mName(g.assigned_to),g.notes].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
}
function sumQ(a){return a.reduce(function(s,g){return s+qtyOf(g);},0);}
function sumV(a){return a.reduce(function(s,g){return s+valOf(g);},0);}

function pill(v,l,title,alert){
  var cls='kpi-pill'+(alert&&+String(v).replace(/[^0-9.]/g,'')>0?(alert==='hot'?' v4-hot':' v4-warm'):'');
  return'<div class="'+cls+'"'+(alert?' data-v4-alert="'+alert+'"':'')+(title?' title="'+esc(title)+'"':'')+'><div class="kpi-val">'+v+'</div><div class="kpi-lbl">'+l+'</div></div>';
}
function renderKpis(){
  var all=scopedGiven(),g=all.filter(isOut),pop=g.filter(isPopup),per=rangeLabel(),rev=all.filter(function(x){return recType(x)==='none';});
  var everPop={};allGiven.forEach(function(x){if(inScope(x)&&isPopup(x)&&isOut(x))everPop[x.contact_id]=1;});
  var low=allItems.filter(function(i){return stockState(i)==='low';}).length,out=allItems.filter(function(i){return stockState(i)==='out';}).length;
  var stockVal=allItems.reduce(function(s,i){return s+Math.max(0,stock(i))*(parseFloat(i.unit_cost)||0);},0);
  document.getElementById('swKpis').innerHTML=
     pill(sumQ(pop),'Pop-Ups Given','Pop-up units given to contacts · '+per)
    +pill(moneyShort(sumV(pop)),'Pop-Up Value','Exact: '+money(sumV(pop))+' · '+per)
    +pill(Object.keys(everPop).length,'Contacts with a Pop-Up','Different contacts who have received a pop-up (all time)')
    +pill(sumQ(g),'Swag Given','All items given to contacts, units · '+per)
    +pill(moneyShort(sumV(g)),'Value Given','Exact: '+money(sumV(g))+' · '+per)
    +pill(low,'Low Stock','Items at or below their low-stock alert','warm')
    +pill(out,'Out of Stock','Items with none left','hot')
    +pill(moneyShort(stockVal),'Stock Value','In stock × unit cost · exact '+money(stockVal))
    +'<div class="kpi-pill'+(rev.length?' v4-warm':'')+'" data-v4-alert="warm" style="cursor:pointer;" onclick="showReview()" title="Records with no contact and no team member — not counted above until fixed · '+esc(per)+'"><div class="kpi-val">'+rev.length+'</div><div class="kpi-lbl">Needs Review</div></div>';
}

function renderInventory(){
  var q=keyName(document.getElementById('searchBox').value);
  var list=allItems.filter(function(i){return!q||[i.part_name,i.part_number,i.description].join(' ').toLowerCase().indexOf(q)>=0;});
  var order={out:0,low:1,good:2};
  list.sort(function(a,b){return(order[stockState(a)]-order[stockState(b)])||String(a.part_name||'').localeCompare(String(b.part_name||''));});
  document.getElementById('swCount').textContent=list.length+' item'+(list.length!==1?'s':'');
  if(!list.length){document.getElementById('swMain').innerHTML='<div class="bx-empty">'+(allItems.length?'No items match your search':'No swag items yet — add your first one')+'</div>';return;}
  var g=scopedGiven(),per=rangeLabel();
  document.getElementById('swMain').innerHTML='<div class="sw-grid">'+list.map(function(i){
    var st=stockState(i),qn=stock(i),low=reorderAt(i);
    var col=st==='out'?'#dc2626':st==='low'?'#f59e0b':'#16a34a';
    var mine=g.filter(function(x){return isOut(x)&&keyName(x.item_name)===keyName(i.part_name);});
    var cost=parseFloat(i.unit_cost)||0;
    return '<div class="bx-card sw-card" style="--bx-m:'+col+';" data-iid="'+esc(i.item_id)+'" onclick="openItemModal(this.dataset.iid)" title="Click to edit">'
      +'<div class="bx-top"><span class="bx-name">'+esc(i.part_name||'Unnamed')+'</span>'+(i.part_number?'<span class="bx-ref">'+esc(i.part_number)+'</span>':'')+'</div>'
      +'<div class="bx-sub">'+esc(i.description||'No description')+'</div>'
      +'<div class="sw-stock"><div><div class="sw-n" style="color:'+col+'">'+qn+'</div><div class="sw-l">in stock · alert at '+low+'</div></div>'
        +'<span class="bx-badge '+(st==='out'?'over':st==='low'?'due':'')+'">'+(st==='out'?'Out of stock':st==='low'?'Low stock':'In stock')+'</span></div>'
      +'<div class="sw-bar"><span style="width:'+(qn>0?Math.min(100,Math.round(qn/Math.max(qn,low*2,1)*100)):0)+'%;background:'+col+'"></span></div>'
      +'<div class="bx-foot"><span class="bx-who">'+(cost?money(cost)+' each':'No cost set')+'</span><span title="'+esc(per)+'">'+sumQ(mine)+' given · '+money(sumV(mine))+'</span></div>'
      +'<button class="sw-give" data-gid="'+esc(i.item_id)+'" onclick="event.stopPropagation();openGiveModal(this.dataset.gid)">Give Swag</button>'
    +'</div>';
  }).join('')+'</div>';
}

function fmtDay(g){var d=gDate(g);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';}
function canEdit(){return ['owner','admin'].indexOf(String(currentUserRole||'').toLowerCase())>=0;}
function wentTo(g){var t=recType(g);
  if(t==='client')return esc(cName(g.contact_id));
  if(t==='team')return '<span class="bx-badge" title="Handed to a team member — not counted as given out">To team</span>';
  return '<span class="bx-badge due" title="No contact or team member recorded — not counted until fixed">Needs review</span>';}
function renderGiven(){
  var list=filteredGiven().slice().sort(function(a,b){return(gDate(b)||0)-(gDate(a)||0);});
  document.getElementById('swCount').textContent=list.length+' record'+(list.length!==1?'s':'');
  var ed=canEdit();

/* Supabase hands back at most 1,000 rows per request — page through so totals include everything */
async function fetchEvery(build){
  var size=1000,r0=await build().range(0,size-1);if(r0.error)return r0;var out=r0.data||[];if(out.length<size)return{data:out,error:null};
  for(var p=1,B=4;p<200;p+=B){var batch=[];for(var k=0;k<B;k++)batch.push(build().range((p+k)*size,(p+k+1)*size-1));var rs=await Promise.all(batch),done=false;
    for(var k=0;k<rs.length;k++){if(rs[k].error)return{data:out,error:rs[k].error};var rows=rs[k].data||[];out=out.concat(rows);if(rows.length<size){done=true;break;}}if(done)break;}
  return{data:out,error:null};
}
async function loadAll(){
  var res=await Promise.all([
    fetchEvery(function(){return sb.from('swag_inventory').select('*').eq('tenant_id',TENANT).order('part_name').order('item_id');}),
    fetchEvery(function(){return sb.from('swag_given').select('*').eq('tenant_id',TENANT).order('given_date',{ascending:false}).order('created_at',{ascending:false});}),
    /* every contact (removed ones too) so old gifts still show a name; the picker only offers active ones */
    fetchEvery(function(){return sb.from('contacts').select('contact_id,first_name,last_name,organization_name,funnel_stage,assigned_to,is_deleted').eq('tenant_id',TENANT).order('contact_id');})
  ]);
  if(res[1].error&&/created_at/.test(res[1].error.message||''))res[1]=await fetchEvery(function(){return sb.from('swag_given').select('*').eq('tenant_id',TENANT).order('given_date',{ascending:false});});
  [['inventory',res[0]],['given log',res[1]],['contacts',res[2]]].forEach(function(p){if(p[1].error)showToast('Could not load '+p[0]+': '+p[1].error.message);});
  allItems=res[0].data||[];allGiven=res[1].data||[];
  contactById={};(res[2].data||[]).forEach(function(c){contactById[c.contact_id]=c;});
  allContacts=(res[2].data||[]).filter(function(c){return c.is_deleted!==true;});
  updateFilters();renderAll();
}

   Changing a record here does not change stock on hand. */
var editGivenIdx=-1;
function givenPk(g){return ['id','given_id','swag_given_id','record_id','uuid'].find(function(k){return g&&g[k]!==undefined&&g[k]!==null;});}
function ensureGivenModal(){
  if(document.getElementById('givenEdit'))return;
  var d=document.createElement('div');d.className='modal-overlay';d.id='givenEdit';
  d.innerHTML='<div class="modal-box"><div class="modal-head"><div class="modal-title">Correct Swag Record</div><button class="modal-x" onclick="closeGivenEdit()">&times;</button></div>'
   +'<div class="modal-body">'
   +'<div class="fr2"><div class="fg"><label class="fl">Date</label><input type="date" class="fi" id="geDate"></div><div class="fg"><label class="fl">Item</label><input type="text" class="fi" id="geItem" list="geItems"><datalist id="geItems"></datalist></div></div>'
   +'<div class="fr2"><div class="fg"><label class="fl">Quantity</label><input type="number" class="fi" id="geQty" min="0" step="1"></div><div class="fg"><label class="fl">Total value ($)</label><input type="number" class="fi" id="geVal" min="0" step="0.01"><div style="font-size:11px;color:var(--text-secondary);margin-top:4px;" id="geValHint"></div></div></div>'
   +'<div class="fg"><label class="fl">Given to (contact)</label><input type="text" class="fi" id="geContact" list="geContacts" placeholder="Leave empty if it went to a team member"><datalist id="geContacts"></datalist></div>'
   +'<div class="fr2"><div class="fg"><label class="fl">Given by</label><select class="fsel" id="geBy"></select></div><div class="fg"><label class="fl">Assigned to (team member)</label><select class="fsel" id="geTo"></select></div></div>'
   +'<div class="fg" id="geNotesWrap"><label class="fl">Notes</label><textarea class="fta" id="geNotes"></textarea></div>'
   +'<div style="font-size:12px;color:var(--text-secondary);">Fixing a record here doesn’t change stock on hand.</div>'
   +'<div id="geMsg" style="font-size:13px;color:#ef4444;margin-top:6px;"></div></div>'
   +'<div class="modal-foot"><button class="btn-primary" onclick="saveGivenEdit()">Save</button><button class="btn-danger" onclick="deleteGiven()">Delete record</button><button class="btn-secondary" onclick="closeGivenEdit()">Cancel</button></div></div>';
  document.body.appendChild(d);
  document.getElementById('geQty').addEventListener('input',geHint);document.getElementById('geItem').addEventListener('input',geHint);
}
function contactLabel(c){var n=((c.first_name||'')+' '+(c.last_name||'')).trim()||c.organization_name||'Unnamed';return n+(c.organization_name&&n!==c.organization_name?' — '+c.organization_name:'');}
function geHint(){var it=allItems.find(function(i){return keyName(i.part_name)===keyName(document.getElementById('geItem').value);});var q=parseInt(document.getElementById('geQty').value,10);
  document.getElementById('geValHint').textContent=it&&it.unit_cost&&!isNaN(q)?'At today’s cost: '+money(q*parseFloat(it.unit_cost))+' ('+money(parseFloat(it.unit_cost))+' each)':'';}
function openGivenEdit(idx){
  if(!canEdit())return;
  var g=allGiven[idx];if(!g)return;
  if(!givenPk(g)){showToast('This record has no id column, so it can’t be edited here.');return;}
  ensureGivenModal();editGivenIdx=idx;
  var d=gDate(g);document.getElementById('geDate').value=d?d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'):'';
  document.getElementById('geItems').innerHTML=allItems.map(function(i){return'<option value="'+esc(i.part_name||'')+'">';}).join('');
  document.getElementById('geItem').value=g.item_name||'';
  document.getElementById('geQty').value=g.quantity==null?'':g.quantity;
  document.getElementById('geVal').value=g.value==null?'':g.value;
  var opts=allContacts.slice().sort(function(a,b){return contactLabel(a).localeCompare(contactLabel(b));});
  window._geMap={};document.getElementById('geContacts').innerHTML=opts.map(function(c){var l=contactLabel(c);window._geMap[l]=c.contact_id;return'<option value="'+esc(l)+'">';}).join('');
  var cur=g.contact_id&&contactById[g.contact_id]?contactLabel(contactById[g.contact_id]):'';if(cur)window._geMap[cur]=g.contact_id;
  document.getElementById('geContact').value=cur;
  var mem=Object.keys(memberById).map(function(id){return memberById[id];}).sort(function(a,b){return mName(a.member_id).localeCompare(mName(b.member_id));});
  document.getElementById('geBy').innerHTML='<option value="">— Not recorded —</option>'+mem.map(function(m){return'<option value="'+esc(m.member_id)+'"'+(m.member_id===g.given_by?' selected':'')+'>'+esc(mName(m.member_id))+'</option>';}).join('');
  document.getElementById('geTo').innerHTML='<option value="">— None —</option>'+mem.map(function(m){return'<option value="'+esc(m.member_id)+'"'+(m.member_id===g.assigned_to?' selected':'')+'>'+esc(mName(m.member_id))+'</option>';}).join('');
  document.getElementById('geNotesWrap').style.display=('notes' in g)?'':'none';document.getElementById('geNotes').value=g.notes||'';
  document.getElementById('geMsg').textContent='';geHint();
  document.getElementById('givenEdit').classList.add('active');
}
function closeGivenEdit(){var m=document.getElementById('givenEdit');if(m)m.classList.remove('active');editGivenIdx=-1;}
async function saveGivenEdit(){
  var g=allGiven[editGivenIdx];if(!g)return;var pk=givenPk(g),msg=document.getElementById('geMsg');
  var item=document.getElementById('geItem').value.trim();if(!item){msg.textContent='Item is required.';return;}
  var q=parseInt(document.getElementById('geQty').value,10);if(isNaN(q)||q<0){msg.textContent='Quantity must be 0 or more.';return;}
  var vRaw=document.getElementById('geVal').value,v=vRaw===''?null:parseFloat(vRaw);if(v!==null&&(isNaN(v)||v<0)){msg.textContent='Value must be 0 or more.';return;}
  var cTxt=document.getElementById('geContact').value.trim(),cid=null;
  if(cTxt){cid=(window._geMap||{})[cTxt];if(!cid){msg.textContent='Pick the contact from the list (or clear the box).';return;}}
  var day=document.getElementById('geDate').value;
  var up={item_name:item,quantity:q,value:v,contact_id:cid,given_by:document.getElementById('geBy').value||null,assigned_to:document.getElementById('geTo').value||null};
  if(day)up.given_date=new Date(day+'T12:00:00').toISOString();
  if('notes' in g)up.notes=document.getElementById('geNotes').value.trim()||null;
  var r=await sb.from('swag_given').update(up).eq(pk,g[pk]).select();
  if(r.error){msg.textContent=r.error.message;return;}
  if(!r.data||!r.data.length){msg.textContent='Not saved — your account isn’t allowed to change this record.';return;}
  closeGivenEdit();await loadAll();showToast('Record corrected');
}
async function deleteGiven(){
  var g=allGiven[editGivenIdx];if(!g)return;var pk=givenPk(g);
  if(!confirm('Delete this swag record ('+qtyOf(g)+' × '+(g.item_name||'item')+')? Stock on hand will not change.'))return;
  var r=await sb.from('swag_given').delete().eq(pk,g[pk]).select();
  if(r.error){document.getElementById('geMsg').textContent=r.error.message;return;}
  if(!r.data||!r.data.length){document.getElementById('geMsg').textContent='Not deleted — your account isn’t allowed to remove this record.';return;}
  closeGivenEdit();await loadAll();showToast('Record deleted');
}

async function saveItem(){

  var payload={
    part_name:name,
    part_number:document.getElementById('iSku').value.trim()||null,
    unit_cost:parseFloat(document.getElementById('iValue').value)||0,
    quantity_on_hand:Math.max(0,parseInt(document.getElementById('iQty').value,10)||0),
    reorder_point:(function(v){v=parseInt(v,10);return isNaN(v)?5:Math.max(0,v);})(document.getElementById('iLow').value),
    description:document.getElementById('iNotes').value.trim()||null,
    updated_at:new Date().toISOString()
  };
  var r;

  else{payload.tenant_id=TENANT;payload.created_at=new Date().toISOString();r=await sb.from('swag_inventory').insert(payload);}
  if(r.error){document.getElementById('itemModalMsg').textContent=r.error.message;return;}

  renderGiveContactDrop(mine,'My Contacts');
}
function filterGiveContact(q){
  if(!q.trim()){showMyGiveContacts();return;}
  var matches=allContacts.filter(function(c){
    var n=((c.first_name||'')+' '+(c.last_name||'')).toLowerCase();
    return n.includes(q.toLowerCase())||(c.organization_name||'').toLowerCase().includes(q.toLowerCase());
  }).slice(0,12);
  renderGiveContactDrop(matches,'');
}
function renderGiveContactDrop(list,header){
  var drop=document.getElementById('gContactDrop');
  var h=header?'<div style="padding:6px 12px;font-size:10px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;border-bottom:1px solid var(--border-default);">'+header+'</div>':'';
  if(!list.length){h+='<div class="cdr" style="color:var(--text-secondary);">No contacts found</div>';}
  else{h+=list.map(function(c){var n=((c.first_name||'')+' '+(c.last_name||'')).trim();return'<div class="cdr" data-cid="'+c.contact_id+'" data-name="'+esc(n)+'">'+esc(n)+(c.organization_name?' <span style="font-size:11px;color:var(--text-secondary);">'+esc(c.organization_name)+'</span>':'')+'</div>';}).join('');}
  drop.innerHTML=h;
  drop.querySelectorAll('.cdr[data-cid]').forEach(function(el){
    el.addEventListener('click',function(){
      document.getElementById('gContact').value=this.dataset.cid;
      document.getElementById('gContactSearch').value=this.dataset.name;
      drop.style.display='none';
    });
  });
  drop.style.display='block';
}

async function saveGive(){
  var qty=parseInt(document.getElementById('gQty').value)||1;
  var item=allItems.find(function(i){return i.item_id===giveItemId;});
  if(!item)return;
  if(!document.getElementById('gMember').value){document.getElementById('giveModalMsg').textContent='Choose who gave it.';return;}
  if(!document.getElementById('gContact').value&&!document.getElementById('gAssignedTo').value){document.getElementById('giveModalMsg').textContent='Pick the contact it went to, or the team member it was handed to.';return;}
  if(qty<1){document.getElementById('giveModalMsg').textContent='Quantity must be at least 1.';return;}
  if(qty>(item.quantity_on_hand||0)&&(item.quantity_on_hand||0)>0){
    document.getElementById('giveModalMsg').textContent='Not enough in stock ('+( item.quantity_on_hand||0)+' available).';return;
  }
  var unitCost=parseFloat(item.unit_cost)||0;
  var totalValue=unitCost*qty; // total value for this transaction
  var _notes=(document.getElementById('gNotes').value||'').trim();
  var _row={
    tenant_id:TENANT,
    item_name:item.part_name,
    quantity:qty,
    value:totalValue,
    contact_id:document.getElementById('gContact').value||null,
    assigned_to:document.getElementById('gAssignedTo').value||null,
    given_by:document.getElementById('gMember').value||currentUserId,
    given_date:document.getElementById('gDate').value?new Date(document.getElementById('gDate').value+'T12:00:00').toISOString():new Date().toISOString()
  };
  if(_notes)_row.notes=_notes;
  var r=await sb.from('swag_given').insert(_row);
  if(r.error&&_notes&&/notes/i.test(r.error.message||'')){delete _row.notes;r=await sb.from('swag_given').insert(_row);}
  if(r.error){document.getElementById('giveModalMsg').textContent=r.error.message;return;}
  // Decrement inventory
  if((item.quantity_on_hand||0)>0){
    var _u=await sb.from('swag_inventory').update({quantity_on_hand:Math.max(0,(item.quantity_on_hand||0)-qty),updated_at:new Date().toISOString()}).eq('item_id',giveItemId);
    if(_u.error)showToast('Gift saved, but stock could not be updated: '+_u.error.message);
  }
  closeGiveModal();await loadAll();showToast('Swag recorded!');
}

document.addEventListener('click',function(e){
  var d=document.getElementById('gContactDrop');
  if(d&&!d.contains(e.target)&&e.target.id!=='gContactSearch')d.style.display='none';
});

async function init(){
  var session=await checkAuth();if(!session)return;
  var authId=session.user?.id,email=session.user?.email;userEmail=email;
  var row=null;
  if(authId){var r1=await sb.from('team_members').select('member_id,role,is_active,first_name,last_name').eq('auth_user_id',authId).eq('tenant_id',TENANT).maybeSingle();if(r1.data)row=r1.data;}
  if(!row&&email){var r2=await sb.from('team_members').select('member_id,role,is_active,first_name,last_name').eq('email',email).eq('tenant_id',TENANT).maybeSingle();if(r2.data)row=r2.data;}
  if(!row){await sb.auth.signOut();location.replace('v4-login.html');return;}
  if(row.is_active===false){await sb.auth.signOut();location.replace('v4-login.html?reason=deactivated');return;}
  currentUserId=row.member_id;currentUserRole=row.role;
  currentUserName=((row.first_name||'')+' '+(row.last_name||'')).trim();
  document.getElementById('dUserName').textContent=currentUserName;
  document.getElementById('mUserName').textContent=currentUserName;
  var mr=await sb.from('team_members').select('member_id,first_name,last_name,color,role,created_at,is_active').eq('tenant_id',TENANT).order('last_name');
  memberById={};(mr.data||[]).forEach(function(m){memberById[m.member_id]=m;});
  allMembers=(mr.data||[]).filter(function(m){return m.is_active!==false;});
  initSwagBoard();
  await loadAll();
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('appShell').style.display='';
}
init();
</script>

    {f:'v4-sharklaw-pipeline.html',n:'Pipeline',i:'<path d="M3 4h18l-7 8v6l-4 2v-8z"/>'},
    {f:'v4-sharklaw-leads.html',n:'Leads',i:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'},
    {f:'v4-sharklaw-swag.html',n:'Swag',i:'<path d="M20.6 13.4 12 22l-9-9V3h10z"/><circle cx="7.5" cy="7.5" r="1.5"/>'},
    {f:'v4-communications.html',n:'Comms',i:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'},
    {f:'v4-sharklaw-settings.html',n:'Settings',i:'<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'}
  ];
  /* the page a tab "belongs" to (profiles live under Contacts, archive under Scheduler) */
  var home=page.indexOf('profiles')>=0?'v4-sharklaw-contacts.html':page.indexOf('archive')>=0?'v4-sharklaw-scheduler.html':page;
  var GEAR='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  var v4=window.SL_STYLE==='v4';
  function ls(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  var role=(ls('sl-role')||'').toLowerCase();

  /* ── display panel (gear) ── */
  function curMode(){
    if(v4)return document.documentElement.getAttribute('data-v4mode')==='dark'?'dark':'light';
    var t=document.documentElement.getAttribute('data-theme')||'';return t.indexOf('light')>=0?'light':'dark';
  }
  function setMode(m){
    var h=document.documentElement,cur=h.getAttribute('data-theme')||'';
    var named=cur.indexOf('-')>=0;  /* comms uses dark-blue / blue-light */
    try{localStorage.setItem('app-theme',m);}catch(e){}
    if(v4)h.setAttribute('data-v4mode',m);
    if(cur||!h.hasAttribute('data-theme'))h.setAttribute('data-theme',named?(m==='light'?'blue-light':'dark-blue'):m);
    paint();
  }
  function setStyle(s){try{localStorage.setItem('sl-style',s);}catch(e){}location.reload();}
  var pop=document.createElement('div');pop.className='v4-pop';pop.setAttribute('role','dialog');pop.setAttribute('aria-label','Display settings');
  pop.innerHTML='<button class="v4-x" aria-label="Close">&times;</button><h3>Appearance</h3><div class="v4-seg"><button data-m="light">Light</button><button data-m="dark">Dark</button></div>'
    +'<h3>Style</h3><div class="v4-seg"><button data-s="legacy">Legacy</button><button data-s="v4">New</button></div>'
    +'<p>Testing switch. Legacy is the current SharkLaw look and stays the default until the new style goes live.</p>';
  document.body.appendChild(pop);
  function paint(){
    var m=curMode();
    pop.querySelectorAll('[data-m]').forEach(function(b){b.classList.toggle('on',b.dataset.m===m);});
    pop.querySelectorAll('[data-s]').forEach(function(b){b.classList.toggle('on',b.dataset.s===(v4?'v4':'legacy'));});
  }
  pop.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.classList.contains('v4-x')){pop.classList.remove('on');return;}
    if(b.dataset.m)setMode(b.dataset.m);
    if(b.dataset.s&&b.dataset.s!==(v4?'v4':'legacy'))setStyle(b.dataset.s);
  });
  document.addEventListener('click',function(e){if(pop.classList.contains('on')&&!pop.contains(e.target)&&!e.target.closest('.v4-gear,.v4h-gear'))pop.classList.remove('on');});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){pop.classList.remove('on');closeSheet();}});
  function gearBtn(extra){var b=document.createElement('button');b.type='button';b.className='v4-gear'+(extra?' '+extra:'');b.title='Display settings';b.setAttribute('aria-label','Display settings');b.innerHTML=GEAR;
    b.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(b);});return b;}
  function placePop(btn){var r=btn.getBoundingClientRect();if(window.innerWidth<=768||r.top>window.innerHeight/2){pop.style.top='';pop.style.right='';return;}
    pop.style.top=Math.round(r.bottom+6)+'px';pop.style.right=Math.max(8,Math.round(window.innerWidth-r.right))+'px';}
  var placed=0;
  ['.desktop-header','.mobile-top-header','.top','.hdr-actions','#mobPickerBar'].forEach(function(sel){
    var box=document.querySelector(sel);if(!box)return;
    if(box.querySelector('.v4-gear'))return;
    var t=box.querySelector('.theme-btn,.theme-toggle-btn,.dark-toggle');
    if(t&&t.parentNode){t.parentNode.insertBefore(gearBtn(),t.nextSibling);placed++;}
    else if(sel==='.hdr-actions'||sel==='#mobPickerBar'||sel==='.top'){box.appendChild(gearBtn());placed++;}
    else if(sel==='.mobile-top-header'){var bar=box.querySelector('.mobile-header-bar,.mob-bar');if(bar){bar.appendChild(gearBtn());placed++;}}
  });
  if(!placed)document.body.appendChild(gearBtn('floating'));
  paint();

  if(!v4)return;   /* everything below is the new look only */

  /* ── standard desktop header: identical to the Overview header on every page,
        so the logo, title and tabs never move when you change page ── */
  var MOON='<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var dh=document.querySelector('.desktop-header');
  var oldTop=document.querySelector('.top');
  if(!dh&&oldTop){dh=document.createElement('div');dh.className='desktop-header v4-made';oldTop.parentNode.insertBefore(dh,oldTop);}
  if(dh&&!dh.querySelector('.v4-hdr')){
    var h1=(dh.querySelector('h1')||(oldTop&&oldTop.querySelector('h1')));
    var title=h1?h1.textContent.trim():document.title.split(/[–-]/)[0].trim();
    var hdr=document.createElement('div');hdr.className='v4-hdr';
    var tabs=PAGES.map(function(p){
      var hide=(p.mg&&MGMT.indexOf(role)<0)||(p.n==='Settings'&&role&&['owner','admin'].indexOf(role)<0);
      return '<a href="'+p.f+'" data-label="'+p.n+'"'+(p.mg?' data-mg="1"':'')+(p.n==='Settings'?' data-adm="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+(hide?' style="display:none"':'')+'>'+p.n+'</a>';
    }).join('');
    hdr.innerHTML='<div class="v4h-top"><a class="v4h-logo-a" href="'+(MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html')+'" aria-label="Shark Law home"><img class="v4h-logo" src="'+LOGO+'" alt="Shark Law — Motorcycle Attorneys"></a><div class="v4h-title"></div></div>'
      +'<div class="v4h-row"><nav class="v4h-tabs" aria-label="Main">'+tabs+'</nav><span class="v4h-extra"></span><div class="v4h-right"><span class="v4h-user"></span>'
      +'<button type="button" class="v4h-btn v4h-mode" aria-label="Switch light or dark mode"><svg viewBox="0 0 24 24"></svg></button>'
      +'<button type="button" class="v4h-btn v4h-gear" aria-label="Display settings" title="Display settings">'+GEAR+'</button>'
      +'<button type="button" class="v4h-out">Logout</button></div></div>';
    hdr.querySelector('.v4h-title').textContent=title;
    dh.appendChild(hdr);
    /* page-specific controls that lived in the old header keep working, now on the tab row */
    var extra=hdr.querySelector('.v4h-extra');
    var vt=document.getElementById('viewToggleWrap');
    if(vt){
      vt.style.marginLeft='0';
      /* on phones the tab row is hidden, so Mine/All sits just under the phone header instead */
      var mslot=document.createElement('div');mslot.className='v4-mscope';
      var mt=document.querySelector('.mobile-top-header');if(mt&&mt.parentNode)mt.parentNode.insertBefore(mslot,mt.nextSibling);
      var mq=window.matchMedia('(max-width:768px)');
      var place=function(){(mq.matches&&mslot.parentNode?mslot:extra).appendChild(vt);};
      if(mq.addEventListener)mq.addEventListener('change',place);else if(mq.addListener)mq.addListener(place);
      place();
    }
    dh.querySelectorAll('.hdr-actions .hdr-btn').forEach(function(b){extra.appendChild(b);});
    /* name of the signed-in person, mirrored from the page */
    var src=document.getElementById('dUserName')||document.getElementById('dBizName')||document.getElementById('legacyUser');
    var uEl=hdr.querySelector('.v4h-user');
    function syncUser(){var t=src?src.textContent.trim():'';uEl.textContent=/^loading/i.test(t)?'':t;}
    syncUser();if(src)new MutationObserver(syncUser).observe(src,{childList:true,characterData:true,subtree:true});
    var mb=hdr.querySelector('.v4h-mode');
    function modeIcon(){mb.querySelector('svg').innerHTML=curMode()==='dark'?SUN:MOON;mb.title=curMode()==='dark'?'Switch to light mode':'Switch to dark mode';}
    modeIcon();mb.onclick=function(){setMode(curMode()==='dark'?'light':'dark');modeIcon();};
    new MutationObserver(modeIcon).observe(document.documentElement,{attributes:true,attributeFilter:['data-v4mode','data-theme']});
    var gb=hdr.querySelector('.v4h-gear');
    gb.addEventListener('click',function(e){e.stopPropagation();paint();pop.classList.toggle('on');placePop(gb);});
    hdr.querySelector('.v4h-out').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  /* ── mobile: logo in the top bar ── */
  var mh=document.querySelector('.mobile-top-header .mobile-header-bar,.mobile-top-header .mob-bar');
  if(mh&&!mh.querySelector('.v4-mlogo')){var im=document.createElement('img');im.className='v4-mlogo';im.src=LOGO;im.alt='Shark Law';mh.insertBefore(im,mh.firstChild);}
  /* ── mobile bottom nav + More sheet ── */
  function navItem(p,label){return'<a href="'+p.f+'"'+(p.mg?' data-mg="1"':'')+(p.f===home?' class="on" aria-current="page"':'')+'><svg viewBox="0 0 24 24">'+p.i+'</svg>'+(label||p.n)+'</a>';}
  function byF(f){for(var i=0;i<PAGES.length;i++)if(PAGES[i].f===f)return PAGES[i];}
  var mn=document.createElement('nav');mn.className='v4-mnav';mn.setAttribute('aria-label','Main');
  function buildMnav(){
    var firstP=MGMT.indexOf(role)>=0?byF('v4-sharklaw-overview.html'):byF('v4-sharklaw-dashboard.html');
    var p2=byF('v4-sharklaw-leads.html'),p3=byF('v4-sharklaw-scheduler.html'),p4=byF('v4-sharklaw-contacts.html');
    mn.innerHTML='<div class="v4-mnav-in">'+navItem(firstP)+navItem(p2)+navItem(p3,'Schedule')+navItem(p4)
      +'<button type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button></div>';
    mn.querySelector('button').onclick=openSheet;
  }
  buildMnav();document.body.appendChild(mn);
  var scrim=document.createElement('div');scrim.className='v4-scrim';scrim.onclick=closeSheet;document.body.appendChild(scrim);
  var sheet=document.createElement('div');sheet.className='v4-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','More');
  function buildSheet(){
    sheet.innerHTML='<div class="grab"></div>'+PAGES.filter(function(p){return !p.mg||MGMT.indexOf(role)>=0;}).map(function(p){return navItem(p);}).join('')
      +'<div class="sep"></div><button class="si" type="button" data-act="display"><svg viewBox="0 0 24 24">'+GEAR.replace(/<\/?svg[^>]*>/g,'')+'</svg>Display settings</button>'
      +'<button class="si" type="button" data-act="logout"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Logout</button>';
    sheet.querySelector('[data-act="display"]').onclick=function(e){e.stopPropagation();closeSheet();paint();pop.classList.add('on');};
    sheet.querySelector('[data-act="logout"]').onclick=function(){if(typeof window.logout==='function')window.logout();else if(typeof window.doLogout==='function')window.doLogout();else location.href='v4-login.html';};
  }
  buildSheet();document.body.appendChild(sheet);
  function openSheet(){scrim.classList.add('on');sheet.classList.add('on');}
  function closeSheet(){scrim.classList.remove('on');sheet.classList.remove('on');}
  window.v4CloseSheet=closeSheet;

  /* ── needs-attention colouring for KPI blocks (red/amber when above zero) ── */
  function alerts(){document.querySelectorAll('[data-v4-alert]').forEach(function(el){
    var v=el.querySelector('.kpi-val,.kpi-value');var t=(v&&v.textContent||'').trim();var n=parseFloat(t.replace(/[^0-9.]/g,''));
    var known=/[0-9]/.test(t);el.classList.toggle('v4-hot',known&&n>0&&el.dataset.v4Alert==='hot');el.classList.toggle('v4-warm',known&&n>0&&el.dataset.v4Alert==='warm');el.classList.toggle('v4-clear',known&&n===0);});}
  alerts();setInterval(alerts,1200);

  /* ── learn the signed-in role once the page has loaded it ── */
  var tries=0;(function poll(){
    var r=(window.currentUserRole||(window.me&&window.me.role)||'');
    if(r){r=String(r).toLowerCase();try{localStorage.setItem('sl-role',r);}catch(e){}
      if(r!==role){role=r;document.querySelectorAll('[data-mg]').forEach(function(el){el.style.display=MGMT.indexOf(role)>=0?'':'none';});
        document.querySelectorAll('.v4-hdr [data-adm]').forEach(function(el){el.style.display=['owner','admin'].indexOf(role)>=0?'':'none';});
        var hl=document.querySelector('.v4h-logo-a');if(hl)hl.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';buildMnav();buildSheet();
        var ll=document.querySelector('.v4-logo-link');if(ll)ll.href=MGMT.indexOf(role)>=0?'v4-sharklaw-overview.html':'v4-sharklaw-dashboard.html';}
      return;}
    if(++tries<40)setTimeout(poll,400);
  })();
})();
</script>
</body>
</html>
